<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Speaking Cards — People in Your Life</title>
<style>
  :root{
    --darkblue:#0B182B;
    --red:#9F241C;
    --lightblue:#388CCA;
    --gray:#E8E8E8;
    --white:#FFFFFF;
    --muted:#5B6572;
    --gold:#C9A227;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:var(--white);
    font-family:'Calibri','Segoe UI',system-ui,sans-serif;
    color:var(--darkblue);
    padding:24px 16px 50px;
    display:flex; justify-content:center;
  }
  .wrap{ width:100%; max-width:480px; }

  .eyebrow{
    font-family:'Cambria',Georgia,serif; font-style:italic;
    font-size:13px; color:var(--lightblue); text-align:center;
    letter-spacing:0.04em; margin-bottom:4px;
  }
  h1{
    font-family:'Cambria',Georgia,serif; font-weight:700;
    font-size:clamp(23px,6vw,28px); text-align:center; margin:0 0 6px;
  }
  .sub{
    text-align:center; font-size:13px; color:var(--muted);
    margin:0 0 14px; line-height:1.4;
  }

  .progress-row{
    display:flex; align-items:center; justify-content:center; gap:8px;
    margin-bottom:16px;
  }
  .dot{ width:9px; height:9px; border-radius:50%; background:var(--gray); border:1.5px solid var(--gray); }
  .dot.done{ background:var(--lightblue); border-color:var(--lightblue); }
  .dot.active{ border-color:var(--darkblue); }

  .card{
    border:1.5px solid var(--darkblue);
    border-radius:20px;
    padding:32px 24px 26px;
    min-height:190px;
    display:flex; flex-direction:column; justify-content:center;
    text-align:center;
    margin-bottom:14px;
  }
  .card-topic{
    font-family:'Calibri','Segoe UI',sans-serif; font-weight:700; font-size:11.5px;
    color:var(--lightblue); text-transform:uppercase; letter-spacing:0.06em; margin-bottom:14px;
  }
  .card-question{
    font-family:'Cambria',Georgia,serif; font-weight:700; font-style:italic;
    font-size:20px; line-height:1.5; color:var(--darkblue);
  }

  .vocab-word{
    color:var(--lightblue);
    font-weight:700;
    font-style:normal;
    cursor:pointer;
    border-bottom:1.5px dotted var(--lightblue);
    padding-bottom:1px;
  }
  .vocab-word:hover{ opacity:0.8; }

  .def-popup{
    display:none;
    border:1.5px solid var(--lightblue);
    border-radius:12px;
    padding:10px 14px;
    margin-bottom:14px;
    background:rgba(56,140,202,0.06);
    font-size:13.5px;
    color:var(--darkblue);
    text-align:left;
  }
  .def-popup.show{ display:block; }
  .def-popup b{ color:var(--lightblue); text-transform:lowercase; }

  .challenge-toggle{
    display:flex; align-items:center; justify-content:center; gap:8px;
    width:100%; padding:11px; border:1.5px dashed var(--gold); border-radius:12px;
    background:var(--white); color:var(--gold); font-weight:700; font-size:13px;
    cursor:pointer; margin-bottom:10px;
  }

  .challenge-box{
    display:none;
    border:1.5px solid var(--gold);
    border-radius:14px;
    padding:16px 18px;
    margin-bottom:14px;
    background:rgba(201,162,39,0.05);
  }
  .challenge-box.show{ display:block; }
  .challenge-label{
    display:flex; align-items:center; gap:6px;
    font-family:'Calibri','Segoe UI',sans-serif; font-weight:700; font-size:11px;
    color:var(--gold); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:8px;
  }
  .challenge-question{
    font-family:'Cambria',Georgia,serif; font-style:italic; font-size:15px;
    line-height:1.5; color:var(--darkblue);
  }

  .nav-row{ display:flex; gap:10px; }
  .nav-btn{
    flex:1; padding:14px; border:1.5px solid var(--darkblue); background:var(--white);
    color:var(--darkblue); border-radius:12px; font-weight:700; font-size:14.5px; cursor:pointer;
  }
  .nav-btn:disabled{ opacity:0.35; cursor:default; }
  .nav-btn.primary{ background:var(--darkblue); color:var(--white); }

  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Week 4 · Speaking Warm-Up</div>
  <h1>People in Your Life</h1>
  <p class="sub">Tap any blue word for a simple definition.</p>

  <div class="progress-row" id="dots"></div>

  <div class="card">
    <div class="card-topic" id="cardTopic"></div>
    <div class="card-question" id="cardQuestion"></div>
  </div>

  <div class="def-popup" id="defPopup"></div>

  <button class="challenge-toggle" id="challengeToggle"></button>

  <div class="challenge-box" id="challengeBox">
    <div class="challenge-label" id="challengeLabel"></div>
    <div class="challenge-question" id="challengeQuestion"></div>
  </div>

  <div class="nav-row">
    <button class="nav-btn" id="prevBtn">&larr; Prev</button>
    <button class="nav-btn primary" id="nextBtn">Next &rarr;</button>
  </div>
</div>

<script>
const VOCAB = {
  sociable:    "friendly, and enjoys being with other people",
  humorous:    "funny; makes people laugh",
  humble:      "not proud; doesn't brag about achievements",
  patient:     "can stay calm when something takes time",
  considerate: "thinks about other people's feelings",
};

const CARDS = [
  {
    topic: "Family Member",
    question: "Think of a family member you are close to. Would you say they are quiet or **sociable**?",
    challenge: "Can you describe a time this person was especially **patient** or **considerate** with you?",
  },
  {
    topic: "A Friend",
    question: "Do you have a friend who is very **humorous**? What do they usually joke about?",
    challenge: "Is this friend **humble** about their achievements, or do they like to talk about their success?",
  },
  {
    topic: "Manager at Work",
    question: "Think about a manager you have had. Were they **patient** with new employees?",
    challenge: "Was this manager **considerate** of your personal life, or mostly focused on work?",
  },
  {
    topic: "A Teacher",
    question: "Did you have a teacher who was **humble**, even though they knew a lot?",
    challenge: "Was this teacher **sociable** with students outside of class, or more formal?",
  },
  {
    topic: "A Well-Known Person",
    question: "Think of a well-known person \u2014 an actor, athlete, or public figure. Do they seem **humorous** in interviews?",
    challenge: "Do you think this person is **humble** or **considerate**, based on what you have seen or read about them?",
  },
];

let current = 0;
const dotsEl = document.getElementById('dots');
const cardTopic = document.getElementById('cardTopic');
const cardQuestion = document.getElementById('cardQuestion');
const defPopup = document.getElementById('defPopup');
const challengeToggle = document.getElementById('challengeToggle');
const challengeBox = document.getElementById('challengeBox');
const challengeLabel = document.getElementById('challengeLabel');
const challengeQuestion = document.getElementById('challengeQuestion');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');

const STAR_SVG = '<svg viewBox="0 0 24 24" width="15" height="15"><path d="M12 2l2.9 6.9L22 9.6l-5.4 4.9L18 22l-6-3.6L6 22l1.4-7.5L2 9.6l7.1-0.7L12 2z" fill="none" stroke="#C9A227" stroke-width="1.6" stroke-linejoin="round"/></svg>';
const STAR_SVG_FILLED = '<svg viewBox="0 0 24 24" width="13" height="13"><path d="M12 2l2.9 6.9L22 9.6l-5.4 4.9L18 22l-6-3.6L6 22l1.4-7.5L2 9.6l7.1-0.7L12 2z" fill="#C9A227"/></svg>';

// Turns **word** markers into clickable vocab spans, using the VOCAB dictionary for definitions.
function linkify(text){
  return text.replace(/\*\*(.+?)\*\*/g, (match, word) => {
    const key = word.toLowerCase();
    const def = VOCAB[key] || '';
    return `<span class="vocab-word" data-word="${word}" data-def="${def}">${word}</span>`;
  });
}

function attachVocabHandlers(container){
  container.querySelectorAll('.vocab-word').forEach(span => {
    span.addEventListener('click', () => {
      const word = span.dataset.word;
      const def = span.dataset.def;
      const alreadyShowingThis = defPopup.classList.contains('show') && defPopup.dataset.word === word;
      if (alreadyShowingThis){
        defPopup.classList.remove('show');
        defPopup.dataset.word = '';
      } else {
        defPopup.innerHTML = `<b>${word}</b> \u2014 ${def}`;
        defPopup.dataset.word = word;
        defPopup.classList.add('show');
      }
    });
  });
}

function buildDots(){
  dotsEl.innerHTML = '';
  CARDS.forEach((_, i) => {
    const d = document.createElement('span');
    d.className = 'dot' + (i < current ? ' done' : '') + (i === current ? ' active' : '');
    dotsEl.appendChild(d);
  });
}

function render(){
  const item = CARDS[current];
  cardTopic.textContent = item.topic;
  cardQuestion.innerHTML = linkify(item.question);
  attachVocabHandlers(cardQuestion);

  defPopup.classList.remove('show');
  defPopup.dataset.word = '';

  challengeQuestion.innerHTML = linkify(item.challenge);
  attachVocabHandlers(challengeQuestion);
  challengeLabel.innerHTML = STAR_SVG_FILLED + ' For a challenge';
  challengeBox.classList.remove('show');
  challengeToggle.innerHTML = STAR_SVG + ' Show challenge question';

  prevBtn.disabled = current === 0;
  nextBtn.textContent = current === CARDS.length - 1 ? 'Restart \u21ba' : 'Next \u2192';

  buildDots();
}

challengeToggle.addEventListener('click', () => {
  const showing = challengeBox.classList.toggle('show');
  challengeToggle.innerHTML = STAR_SVG + (showing ? ' Hide challenge question' : ' Show challenge question');
});

prevBtn.addEventListener('click', () => {
  if (current > 0){ current--; render(); }
});

nextBtn.addEventListener('click', () => {
  if (current < CARDS.length - 1){ current++; } else { current = 0; }
  render();
});

render();
</script>
</body>
</html>
