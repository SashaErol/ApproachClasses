<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Fill in the Connectors — Michelle Obama</title>
<style>
  :root{
    --darkblue:#0B182B;
    --red:#9F241C;
    --lightblue:#388CCA;
    --gray:#E8E8E8;
    --white:#FFFFFF;
    --muted:#5B6572;
    --good:#2F7D5C;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:var(--white);
    font-family:'Calibri','Segoe UI',system-ui,sans-serif;
    color:var(--darkblue);
    padding:22px 14px 50px;
    display:flex; justify-content:center;
  }
  .wrap{ width:100%; max-width:560px; }

  .eyebrow{
    font-family:'Cambria',Georgia,serif; font-style:italic;
    font-size:13px; color:var(--lightblue); text-align:center;
    letter-spacing:0.04em; margin-bottom:4px;
  }
  h1{
    font-family:'Cambria',Georgia,serif; font-weight:700;
    font-size:clamp(21px,5.5vw,26px); text-align:center; margin:0 0 6px;
  }
  .sub{
    text-align:center; font-size:13px; color:var(--muted);
    margin:0 0 16px; line-height:1.4;
  }
  .progress{
    text-align:center; font-family:'Cambria',Georgia,serif; font-style:italic;
    font-size:13px; color:var(--darkblue); margin-bottom:14px;
  }

  .bank-label{
    font-family:'Cambria',Georgia,serif; font-weight:700; font-size:12.5px;
    color:var(--muted); text-align:center; margin-bottom:8px; letter-spacing:0.04em;
  }
  .bank{
    display:flex; flex-wrap:wrap; gap:8px; justify-content:center;
    margin-bottom:20px;
  }
  .chip{
    border:1.5px solid var(--lightblue); background:var(--white); color:var(--darkblue);
    border-radius:999px; padding:9px 16px; font-size:14px; font-weight:600; cursor:pointer;
  }
  .chip.selected{ background:var(--lightblue); color:var(--white); }
  .chip:disabled{ opacity:0.25; pointer-events:none; }

  .story{
    border:1.5px solid var(--darkblue);
    border-radius:16px;
    padding:20px 20px;
    font-family:'Cambria',Georgia,serif;
    font-size:16px;
    line-height:2;
    text-align:left;
    margin-bottom:16px;
  }
  .story b.name{ color:var(--darkblue); }
  .blank{
    display:inline-block; min-width:82px; text-align:center;
    border-bottom:2px solid var(--gray); padding:1px 6px; margin:0 2px;
    font-weight:700; color:var(--muted); cursor:pointer;
    font-family:'Calibri','Segoe UI',sans-serif; font-size:14.5px;
  }
  .blank.filled{
    border-bottom-color:var(--good); color:var(--good);
    background:rgba(47,125,92,0.07); border-radius:6px; cursor:default;
  }
  .blank.shake{ animation:shake 0.3s; border-bottom-color:var(--red); color:var(--red); }
  @keyframes shake{
    0%,100%{ transform:translateX(0); }
    25%{ transform:translateX(-4px); }
    75%{ transform:translateX(4px); }
  }

  .end{ display:none; text-align:center; margin-top:6px; }
  .end.show{ display:block; }
  .end h2{ font-family:'Cambria',Georgia,serif; font-size:22px; margin:0 0 6px; }
  .end p{ font-size:14px; color:var(--muted); margin:0 0 14px; }
  .restart-btn{
    padding:12px 24px; border:none; border-radius:12px;
    background:var(--lightblue); color:var(--white); font-weight:600; font-size:15px; cursor:pointer;
  }

  @media (prefers-reduced-motion: reduce){ *{ animation:none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Week 3 · Reading &amp; Connectors</div>
  <h1>Michelle Obama</h1>
  <p class="sub">Tap a connector from the box, then tap the blank where it belongs.</p>
  <div class="progress" id="progress">0 / 7 filled</div>

  <div class="bank-label">CONNECTOR BANK</div>
  <div class="bank" id="bank"></div>

  <div class="story" id="story"></div>

  <div class="end" id="end">
    <h2>Well done!</h2>
    <p>You completed the story with all 7 connectors in the right place.</p>
    <button class="restart-btn" id="restartBtn">Shuffle &amp; try again</button>
  </div>
</div>

<script>
const CONNECTORS = ["First", "and", "then", "but", "In addition", "As a result", "However"];

// Story split into fixed text segments, with each blank's correct connector in ANSWERS (same order).
const SEGMENTS = [
  "Michelle Obama grew up in Chicago with her brother, a <b>supportive</b> sibling who encouraged her to study hard. ",
  " she became a lawyer, ",
  " ",
  " she worked to help children eat healthy, homemade food. She is <b>honest</b> about her struggles, ",
  " she stays <b>patient</b> with critics. ",
  " she is <b>generous</b> with her time; she visits schools and hospitals often. ",
  " many people find her presence comforting. ",
  " what makes her truly special is her warmth.",
];
const ANSWERS = ["First", "and", "then", "but", "In addition", "As a result", "However"];

function shuffle(arr){
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

let filledCount = 0;
let selectedChip = null;

const bankEl = document.getElementById('bank');
const storyEl = document.getElementById('story');
const progressEl = document.getElementById('progress');
const endEl = document.getElementById('end');

function buildStory(){
  filledCount = 0;
  selectedChip = null;
  progressEl.textContent = `0 / ${ANSWERS.length} filled`;
  endEl.classList.remove('show');

  // word bank
  bankEl.innerHTML = '';
  shuffle(CONNECTORS).forEach(word => {
    const chip = document.createElement('button');
    chip.className = 'chip';
    chip.textContent = word;
    chip.dataset.word = word;
    chip.addEventListener('click', () => selectChip(chip, word));
    bankEl.appendChild(chip);
  });

  // story with inline blanks
  storyEl.innerHTML = '';
  SEGMENTS.forEach((seg, i) => {
    storyEl.insertAdjacentHTML('beforeend', seg);
    if (i < ANSWERS.length){
      const blank = document.createElement('span');
      blank.className = 'blank';
      blank.textContent = '_______';
      blank.dataset.answer = ANSWERS[i];
      blank.addEventListener('click', () => handleBlankClick(blank));
      storyEl.appendChild(blank);
    }
  });
}

function selectChip(chipEl, word){
  if (chipEl.disabled) return;
  if (selectedChip && selectedChip.el === chipEl){
    chipEl.classList.remove('selected');
    selectedChip = null;
    return;
  }
  if (selectedChip) selectedChip.el.classList.remove('selected');
  selectedChip = { word, el: chipEl };
  chipEl.classList.add('selected');
}

function handleBlankClick(blankEl){
  if (blankEl.classList.contains('filled')) return;
  if (!selectedChip) return;

  if (selectedChip.word === blankEl.dataset.answer){
    blankEl.textContent = selectedChip.word;
    blankEl.classList.add('filled');
    selectedChip.el.disabled = true;
    selectedChip.el.classList.remove('selected');
    selectedChip = null;
    filledCount++;
    progressEl.textContent = `${filledCount} / ${ANSWERS.length} filled`;
    if (filledCount === ANSWERS.length){
      endEl.classList.add('show');
    }
  } else {
    blankEl.classList.remove('shake');
    void blankEl.offsetWidth;
    blankEl.classList.add('shake');
    setTimeout(() => blankEl.classList.remove('shake'), 350);
    selectedChip.el.classList.remove('selected');
    selectedChip = null;
  }
}

document.getElementById('restartBtn').addEventListener('click', buildStory);
buildStory();
</script>
</body>
</html>
