<style>/* Approach International Student Center brand: Dark Blue, Blue, Red, Light Blue, Gray, White. */
/* Layout: brand band, then one centered stage that swaps between instructions, the timed question and the results with a concept review. Big type for a classroom projector. */
:root {
  --bg: #E7E7E7; --surface: #FFFFFF; --ink: #0C1927; --ink-soft: #44546A; --line: #C9CDD2;
  --navy: #10294A; --navy-ink: #FFFFFF; --red: #9C2519; --red-ink: #FFFFFF; --accent: #9C2519;
  --bar: #4189BF; --track: #E3EAF1; --hl-bg: #CFE3F3; --hl-ink: #0C1927; --focus: #1D6FB8;
  --good: #1F7A4D; --warn: #A65F00; --crit: #B3261E; --field: #F6F8FA;
  --font-display: "Montserrat", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1927; --surface: #10294A; --ink: #F1F4F7; --ink-soft: #AFBCCB; --line: #2A486B;
    --navy: #4189BF; --navy-ink: #0C1927; --red: #B3382B; --red-ink: #FFFFFF; --accent: #F08A7E;
    --bar: #6FA8D8; --track: #183A63; --hl-bg: #1F4F7C; --hl-ink: #EAF3FB; --focus: #8CC0EE;
    --good: #5CC48D; --warn: #F2B24C; --crit: #FF8A80; --field: #0C1F38;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1927; --surface: #10294A; --ink: #F1F4F7; --ink-soft: #AFBCCB; --line: #2A486B;
  --navy: #4189BF; --navy-ink: #0C1927; --red: #B3382B; --red-ink: #FFFFFF; --accent: #F08A7E;
  --bar: #6FA8D8; --track: #183A63; --hl-bg: #1F4F7C; --hl-ink: #EAF3FB; --focus: #8CC0EE;
  --good: #5CC48D; --warn: #F2B24C; --crit: #FF8A80; --field: #0C1F38;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 1.05rem; line-height: 1.55; padding-inline: 1rem; padding-block: 1.5rem 3rem; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
.wrap { max-width: 60rem; margin-inline: auto; display: flex; flex-direction: column; gap: 1.5rem; }

.band { display: flex; align-items: center; gap: .9rem; flex-wrap: wrap; background: #10294A; color: #FFFFFF; border-radius: 1rem; padding: .9rem 1.25rem; border-bottom: .3rem solid #9C2519; }

.wm { display: flex; flex-direction: column; line-height: 1.05; }
.wm-a { font-family: var(--font-display); font-weight: 800; font-size: 1.6rem; letter-spacing: .03em; }
.wm-b { font-size: .85rem; font-weight: 600; opacity: .9; }
.band-tag { margin-left: auto; font-size: .8rem; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; opacity: .85; }
@media (max-width: 30rem) { .band-tag { margin-left: 0; width: 100%; } }

.lbl { font-size: .8rem; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; color: var(--ink-soft); }
h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(2rem, 6.5vw, 3.4rem); line-height: 1.02; letter-spacing: -.01em; margin: 0; text-wrap: balance; }
h1 span { color: var(--accent); }
h2 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: clamp(1.3rem, 3.6vw, 1.8rem); }
h3 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 1.1rem; }
.card { background: var(--surface); border: 2px solid var(--line); border-radius: 1.5rem; padding: clamp(1.1rem, 4vw, 2rem); display: flex; flex-direction: column; gap: 1.25rem; min-width: 0; }
.btn { border: 2px solid var(--ink); background: transparent; border-radius: .9rem; padding: .7rem 1.3rem; font-weight: 700; }
.btn.primary { background: var(--navy); color: var(--navy-ink); border-color: var(--navy); }
.btn.big { font-size: 1.15rem; padding: .85rem 1.8rem; }
.row { display: flex; flex-wrap: wrap; gap: .75rem; align-items: center; }
.row.between { justify-content: space-between; }
.vw { background: var(--hl-bg); color: var(--hl-ink); border-radius: .3rem; padding: 0 .3rem; font-weight: 700; }

/* intro */
ol.how { margin: 0; padding-left: 1.4rem; display: flex; flex-direction: column; gap: .6rem; font-size: 1.1rem; }
.keys { display: flex; flex-wrap: wrap; gap: .5rem; }
kbd { font-family: var(--font-display); font-weight: 700; font-size: .9rem; border: 2px solid var(--line); border-bottom-width: 4px; border-radius: .5rem; padding: .05rem .55rem; background: var(--field); }

/* question */
.qtop { display: flex; flex-wrap: wrap; gap: .75rem; align-items: center; justify-content: space-between; }
.dots { display: flex; flex-wrap: wrap; gap: .4rem; }
.dot { width: 2.1rem; height: 2.1rem; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-weight: 800; font-size: .8rem; font-variant-numeric: tabular-nums; background: var(--field); }
.dot.cur { border-color: var(--ink); background: var(--ink); color: var(--bg); }
.dot.right { border-color: var(--good); color: var(--good); }
.dot.wrong, .dot.time { border-color: var(--crit); color: var(--crit); }
.timer { display: flex; align-items: center; gap: 1rem; }
.secs { font-family: var(--font-display); font-weight: 800; font-size: clamp(2.2rem, 7vw, 3.2rem); line-height: 1; min-width: 2.2ch; text-align: right; font-variant-numeric: tabular-nums; }
.tbar { flex: 1; height: 1rem; border-radius: 999px; background: var(--track); overflow: hidden; }
.tbar i { display: block; height: 100%; width: 100%; background: var(--bar); border-radius: 999px; }
.tbar i.warn { background: var(--warn); } .tbar i.crit { background: var(--crit); }
.stmt { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: clamp(1.25rem, 3.4vw, 1.95rem); line-height: 1.3; text-wrap: pretty; }
.tf { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
.tf button { border: 0; border-radius: 1.1rem; min-height: 5.5rem; font-family: var(--font-display); font-weight: 800; font-size: clamp(1.6rem, 5vw, 2.4rem); }
.tf .t { background: var(--navy); color: var(--navy-ink); }
.tf .f { background: var(--red); color: var(--red-ink); }
.tf button[disabled] { opacity: .45; cursor: default; }
.tf button.answer { opacity: 1; outline: 4px solid var(--ink); outline-offset: 3px; }
.verdict { border-top: 2px solid var(--line); padding-top: 1.1rem; display: flex; flex-direction: column; gap: .8rem; }
.vpill { align-self: flex-start; font-family: var(--font-display); font-weight: 800; font-size: 1.05rem; padding: .3rem 1rem; border-radius: 999px; border: 2px solid currentColor; }
.vpill.good { color: var(--good); } .vpill.crit { color: var(--crit); } .vpill.warn { color: var(--warn); }
.verdict p { margin: 0; font-size: 1.1rem; max-width: 46rem; text-wrap: pretty; }
.verdict .ans { font-weight: 800; }

/* end */
.score { font-family: var(--font-display); font-weight: 800; font-size: clamp(3rem, 12vw, 5.5rem); line-height: 1; }
.score small { font-size: .35em; color: var(--ink-soft); }
.res { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: .3rem; }
.res li { display: grid; grid-template-columns: 2.2rem 1fr; gap: .6rem; align-items: start; padding: .45rem .2rem; border-top: 1px solid var(--line); font-size: .98rem; }
.res .ic { font-weight: 800; font-family: var(--font-display); }
.res .ok { color: var(--good); } .res .no { color: var(--crit); }
.review { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 22rem), 1fr)); gap: 1rem; }
.rv { background: var(--field); border-radius: 1.1rem; padding: 1.1rem 1.2rem; display: flex; flex-direction: column; gap: .4rem; min-width: 0; }
.rv p { margin: 0; font-size: 1rem; color: var(--ink-soft); text-wrap: pretty; }
.rv p b { color: var(--ink); }
.rv h3 { color: var(--ink); }
.note { font-size: .9rem; color: var(--ink-soft); margin: 0; }
@media (max-width: 32rem) { .tf { gap: .6rem; } .tf button { min-height: 4.5rem; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
.part{display:inline-block;background:var(--hl-bg);color:var(--hl-ink);border-radius:.5rem;padding:.2rem .7rem;font-weight:800;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase}
.q{font-family:var(--font-display);font-weight:700;font-size:clamp(1.2rem,3.4vw,1.8rem);line-height:1.3;margin:0;text-wrap:pretty}
.q u{text-decoration:none;border-bottom:.2rem solid var(--accent);padding:0 .6rem;font-weight:800;color:var(--accent)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,14rem),1fr));gap:.7rem}
.opts.col{grid-template-columns:1fr}
.o{border:2px solid var(--line);background:var(--surface);border-radius:1rem;padding:.8rem 1rem;font-weight:700;text-align:left;font-size:1.05rem;line-height:1.35}
.o:hover:not([disabled]){border-color:var(--navy)}
.o.good{border-color:var(--good);background:var(--field)}.o.bad{border-color:var(--crit);background:var(--field)}
.o[disabled]{cursor:default}
.mk{margin-right:.5rem;font-weight:800}
.fine{font-size:.95rem}
.sec{display:flex;flex-direction:column;gap:.6rem;background:var(--field);border-radius:1rem;padding:1rem 1.1rem}
.sec p{margin:0;color:var(--ink-soft)}.sec p b{color:var(--ink)}
.rv{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,16rem),1fr));gap:.8rem}
.bars{display:flex;flex-direction:column;gap:.6rem}
.br{display:grid;grid-template-columns:9rem 1fr 3rem;gap:.7rem;align-items:center;font-size:.95rem}
.br i{display:block;height:1rem;border-radius:0 4px 4px 0;background:var(--bar)}
.br .tr{background:var(--track);border-radius:0 4px 4px 0;height:1rem}
.nav{display:flex;justify-content:flex-end}

<script>var BANK=["APR","APY","HOA","PMI","Overdraft fee","Teaser rate","Inflation","Refinance"];
var P=["Part 1 · Fill the blank","Part 2 · Who got it wrong?","Part 3 · Concept check"];
function fill(s,a,why){return {p:0,q:s,o:BANK,a:BANK.indexOf(a),w:why,bank:1}}
function who(s,ok,why){return {p:1,q:s,o:["Correct","Mistake"],a:ok?0:1,w:why}}

var Q=[
fill("The ad promised 6% for the first two months, but then the rate dropped. It was only a <u>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</u>.","Teaser rate","A teaser rate is a short, attractive promotion. Ramit says banks that rely on teaser rates should be avoided."),
fill("Lena’s mortgage rate fell from 7% to 5.5%, so she decided to <u>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</u> and lower her monthly payment.","Refinance","To refinance is to replace your current loan with a new one, usually at a better rate."),
fill("Because Tom put down only 8% on his house, the lender added a monthly <u>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</u> charge that protects the lender, not Tom.","PMI","PMI (private mortgage insurance) usually applies when the down payment is under 20%. It protects the lender if you stop paying."),
fill("Besides her mortgage, Ana pays $320 a month to the neighborhood association for snow removal, landscaping and the pool. That is an <u>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</u> fee.","HOA","HOA stands for homeowners association. Dues are an extra cost of owning in many condos and communities."),
fill("A credit card with a 24% <u>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</u> can be very expensive if you carry a balance from month to month.","APR","APR (annual percentage rate) is the yearly cost of borrowing."),

fill("Prices rose 4% this year, but my savings earned only 1%. My money lost buying power because of <u>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</u>.","Inflation","Inflation is the general rise in prices over time. It quietly erodes cash savings."),
fill("Mateo paid $35 because his checking balance was too low to cover a purchase. That charge is an <u>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</u>.","Overdraft fee","Ramit calls overdraft fees the most painful and expensive bank fees. Many can be waived if you ask."),
who("“The Fed raised interest rates, so my credit card APR might go up too.”",1,"Correct. Rate increases often push credit card interest rates higher."),
who("“My new card has a 22% APY, so it will be costly if I carry a balance.”",0,"The cost of borrowing is the APR. APY describes what you earn on savings."),
who("“PMI protects me if I lose my job and can’t pay the mortgage.”",0,"PMI protects the lender, not the borrower."),
who("“Once my mortgage is paid off, I won’t owe anything else on the house.”",0,"You may still owe property taxes, insurance and HOA dues."),

who("“With a 20% down payment, I can usually avoid PMI on a conventional loan.”",1,"Correct. A larger down payment generally means no PMI on a conventional loan."),
mc("What is the Federal Reserve?",["The central bank of the United States","A private company that calculates your credit score","A federal agency that collects income taxes each year","A group of local banks that compete for customers"],0,"It is the central bank of the U.S. It manages inflation and unemployment, sets interest rates and keeps the financial system stable."),
mc("The Fed announces it will raise interest rates to fight inflation. What is a likely effect on you?",["Borrowing, such as credit card debt, usually gets more expensive","Mortgages automatically become cheaper for everyone","Rent in every city is required to go down","Banks are no longer allowed to charge any fees"],0,"Higher rates usually mean costlier credit card debt and loans."),
mc("Why might bonds look more attractive when interest rates rise?",["New bonds pay more interest than before","Bonds become completely free of any risk","Stocks are no longer allowed to be traded","Banks are legally required to buy them all"],0,"A bond is a loan to a government or company. When rates rise, new bonds pay higher interest."),
mc("What is the most important practical difference between checking and savings accounts?",["You withdraw often from checking, rarely from savings","Checking pays much more interest than savings","Only savings accounts come with a debit card","Checking is for goals and savings is for bills"],0,"Checking is for frequent spending; savings is a goals account (travel, a house, an emergency fund)."),
mc("Why does Ramit suggest keeping checking and savings at two different banks?",["Extra steps help protect your savings from spending","The law requires one bank for each account","It doubles the interest you earn each year","It lowers the income taxes you owe"],0,"If savings are not instantly reachable, you are less likely to spend them."),
mc("Ramit’s example: $5,000 in savings at 3% vs 0.5%. What is his point?",["The gap is only about $10 a month, so don’t obsess","You should switch banks every single month","Savings accounts are the best way to build wealth","Interest rates stay the same for decades"],0,"3% is about $12.50 a month and 0.5% about $2.08. The Big Wins matter more."),
mc("Which is NOT one of the consequences of missing a credit card payment mentioned in the book?",["Your bank account is closed automatically","Your credit score can drop by 100+ points","Your APR can rise as high as 30%","You are charged a late fee of about $35"],0,"The book lists the score drop, the APR increase, the late fee and higher rates on your other cards."),
mc("On a $200,000 30-year mortgage, how much more does someone with a 620–639 score pay than someone with 760–850?",["About $70,000 more over the life of the loan","About $700 more over the life of the loan","About $7,000 more over the life of the loan","Nearly the same amount over the life of the loan"],0,"$425,585 vs $355,420: roughly $70,165 more with interest. Your score really changes what you pay.")

function rnd(a){a=a.slice();for(var k=a.length-1;k>0;k--){var j=Math.floor(Math.random()*(k+1));var t=a[k];a[k]=a[j];a[j]=t}return a}
function targets(n,m){var t;do{var base=[];for(var k=0;k<n;k++)base.push(k%m);t=rnd(base)}while(t.some(function(x,k){return k&&x==t[k-1]}));return t}
function place(qs,m,fixedOthers){var t=targets(qs.length,m);qs.forEach(function(q,k){var c=q.o[q.a],rest=rnd(q.o.filter(function(_,n){return n!=q.a})),o=rest.slice(0,m-1);o.splice(Math.min(t[k],o.length),0,c);q.o=o;q.a=t[k]})}
place(Q.filter(function(q){return q.p==0}),8);
place(Q.filter(function(q){return q.p==2}),4);

'<p>Work alone or in pairs. After each answer, read the explanation. Discuss it before you go on.</p><div class="row"><button class="btn primary big" id="go">Start →</button></div></section>');
document.getElementById("go").onclick=show}

var d='';Q.forEach(function(_,k){d+='<span class="dot'+(k==i?' cur':res[k]===undefined?'':res[k]?' right':' wrong')+'">'+(k+1)+'</span>'});
h('<section class="card"><div class="qtop"><span class="part">'+P[q.p]+'</span><span class="lbl">Question '+(i+1)+' of '+Q.length+'</span></div><p class="q">'+q.q+'</p>'+
'<div class="opts'+(q.col?' col':'')+'">'+q.o.map(function(t,k){return '<button class="o" data-k="'+k+'">'+t+'</button>'}).join('')+'</div><div id="fb"></div></section>');
st.querySelectorAll(".o").forEach(function(b){b.onclick=function(){pick(+b.dataset.k)}})}

st.querySelectorAll(".o").forEach(function(b,n){b.disabled=true;if(n==q.a){b.classList.add("good");b.insertAdjacentHTML("afterbegin",'<span class="mk yes">✓</span>')}else if(n==k){b.classList.add("bad");b.insertAdjacentHTML("afterbegin",'<span class="mk no">✗</span>')}});

["APY","Annual percentage yield: what you <b>earn</b> in a year on savings, with compounding."],
