<title>The Envelope</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F6FA; --card:#FFFFFF; --ink:#14213D; --ink2:#54627C; --line:#D8DEE9; --accent:#2457D6; --accent-t:#E3EBFF; --on:#FFFFFF;
  --warm:#B4440F; --warm-t:#FFEBDD; --ok-t:#E3F4EA; --ok:#17724A; --night:#0E1626;
  --f-d:"Bricolage Grotesque","Arial Black",system-ui,sans-serif;
  --f-b:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1424; --card:#172036; --ink:#EAEEF9; --ink2:#A4B0CB; --line:#2C3957; --accent:#8FADFF; --accent-t:#1E2D5C; --on:#0E1424;
  --warm:#FFAA78; --warm-t:#4A2914; --ok-t:#14392A; --ok:#79D9A5; --night:#070B14; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1424; --card:#172036; --ink:#EAEEF9; --ink2:#A4B0CB; --line:#2C3957; --accent:#8FADFF; --accent-t:#1E2D5C; --on:#0E1424;
  --warm:#FFAA78; --warm-t:#4A2914; --ok-t:#14392A; --ok:#79D9A5; --night:#070B14; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:19px/1.55 var(--f-b);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px}
.wrap{max-width:1000px;margin:0 auto}
header{padding:22px 0 10px}
.kick{font:700 13px var(--f-b);letter-spacing:.14em;text-transform:uppercase;color:var(--warm);margin:0 0 4px}
h1{font:800 clamp(34px,6vw,54px)/1 var(--f-d);margin:0 0 8px;letter-spacing:-.02em}
.sub{margin:0;color:var(--ink2);max-width:62ch}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line);margin-bottom:20px}
.row{display:flex;gap:8px;overflow-x:auto}
.row button{flex:none;font:700 16px var(--f-b);padding:10px 16px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.row button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--on)}
button:focus-visible{outline:3px solid var(--warm);outline-offset:2px}
.photo{margin:0 0 16px;border-radius:14px;overflow:hidden;background:var(--night);border:1.5px solid var(--line)}
.photo img{display:block;width:100%;height:auto}
.photo figcaption{padding:8px 14px;font:700 13px var(--f-b);letter-spacing:.1em;text-transform:uppercase;color:#C9D3EA;background:var(--night)}
h2{font:800 clamp(24px,3.6vw,32px)/1.1 var(--f-d);margin:0 0 10px}
h3{font:800 20px var(--f-d);margin:0 0 6px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:16px 18px;min-width:0}
.card.q{background:var(--accent-t);border-color:transparent}
.card.w{background:var(--warm-t);border-color:transparent}
ol.qs{margin:0;padding-left:22px;display:grid;gap:10px}
.use{display:inline-block;font:700 12px var(--f-b);letter-spacing:.08em;text-transform:uppercase;padding:1px 8px;border-radius:999px;background:var(--card);color:var(--ink2);margin-left:6px;vertical-align:1px}
dl{margin:0;display:grid;gap:8px}
dt{font-weight:700}
dd{margin:0;color:var(--ink2);font-size:17px}
dt+dd{margin-top:-6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:4px 12px;font-size:17px}
.gram{display:grid;gap:14px}
.g{background:var(--card);border:1.5px solid var(--line);border-left:6px solid var(--accent);border-radius:12px;padding:14px 18px}
.g .form{font:700 17px var(--f-b);color:var(--accent);margin:0 0 4px}
.g p{margin:2px 0}
.g .ex{color:var(--ink)}
.g .why{color:var(--ink2);font-size:17px}
mark{background:var(--warm-t);color:var(--ink);padding:0 3px;border-radius:4px;font-weight:700}
.task{counter-reset:s;display:grid;gap:12px}
.task li{list-style:none;counter-increment:s;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 16px 12px 56px;position:relative}
.task li::before{content:counter(s);position:absolute;left:14px;top:10px;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--on);font:800 16px/30px var(--f-d);text-align:center}
.task{margin:0;padding:0}
.nextbar{display:flex;justify-content:space-between;gap:10px;margin-top:22px}
.nextbar button{font:700 17px var(--f-b);padding:12px 20px;border-radius:10px;border:1.5px solid var(--accent);background:var(--accent);color:var(--on);cursor:pointer}
.nextbar button.ghost{background:transparent;color:var(--accent)}
</style>

<div class="wrap">
<header>
  <p class="kick">Group 1 · Photo story</p>
  <h1>The Envelope</h1>
  <p class="sub">Three photos, one night. Look carefully, then decide together what happened before, what is happening now, and how it ends. There is no right answer. A good story has clues from the photos.</p>
</header>

const EP=[
{n:'Episode 1',when:'The laundromat',alt:'A woman in a green rain jacket stands in a laundromat at night holding a towel, looking toward a rainy window where a figure in a long coat stands outside. A tan envelope tied with red string sits on a dryer.',
 q:[['What is she doing, and what has just made her stop?','was doing / had just heard'],
    ['Who is the figure in the window? How long had he been standing there?','had been standing'],
    ['What is in the envelope, and who left it on the dryer?','must / might / can’t have + p.p.'],
    ['Why is she doing laundry so late at night?','had been working / was']],
 w:[['uneasy','nervous, with a feeling that something is wrong'],['wary','careful because you do not trust something'],['to stumble upon','to find by accident'],['to be on edge','to feel tense and ready to react'],['out of the blue','suddenly, without warning'],['abandoned','left behind by someone']]},
{n:'Episode 2',when:'The diner',alt:'The same woman sits in a red diner booth with her hand over her mouth. On the table are the open envelope, a black-and-white photograph and a key. Behind her an older man in a camel coat looks at her over a newspaper.',
 q:[['What is she looking at, and why is she so shocked?','has just seen / realized'],
    ['The man at the counter keeps looking at her. Was he following her, or is it a coincidence?','had been following / might have'],
    ['Whose photograph is it? Who is in it?','must have been / can’t be'],
    ['What does the key open? Why did someone keep it for years?','had kept / has been hidden']],
 w:[['dumbfounded','so surprised you cannot speak'],['to keep an eye on','to watch carefully'],['a long-lost secret','something hidden for many years'],['to put two and two together','to understand the truth from small clues'],['suspicious','making you feel something is not honest'],['to tamper with','to change something that should be left alone']]},
{n:'Episode 3',when:'The bus stop',alt:'At dawn the woman sits on a bus stop bench in the rain, smiling slightly and looking to the side with her fist closed. The empty envelope is on her lap. A brown leather satchel sits next to her and a bus is approaching.',
 q:[['Where is she going, and why does she look relieved?','is about to / has decided'],
    ['Whose leather bag is next to her? What happened to its owner?','must belong / had left'],
    ['What is she holding in her fist? Why is she smiling now?','has found / will have'],
    ['How will her life be different in a year?','will have changed / will have been']],
 w:[['bittersweet','happy and sad at the same time'],['to come to terms with','to accept something difficult'],['a turning point','a moment when everything changes'],['to be torn between','to find it hard to choose'],['closure','the feeling that something painful is finally over'],['to have mixed feelings','to feel two different emotions']]}
];
const BANK={
 adj:['exhausted','startled','hesitant','relieved','mysterious','eerie','heartbroken','determined','overwhelmed','guilty','nostalgic','suspicious'],
 spec:['It looks as if she’s…','It seems like…','She must have…','He can’t have…','I’d say that…','The way she’s holding… suggests that…','There’s a good chance that…','What if…?','Maybe it’s a coincidence, but…','That would explain why…'],
 link:['Meanwhile,','By the time she got to the diner,','After that,','Little did she know that…','As it turned out,','In the end,','All of a sudden,']
};
const GR=[
 {f:'Past simple',s:'finished actions in order',ex:'She <mark>found</mark> the envelope, <mark>took</mark> it to the diner and <mark>opened</mark> it.',why:'The main events of the story, one after another.'},
 {f:'Past continuous · was / were + -ing',s:'the background, an action in progress',ex:'She <mark>was folding</mark> towels when she <mark>noticed</mark> a figure at the window.',why:'The longer action sets the scene. The short action interrupts it (past simple).'},
 {f:'Past perfect · had + past participle',s:'one step further back',ex:'Someone <mark>had left</mark> the envelope before she <mark>arrived</mark>.',why:'Use it for the backstory: what happened before the moment in the photo.'},
 {f:'Past perfect continuous · had been + -ing',s:'how long, or the reason for what you see',ex:'He <mark>had been watching</mark> her for weeks. Her eyes were red because she <mark>had been crying</mark>.',why:'Shows an activity that continued up to the photo. The result is still visible.'},
 {f:'Guessing about the past · must / might / can’t have + past participle',s:'what you think happened',ex:'It <mark>must have been</mark> her mother’s. It <mark>can’t have been</mark> a coincidence.',why:'must = almost sure, might = possible, can’t = almost sure it is not true.'},
 {f:'Future perfect · will have + past participle',s:'finished by a future moment',ex:'By next week, she <mark>will have decided</mark> what to do with the key.',why:'Use it for outcomes: what will be done before a certain time.'}
];
const TASK=[
 'Decide who the woman is. (Give her a name. What does she do? What kind of day had she had before the first photo?)',
 'Agree on the backstory. Who had left the envelope? What had happened between them years ago? Use <b>past perfect</b> and <b>past perfect continuous</b>.',
 'Tell the middle. What did she find in the envelope, and why did the man in the camel coat follow her? Use <b>past simple</b> and <b>past continuous</b>.',
 'Choose your ending. What is she holding in her fist? Where is the bus taking her? What <b>will have happened</b> by the end of the month?',
 'Prepare a 2-minute retelling. Everyone in the group speaks. Add one surprise that the other groups will not expect.'
];
const TABS=[['look','1. Look and talk'],['words','2. Useful words'],['gram','3. Grammar'],['tell','4. Tell the story']];
const tabs=document.getElementById('tabs'),main=document.getElementById('main');
let cur='look',ep=0;
const E=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
function look(){
  const e=EP[ep];
  return `<div class="row" role="tablist" style="margin-bottom:14px">${EP.map((x,i)=>`<button role="tab" aria-selected="${i===ep}" data-ep="${i}">${x.n}</button>`).join('')}</div>
  <figure class="photo"><img src="${IMG[ep]}" alt="${E(e.alt)}"><figcaption>${e.n} · ${e.when}</figcaption></figure>
  <div class="grid"><div class="card q"><h3>Talk about it</h3><ol class="qs">${e.q.map(q=>`<li>${E(q[0])}<span class="use">${E(q[1])}</span></li>`).join('')}</ol></div>
  <div class="card w"><h3>Words for this photo</h3><dl>${e.w.map(w=>`<dt>${E(w[0])}</dt><dd>${E(w[1])}</dd>`).join('')}</dl></div></div>
  <div class="nextbar"><button class="ghost" data-go="prev" ${ep===0?'disabled style="visibility:hidden"':''}>Back</button><button data-go="next">${ep<2?'Next photo':'Next: useful words'}</button></div>`;
}
function words(){
  return `<h2>Useful language</h2><div class="grid">
  <div class="card"><h3>Describing feelings and faces</h3><div class="chips">${BANK.adj.map(x=>`<span class="chip">${x}</span>`).join('')}</div></div>
  <div class="card"><h3>Guessing and speculating</h3><div class="chips">${BANK.spec.map(x=>`<span class="chip">${E(x)}</span>`).join('')}</div></div>
  <div class="card"><h3>Moving the story forward</h3><div class="chips">${BANK.link.map(x=>`<span class="chip">${E(x)}</span>`).join('')}</div></div></div>
  <div class="nextbar"><button class="ghost" data-tab="look">Back</button><button data-tab="gram">Next: grammar</button></div>`;
}
function gram(){
  return `<h2>Quick grammar reminder</h2><p class="sub" style="margin:0 0 14px;color:var(--ink2)">Your story will probably use all of these. The first photo is your “now”. Everything before it is the past in the past.</p>
  <div class="gram">${GR.map(g=>`<div class="g"><p class="form">${g.f}</p><p>${E(g.s)}</p><p class="ex">${g.ex}</p><p class="why">${E(g.why)}</p></div>`).join('')}</div>
  <div class="card q" style="margin-top:16px"><h3>Watch out</h3><p style="margin:0">Not <i>She was knowing</i> (stative verbs: know, want, believe do not take -ing). Not <i>She was in the diner since midnight</i>. Say <i>She had been in the diner since midnight</i>. Do not use past perfect for a simple list of events in order.</p></div>
  <div class="nextbar"><button class="ghost" data-tab="words">Back</button><button data-tab="tell">Next: tell the story</button></div>`;
}
function tell(){
  return `<h2>Your group’s task</h2><ol class="task">${TASK.map(t=>`<li>${t}</li>`).join('')}</ol>
  <div class="card w" style="margin-top:16px"><h3>While other groups present</h3><p style="margin:0">Listen for one detail that is different from your story. Ask one question with <i>Had you…?</i> or <i>Will it have…?</i></p></div>
  <div class="nextbar"><button class="ghost" data-tab="gram">Back</button><button data-tab="look">Back to the photos</button></div>`;
}
function render(){
  tabs.innerHTML=TABS.map(t=>`<button role="tab" aria-selected="${t[0]===cur}" data-tab="${t[0]}">${t[1]}</button>`).join('');
  main.innerHTML={look,words,gram,tell}[cur]();
  window.scrollTo({top:0});
}
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.tab){cur=b.dataset.tab;render();}
  else if(b.dataset.ep!==undefined){ep=+b.dataset.ep;render();}
  else if(b.dataset.go==='next'){if(ep<2){ep++;}else{cur='words';}render();}
  else if(b.dataset.go==='prev'){ep=Math.max(0,ep-1);render();}
});
render();
</script>
