<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>The Tower and the City</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: a 16:9 stage scaled with container units, one slide at a time. Controls sit under the stage. Below 760px the stage drops the 16:9 ratio and slides scroll. */
:root {
  --ink: #0b1827;
  --red: #9d251a;
  --sky: #418abd;
  --sky-text: #2b6a9a;
  --bg: #e4e7eb;
  --card: #ffffff;
  --fg: #0b1827;
  --muted: #566274;
  --line: #d6dae0;
  --soft: #eef0f3;
  --btn-bg: #0b1827;
  --btn-fg: #ffffff;
  --okbg: #e3f3ea;
  --ok: #1f6b45;
  --badbg: #f6e4e1;
  --hl: #ffef0a;
  --hl-fg: #0b1827;
  --logo-filter: none;
  --dark-slide: #0b1827;
  --dark-fg: #ffffff;
  --font-display: "Montserrat", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Source Serif 4", Georgia, "Times New Roman", serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --red: #f0907f; --sky: #6fb0dd; --sky-text: #8cc3e8;
    --bg: #050c14; --card: #0e2a47; --fg: #eef3f8; --muted: #a9b8c9; --line: #25496e; --soft: #123456;
    --btn-bg: #6fb0dd; --btn-fg: #08111c; --okbg: #163a2b; --ok: #7fd1a3; --badbg: #4a2527; --hl: #e6d800; --logo-filter: brightness(0) invert(0.93);
    --dark-slide: #08111c; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --red: #f0907f; --sky: #6fb0dd; --sky-text: #8cc3e8;
  --bg: #050c14; --card: #0e2a47; --fg: #eef3f8; --muted: #a9b8c9; --line: #25496e; --soft: #123456;
  --btn-bg: #6fb0dd; --btn-fg: #08111c; --okbg: #163a2b; --ok: #7fd1a3; --badbg: #4a2527; --hl: #e6d800; --logo-filter: brightness(0) invert(0.93);
  --dark-slide: #08111c; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px 18px;
}
.app { max-width: 1280px; margin-inline: auto; display: flex; flex-direction: column; gap: 10px; }
.stage { --s: 1cqw; container-type: inline-size; width: 100%; aspect-ratio: 16 / 9; background: var(--card); border: 1px solid var(--line); position: relative; overflow: hidden; }
.slide { position: absolute; inset: 0; display: flex; flex-direction: column; padding: calc(var(--s) * 2.4) calc(var(--s) * 3.4) calc(var(--s) * 2.2); gap: calc(var(--s) * 1.4); min-width: 0; }
.slide[hidden] { display: none !important; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex: none; }
.kick { font-family: var(--font-display); font-weight: 700; font-size: calc(var(--s) * 1.15); letter-spacing: 0.16em; text-transform: uppercase; color: var(--red); }
.kick span { color: var(--muted); font-weight: 600; letter-spacing: 0.08em; }
.mini { height: calc(var(--s) * 2.2); width: auto; filter: var(--logo-filter); display: block; }
h2 { margin: 0; font-weight: 600; font-size: calc(var(--s) * 3); line-height: 1.15; text-wrap: balance; flex: none; }
.lead { margin: 0; font-size: calc(var(--s) * 1.9); line-height: 1.4; color: var(--muted); max-width: 70ch; flex: none; }
.body { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: calc(var(--s) * 1.4); }
.btn { font-family: var(--font-display); font-weight: 600; font-size: calc(var(--s) * 1.5); letter-spacing: 0.03em; border-radius: 2px; cursor: pointer; padding: calc(var(--s) * 0.9) calc(var(--s) * 1.6); min-height: 44px; border: 1px solid transparent; }
.btn.solid { background: var(--btn-bg); color: var(--btn-fg); }
.btn.solid:hover { opacity: 0.9; }
.btn.line { background: transparent; color: var(--fg); border-color: var(--line); }
.btn.line:hover { background: var(--soft); }
.btn:focus-visible, .opt:focus-visible, select:focus-visible, textarea:focus-visible, input:focus-visible, .card:focus-visible, .wc:focus-visible, .ctl button:focus-visible, .ctl select:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }
.row { display: flex; flex-wrap: wrap; gap: calc(var(--s) * 1) calc(var(--s) * 1.2); align-items: center; }
.score { font-family: var(--font-display); font-weight: 700; font-size: calc(var(--s) * 1.6); color: var(--sky-text); font-variant-numeric: tabular-nums; }
.note { font-size: calc(var(--s) * 1.6); color: var(--muted); line-height: 1.4; }

/* title slide */
.slide.title { background: var(--dark-slide); color: var(--dark-fg); padding: 0; flex-direction: row; gap: 0; }
.slide.title .l { flex: 1.15; padding: calc(var(--s) * 4) calc(var(--s) * 4); display: flex; flex-direction: column; justify-content: space-between; min-width: 0; }
.slide.title .logo { height: calc(var(--s) * 3.4); width: auto; align-self: flex-start; filter: brightness(0) invert(1); }
.slide.title h1 { margin: 0; font-weight: 600; font-size: calc(var(--s) * 6.2); line-height: 1.05; text-wrap: balance; }
.slide.title .sub { margin: calc(var(--s) * 1.6) 0 0; font-size: calc(var(--s) * 2.1); line-height: 1.35; max-width: 24ch; opacity: 0.88; }
.slide.title .wk { font-family: var(--font-display); font-weight: 700; font-size: calc(var(--s) * 1.25); letter-spacing: 0.16em; text-transform: uppercase; color: #9fd0f0; }
.slide.title .r { flex: 1; background: center / cover no-repeat var(--photo); border-left: calc(var(--s) * 0.7) solid var(--red); }
.photo { background: center / cover no-repeat var(--photo); min-height: 0; }

/* warm-up */
.warm { display: grid; grid-template-columns: 0.8fr 1.2fr; gap: calc(var(--s) * 2.4); flex: 1; min-height: 0; }
.warm .photo { border: 1px solid var(--line); }
.qs { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: calc(var(--s) * 1.4); counter-reset: q; }
.qs li { counter-increment: q; font-size: calc(var(--s) * 2.4); line-height: 1.35; padding-left: calc(var(--s) * 3.4); position: relative; }
.qs li::before { content: counter(q); position: absolute; left: 0; top: 0; font-family: var(--font-display); font-weight: 700; font-size: calc(var(--s) * 1.6); color: var(--sky-text); }
.timer { font-family: var(--font-display); font-weight: 700; font-size: calc(var(--s) * 3); font-variant-numeric: tabular-nums; min-width: 4.2ch; }
.timer.end { color: var(--red); }

/* predict + generic option buttons */
.pgrid { display: grid; grid-template-columns: 1fr 1fr; gap: calc(var(--s) * 1.6) calc(var(--s) * 2.4); }
.q .qt { margin: 0 0 calc(var(--s) * 0.7); font-size: calc(var(--s) * 2.15); line-height: 1.3; font-weight: 600; }
.opts { display: flex; flex-wrap: wrap; gap: calc(var(--s) * 0.7); }
.opt { font-family: var(--font-display); font-weight: 600; font-size: calc(var(--s) * 1.7); padding: calc(var(--s) * 0.8) calc(var(--s) * 1.3); min-height: 44px; border: 1px solid var(--line); border-radius: 2px; background: var(--card); color: var(--fg); cursor: pointer; text-align: left; }
.opt:hover { background: var(--soft); }
.opt[aria-pressed="true"] { background: var(--btn-bg); color: var(--btn-fg); border-color: var(--btn-bg); }
.opt.ok { background: var(--okbg); color: var(--fg); border-color: var(--ok); box-shadow: inset 0 0 0 1px var(--ok); }
.opt.bad { background: var(--badbg); color: var(--fg); border-color: var(--red); text-decoration: line-through; }

/* vocab cards */
.cards { display: grid; grid-template-columns: repeat(5, 1fr); gap: calc(var(--s) * 1); align-items: start; flex: 1; min-height: 0; }
.card { border: 1px solid var(--line); border-radius: 2px; background: var(--card); color: var(--fg); padding: calc(var(--s) * 1.4); text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: calc(var(--s) * 0.8); min-width: 0; font: inherit; }
.card:hover { background: var(--soft); }
.card .w { font-family: var(--font-display); font-weight: 700; font-size: calc(var(--s) * 2.2); line-height: 1.1;  }
.card .st { font-family: var(--font-display); font-weight: 600; font-size: calc(var(--s) * 1.3); letter-spacing: 0.06em; color: var(--sky-text); }
.card .back { display: none; flex-direction: column; gap: calc(var(--s) * 0.8); }
.card .back p { margin: 0; font-size: calc(var(--s) * 1.8); line-height: 1.35; }
.card .back p.ex { color: var(--muted); font-style: italic; }
.card.open { border-color: var(--sky); box-shadow: inset 0 calc(var(--s) * 0.5) 0 var(--sky); }
.card.open .back { display: flex; }
.card .tap { font-size: calc(var(--s) * 1.4); color: var(--muted); }
.card.open .tap { display: none; }
.old { font-size: calc(var(--s) * 1.7); color: var(--muted); }
.old b { font-family: var(--font-display); color: var(--fg); }

/* reading */
.read { font-size: calc(var(--s) * 2.5); line-height: 1.5; display: flex; flex-direction: column; gap: calc(var(--s) * 1.2); max-width: 74ch; }
.read p { margin: 0; }
mark.n { background: var(--hl); color: var(--hl-fg); padding: 0 0.15em; cursor: pointer; border-radius: 1px; }
u.r { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; text-decoration-color: var(--sky); cursor: pointer; }
.focusq { margin-top: auto; background: var(--soft); padding: calc(var(--s) * 1.1) calc(var(--s) * 1.5); display: flex; flex-direction: column; gap: calc(var(--s) * 0.4); flex: none; }
.focusq b { font-family: var(--font-display); font-size: calc(var(--s) * 1.1); letter-spacing: 0.14em; text-transform: uppercase; color: var(--red); }
.focusq span { font-size: calc(var(--s) * 1.95); line-height: 1.35; }
.gloss { min-height: calc(var(--s) * 2.6); font-family: var(--font-display); font-weight: 600; font-size: calc(var(--s) * 1.65); color: var(--sky-text); }
.legend { font-size: calc(var(--s) * 1.45); color: var(--muted); }
.legend mark.n, .legend u.r { cursor: default; }

/* check activities */
.items { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: calc(var(--s) * 0.9); counter-reset: it; flex: 1; min-height: 0; }
.items > li { counter-increment: it; display: flex; align-items: center; gap: calc(var(--s) * 1.2); padding: calc(var(--s) * 0.5) calc(var(--s) * 0.8) calc(var(--s) * 0.5) calc(var(--s) * 3); position: relative; border-left: 4px solid transparent; font-size: calc(var(--s) * 2); line-height: 1.3; min-width: 0; }
.items > li::before { content: counter(it); position: absolute; left: calc(var(--s) * 0.7); font-family: var(--font-display); font-weight: 700; font-size: calc(var(--s) * 1.3); color: var(--sky-text); }
.items > li.ok { background: var(--okbg); border-left-color: var(--ok); }
.items > li.bad { background: var(--badbg); border-left-color: var(--red); }
.items .txt { flex: 1; min-width: 0; }
.items .why { display: block; font-family: var(--font-display); font-size: calc(var(--s) * 1.15); font-weight: 600; color: var(--ok); margin-top: 2px; }
.items > li.bad .why { color: var(--red); }
.items select, .items .opts { flex: none; }
select { font-family: var(--font-display); font-weight: 600; font-size: calc(var(--s) * 1.55); padding: calc(var(--s) * 0.7) calc(var(--s) * 0.9); min-height: 44px; max-width: 100%; border: 1px solid var(--fg); background: var(--card); color: var(--fg); border-radius: 2px; }
.items select { width: calc(var(--s) * 36); }
.items .opts { flex-wrap: nowrap; }
.items .opt { font-size: calc(var(--s) * 1.55); padding: calc(var(--s) * 0.7) calc(var(--s) * 1.1); text-align: center; }
.bank { display: flex; flex-wrap: wrap; gap: calc(var(--s) * 0.8); flex: none; }
.bank span { font-family: var(--font-display); font-weight: 700; font-size: calc(var(--s) * 1.75); padding: calc(var(--s) * 0.5) calc(var(--s) * 1.2); background: var(--soft); border: 1px solid var(--line); border-radius: 2px; }
.blank { font-family: var(--font-display); font-weight: 600; font-size: calc(var(--s) * 1.8); width: calc(var(--s) * 13); max-width: 100%; padding: 2px calc(var(--s) * 0.7); border: 0; border-bottom: 2px solid var(--fg); background: var(--soft); color: var(--fg); border-radius: 2px 2px 0 0; text-align: center; }
.items.gaps > li { line-height: 1.9; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: calc(var(--s) * 0.8); flex: none; }
.pair .opt { text-align: left; font-family: var(--font-body); font-weight: 400; font-size: calc(var(--s) * 1.8); line-height: 1.3; }
.items.use > li { align-items: stretch; flex-direction: column; gap: calc(var(--s) * 0.5); }
.items.use .pair { width: 100%; }

/* speaking cards */
.sp { display: grid; grid-template-columns: 0.55fr 1.45fr; gap: calc(var(--s) * 2); flex: 1; min-height: 0; }
.sp .list { display: flex; flex-direction: column; gap: calc(var(--s) * 0.8); }
.wc { font-family: var(--font-display); font-weight: 700; font-size: calc(var(--s) * 2.3); text-align: left; padding: calc(var(--s) * 1) calc(var(--s) * 1.4); border: 1px solid var(--line); background: var(--card); color: var(--fg); border-radius: 2px; cursor: pointer; flex: 1; }
.wc:hover { background: var(--soft); }
.wc[aria-pressed="true"] { background: var(--btn-bg); color: var(--btn-fg); border-color: var(--btn-bg); }
.sp .big { background: var(--soft); padding: calc(var(--s) * 2.4); display: flex; flex-direction: column; justify-content: center; gap: calc(var(--s) * 1.2); }
.sp .big b { font-family: var(--font-display); font-size: calc(var(--s) * 1.2); letter-spacing: 0.16em; text-transform: uppercase; color: var(--red); }
.sp .big p { margin: 0; font-size: calc(var(--s) * 2.7); line-height: 1.3; }

/* opinion */
.scale { display: grid; grid-template-columns: repeat(5, calc(var(--s) * 5)); gap: calc(var(--s) * 0.6); flex: none; }
.scale .opt { text-align: center; padding-inline: 0; }
.ends { display: flex; justify-content: space-between; font-size: calc(var(--s) * 1.1); color: var(--muted); font-family: var(--font-display); width: calc(var(--s) * 28.4); margin-top: 2px; }
.stmt { display: flex; flex-direction: column; }
.opin > li { align-items: flex-start; justify-content: space-between; }

/* exit ticket */
textarea { width: 100%; flex: 1; min-height: calc(var(--s) * 10); font-family: var(--font-body); font-size: calc(var(--s) * 2); line-height: 1.45; padding: calc(var(--s) * 1.2); border: 1px solid var(--line); border-radius: 2px; background: var(--card); color: var(--fg); resize: none; }
.used { display: flex; flex-wrap: wrap; gap: calc(var(--s) * 0.8); align-items: center; }
.used span { font-family: var(--font-display); font-weight: 700; font-size: calc(var(--s) * 1.65); padding: calc(var(--s) * 0.5) calc(var(--s) * 1.2); border: 1px solid var(--line); border-radius: 2px; color: var(--muted); }
.used span.on { background: var(--hl); color: var(--hl-fg); border-color: var(--hl); }

/* controls */
.ctl { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.ctl button, .ctl select { font-family: var(--font-display); font-weight: 600; font-size: 0.85rem; padding: 10px 16px; min-height: 44px; border: 1px solid var(--line); background: var(--card); color: var(--fg); border-radius: 2px; cursor: pointer; }
.ctl button.next { background: var(--btn-bg); color: var(--btn-fg); border-color: var(--btn-bg); }
.ctl button:hover { opacity: 0.9; }
.ctl select { min-width: 0; max-width: 100%; flex: 1 1 200px; }
.ctl .pg { font-family: var(--font-display); font-weight: 700; font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; margin-left: auto; }
.prog { height: 4px; background: var(--line); }
.prog i { display: block; height: 100%; background: var(--red); width: 0; transition: width 0.25s; }
@media (prefers-reduced-motion: reduce) { .prog i { transition: none; } }

@media (max-width: 760px) {
  .stage { --s: 0.5rem; aspect-ratio: auto; container-type: normal; min-height: 60vh; overflow: visible; }
  .slide { position: relative; inset: auto; padding: 1.3rem 1.1rem 1.6rem; min-height: 60vh; }
  .slide.title { flex-direction: column-reverse; }
  .slide.title .l { padding: 1.6rem 1.2rem; gap: 2rem; }
  .slide.title .r { min-height: 14rem; border-left: 0; border-bottom: 0.4rem solid var(--red); }
  .slide.title h1 { font-size: 2.4rem; }
  .warm, .sp, .pgrid { grid-template-columns: 1fr; }
  .warm .photo { min-height: 12rem; }
  .cards { grid-template-columns: 1fr 1fr; }
  h2 { font-size: 1.5rem; }
  .items > li { flex-wrap: wrap; align-items: flex-start; padding-left: 1.9rem; font-size: 1.05rem; }
  .items .opts { flex-wrap: wrap; }
  .items .txt { flex: 1 1 100%; }
  .items select { width: 100%; }
  .pair { grid-template-columns: 1fr; }
  .qs li, .read, .sp .big p { font-size: 1.1rem; }
  .sp .big p { font-size: 1.35rem; }
  .items > li::before { left: 0.4rem; }
  .scale { grid-template-columns: repeat(5, 2.6rem); }
  .ends { width: 100%; max-width: 16rem; }
  .qs li { padding-left: 1.8rem; }
  .qs li::before, .kick { font-size: 0.8rem; }
  .wc { font-size: 1.1rem; }
  .opt, .btn, .items .opt { font-size: 0.9rem; }
  .score, .note, .legend, .gloss { font-size: 0.9rem; }
  .q .qt { font-size: 1.05rem; }
  .card .w { font-size: 1.3rem; } .card .back p { font-size: 0.95rem; }
  .timer { font-size: 1.5rem; }
  textarea { font-size: 1rem; min-height: 9rem; }
  .blank { font-size: 1rem; width: 8.5rem; }
  .used span, .bank span { font-size: 0.85rem; }
  .focusq span { font-size: 1rem; }
  .lead { font-size: 1rem; }
}
</style>
<style id="photo-css"></style>

<div class="app">
  <div class="stage" id="stage"></div>
  <div class="prog" aria-hidden="true"><i id="bar"></i></div>
  <div class="ctl">
    <button type="button" id="prev" aria-label="Previous slide">&larr; Back</button>
    <button type="button" id="next" class="next" aria-label="Next slide">Next &rarr;</button>
    <select id="jump" aria-label="Jump to slide"></select>
    <button type="button" id="full">Full screen</button>
    <span class="pg" id="pg" role="status"></span>
  </div>
</div>

  S.push({ t: "Meet the words", html: top('Vocabulary', 'five new words') + '<h2>Meet the words</h2><p class="lead">Tap a card to see the meaning. Say each word out loud.</p><div class="body"><div class="cards">' +
    CARDS.map(function (c) { return '<button class="card" type="button" aria-expanded="false"><span class="w">' + c[0] + '</span><span class="st">' + c[1] + ' · ' + c[2] + '</span><span class="tap">Tap to see the meaning</span><span class="back"><p>' + esc(c[3]) + '</p><p class="ex">“' + esc(c[4]) + '”</p></span></button>'; }).join('') +
    '</div><div class="old"><b>You already know:</b> stand out · hub · plunge · spark · ramp up · at stake. Look for them in the article.</div></div>' });

  S.push({ t: "Read 1", html: readSlide(1, 4, [P[0]], 'Why may this be Boston’s last skyscraper for a while?') });
  S.push({ t: "Read 2", html: readSlide(2, 4, [P[1]], 'Who criticizes the tower, and why?') });
  S.push({ t: "Read 3", html: readSlide(3, 4, [P[2]], 'Find two ideas the city has to make more homes.') });
  S.push({ t: "Read 4", html: readSlide(4, 4, [P[3], P[4]], 'What does each side say about the rules? What is at stake?') });

  S.push({ t: "Headlines", html: top('Check', 'main ideas') + '<h2>Which headline fits?</h2><p class="lead">Each paragraph needs a headline. One headline is extra.</p><div class="body"><ul class="items" data-kind="head">' +
    [0, 1, 2, 3, 4].map(function (i) { var st = ['South Station Tower is hard to miss…', 'The tower has sparked criticism…', 'Now the city wants to revamp its rules…', 'The need is clear…', 'Much is at stake…'][i]; return '<li data-ans="' + i + '"><span class="txt"><b>Paragraph ' + (i + 1) + ':</b> ' + esc(st) + '</span><select aria-label="Headline for paragraph ' + (i + 1) + '"><option value="">Choose a headline…</option>' + HORDER.map(function (h) { return '<option value="' + h + '">' + esc(HEAD[h]) + '</option>'; }).join('') + '</select></li>'; }).join('') +
    '</ul>' + checkBar() + '</div>' });

  S.push({ t: "True / False / Not given", html: top('Check', 'details') + '<h2>True, false or not given?</h2><p class="lead">Not given means the article does not say.</p><div class="body"><ul class="items" data-kind="tf">' +
    TF.map(function (t) { return '<li data-ans="' + t[1] + '" data-why="' + esc(t[2]) + '"><span class="txt">' + esc(t[0]) + '</span><span class="opts">' + [["T", "True"], ["F", "False"], ["N", "Not given"]].map(function (o) { return '<button class="opt" type="button" data-v="' + o[0] + '" aria-pressed="false">' + o[1] + '</button>'; }).join('') + '</span></li>'; }).join('') +
    '</ul>' + checkBar() + '</div>' });

  S.push({ t: "Who says it?", html: top('Check', 'points of view') + '<h2>Who would say it?</h2><p class="lead">Choose the person or group that fits each sentence.</p><div class="body"><ul class="items" data-kind="who">' +
    WHOQ.map(function (q) { return '<li data-ans="' + q[1] + '"><span class="txt">' + q[0] + '</span><select aria-label="Who would say this?"><option value="">Choose…</option>' + WHO.map(function (w, i) { return '<option value="' + i + '">' + w + '</option>'; }).join('') + '</select></li>'; }).join('') +
    '</ul>' + checkBar() + '</div>' });

  S.push({ t: "Fill the gaps", html: top('Vocabulary', 'use the words') + '<h2>Fill the gaps</h2><div class="bank" aria-label="Word bank"><span>revamp</span><span>overcrowding</span><span>demolish</span><span>merge</span><span>decline</span></div><div class="body"><ul class="items gaps" data-kind="gap">' +
    GAPS.map(function (g, i) { return '<li data-ans="' + g[3] + '"><span class="txt">' + esc(g[0]) + '<input class="blank" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Gap ' + (i + 1) + '"> ' + esc(g[1]) + '</span></li>'; }).join('') +
    '</ul><p class="note">Change the form if you need to (for example: declined).</p>' + checkBar() + '</div>' });

  S.push({ t: "Which sentence is correct?", html: top('Vocabulary', 'natural English') + '<h2>Which sentence is correct?</h2><div class="body"><ul class="items use" data-kind="use">' +
    USE.map(function (u) { return '<li data-ans="' + u[2] + '"><div class="pair"><button class="opt" type="button" data-v="0" aria-pressed="false"><b>A</b>&nbsp; ' + esc(u[0]) + '</button><button class="opt" type="button" data-v="1" aria-pressed="false"><b>B</b>&nbsp; ' + esc(u[1]) + '</button></div></li>'; }).join('') +
    '</ul>' + checkBar() + '</div>' });

  S.push({ t: "Word cards", html: top('Speak', 'groups of three') + '<h2>Say it with the word</h2><div class="sp"><div class="list">' +
    SPEAK.map(function (s, i) { return '<button class="wc" type="button" data-i="' + i + '" aria-pressed="false">' + s[0] + '</button>'; }).join('') +

  S.push({ t: "Where do you stand?", html: top('Opinion', 'weigh in') + '<h2>Where do you stand?</h2><p class="lead">Choose a number, then find someone with a different number and ask why.</p><div class="body"><ul class="items opin" data-kind="opin">' +
    OPIN.map(function (o) { return '<li><span class="txt">' + esc(o) + '</span><span class="stmt"><span class="scale">' + [1, 2, 3, 4, 5].map(function (n) { return '<button class="opt" type="button" data-v="' + n + '" aria-pressed="false">' + n + '</button>'; }).join('') + '</span><span class="ends"><span>Disagree</span><span>Agree</span></span></span></li>'; }).join('') +
    '</ul></div>' });

  S.push({ t: "Exit ticket", html: top('Write', 'exit ticket') + '<h2>Your city, ten years from now</h2><p class="lead">Write two or three sentences about your city’s future. Use at least two new words.</p><div class="body"><textarea id="exit" aria-label="Your sentences" placeholder="In ten years, my city will..."></textarea><div class="used" aria-live="polite"><span data-w="revamp">revamp</span><span data-w="overcrowding">overcrowding</span><span data-w="demolish">demolish</span><span data-w="merge">merge</span><span data-w="decline">decline</span><span class="cnt" style="border:0;color:var(--sky-text)"></span></div><div class="row"><button class="btn line" data-act="copy" type="button">Copy my sentences</button></div></div>' });

  var stage = $("#stage"), cur = 0, secs = [];
  S.forEach(function (s, i) {
    var sec = document.createElement("section"); sec.className = "slide" + (s.cls ? " " + s.cls : ""); sec.setAttribute("aria-label", "Slide " + (i + 1) + ": " + s.t); sec.innerHTML = s.html; sec.hidden = i !== 0; stage.appendChild(sec); secs.push(sec);

    if (window.innerWidth <= 760) window.scrollTo({ top: 0 });
  }
  $("#prev").onclick = function () { go(cur - 1); }; $("#next").onclick = function () { go(cur + 1); }; jump.onchange = function () { go(+jump.value); };
  $("#full").onclick = function () { try { if (document.fullscreenElement) document.exitFullscreen(); else stage.requestFullscreen().catch(function () {}); } catch (e) {} };

  function clear(sec) { $$("li.ok, li.bad", sec).forEach(function (l) { l.classList.remove("ok", "bad"); }); $$(".why", sec).forEach(function (w) { w.remove(); }); $$(".opt.ok, .opt.bad", sec).forEach(function (o) { o.classList.remove("ok", "bad"); }); var sc = $(".score", sec); if (sc) sc.textContent = ""; }
  function why(li, text) { var s = document.createElement("span"); s.className = "why"; s.textContent = text; var t = $(".txt", li) || li; t.appendChild(s); }
  function value(li, kind) {

  function label(li, kind) {
    var a = li.dataset.ans;
    if (kind === "head") return HEAD[+a]; if (kind === "who") return WHO[+a];

    if (kind === "use") return "Sentence " + "AB"[+a]; if (kind === "gap") return a; return "";
  }
  function check(sec, show) {

    clear(sec);
    items.forEach(function (li) {
      var v = value(li, kind), ok = isOk(li, kind, v); if (ok) right++;
      li.classList.add(ok ? "ok" : "bad");

    $(".score", sec).textContent = right + " of " + items.length + " correct";
  }

  secs.forEach(function (sec, idx) {
    sec.addEventListener("click", function (e) {
      var t = e.target.closest("button, mark, u"); if (!t) return;

      if (t.matches("mark.n[data-m], u.r[data-m]")) { var g = $(".gloss", sec); if (g) g.textContent = t.dataset.m; return; }
      if (t.dataset.act === "check") return check(sec, false);
      if (t.dataset.act === "show") return check(sec, true);
      if (t.dataset.act === "reset") {
        clear(sec); $$(".opt[aria-pressed=true]", sec).forEach(function (o) { o.setAttribute("aria-pressed", "false"); }); $$("select", sec).forEach(function (s) { s.value = ""; }); $$("input.blank", sec).forEach(function (i) { i.value = ""; }); return;
      }
      if (t.classList.contains("opt") && (kind === "tf" || kind === "use" || kind === "opin")) {
        var grp = kind === "use" ? $(".pair", t.closest("li")) : (kind === "opin" ? $(".scale", t.closest("li")) : $(".opts", t.closest("li")));
        $$(".opt", grp).forEach(function (o) { o.setAttribute("aria-pressed", "false"); }); t.setAttribute("aria-pressed", "true"); return;
      }
      if (S[idx].t === "Predict the numbers") {
        if (t.classList.contains("opt")) { $$(".opt", t.parentNode).forEach(function (o) { o.setAttribute("aria-pressed", "false"); o.classList.remove("ok", "bad"); }); t.setAttribute("aria-pressed", "true"); }
        if (t.dataset.act === "reveal") { $$(".opts", sec).forEach(function (g) { var os = $$(".opt", g); os.forEach(function (o, i) { o.classList.remove("ok", "bad"); if (i === +g.dataset.ans) o.classList.add("ok"); else if (o.getAttribute("aria-pressed") === "true") o.classList.add("bad"); }); }); }
        return;

      if (t.classList.contains("card")) { var open = t.classList.toggle("open"); t.setAttribute("aria-expanded", open); return; }
      if (t.classList.contains("wc")) {

        var s = SPEAK[+t.dataset.i], big = $(".big", sec); big.innerHTML = "<b>" + s[0] + "</b><p>" + esc(s[1]) + "</p>"; return;

      if (t.dataset.act === "timer") { startTimer(sec, t); return; }
      if (t.dataset.act === "copy") { var ta = $("#exit"); try { navigator.clipboard.writeText(ta.value).then(function () { t.textContent = "Copied"; }, function () { ta.focus(); ta.select(); }); } catch (er) { ta.focus(); ta.select(); } }
    });
  });

  var tick = null;
  function startTimer(sec, btn) {
    var el = $(".timer", sec); if (tick) { clearInterval(tick); tick = null; btn.textContent = "Start 3:00"; el.textContent = "3:00"; el.classList.remove("end"); return; }
    var left = 180; btn.textContent = "Stop"; el.classList.remove("end");
    tick = setInterval(function () { left--; el.textContent = Math.floor(left / 60) + ":" + ("0" + (left % 60)).slice(-2); if (left <= 0) { clearInterval(tick); tick = null; el.textContent = "Time!"; el.classList.add("end"); btn.textContent = "Start 3:00"; } }, 1000);
  }
  var FORMS = { revamp: /\brevamp(s|ed|ing)?\b/i, overcrowding: /\bovercrowd(ing|ed)\b/i, demolish: /\bdemolish(es|ed|ing)?\b/i, merge: /\bmerg(e|es|ed|ing)\b/i, decline: /\bdeclin(e|es|ed|ing)\b/i };
  $("#exit").addEventListener("input", function () {
    var v = this.value, n = 0; $$(".used span[data-w]").forEach(function (s) { var on = FORMS[s.dataset.w].test(v); s.classList.toggle("on", on); if (on) n++; });

  $("#exit").dispatchEvent(new Event("input"));

})();
