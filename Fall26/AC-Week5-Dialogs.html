<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Exam Prep · 4 Short Dialogs (A1)</title>
<style>
:root{--navy:#1f3a5f;--gold:#e0a526;--green:#2e8b57;--bg:#f6f3ec;--ink:#1d2433}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.4}
.wrap{max-width:820px;margin:0 auto;padding:14px}
header{display:flex;align-items:center;gap:10px}.logo{font-weight:800;letter-spacing:.08em;color:var(--navy);font-size:13px}
.tag{margin-left:auto;font-size:12px;background:var(--navy);color:#fff;padding:3px 10px;border-radius:99px}
.tabs{display:flex;gap:6px;margin:10px 0;overflow-x:auto}
.tab{flex:1;min-width:44px;border:2px solid var(--navy);background:#fff;color:var(--navy);border-radius:10px;padding:6px 0;font-weight:800;font-size:16px;cursor:pointer}
.tab.on{background:var(--navy);color:#fff}
.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 2px 8px #0002}
.band{background:var(--navy);color:#fff;padding:18px 16px;display:flex;align-items:center;gap:14px}.band .n{font-size:44px;font-weight:800;color:var(--gold);line-height:1}.band .p{font-size:13px;opacity:.9}.rounds{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px;font-weight:700;color:var(--navy)}.rounds label{background:#eef3f9;border-radius:8px;padding:5px 10px;cursor:pointer}
.in{padding:14px 16px}
.place{display:inline-block;background:var(--gold);color:#222;font-weight:700;font-size:12px;border-radius:99px;padding:2px 10px}
h1{margin:6px 0 2px;font-size:24px;color:var(--navy)}.setup{margin:0 0 10px;color:#445}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}
.chip{background:#fff7e0;border:2px solid var(--gold);border-radius:10px;padding:4px 8px;font-size:14px;cursor:pointer}
.chip b{color:var(--navy)}.chip span{color:#555;display:block;font-size:12.5px}
.ctl{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0 10px;font-size:14px}
.ctl button{border:2px solid var(--navy);background:#fff;color:var(--navy);border-radius:8px;padding:4px 10px;font-weight:700;cursor:pointer}
.ctl button.on{background:var(--navy);color:#fff}
.ln{display:flex;gap:8px;margin:7px 0;align-items:flex-start}
.ln.B{flex-direction:row-reverse}
.who{flex:none;width:68px;font-size:11.5px;font-weight:800;color:var(--navy);text-align:center;padding-top:6px;overflow-wrap:anywhere}
.bub{flex:1;max-width:88%;background:#e8eef7;border-radius:14px;padding:8px 12px;font-size:17px;position:relative;cursor:pointer}
.ln.B .bub{background:#e7f4ea}
.bub mark{background:#ffe59a;border-radius:4px;padding:0 2px}
.bub.cov{filter:blur(6px)}
.say{background:#fff7e0;border:2px dashed var(--gold);border-radius:12px;padding:10px 12px;margin-top:12px}
.note{background:#eef3f9;border-left:5px solid var(--navy);border-radius:8px;padding:8px 12px;margin-top:10px;font-size:14.5px}
.nav{display:flex;justify-content:space-between;margin:12px 0}
.nav button{background:var(--navy);color:#fff;border:0;border-radius:10px;padding:10px 20px;font-size:16px;font-weight:700;cursor:pointer}
.nav button:disabled{opacity:.35}
</style></head><body><div class="wrap">
<header><span class="logo">APPROACH · English for Real Life</span><span class="tag">Exam prep · A1</span></header>
<div class="tabs" id="tabs"></div><div class="card" id="card"></div>
<div class="nav"><button id="bk">← Back</button><button id="nx">Next →</button></div></div>
<script>
const D=[{"title": "A New Classmate", "place": "Exam topic 1 · Moving to the U.S.", "A": "Lia", "B": "Pedro", "num": "1", "setup": "It is the first week of class. Lia meets Pedro.", "words": [["from", "de (origem)"], ["visa", "visto"], ["helped", "ajudou"], ["hard", "difícil"], ["comfortable", "à vontade, confortável"], ["small talk", "conversa informal"]], "lines": ["Hi! I am Lia. What is your name?", "Hi, Lia. I am Pedro. Nice to meet you.", "Nice to meet you, too. Where are you from?", "I am from Brazil. And you?", "I am from Brazil, too! How long are you here?", "Two months. It is hard for me.", "What is hard?", "The visa was hard. My friend helped me.", "I understand. Do you feel comfortable now?", "A little. Small talk is hard for me.", "No problem. Let’s practice together!", "Great idea. See you in class!"], "note": "In the U.S., “How are you?” is small talk. The answer is short: “Good, thanks. And you?” People do not tell a long story.", "turn": "Use your own information: your name, your country, how long you are here, what was hard, who helped you.", "img": ""}, {"title": "At the Front Desk", "place": "Exam topic 2 · English school", "A": "Staff", "B": "Student", "num": "2", "setup": "A new student asks for help at school.", "words": [["front desk", "recepção"], ["student ID", "carteira de estudante"], ["tutor", "professor particular"], ["free", "grátis"], ["library", "biblioteca"], ["fill out", "preencher"]], "lines": ["Good morning. How can I help you?", "Hello. I am a new student. I need a student ID.", "Okay. What is your name?", "Carlos Silva.", "Do you have your passport?", "Yes. Here you go.", "Thank you. Please fill out this form.", "Okay. Also, I need help with English. Is there a tutor?", "Yes. The tutor is here on Tuesday.", "Is it free?", "Yes, it is free. The library is free, too.", "Great! Thank you very much."], "note": "At school you can ask the front desk or your teacher for help. Many schools have free resources: a tutor, a library, a computer room.", "turn": "Ask for something else: a letter for the bank, a class schedule, or a quiet room to study.", "img": ""}, {"title": "A New Neighbor", "place": "Exam topic 3 · My neighborhood", "A": "Sam", "B": "Rita", "num": "3", "setup": "Rita is new in the building. Her neighbor Sam says hello.", "words": [["neighbor", "vizinho(a)"], ["neighborhood", "bairro"], ["trash day", "dia da coleta de lixo"], ["parking permit", "autorização de estacionamento"], ["quiet", "silencioso"], ["loud", "alto, barulhento"]], "lines": ["Hi! I am Sam. I live in apartment 5.", "Hi, Sam. I am Rita. I am new here.", "Welcome to the neighborhood!", "Thank you. Can you help me? What are the rules?", "Sure. Trash day is Tuesday.", "Okay. And parking?", "You need a parking permit.", "Good to know. Is it loud here?", "No, it is quiet. Please, no loud music after 10 p.m.", "No problem. Where is a supermarket?", "It is on Main Street. Take the bus.", "Thank you, Sam!"], "note": "Many Americans say hello to neighbors but do not visit often. Quiet hours (after 10 p.m.) and trash day are important rules in many buildings.", "turn": "Tell a new neighbor 2 rules in your building or street. Is it the same in your country?", "img": ""}, {"title": "I Am Sick Today", "place": "Exam topics 4–5 · Symptoms", "A": "Ana", "B": "Office", "num": "4", "setup": "Ana is sick. She calls the school.", "words": [["sick", "doente"], ["fever", "febre"], ["stomachache", "dor de barriga"], ["dizzy", "tonto(a)"], ["rest", "descansar"], ["urgent care", "pronto atendimento"]], "lines": ["Hello, this is Ana. I am in the English class.", "Hello, Ana. How can I help you?", "I am sick today. I can’t come to class.", "I am sorry. What is wrong?", "I have a fever and a stomachache.", "Since when?", "Since last night. I feel dizzy, too.", "Please rest and drink water.", "Okay. Should I see a doctor?", "Yes. Go to urgent care if the fever is high.", "Thank you. See you on Monday.", "Feel better soon!"], "note": "In the U.S., call or write to the school before class if you are sick. A fever is 100.4°F (38°C) or higher.", "turn": "Call the school with a different problem: a headache, a toothache, or a sore throat.", "img": ""}];let cur=0,cover={A:false,B:false},voice=null;
function pick(){const v=speechSynthesis.getVoices().filter(x=>/en[-_]US/i.test(x.lang));voice=v.find(x=>/natural|premium|enhanced|neural|samantha|google us/i.test(x.name))||v[0]||null}
try{pick();speechSynthesis.onvoiceschanged=pick}catch(e){}
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.82;if(voice)u.voice=voice;speechSynthesis.speak(u)}catch(e){}}
function hl(s,w){const e=w.map(x=>x[0].replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).sort((a,b)=>b.length-a.length);
 return s.replace(new RegExp('\\b('+e.join('|')+')',"gi"),m=>'<mark>'+m+'</mark>')}
function render(){
 const d=D[cur];
 document.getElementById('tabs').innerHTML=D.map((x,i)=>`<button class="tab${i==cur?' on':''}" onclick="go(${i})">${i+1}</button>`).join('');
 document.getElementById('card').innerHTML=`<div class="band"><span class="n">${d.num}</span><span class="p">${d.place}</span></div><div class="in"><h1>${d.title}</h1><p class="setup">${d.setup}</p>
 <div class="chips">${d.words.map((w,i)=>`<div class="chip" onclick="say(D[cur].words[${i}][0])"><b>🔊 ${w[0]}</b><span>${w[1]}</span></div>`).join('')}</div>
 <div class="ctl">Practice: <button id="cA" class="${cover.A?'on':''}" onclick="tg('A')">Cover ${d.A}</button><button id="cB" class="${cover.B?'on':''}" onclick="tg('B')">Cover ${d.B}</button><span>Tap a line to listen.</span></div>
 <div id="lines">${d.lines.map((l,i)=>{const r=i%2?'B':'A';return `<div class="ln ${r}"><div class="who">${d[r]}</div><div class="bub${cover[r]?' cov':''}" data-i="${i}" onclick="ln(this)">${hl(l,d.words)}</div></div>`}).join('')}</div>
 <div class="say"><b>Your turn:</b> ${d.turn}<br><small>Switch roles. Then do it again without reading.</small></div>
 <div class="rounds">Practice: <label><input type="checkbox"> 1 Read it</label><label><input type="checkbox"> 2 Cover one role</label><label><input type="checkbox"> 3 No paper</label></div><div class="note"><b>Good to know:</b> ${d.note}</div></div>`;
 bk.disabled=cur==0;nx.disabled=cur==D.length-1;
}
function ln(el){if(el.classList.contains('cov')){el.classList.remove('cov');return}say(D[cur].lines[+el.dataset.i])}
function tg(r){cover[r]=!cover[r];render()}
function go(i){cur=i;cover={A:false,B:false};render();scrollTo(0,0)}
bk.onclick=()=>go(cur-1);nx.onclick=()=>go(cur+1);render();
</script></body></html>
