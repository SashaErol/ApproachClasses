<style>/* Approach International Student Center brand: Dark Blue, Blue, Red, Light Blue, Gray, White. */
/* Layout: brand band, then one centered stage that swaps between instructions, the timed question and the results with a concept review. Big type for a classroom projector. */
:root {
  --bg: #E7E7E7; --surface: #FFFFFF; --ink: #0C1927; --ink-soft: #44546A; --line: #C9CDD2;
  --navy: #10294A; --navy-ink: #FFFFFF; --red: #9C2519; --red-ink: #FFFFFF; --accent: #9C2519;
  --bar: #4189BF; --track: #E3EAF1; --hl-bg: #CFE3F3; --hl-ink: #0C1927; --focus: #1D6FB8;
  --good: #1F7A4D; --warn: #A65F00; --crit: #B3261E; --field: #F6F8FA;
  --font-display: "Montserrat", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1927; --surface: #10294A; --ink: #F1F4F7; --ink-soft: #AFBCCB; --line: #2A486B;
    --navy: #4189BF; --navy-ink: #0C1927; --red: #B3382B; --red-ink: #FFFFFF; --accent: #F08A7E;
    --bar: #6FA8D8; --track: #183A63; --hl-bg: #1F4F7C; --hl-ink: #EAF3FB; --focus: #8CC0EE;
    --good: #5CC48D; --warn: #F2B24C; --crit: #FF8A80; --field: #0C1F38;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1927; --surface: #10294A; --ink: #F1F4F7; --ink-soft: #AFBCCB; --line: #2A486B;
  --navy: #4189BF; --navy-ink: #0C1927; --red: #B3382B; --red-ink: #FFFFFF; --accent: #F08A7E;
  --bar: #6FA8D8; --track: #183A63; --hl-bg: #1F4F7C; --hl-ink: #EAF3FB; --focus: #8CC0EE;
  --good: #5CC48D; --warn: #F2B24C; --crit: #FF8A80; --field: #0C1F38;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 1.05rem; line-height: 1.55; padding-inline: 1rem; padding-block: 1.5rem 3rem; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
.wrap { max-width: 60rem; margin-inline: auto; display: flex; flex-direction: column; gap: 1.5rem; }

.band { display: flex; align-items: center; gap: .9rem; flex-wrap: wrap; background: #10294A; color: #FFFFFF; border-radius: 1rem; padding: .9rem 1.25rem; border-bottom: .3rem solid #9C2519; }

.wm { display: flex; flex-direction: column; line-height: 1.05; }
.wm-a { font-family: var(--font-display); font-weight: 800; font-size: 1.6rem; letter-spacing: .03em; }
.wm-b { font-size: .85rem; font-weight: 600; opacity: .9; }
.band-tag { margin-left: auto; font-size: .8rem; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; opacity: .85; }
@media (max-width: 30rem) { .band-tag { margin-left: 0; width: 100%; } }

.lbl { font-size: .8rem; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; color: var(--ink-soft); }
h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(2rem, 6.5vw, 3.4rem); line-height: 1.02; letter-spacing: -.01em; margin: 0; text-wrap: balance; }
h1 span { color: var(--accent); }
h2 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: clamp(1.3rem, 3.6vw, 1.8rem); }
h3 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 1.1rem; }
.card { background: var(--surface); border: 2px solid var(--line); border-radius: 1.5rem; padding: clamp(1.1rem, 4vw, 2rem); display: flex; flex-direction: column; gap: 1.25rem; min-width: 0; }
.btn { border: 2px solid var(--ink); background: transparent; border-radius: .9rem; padding: .7rem 1.3rem; font-weight: 700; }
.btn.primary { background: var(--navy); color: var(--navy-ink); border-color: var(--navy); }
.btn.big { font-size: 1.15rem; padding: .85rem 1.8rem; }
.row { display: flex; flex-wrap: wrap; gap: .75rem; align-items: center; }
.row.between { justify-content: space-between; }
.vw { background: var(--hl-bg); color: var(--hl-ink); border-radius: .3rem; padding: 0 .3rem; font-weight: 700; }

/* intro */
ol.how { margin: 0; padding-left: 1.4rem; display: flex; flex-direction: column; gap: .6rem; font-size: 1.1rem; }
.keys { display: flex; flex-wrap: wrap; gap: .5rem; }
kbd { font-family: var(--font-display); font-weight: 700; font-size: .9rem; border: 2px solid var(--line); border-bottom-width: 4px; border-radius: .5rem; padding: .05rem .55rem; background: var(--field); }

/* question */
.qtop { display: flex; flex-wrap: wrap; gap: .75rem; align-items: center; justify-content: space-between; }
.dots { display: flex; flex-wrap: wrap; gap: .4rem; }
.dot { width: 2.1rem; height: 2.1rem; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-weight: 800; font-size: .8rem; font-variant-numeric: tabular-nums; background: var(--field); }
.dot.cur { border-color: var(--ink); background: var(--ink); color: var(--bg); }
.dot.right { border-color: var(--good); color: var(--good); }
.dot.wrong, .dot.time { border-color: var(--crit); color: var(--crit); }
.timer { display: flex; align-items: center; gap: 1rem; }
.secs { font-family: var(--font-display); font-weight: 800; font-size: clamp(2.2rem, 7vw, 3.2rem); line-height: 1; min-width: 2.2ch; text-align: right; font-variant-numeric: tabular-nums; }
.tbar { flex: 1; height: 1rem; border-radius: 999px; background: var(--track); overflow: hidden; }
.tbar i { display: block; height: 100%; width: 100%; background: var(--bar); border-radius: 999px; }
.tbar i.warn { background: var(--warn); } .tbar i.crit { background: var(--crit); }
.stmt { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: clamp(1.25rem, 3.4vw, 1.95rem); line-height: 1.3; text-wrap: pretty; }
.tf { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
.tf button { border: 0; border-radius: 1.1rem; min-height: 5.5rem; font-family: var(--font-display); font-weight: 800; font-size: clamp(1.6rem, 5vw, 2.4rem); }
.tf .t { background: var(--navy); color: var(--navy-ink); }
.tf .f { background: var(--red); color: var(--red-ink); }
.tf button[disabled] { opacity: .45; cursor: default; }
.tf button.answer { opacity: 1; outline: 4px solid var(--ink); outline-offset: 3px; }
.verdict { border-top: 2px solid var(--line); padding-top: 1.1rem; display: flex; flex-direction: column; gap: .8rem; }
.vpill { align-self: flex-start; font-family: var(--font-display); font-weight: 800; font-size: 1.05rem; padding: .3rem 1rem; border-radius: 999px; border: 2px solid currentColor; }
.vpill.good { color: var(--good); } .vpill.crit { color: var(--crit); } .vpill.warn { color: var(--warn); }
.verdict p { margin: 0; font-size: 1.1rem; max-width: 46rem; text-wrap: pretty; }
.verdict .ans { font-weight: 800; }

/* end */
.score { font-family: var(--font-display); font-weight: 800; font-size: clamp(3rem, 12vw, 5.5rem); line-height: 1; }
.score small { font-size: .35em; color: var(--ink-soft); }
.res { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: .3rem; }
.res li { display: grid; grid-template-columns: 2.2rem 1fr; gap: .6rem; align-items: start; padding: .45rem .2rem; border-top: 1px solid var(--line); font-size: .98rem; }
.res .ic { font-weight: 800; font-family: var(--font-display); }
.res .ok { color: var(--good); } .res .no { color: var(--crit); }
.review { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 22rem), 1fr)); gap: 1rem; }
.rv { background: var(--field); border-radius: 1.1rem; padding: 1.1rem 1.2rem; display: flex; flex-direction: column; gap: .4rem; min-width: 0; }
.rv p { margin: 0; font-size: 1rem; color: var(--ink-soft); text-wrap: pretty; }
.rv p b { color: var(--ink); }
.rv h3 { color: var(--ink); }
.note { font-size: .9rem; color: var(--ink-soft); margin: 0; }
@media (max-width: 32rem) { .tf { gap: .6rem; } .tf button { min-height: 4.5rem; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
<div class="wrap">
  <header class="band">
    <div class="mark" role="img" aria-label="Approach logo"></div>
    <div class="wm"><span class="wm-a">APPROACH</span><span class="wm-b">International Student Center®</span></div>
    <span class="band-tag">Personal Finances · Week 1 Review</span>
  </header>
  <main id="stage" aria-live="polite"></main>
</div>
<script>var Q = [
 {t:true, s:"The author argues that people tend to spend far more energy debating minutiae than taking the few actions that genuinely move the needle.",
  e:"True. Ramit calls the important actions the “Big Wins”: opening the right accounts, automating, and getting your credit in order. Arguing about a $3 latte is a distraction."},
 {t:false, s:"A credit report and a credit score are essentially the same thing, so checking one makes the other redundant.",
  e:"False. The report is the detailed record of your borrowing history; the score is a single number (FICO: 300–850) calculated from that record. You need to review both."},
 {t:true, s:"Payment history is the most heavily weighted component of a FICO score, accounting for roughly 35 percent.",
  e:"True. Missing even one payment can be costly, which is why automating payments is the first of the Six Commandments."},
 {t:false, s:"“Conscious spending” means eliminating discretionary purchases wherever possible so that your savings rate is as high as it can be.",
  e:"False. It means spending extravagantly on the things you love and cutting costs mercilessly on the things you don’t. The goal is a Rich Life, not deprivation."},
 {t:true, s:"Making only the minimum payment on a $10,000 balance at 14% APR could keep you in debt for over three decades and cost more than $13,000 in interest.",
  e:"True. The minimum payment is designed to keep you paying for as long as possible. That is exactly how card companies profit."},
 {t:false, s:"Credit utilization, the proportion of available credit you are actually using, makes up only about 10 percent of your score.",
  e:"False. Amounts owed (utilization) is about 30 percent, the second-largest factor. The 10 percent categories are new credit and credit mix."},
 {t:true, s:"The “85 Percent Solution” holds that an imperfect system you actually put into practice is better than a flawless one you never get around to implementing.",
  e:"True. Done beats perfect: start with 85 percent of the optimal plan and refine it later, instead of falling into analysis paralysis."},
 {t:false, s:"Retail store cards are usually a borrower-friendly choice because their introductory discounts outweigh their interest rates.",
  e:"False. Store cards typically carry very high APRs and low limits. The one-time discount rarely compensates for the interest you may pay."},
 {t:true, s:"If you slip and miss a payment, it can be worth calling the issuer and politely asking for the late fee to be waived.",
  e:"True. Fees are negotiable, particularly for a customer with a good record. The script is simple: “I’d like to have it waived.”"},
 {t:false, s:"Closing your oldest credit card is a savvy move, since it simplifies your finances without affecting your score.",
  e:"False. Length of credit history counts for about 15 percent, and closing a card also shrinks your total available credit, which can raise your utilization. Keep your main cards long and active."},
 {t:true, s:"Credit card companies reportedly refer to customers who pay their balance in full every month as “deadbeats”, because those customers generate little interest revenue.",
  e:"True. The business model depends on people carrying a balance. The smart response is to use the card on your terms and collect the perks."},
 {t:false, s:"Under the “snowball” method, you prioritize the debt with the highest interest rate first, because that is mathematically optimal.",
  e:"False. That describes the standard approach. The snowball method targets the smallest balance first, to build momentum with quick wins."}
];
var REVIEW = [
 ["Focus on the Big Wins", "Most of the financial noise is minutiae. A handful of decisions drive nearly all of your results: where you keep your money, whether it is automated, and how you handle credit and debt. Take the <b>85 Percent Solution</b>: start with an imperfect plan now rather than waiting for a perfect one."],
 ["Conscious spending", "Spend extravagantly on what you truly love, and cut costs mercilessly on what you don’t. You play <b>offense, not defense</b>: you design a Rich Life on purpose instead of feeling guilty about every purchase."],
 ["Credit report vs. credit score", "The <b>report</b> is the detailed history; the <b>score</b> (FICO, 300–850) is the summary. Check your free report at annualcreditreport.com and track the inquiries. Weights: 35% payment history, 30% amounts owed, 15% length of history, 10% new credit, 10% credit mix."],
 ["The minimum-payment trap", "Card companies profit when you carry a balance. A $10,000 balance at 14% APR with a 2% minimum payment takes 30+ years to clear and costs over $13,000 in interest. <b>Retail store cards</b> are especially predatory."],
 ["The Six Commandments", "Pay on time (auto-pay); get fees waived; negotiate a lower APR; keep your main cards long and active; get more credit only if you are debt-free; and use the secret perks such as warranty extension and rental insurance."],
 ["Getting out of debt", "Know the two strategies: <b>standard</b> (highest APR first) saves the most interest, while the <b>snowball</b> (smallest balance first) builds momentum. Pick one, automate it, and stop chasing 0% balance transfers."]
];
var TIME = 45, i = 0, left = TIME, tick = null, res = [], locked = false;
var stage = document.getElementById("stage");
function h(s){ stage.innerHTML = s; window.scrollTo(0,0); }
function intro(){
  clearInterval(tick); i = 0; res = [];
  h('<section class="card">'+
    '<div class="lbl">Week 1 · Introduction + Credit Cards</div>'+
    '<h1>Quick-fire <span>True or False</span></h1>'+
    '<h2>How it works</h2>'+
    '<ol class="how">'+
    '<li>You will see <b>12 statements</b>, one at a time.</li>'+
    '<li>Decide if each statement is <b>True</b> or <b>False</b>. You have <b>45 seconds</b> per question.</li>'+
    '<li>Read carefully: one small word (<i>only, always, essentially</i>) can make a statement false.</li>'+
    '<li>After you answer, or when the time is up, the explanation appears. Discuss it with your partner before moving on.</li>'+
    '<li>At the end, you will see your score and a short summary of the key concepts.</li></ol>'+
    '<div class="keys"><span class="note">Keyboard:</span> <kbd>T</kbd> True &nbsp; <kbd>F</kbd> False &nbsp; <kbd>Enter</kbd> Next</div>'+
    '<div class="row"><button class="btn primary big" id="go">Start the quiz →</button></div>'+
    '</section>');
  document.getElementById("go").onclick = function(){ show(0); };
}
function dots(){
  var o = ''; for (var k=0;k<Q.length;k++){
    var c = k===i ? 'cur' : (res[k]===undefined ? '' : (res[k]==='r' ? 'right' : (res[k]==='t' ? 'time' : 'wrong')));
    o += '<span class="dot '+c+'">'+(k+1)+'</span>'; }
  return o;
}
function show(n){
  i = n; left = TIME; locked = false; clearInterval(tick);
  h('<section class="card">'+
    '<div class="qtop"><div class="lbl">Question '+(i+1)+' of '+Q.length+'</div><div class="dots" aria-hidden="true">'+dots()+'</div></div>'+
    '<div class="timer"><div class="secs" id="secs" role="timer">'+TIME+'</div><div class="tbar"><i id="tb"></i></div></div>'+
    '<p class="stmt">'+Q[i].s+'</p>'+
    '<div class="tf"><button class="t" id="bt">TRUE</button><button class="f" id="bf">FALSE</button></div>'+
    '<div id="vd"></div></section>');
  document.getElementById("bt").onclick = function(){ answer(true); };
  document.getElementById("bf").onclick = function(){ answer(false); };
  var end = Date.now() + TIME*1000;
  tick = setInterval(function(){
    left = Math.max(0, Math.ceil((end - Date.now())/1000));
    paint();
    if (left <= 0) answer(null);
  }, 200);
}
function paint(){
  var s = document.getElementById("secs"), b = document.getElementById("tb");
  if (!s) return;
  s.textContent = left; b.style.width = (left/TIME*100)+"%";
  b.className = left <= 10 ? "crit" : (left <= 20 ? "warn" : "");
}
function answer(v){
  if (locked) return; locked = true; clearInterval(tick);
  var q = Q[i], ok = v === q.t, code = v===null ? 't' : (ok ? 'r' : 'w');
  res[i] = code; paint();
  var bt = document.getElementById("bt"), bf = document.getElementById("bf");
  bt.disabled = bf.disabled = true;
  (q.t ? bt : bf).classList.add("answer");
  var pill = v===null ? '<span class="vpill warn">⏱ Time’s up</span>' : (ok ? '<span class="vpill good">✓ Correct</span>' : '<span class="vpill crit">✗ Not quite</span>');
  var last = i === Q.length-1;
  document.getElementById("vd").innerHTML = '<div class="verdict">'+pill+
    '<p><span class="ans">Answer: '+(q.t?'TRUE':'FALSE')+'.</span> '+q.e.replace(/^(True|False)\. /,'')+'</p>'+
    '<div class="row"><button class="btn primary big" id="nx">'+(last?'See results →':'Next question →')+'</button></div></div>';
  document.getElementById("nx").onclick = next;
  document.getElementById("nx").focus();
  var d = document.querySelectorAll(".dot")[i]; if (d) d.className = "dot " + (code==='r'?'right':(code==='t'?'time':'wrong'));
}
function next(){ if (i < Q.length-1) show(i+1); else finish(); }
function finish(){
  clearInterval(tick);
  var sc = res.filter(function(x){return x==='r';}).length;
  var msg = sc>=11 ? "Outstanding. You really own this material." : sc>=8 ? "Solid work. Review the points you missed below." : sc>=5 ? "A good start. Read the reminders carefully and try again." : "Don’t worry. Read the reminders below, then replay the quiz.";
  var list = ''; Q.forEach(function(q,k){
    var r = res[k]; var ic = r==='r' ? '<span class="ic ok">✓</span>' : '<span class="ic no">'+(r==='t'?'⏱':'✗')+'</span>';
    list += '<li>'+ic+'<span>'+q.s+' <b>('+(q.t?'True':'False')+')</b></span></li>'; });
  var rv = ''; REVIEW.forEach(function(r){ rv += '<div class="rv"><h3>'+r[0]+'</h3><p>'+r[1]+'</p></div>'; });
  h('<section class="card"><div class="lbl">Your result</div>'+
    '<div class="score">'+sc+'<small> / '+Q.length+'</small></div><h2>'+msg+'</h2>'+
    '<ul class="res">'+list+'</ul>'+
    '<div class="row"><button class="btn primary" id="again">Play again</button></div></section>'+
    '<section class="card"><div class="lbl">Concept reminders</div><h2>Week 1 in six paragraphs</h2><div class="review">'+rv+'</div>'+
    '<p class="note">Source: Ramit Sethi, <i>I Will Teach You to Be Rich</i>, Introduction and Chapter 1.</p></section>');
  document.getElementById("again").onclick = intro;
}
document.addEventListener("keydown", function(e){
  var k = e.key.toLowerCase();
  if (!document.getElementById("bt") || locked) return;
  if (k==="t") answer(true); else if (k==="f") answer(false);
});
intro();
</script>
