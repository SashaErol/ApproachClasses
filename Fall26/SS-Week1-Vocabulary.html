<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tell-Tale Heart – Vocabulary Match</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--dark:#0b1827;--navy:#0e2a47;--red:#9d251a;--blue:#418abd;--gray:#e8e8e8;--gold:#9a7c46;--muted:#5b6776;--ok:#1f7a4d;--okbg:#e6f4ec;--badbg:#fbe9e7;--tint:rgba(65,138,189,.13);--font:'Montserrat',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
*{box-sizing:border-box}body{margin:0;font-family:var(--font);color:var(--dark);background:#f6f8fb;line-height:1.5}
header{background:var(--navy);color:#fff;display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:3px solid var(--gold)}
header img{height:34px;filter:brightness(0) invert(1)}header b{font-size:15px;display:block}header small{opacity:.8;font-size:12px}
main{max-width:860px;margin:0 auto;padding:18px 16px 90px}
.steps{display:flex;gap:6px;margin:4px 0 16px}.steps i{flex:1;height:6px;border-radius:9px;background:var(--gray)}.steps i.on{background:var(--blue)}.steps i.done{background:var(--gold)}
h1{font-size:22px;color:var(--navy);margin:6px 0 4px}p.lead{color:var(--muted);margin:0 0 14px;font-size:14px}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin-bottom:2px}
.grid{display:grid;grid-template-columns:1fr 1.5fr;gap:12px 18px;align-items:start}
.col{display:flex;flex-direction:column;gap:10px}
.it{font:inherit;text-align:left;border:2px solid #d3dbe5;background:#fff;border-radius:12px;padding:12px 14px;cursor:pointer;color:var(--dark);font-size:15px;transition:.15s}
.it.w{font-weight:700;color:var(--navy);font-size:17px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.it:hover{border-color:var(--blue)}.it.sel{border-color:var(--blue);background:var(--tint);box-shadow:0 0 0 3px rgba(65,138,189,.25)}
.it.ok{border-color:var(--ok);background:var(--okbg);cursor:default}.it.bad{animation:sh .35s;border-color:var(--red);background:var(--badbg)}
.it .k{font-size:11px;font-weight:700;text-transform:uppercase;color:var(--gold);display:block;margin-bottom:2px}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.spk{border:0;background:none;cursor:pointer;font-size:16px;padding:0 2px}
.bar{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:10px}
.msg{font-size:14px;color:var(--muted);min-height:22px}
.btn{font:inherit;font-weight:700;border:0;border-radius:999px;padding:12px 24px;background:var(--navy);color:#fff;cursor:pointer;font-size:15px}.btn:disabled{opacity:.35;cursor:default}.btn.alt{background:#fff;color:var(--navy);border:2px solid var(--navy)}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;font-size:14px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
th{background:var(--navy);color:#fff;text-align:left;padding:10px;font-size:12px;text-transform:uppercase;letter-spacing:.05em}
td{padding:10px;border-top:1px solid var(--gray);vertical-align:top}td.e{font-weight:700;color:var(--navy);white-space:nowrap}
td small{display:block;color:var(--muted);font-size:12px}
.pt{color:#1f6a3a;font-weight:600}.es{color:var(--red);font-weight:600}
.tip{background:#fff;border-left:4px solid var(--gold);padding:10px 14px;margin-top:14px;border-radius:8px;font-size:14px}
.score{font-size:40px;font-weight:700;color:var(--navy)}
@media(max-width:620px){.grid{grid-template-columns:1fr}.cols-t th:nth-child(4),.cols-t td:nth-child(4){display:none}}
</style></head><body>

<script>
const W=[
 {w:'certain',pos:'adj',type:'syn',m:'positive; without any doubt',pt:'certo; seguro',es:'seguro; cierto',tip:''},
 {w:'escape',pos:'verb',type:'syn',m:'get away; break free',pt:'escapar; fugir',es:'escapar; huir',tip:''},
 {w:'suddenly',pos:'adv',type:'syn',m:'all at once; without warning',pt:'de repente',es:'de repente; de pronto',tip:'Also common: “all of a sudden.”'},

 {w:'illness',pos:'noun',type:'def',m:'a period of being sick, or a particular disease',pt:'doença',es:'enfermedad',tip:'Say “illness” for the condition, “ill” or “sick” for the person.'},
 {w:'madman',pos:'noun',type:'syn',m:'someone who seems wildly out of control (old-fashioned, offensive today)',pt:'louco (ofensivo hoje)',es:'loco (ofensivo hoy)',tip:'Today we say “a person with a mental illness.”'},
 {w:'fall upon',pos:'phrasal verb',type:'syn',m:'to pounce on; to land on',pt:'lançar-se sobre; atacar; (luz) incidir sobre',es:'abalanzarse sobre; caer sobre',tip:'“Upon” is formal/literary. In daily speech: “on.”'},
 {w:'sense',pos:'noun',type:'def',m:'a natural ability of the body, like sight or hearing; also a gut feeling',pt:'sentido; senso',es:'sentido',tip:'“Sentido” has more meanings in PT/ES than “sense.” Watch “makes sense” = “faz sentido / tiene sentido.”'},
 {w:'indeed',pos:'adv',type:'syn',m:'really; in fact (adds emphasis)',pt:'de fato; realmente; deveras',es:'de hecho; en efecto; realmente',tip:'Very frequent in Poe! Today it sounds formal; say “really” or “for sure.”'}
];
const R=[{t:'Round 1',n:'Synonym speed-dating',d:'Match each word to its synonym or close paraphrase.',ids:['certain','escape','suddenly']},
 {t:'Round 2',n:'Meaning match',d:'Now match each word to what it means.',ids:['bear','plan','illness']},
 {t:'Round 3',n:'Mixed bag',d:'Four tricky ones. No hints: trust your reading!',ids:['madman','fall upon','sense','indeed']}];

let r=0,errors=0,total=0,pick=null,done=0;
function speak(t){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';const v=speechSynthesis.getVoices().find(v=>/en[-_]US/.test(v.lang));if(v)u.voice=v;u.rate=.9;speechSynthesis.speak(u);}

function round(){
  steps(); const R0=R[r]; pick=null; done=0;
  const L=shuf(R0.ids), M=shuf(R0.ids);
  $('#app').innerHTML=`<span class="tag">${R0.t} of 3</span><h1>${R0.n}</h1><p class="lead">${R0.d} Tap a word, then tap its match.</p>

  <div class="col">${M.map(w=>`<button class="it m" data-k="${w}"><span class="k">${by(w).type==='syn'?'synonym':'meaning'}</span>${by(w).m}</button>`).join('')}</div></div>
  <div class="bar"><div class="msg" id="msg"></div><button class="btn" id="nx" disabled>${r<2?'Next round →':'See all 10 words →'}</button></div>`;

  $('#nx').onclick=()=>{r++; r<3?round():finish()};
}
function click(b){
  if(b.classList.contains('ok'))return;
  const isW=b.classList.contains('w');
  if(!pick||pick.classList.contains('w')===isW){ if(pick)pick.classList.remove('sel'); pick=b; b.classList.add('sel'); return; }
  const a=pick; pick=null; a.classList.remove('sel'); total++;
  if(a.dataset.k===b.dataset.k){ [a,b].forEach(x=>x.classList.add('ok')); done++; $('#msg').textContent=['Nice!','Exactly.','You got it.','Sharp eyes!'][done%4];
    if(done===R[r].ids.length){ $('#nx').disabled=false; $('#msg').textContent='Round complete! 🎉'; } }
  else { errors++; [a,b].forEach(x=>{x.classList.add('bad');setTimeout(()=>x.classList.remove('bad'),400)}); $('#msg').textContent='Not quite. Try another pair.'; }
}
function finish(){
  r=3; steps();

  $('#app').innerHTML=`<span class="tag">Your word bank</span><h1>All 10 words, with Portuguese &amp; Spanish</h1>

}
