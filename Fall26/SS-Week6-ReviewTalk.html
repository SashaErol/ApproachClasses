<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Review Warm-Up: 4 Talk Cards</title>
<style>
:root{--navy:#0e2a47;--red:#9d251a;--gold:#9a7c46;--blue:#418abd;--cream:#f9f6f0;--light:#f4f5f7;--ink:#0b1827;--card:#fff;--line:#dfe3e8}
@media (prefers-color-scheme:dark){:root{--cream:#1b2735;--light:#0b1827;--ink:#eef1f5;--card:#142235;--line:#2a3b50;--gold:#d2b277;--blue:#7fb8e2}}
*{box-sizing:border-box}body{margin:0;background:var(--light);color:var(--ink);font:17px/1.5 "Segoe UI",Helvetica,Arial,sans-serif}
header{background:var(--navy);color:#fff;padding:14px 20px;border-bottom:3px solid var(--gold);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
header b{letter-spacing:.08em;font-size:15px}header span{font-size:13px;opacity:.85}
main{max-width:1050px;margin:0 auto;padding:16px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tab{flex:1;min-width:120px;border:2px solid var(--navy);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 10px;font:inherit;font-weight:600;cursor:pointer;text-align:left}
.tab small{display:block;font-weight:400;color:var(--gold);font-size:12px}
.tab.on{background:var(--navy);color:#fff}.tab.on small{color:#e8d3a6}
.card{display:none;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.card.on{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr)}
.pics{background:var(--cream);padding:14px;display:flex;flex-direction:column;gap:10px;justify-content:center}
.pics img,.pics svg{width:100%;max-height:430px;object-fit:contain;border-radius:10px;border:1px solid var(--line);display:block}
.pics .cap{font-size:13px;color:var(--gold);font-style:italic;margin-top:-4px}
.body{padding:20px 24px}
.num{color:var(--red);font-weight:700;letter-spacing:.1em;font-size:13px}
h2{margin:2px 0 10px;color:var(--navy);font-size:26px;line-height:1.2}
@media (prefers-color-scheme:dark){h2{color:#fff}}
.q{font-size:19px;margin:0 0 12px}.sub{margin:0;padding:0;list-style:none}
.sub li{background:var(--cream);border-left:4px solid var(--gold);padding:9px 12px;margin:8px 0;border-radius:6px}
.sub li b{color:var(--red)}
.w{border-bottom:2px dotted var(--blue);color:var(--blue);cursor:pointer;font-weight:600;white-space:nowrap}
.w:hover,.w.act{background:rgba(65,138,189,.18)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
.btn{border:0;border-radius:999px;padding:8px 14px;font:inherit;font-size:15px;font-weight:600;cursor:pointer;background:var(--navy);color:#fff}
.btn.alt{background:transparent;color:var(--navy);border:2px solid var(--navy)}
@media (prefers-color-scheme:dark){.btn{background:var(--blue);color:#0b1827}.btn.alt{color:#fff;border-color:#fff;background:transparent}}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{font-size:14px;padding:3px 10px;border:1px solid var(--blue);border-radius:999px;color:var(--blue);cursor:pointer;background:transparent;font-family:inherit}
.hint{font-size:13px;color:var(--gold);margin-top:6px}
#pop{position:fixed;z-index:20;max-width:320px;background:var(--navy);color:#fff;border-radius:12px;padding:12px 14px;box-shadow:0 8px 24px rgba(0,0,0,.35);display:none;font-size:15px;line-height:1.4;border:1px solid var(--gold)}
#pop h4{margin:0 0 4px;font-size:18px;color:#f0dcae;display:flex;justify-content:space-between;gap:8px;align-items:center}
#pop .tr{color:#cfe3f3;font-size:14px;margin:4px 0}#pop .ex{font-style:italic;color:#e6e9ee;margin-top:4px}
#pop button{border:0;border-radius:999px;background:var(--gold);color:#fff;padding:3px 10px;font-size:15px;cursor:pointer}
#pop .x{background:transparent;color:#fff;font-size:20px;padding:0 4px}
footer{text-align:center;font-size:12px;color:var(--gold);padding:14px}
@media (max-width:760px){.card.on{grid-template-columns:1fr}h2{font-size:22px}.q{font-size:18px}}
</style></head><body>
<header><b>APPROACH · INTERNATIONAL STUDENT CENTER</b><span>Reading &amp; Critical Thinking · Review Warm-Up · Week 6</span></header>
<main>
<div class="tabs" id="tabs"></div>
<div id="cards"></div>
<div class="hint">Tip: tap any <span class="w">blue word</span> to see its meaning and hear it. Use ← → keys to switch cards.</div>
</main>
<div id="pop"></div>
<footer>Approach International Student Center · Review warm-up · no printing needed</footer>

const G={
"melting pot":{d:"a place where different cultures mix and become one new culture",pt:"caldeirão cultural",es:"crisol de culturas",ex:"In a melting pot, everyone becomes a little bit the same."},
"salad bowl":{d:"a place where cultures stay different but live together, like pieces in a salad",pt:"salada de culturas",es:"ensalada de culturas",ex:"In a salad bowl, I can keep my food, my music and my language."},
"fit in":{d:"to feel like a normal part of a group",pt:"se encaixar, se integrar",es:"encajar, integrarse",ex:"At my new school, I wanted to fit in."},
"clutch":{d:"to hold something very tightly",pt:"agarrar com força",es:"agarrar con fuerza, aferrarse",ex:"She clutched her bag on the crowded bus."},
"heritage":{d:"the traditions, language and things that come from your family and your country",pt:"herança cultural",es:"herencia cultural",ex:"Cooking my grandmother’s recipes keeps my heritage alive."},
"listlessly":{d:"with no energy and no interest",pt:"sem energia, sem ânimo",es:"sin energía, sin ganas",ex:"After lunch, he stared listlessly at his computer."},
"gaze":{d:"to look at something for a long time",pt:"olhar fixamente",es:"mirar fijamente",ex:"I gazed out of the window for ten minutes."},
"pursuit":{d:"the act of trying to get or reach something important",pt:"busca",es:"búsqueda",ex:"Many people come to the U.S. in pursuit of a better life."},
"American Dream":{d:"the idea that anyone can have a good life in the U.S. if they work hard",pt:"o Sonho Americano",es:"el Sueño Americano",ex:"For my parents, the American Dream was a small house and a good job."},
"bootstraps":{d:"“Pull yourself up by your bootstraps” means to succeed by yourself, with no help",pt:"por conta própria, com o próprio esforço",es:"por tus propios medios",ex:"He had no money, but he pulled himself up by his bootstraps."},
"make a living":{d:"to earn enough money to pay for your life",pt:"ganhar a vida",es:"ganarse la vida",ex:"She makes a living by cleaning houses."},
"hand down":{d:"to give something to the next generation in your family",pt:"passar de geração em geração",es:"transmitir de generación en generación",ex:"My mom handed down her recipes to me."},
"ancestors":{d:"family members who lived a long time ago",pt:"antepassados",es:"antepasados",ex:"My ancestors came from a small village."},
"belong":{d:"to feel that you are a real part of a group or a place",pt:"pertencer",es:"pertenecer",ex:"In my English class, I feel that I belong."},
"tradition":{d:"something your family or country does in the same way for many years",pt:"tradição",es:"tradición",ex:"Big Sunday lunch is a tradition in our family."}
};

{n:4,t:"Memory or wall?",tab:"Heritage",
 pics:[{img:"quilt",cap:"A quilt like the ones Dee and Maggie fought about."}],
 q:"Remember the two sisters in “Everyday Use”? Is it enough to keep our [[heritage]] in our memories? Or should we put signs of it everywhere in the house, as a symbol of our culture?",
 sub:["What do you have at home that comes from your family or your country? Would you hang it on the wall, like Dee, or use it every day, like Maggie?","Will you [[hand down]] something to your children? What?","How do you keep the [[tradition]]s of your [[ancestors]] alive in a new country?"],
 chips:["heritage","hand down","ancestors","tradition"],say:"Remember the two sisters in Everyday Use? Is it enough to keep our heritage in our memories? Or should we put signs of it everywhere in the house, as a symbol of our culture?"}
];
const $=s=>document.querySelector(s),pop=$('#pop');let cur=0;
function mark(t){return t.replace(/\[\[(.+?)\]\]/g,(m,k)=>`<span class="w" data-k="${k}" tabindex="0">${k}</span>`)}
function speak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/<[^>]+>/g,''));u.lang='en-US';u.rate=.9;speechSynthesis.speak(u)}catch(e){}}
function build(){
 $('#tabs').innerHTML=CARDS.map((c,i)=>`<button class="tab" data-i="${i}">${c.n}. ${c.t}<small>${c.tab}</small></button>`).join('');
 $('#cards').innerHTML=CARDS.map((c,i)=>`<section class="card" id="c${i}"><div class="pics">${c.pics.map(p=>(p.svg?p.svg:`<img src="${IMG[p.img]}" alt="${p.cap}">`)+`<div class="cap">${p.cap}</div>`).join('')}</div><div class="body"><div class="num">QUESTION ${c.n} OF 4</div><h2>${c.t}</h2><p class="q">${mark(c.q)}</p><ul class="sub">${c.sub.map(s=>'<li>'+mark(s)+'</li>').join('')}</ul><div class="chips">${c.chips.map(k=>`<button class="chip" data-k="${k}">${k}</button>`).join('')}</div><div class="row"><button class="btn" data-say="${i}">🔊 Listen to the question</button><button class="btn alt" data-go="${i-1}" ${i==0?'disabled style="opacity:.4"':''}>← Back</button><button class="btn alt" data-go="${i+1}" ${i==3?'disabled style="opacity:.4"':''}>Next →</button></div></div></section>`).join('');
 show(0)}
function show(i){cur=i;document.querySelectorAll('.card').forEach((c,j)=>c.classList.toggle('on',j==i));document.querySelectorAll('.tab').forEach((c,j)=>c.classList.toggle('on',j==i));hide()}
function hide(){pop.style.display='none';document.querySelectorAll('.w.act').forEach(e=>e.classList.remove('act'))}
function open(k,el){const g=G[k];if(!g)return;hide();el.classList.add('act');
 pop.innerHTML=`<h4><span>${k}</span><span><button data-sp="${k}" aria-label="Listen">🔊 Listen</button> <button class="x" data-x aria-label="Close">×</button></span></h4><div>${g.d}</div><div class="tr">🇧🇷 ${g.pt}<br>🇪🇸 ${g.es}</div><div class="ex">“${g.ex}”</div><button data-spx="${k}" style="margin-top:8px">🔊 Example</button>`;
 pop.style.display='block';const r=el.getBoundingClientRect(),w=pop.offsetWidth,h=pop.offsetHeight;
 let x=Math.max(8,Math.min(innerWidth-w-8,r.left)),y=r.bottom+8;if(y+h>innerHeight-8)y=Math.max(8,r.top-h-8);pop.style.left=x+'px';pop.style.top=y+'px';speak(k)}
document.addEventListener('click',e=>{const t=e.target;
 if(t.dataset.i!==undefined)show(+t.dataset.i);
 else if(t.dataset.go!==undefined&&+t.dataset.go>=0&&+t.dataset.go<4)show(+t.dataset.go);
 else if(t.dataset.say!==undefined)speak(CARDS[+t.dataset.say].say);
 else if(t.dataset.sp)speak(t.dataset.sp);
 else if(t.dataset.spx)speak(G[t.dataset.spx].ex);
 else if(t.dataset.x!==undefined)hide();
 else if(t.classList.contains('w')||t.classList.contains('chip'))open(t.dataset.k,t.classList.contains('chip')?t:t);
 else if(!pop.contains(t))hide();});
document.addEventListener('keydown',e=>{if(e.key=='ArrowRight'&&cur<3)show(cur+1);if(e.key=='ArrowLeft'&&cur>0)show(cur-1);if(e.key=='Escape')hide();if(e.key=='Enter'&&e.target.classList.contains('w'))open(e.target.dataset.k,e.target)});
build();
</script></body></html>
