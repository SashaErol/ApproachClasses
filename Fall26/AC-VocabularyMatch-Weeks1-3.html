<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vocabulary Match: Weeks 1-3</title>
<style>
  :root{--navy:#1b2a4a;--navy-dark:#10192e;--green:#2f7a4f;--gold:#c9a227;--red:#a8342a;--paper:#faf7f0;--ink:#1c1c1c;--line:#d9d2c0}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:linear-gradient(160deg,var(--navy),var(--navy-dark));font-family:'Helvetica Neue','Segoe UI',Arial,sans-serif;display:flex;justify-content:center;padding:22px 12px 32px;-webkit-tap-highlight-color:transparent}
  .wrap{width:100%;max-width:720px}
  .kicker{color:var(--gold);letter-spacing:2px;font-size:12px;font-weight:700;text-transform:uppercase;text-align:center;margin-bottom:5px}
  .title{color:var(--paper);text-align:center;font-family:Georgia,Cambria,serif;font-size:26px;font-weight:700;margin:0 0 4px}
  .subtitle{color:#b9c2d6;text-align:center;font-size:13px;margin-bottom:14px}
  .steps{display:flex;gap:6px;justify-content:center;margin-bottom:14px}
  .step{flex:1;max-width:120px;height:6px;border-radius:3px;background:#3b4968}
  .step.done{background:var(--green)}.step.now{background:var(--gold)}
  .card{background:var(--paper);border-radius:18px;padding:26px 18px 20px;box-shadow:0 20px 45px rgba(0,0,0,.35);position:relative}
  .card::before{content:"";position:absolute;top:0;left:0;right:0;height:5px;border-radius:18px 18px 0 0;background:linear-gradient(90deg,var(--navy),var(--green),var(--gold),var(--red))}
  .pn{font-size:12px;font-weight:700;color:var(--green);letter-spacing:1px}
  .ptitle{font-family:Georgia,serif;font-size:24px;font-weight:700;color:var(--navy);margin:2px 0 3px}
  .inst{font-size:14px;color:#555;margin-bottom:14px;line-height:1.45}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
  .colh{font-size:11px;letter-spacing:1px;font-weight:700;color:#777;text-transform:uppercase;margin-bottom:2px}
  .col{display:flex;flex-direction:column;gap:9px}
  .item{position:relative;display:flex;align-items:center;gap:8px;min-height:56px;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 10px;font-family:inherit;font-size:16px;font-weight:700;color:var(--navy);cursor:pointer;touch-action:manipulation;transition:border-color .12s,background .12s}
  .item.pt{font-weight:600;font-size:15.5px}
  .item:hover{border-color:var(--navy)}
  .item.sel{border-color:var(--gold);background:#fff8e1;box-shadow:0 0 0 3px rgba(201,162,39,.25)}
  .item .num{flex:0 0 auto;width:24px;height:24px;border-radius:50%;background:var(--navy);color:#fff;font-size:13px;font-weight:700;display:none;align-items:center;justify-content:center}
  .item.paired{border-color:var(--navy);background:#eef1f8}
  .item.paired .num{display:flex}
  .item.ok{border-color:var(--green);background:#e8f4ec;cursor:default}
  .item.ok .num{background:var(--green)}
  .item.bad{border-color:var(--red);background:#fbeceb}
  .item.bad .num{background:var(--red)}
  .item .txt{flex:1;line-height:1.25}
  .spk{all:unset;flex:0 0 auto;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--navy)}
  .spk:hover{background:rgba(27,42,74,.12)}
  .spk svg{width:18px;height:18px;fill:currentColor}
  body.no-tts .spk{display:none}
  .bar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:16px;flex-wrap:wrap}
  .btn{background:var(--navy);color:var(--paper);border:1px solid rgba(250,247,240,.3);padding:11px 22px;border-radius:999px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
  .btn:hover:not(:disabled){background:var(--green)}
  .btn:disabled{opacity:.35;cursor:default}
  .btn.ghost{background:transparent;color:var(--navy);border:1.5px solid var(--navy)}
  .btn.ghost:hover:not(:disabled){background:#e8ebf3}
  .btn.go{background:var(--green)}
  .msg{font-size:14px;font-weight:700;min-height:20px}
  .msg.good{color:var(--green)}.msg.warn{color:var(--red)}
  .ex{margin-top:16px;border-top:2px dashed var(--line);padding-top:12px;display:none}
  .ex.show{display:block}
  .ex h4{margin:0 0 8px;font-family:Georgia,serif;font-size:16px;color:var(--navy)}
  .exl{display:flex;gap:8px;align-items:flex-start;font-size:14.5px;line-height:1.5;margin:6px 0}
  .exl b{color:var(--navy)}
  .exl .ptw{color:#6e6e6e;font-size:12.5px}
  .final{text-align:center;padding:10px 4px}
  .final h2{font-family:Georgia,serif;color:var(--navy);margin:4px 0 6px;font-size:26px}
  .big{font-family:Georgia,serif;font-size:46px;font-weight:700;color:var(--green)}
  .rows{max-width:380px;margin:12px auto;text-align:left}
  .row{display:flex;justify-content:space-between;padding:8px 2px;border-bottom:1px solid var(--line);font-size:15px}
  .row b{color:var(--navy)}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
  .nav .btn{min-width:110px}
  .nav .btn.ready{background:var(--green);box-shadow:0 0 0 3px rgba(47,122,79,.35)}
  .footer{text-align:center;color:#8793ad;font-size:12px;margin-top:14px}
  @media(max-width:430px){.item{font-size:14.5px;padding:7px 8px}.item.pt{font-size:14px}.cols{gap:8px 8px}.card{padding:24px 12px 18px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="kicker">Approach ISC &middot; English for Real Life</div>
  <div class="title">Vocabulary Match</div>
  <div class="subtitle">Weeks 1 to 3 &middot; English &rarr; Portuguese</div>
  <div class="steps" id="steps"></div>
  <div class="card" id="card"></div>
  <div class="nav"><button class="btn" id="back">&larr; Back</button><button class="btn" id="next">Next &rarr;</button></div>
  <div class="footer">Tap an English word, then tap its Portuguese meaning. Tap a matched word again to undo.</div>
</div>
<script>
const PAGES=[
 {tag:"Week 1",title:"Getting started",pairs:[
  {en:"enroll",pt:"matricular-se",ex:"I want to enroll in a class at Approach ISC."},
  {en:"resource",pt:"recurso",ex:"The library is a good resource for English."},
  {en:"support",pt:"apoio",ex:"My teacher gives me a lot of support."},
  {en:"small talk",pt:"conversa informal",ex:"We make small talk about the weather."},
  {en:"comfortable",pt:"à vontade",ex:"I feel comfortable with my neighbors."}]},
 {tag:"Week 2",title:"Where I live",pairs:[
  {en:"landlord",pt:"proprietário(a) do imóvel",ex:"My landlord is very kind."},
  {en:"leasing office",pt:"administração do prédio",ex:"Go to the leasing office for the form."},
  {en:"maintenance",pt:"manutenção",ex:"Call maintenance if the sink is broken."},
  {en:"complaint",pt:"reclamação",ex:"I have a complaint about the noise."},
  {en:"neighborhood",pt:"bairro",ex:"My neighborhood is quiet at night."}]},
 {tag:"Week 3",title:"Healthcare",pairs:[
  {en:"insurance",pt:"seguro-saúde",ex:"Do you have health insurance?"},
  {en:"deductible",pt:"franquia",ex:"First I pay the deductible, then the plan helps."},
  {en:"in-network",pt:"credenciado (da rede)",ex:"Is Dr. Lee in-network?"},
  {en:"urgent care",pt:"pronto atendimento",ex:"Go to urgent care for a deep cut."},
  {en:"marketplace",pt:"mercado de planos de saúde",ex:"You can compare plans on the marketplace."}]},
 {tag:"Weeks 1-3",title:"Useful phrases",pairs:[
  {en:"fill out a form",pt:"preencher um formulário",ex:"Please fill out this form."},
  {en:"get a parking permit",pt:"obter uma autorização de estacionamento",ex:"You can get a parking permit at the leasing office."},
  {en:"pay a co-pay",pt:"pagar a coparticipação",ex:"I pay a co-pay of twenty dollars."},
  {en:"make an appointment",pt:"marcar uma consulta",ex:"I need to make an appointment."},
  {en:"call 911",pt:"ligar para o 911 (emergência)",ex:"Call 911 in an emergency."}]}
];
const hasTTS=('speechSynthesis' in window)&&('SpeechSynthesisUtterance' in window);
if(!hasTTS) document.body.classList.add('no-tts');
function pick(){const v=speechSynthesis.getVoices().filter(x=>/^en[-_]US/i.test(x.lang));
  return v.find(x=>/natural|premium|enhanced|neural/i.test(x.name))||v.find(x=>/samantha|aria|jenny|google us/i.test(x.name))||v[0];}
function say(t){if(!hasTTS)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=0.85;const v=pick();if(v)u.voice=v;speechSynthesis.speak(u);}
if(hasTTS) speechSynthesis.getVoices();
const SPK='<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>';

function shuffle(a){const r=a.slice();for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;}
function mixed(n){ // shuffled order that does not equal identity, and differs from the other column's alignment
  let a;do{a=shuffle([...Array(n).keys()]);}while(a.every((v,i)=>v===i));return a;}

let page=0, S=null, scores=[null,null,null,null], states=[];
function st(){ if(!states[page]) states[page]=newState(); return states[page]; }
function newState(){
  const n=PAGES[page].pairs.length;
  let L=mixed(n), R;
  do{R=mixed(n);}while(L.every((l,i)=>R[i]===l)||R.some((r,i)=>r===L[i]&&false));
  // avoid correct pairs sitting side by side in the same row
  let tries=0; while(L.some((l,i)=>R[i]===l)&&tries<50){R=mixed(n);tries++;}
  return {L,R,pairs:{},locked:{},sel:null,first:null,checked:false,msg:'',msgc:''};
}
const card=document.getElementById('card'),stepsEl=document.getElementById('steps');
function nextNum(){const used=new Set(Object.values(S.pairs).map(p=>p.n));for(let k=1;k<=9;k++)if(!used.has(k))return k;}
function render(){
  const bk=document.getElementById('back'),nx=document.getElementById('next');
  bk.disabled=page===0;
  nx.disabled=page>=PAGES.length;
  nx.innerHTML=page===PAGES.length-1?'Finish &rarr;':'Next &rarr;';
  nx.classList.toggle('ready',page<PAGES.length&&allLocked());
  stepsEl.innerHTML=PAGES.map((_,i)=>`<div class="step ${i<page||(i===page&&allLocked())?'done':i===page?'now':''}"></div>`).join('');
  if(page>=PAGES.length){return renderFinal();}
  const P=PAGES[page];
  const pairedL={},pairedR={};
  Object.entries(S.pairs).forEach(([l,p])=>{pairedL[l]=p;pairedR[p.r]={l:+l,n:p.n,st:p.st};});
  const left=S.L.map(i=>{const p=pairedL[i];const cls=['item'];
    if(S.sel&&S.sel.side==='L'&&S.sel.idx===i)cls.push('sel');
    if(p){cls.push('paired');if(p.st==='ok')cls.push('ok');if(p.st==='bad')cls.push('bad');}
    return `<button class="item ${cls.slice(1).join(' ')}" data-side="L" data-i="${i}"><span class="num">${p?p.n:''}</span><span class="txt">${P.pairs[i].en}</span><span class="spk" role="button" tabindex="0" aria-label="Listen" data-say="${P.pairs[i].en}">${SPK}</span></button>`;}).join('');
  const right=S.R.map(j=>{const p=pairedR[j];const cls=[];
    if(S.sel&&S.sel.side==='R'&&S.sel.idx===j)cls.push('sel');
    if(p){cls.push('paired');if(p.st==='ok')cls.push('ok');if(p.st==='bad')cls.push('bad');}
    return `<button class="item pt ${cls.join(' ')}" data-side="R" data-i="${j}"><span class="num">${p?p.n:''}</span><span class="txt">${P.pairs[j].pt}</span></button>`;}).join('');
  const free=P.pairs.length-Object.keys(S.locked).length;
  const open=Object.entries(S.pairs).filter(([l,p])=>p.st!=='ok').length;
  const canCheck=free>0&&open===free&&!S._busy;
  const done=allLocked();
  card.innerHTML=`<div class="pn">PAGE ${page+1} OF ${PAGES.length} &middot; ${P.tag.toUpperCase()}</div>
   <div class="ptitle">${P.title}</div>
   <div class="inst">Match each English word or phrase to its Portuguese meaning.</div>
   <div class="cols"><div><div class="colh">English</div><div class="col">${left}</div></div><div><div class="colh">Portugu&ecirc;s</div><div class="col">${right}</div></div></div>
   <div class="bar"><div class="msg ${S.msgc}" id="msg">${S.msg}</div>
    <div style="display:flex;gap:8px">
     <button class="btn ghost" id="reset" ${done?'disabled':''}>Start again</button>
     ${done?'':`<button class="btn" id="check" ${canCheck?'':'disabled'}>Check</button>`}
    </div></div>
   <div class="ex ${done?'show':''}"><h4>In a sentence</h4>${P.pairs.map(p=>`<div class="exl"><span class="spk" role="button" tabindex="0" aria-label="Listen" data-say="${p.ex.replace(/"/g,'&quot;')}">${SPK}</span><div><b>${p.en}</b> &mdash; <span class="ptw">${p.pt}</span><br>${p.ex}</div></div>`).join('')}</div>`;
}
function allLocked(){return S&&Object.keys(S.locked).length===PAGES[page]?.pairs.length;}
function unpairL(l){delete S.pairs[l];}
card.addEventListener('click',e=>{
  if(page>=PAGES.length){if(e.target.closest('#again')){scores=[null,null,null,null];states=[];page=0;S=st();render();window.scrollTo(0,0);}return;}
  const sp=e.target.closest('.spk');
  if(sp){e.stopPropagation();say(sp.dataset.say);return;}
  const it=e.target.closest('.item');
  if(it){
    const side=it.dataset.side,idx=+it.dataset.i;
    // locked?
    const lockedPair=Object.entries(S.pairs).find(([l,p])=>p.st==='ok'&&(side==='L'?+l===idx:p.r===idx));
    if(lockedPair)return;
    S.msg='';S.msgc='';
    // already paired (not ok): unpair
    const pr=Object.entries(S.pairs).find(([l,p])=>side==='L'?+l===idx:p.r===idx);
    if(pr){delete S.pairs[pr[0]];S.sel=null;render();return;}
    if(S.sel&&S.sel.side!==side){
      const l=side==='L'?idx:S.sel.idx, r=side==='R'?idx:S.sel.idx;
      S.pairs[l]={r,n:nextNum(),st:''};S.sel=null;
    } else if(S.sel&&S.sel.side===side&&S.sel.idx===idx){S.sel=null;}
    else S.sel={side,idx};
    render();return;
  }
  if(e.target.closest('#reset')){states[page]=newState();S=states[page];scores[page]=null;render();return;}
  if(e.target.closest('#check')){doCheck();return;}
});
function doCheck(){
  const open=Object.entries(S.pairs).filter(([l,p])=>p.st!=='ok');
  let good=0,bad=0;
  open.forEach(([l,p])=>{if(+l===p.r){p.st='ok';S.locked[l]=true;good++;}else{p.st='bad';bad++;}});
  if(S.first===null){S.first=Object.values(S.locked).length;scores[page]=S.first;}
  if(allLocked()){S.msg='All correct. Well done!';S.msgc='good';}
  else{S.msg=`${good} correct, ${bad} to try again.`;S.msgc='warn';S._busy=true;
    render();
    setTimeout(()=>{Object.entries(S.pairs).forEach(([l,p])=>{if(p.st==='bad')delete S.pairs[l];});S._busy=false;render();},1100);return;}
  render();
}
function renderFinal(){
  const total=scores.reduce((a,b)=>a+(b||0),0);
  card.innerHTML=`<div class="final"><div class="pn">FINISHED</div><h2>Great work!</h2><div class="big">${total} / 20</div>
   <div class="inst">Correct on the first try</div>
   <div class="rows">${PAGES.map((p,i)=>`<div class="row"><span>${p.tag}: ${p.title}</span><b>${scores[i]===null?'skipped':scores[i]+' / '+p.pairs.length}</b></div>`).join('')}</div>
   <div class="bar" style="justify-content:center"><button class="btn" id="again">Play again</button></div></div>`;
}
function go(p){page=Math.max(0,Math.min(PAGES.length,p));if(page<PAGES.length)S=st();render();window.scrollTo(0,0);}
document.getElementById('back').onclick=()=>go(page-1);
document.getElementById('next').onclick=()=>go(page+1);
S=st();render();
</script>
</body>
</html>
