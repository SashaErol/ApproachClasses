<style>
:root{
  --bg:#F4F6FA; --card:#FFFFFF; --ink:#14213D; --ink2:#54627C; --line:#D8DEE9; --accent:#2457D6; --accent-t:#E3EBFF; --on:#FFFFFF;
  --warm:#B4440F; --warm-t:#FFEBDD; --ok-t:#E3F4EA; --ok:#17724A; --night:#0E1626;
  --f-d:"Bricolage Grotesque","Arial Black",system-ui,sans-serif;
  --f-b:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1424; --card:#172036; --ink:#EAEEF9; --ink2:#A4B0CB; --line:#2C3957; --accent:#8FADFF; --accent-t:#1E2D5C; --on:#0E1424;
  --warm:#FFAA78; --warm-t:#4A2914; --ok-t:#14392A; --ok:#79D9A5; --night:#070B14; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1424; --card:#172036; --ink:#EAEEF9; --ink2:#A4B0CB; --line:#2C3957; --accent:#8FADFF; --accent-t:#1E2D5C; --on:#0E1424;
  --warm:#FFAA78; --warm-t:#4A2914; --ok-t:#14392A; --ok:#79D9A5; --night:#070B14; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:19px/1.55 var(--f-b);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px}
.wrap{max-width:1000px;margin:0 auto}
header{padding:22px 0 10px}
.kick{font:700 13px var(--f-b);letter-spacing:.14em;text-transform:uppercase;color:var(--warm);margin:0 0 4px}
h1{font:800 clamp(34px,6vw,54px)/1 var(--f-d);margin:0 0 8px;letter-spacing:-.02em}
.sub{margin:0;color:var(--ink2);max-width:62ch}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line);margin-bottom:20px}
.row{display:flex;gap:8px;overflow-x:auto}
.row button{flex:none;font:700 16px var(--f-b);padding:10px 16px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.row button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--on)}
button:focus-visible{outline:3px solid var(--warm);outline-offset:2px}
.photo{margin:0 0 16px;border-radius:14px;overflow:hidden;background:var(--night);border:1.5px solid var(--line)}
.photo img{display:block;width:100%;height:auto}
.photo figcaption{padding:8px 14px;font:700 13px var(--f-b);letter-spacing:.1em;text-transform:uppercase;color:#C9D3EA;background:var(--night)}
h2{font:800 clamp(24px,3.6vw,32px)/1.1 var(--f-d);margin:0 0 10px}
h3{font:800 20px var(--f-d);margin:0 0 6px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:16px 18px;min-width:0}
.card.q{background:var(--accent-t);border-color:transparent}
.card.w{background:var(--warm-t);border-color:transparent}
ol.qs{margin:0;padding-left:22px;display:grid;gap:10px}
.use{display:inline-block;font:700 12px var(--f-b);letter-spacing:.08em;text-transform:uppercase;padding:1px 8px;border-radius:999px;background:var(--card);color:var(--ink2);margin-left:6px;vertical-align:1px}
dl{margin:0;display:grid;gap:8px}
dt{font-weight:700}
dd{margin:0;color:var(--ink2);font-size:17px}
dt+dd{margin-top:-6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:4px 12px;font-size:17px}
.gram{display:grid;gap:14px}
.g{background:var(--card);border:1.5px solid var(--line);border-left:6px solid var(--accent);border-radius:12px;padding:14px 18px}
.g .form{font:700 17px var(--f-b);color:var(--accent);margin:0 0 4px}
.g p{margin:2px 0}
.g .ex{color:var(--ink)}
.g .why{color:var(--ink2);font-size:17px}
mark{background:var(--warm-t);color:var(--ink);padding:0 3px;border-radius:4px;font-weight:700}
.task{counter-reset:s;display:grid;gap:12px}
.task li{list-style:none;counter-increment:s;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 16px 12px 56px;position:relative}
.task li::before{content:counter(s);position:absolute;left:14px;top:10px;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--on);font:800 16px/30px var(--f-d);text-align:center}
.task{margin:0;padding:0}
.nextbar{display:flex;justify-content:space-between;gap:10px;margin-top:22px}
.nextbar button{font:700 17px var(--f-b);padding:12px 20px;border-radius:10px;border:1.5px solid var(--accent);background:var(--accent);color:var(--on);cursor:pointer}
.nextbar button.ghost{background:transparent;color:var(--accent)}
</style>

<header>
  <p class="kick">Group 3 · Photo story</p>
  <h1>The Lake House</h1>
  <p class="sub">Three photos, one family weekend. Look carefully, then decide together what happened before, what is happening now, and how it ends. There is no right answer. A good story has clues from the photos.</p>
</header>

    ['This banner says “Welcome Home.” Whose home is it? Who had wanted this reunion to happen?','had organized / had insisted']],
 w:[['a family reunion','a gathering of relatives who do not often meet'],['to avoid eye contact','to not look at someone on purpose'],['tension in the air','an uncomfortable feeling between people'],['to hold a grudge','to stay angry about something for a long time'],['estranged','no longer in contact with someone close'],['the elephant in the room','a big problem that nobody mentions']]},
{n:'Episode 2',when:'Dinner at dusk',alt:'A long wooden table outdoors by a lake at dusk, with string lights and food: corn, chicken, bread, salad and a cake. About a dozen relatives sit frozen, all looking in different directions. At the near end the grandmother rests her hand on a small framed photo turned away from the camera. A woman stands with her hand over her mouth. A man in a floral shirt holds a fork mid-air. A girl looks over her shoulder. A glass has tipped over and a dog watches. On the right, an older man in a gray jacket stands at the edge of the light holding a small blue gift box.',
 q:[['Who is the man standing at the edge of the light? How do the different people at the table react to him?','has just arrived / must be'],
    ['The woman in the cardigan has her hand over her mouth. What has she just realized?','has just recognized / can’t believe'],
    ['Whose photo is on the table? Why is it facing away from us?','must have been / had been placed'],
    ['What had the grandmother prepared for this evening? Why is she the only calm person at the table?','had prepared / had been planning']],
 w:[['to be taken aback','to be surprised and a little shocked'],['uninvited','not asked to come'],['out of nowhere','suddenly and unexpectedly'],['you could hear a pin drop','it was completely silent'],['to clear the air','to talk about a problem to make things better'],['to make a scene','to behave in a way that gets everyone’s attention']]},
{n:'Episode 3',when:'The dock at night',alt:'Under a full moon, the grandmother and the older man in the gray jacket sit side by side on a wooden dock. Between them is an open blue box with old photographs and papers, and its lid lies beside it. A lantern lights their faces. Her cane and a plate with a piece of cake are next to her. In the background, family members watch from the lit porch. A rowboat is tied nearby.',
 q:[['What is in the box? Why does the grandmother look so tender?','has kept / must be'],
    ['The family is watching from the porch. What are they saying to each other?','are probably wondering / might be'],
    ['How long had these two people been apart? What had kept them apart?','had been apart / had stopped'],
    ['How will this night change the family? What will have happened by next summer?','will have changed / will have forgiven']],
 w:[['to reconcile','to become friends again after a conflict'],['to bury the hatchet','to end an old argument'],['long-lost','lost or separated for a very long time'],['to heal old wounds','to help people feel better after a painful past'],['tender','gentle and loving'],['to come full circle','to return to where something started'],['to reach out','to contact someone to start a conversation']]}
];
const BANK={
 adj:['awkward','tense','sheepish','astonished','tearful','reluctant','nostalgic','affectionate','guarded','relieved','protective','forgiving'],
 spec:['It looks as if they’re…','It seems like…','She must have…','He can’t have…','I’d say that…','The way she’s looking at him suggests that…','There’s a good chance that…','What if he’s actually…?','That would explain why…','I have a feeling that…'],
 link:['At first,','For years,','Little did they know that…','Meanwhile,','By the time dinner was served,','To everyone’s surprise,','As it turned out,','In the end,']
};
const GR=[
 {f:'Past simple',s:'finished actions in order',ex:'The family <mark>arrived</mark>, <mark>unloaded</mark> the cars and <mark>sat</mark> down to dinner.',why:'The main events of the story, one after another.'},
 {f:'Past continuous · was / were + -ing',s:'the background, an action in progress',ex:'Everyone <mark>was eating</mark> when a stranger <mark>stepped</mark> out of the woods.',why:'The longer action sets the scene. The short action interrupts it (past simple).'},
 {f:'Past perfect · had + past participle',s:'one step further back',ex:'The grandmother <mark>had sent</mark> an invitation before the family <mark>arrived</mark>.',why:'Use it for the backstory: what happened before the moment in the photo.'},
 {f:'Past perfect continuous · had been + -ing',s:'how long, or the reason for what you see',ex:'The siblings <mark>had been avoiding</mark> each other for years. Her eyes were wet because she <mark>had been waiting</mark> for this night.',why:'Shows an activity that continued up to the photo. The result is still visible.'},
 {f:'Guessing about the past · must / might / can’t have + past participle',s:'what you think happened',ex:'He <mark>must have been</mark> away for a long time. It <mark>can’t have been</mark> an accident that she invited him.',why:'must = almost sure, might = possible, can’t = almost sure it is not true.'},
 {f:'Future perfect · will have + past participle',s:'finished by a future moment',ex:'By next summer, the siblings <mark>will have made</mark> peace.',why:'Use it for outcomes: what will be done before a certain time.'}
];
const TASK=[
 'Build the family. Give names to the grandmother, the man in the floral shirt, the woman in the cardigan and the stranger. How are they related? What had each of them been doing before the weekend?',
 'Agree on the backstory. Why had the two siblings stopped talking? Who is the stranger to the grandmother? Use <b>past perfect</b> and <b>past perfect continuous</b>.',
 'Tell the middle. What did the stranger say at dinner? What did the family do when he stepped forward? Use <b>past simple</b> and <b>past continuous</b>.',
 'Choose your ending. What is in the blue box? What will each family member have done by the end of the summer? What <b>will have changed</b> by next year’s reunion?',
 'Prepare a 2-minute retelling. Everyone in the group speaks. Add one twist that the other groups will not expect.'
];
const TABS=[['look','1. Look and talk'],['words','2. Useful words'],['gram','3. Grammar'],['tell','4. Tell the story']];
const tabs=document.getElementById('tabs'),main=document.getElementById('main');
let cur='look',ep=0;
const E=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
function look(){
  const e=EP[ep];
  return `<div class="row" role="tablist" style="margin-bottom:14px">${EP.map((x,i)=>`<button role="tab" aria-selected="${i===ep}" data-ep="${i}">${x.n}</button>`).join('')}</div>
  <figure class="photo"><img src="${IMG[ep]}" alt="${E(e.alt)}"><figcaption>${e.n} · ${e.when}</figcaption></figure>
  <div class="grid"><div class="card q"><h3>Talk about it</h3><ol class="qs">${e.q.map(q=>`<li>${E(q[0])}<span class="use">${E(q[1])}</span></li>`).join('')}</ol></div>
  <div class="card w"><h3>Words for this photo</h3><dl>${e.w.map(w=>`<dt>${E(w[0])}</dt><dd>${E(w[1])}</dd>`).join('')}</dl></div></div>
  <div class="nextbar"><button class="ghost" data-go="prev" ${ep===0?'disabled style="visibility:hidden"':''}>Back</button><button data-go="next">${ep<2?'Next photo':'Next: useful words'}</button></div>`;
}
function words(){
  return `<h2>Useful language</h2><div class="grid">
  <div class="card"><h3>Describing feelings and faces</h3><div class="chips">${BANK.adj.map(x=>`<span class="chip">${x}</span>`).join('')}</div></div>
  <div class="card"><h3>Guessing and speculating</h3><div class="chips">${BANK.spec.map(x=>`<span class="chip">${E(x)}</span>`).join('')}</div></div>
  <div class="card"><h3>Moving the story forward</h3><div class="chips">${BANK.link.map(x=>`<span class="chip">${E(x)}</span>`).join('')}</div></div></div>
  <div class="nextbar"><button class="ghost" data-tab="look">Back</button><button data-tab="gram">Next: grammar</button></div>`;
}
function gram(){
  return `<h2>Quick grammar reminder</h2><p class="sub" style="margin:0 0 14px;color:var(--ink2)">Your story will probably use all of these. The first photo is your “now”. Everything before it is the past in the past.</p>
  <div class="gram">${GR.map(g=>`<div class="g"><p class="form">${g.f}</p><p>${E(g.s)}</p><p class="ex">${g.ex}</p><p class="why">${E(g.why)}</p></div>`).join('')}</div>
  <div class="card q" style="margin-top:16px"><h3>Watch out</h3><p style="margin:0">Not <i>She was knowing</i> (stative verbs: know, want, believe do not take -ing). Not <i>They were not talking since 2015</i>. Say <i>They had not been talking since 2015</i> or <i>They had been avoiding each other for years</i>. Do not use past perfect for a simple list of events in order.</p></div>
  <div class="nextbar"><button class="ghost" data-tab="words">Back</button><button data-tab="tell">Next: tell the story</button></div>`;
}
function tell(){
  return `<h2>Your group’s task</h2><ol class="task">${TASK.map(t=>`<li>${t}</li>`).join('')}</ol>
  <div class="card w" style="margin-top:16px"><h3>While other groups present</h3><p style="margin:0">Listen for one detail that is different from your story. Ask one question with <i>Had they…?</i> or <i>Will the family have…?</i></p></div>
  <div class="nextbar"><button class="ghost" data-tab="gram">Back</button><button data-tab="look">Back to the photos</button></div>`;
}
function render(){
  tabs.innerHTML=TABS.map(t=>`<button role="tab" aria-selected="${t[0]===cur}" data-tab="${t[0]}">${t[1]}</button>`).join('');
  main.innerHTML={look,words,gram,tell}[cur]();
  window.scrollTo({top:0});
}
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.tab){cur=b.dataset.tab;render();}
  else if(b.dataset.ep!==undefined){ep=+b.dataset.ep;render();}
  else if(b.dataset.go==='next'){if(ep<2){ep++;}else{cur='words';}render();}
  else if(b.dataset.go==='prev'){ep=Math.max(0,ep-1);render();}
});
render();
</script>

</body></html>
