</head><body>
<div class="wrap">
<header>
  <p class="kick">Conditionals · Unreal situations</p>
  <h1>If I had, I would</h1>
  <p class="sub">Second and third conditionals together. Start with signal words, then build the forms, then use them in your own sentences.</p>
</header>
<nav><div class="row" id="tabs" role="tablist"></div></nav>
<main id="main"></main>
</div>
<button id="cheatbtn" aria-expanded="false">Cheat sheet</button>
<div id="cheat" hidden></div>

<script>
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const WORDS=[['put off','delay'],['pay off','bring good results'],['take for granted','not appreciate'],['relocate','move to a new place'],['a game changer','changes everything'],['a double-edged sword','good and bad together'],['be torn between','cannot decide']];
const NOWSIG=['now','these days','this year','someday','next year','if I were you','imagine','suppose'];
const THENSIG=['yesterday','last year','back then','at the time','in 2019','too late','by then','if only'];
const PAGES=[['p1','Page 1 · Spot it'],['p2','Page 2 · Build it'],['p3','Page 3 · Say it']];
let cur='p1';

/* ---------- PAGE 1 data ---------- */
const SORT=[
 {t:'If I had a bigger apartment, I would host Thanksgiving <mark class="sig">this year</mark>.',a:'now',why:'“this year” is still open, and the fact is: I do not have a bigger apartment.'},
 {t:'If we had left earlier <mark class="sig">yesterday</mark>, we wouldn’t have missed the ferry.',a:'then',why:'“yesterday” is finished. We did miss the ferry, and we cannot change it.'},
 {t:'<mark class="sig">If I were you</mark>, I wouldn’t take your friends for granted.',a:'now',why:'“If I were you” is a classic signal: advice now, an imagined situation.'},
 {t:'<mark class="sig">Back then</mark>, if Rosa had put off the repair, her basement would have flooded again.',a:'then',why:'“Back then” points to the past. Rosa did not put it off, so it did not flood.'},
 {t:'<mark class="sig">Someday</mark>, if the city built a free bike lane downtown, it would be a game changer.',a:'now',why:'“Someday” looks forward. The bike lane does not exist, so we imagine it.'},
 {t:'If Dana had invested <mark class="sig">in 2015</mark>, her savings would have paid off.',a:'then',why:'“in 2015” is a finished past time. Dana did not invest.'},
 {t:'If the neighbors relocated to Vermont <mark class="sig">next spring</mark>, I would feel lonely.',a:'now',why:'“next spring” is future, but unreal: we are only imagining it. We use past simple + would.'},
 {t:'If you had called me <mark class="sig">at the time</mark>, I would have picked you up.',a:'then',why:'“at the time” is a past moment. You did not call, and it is too late.'}
];
const SEL=[
 {pre:'<mark class="sig">These days</mark>, if I',o1:['earned','had earned','would earn'],a1:0,mid:', I',o2:['will relocate','would relocate','would have relocated'],a2:1,post:' to Worcester.',why:'“These days” = now. Imagine now: past simple + would + base verb.'},
 {pre:'<mark class="sig">Last winter</mark>, if the pipes',o1:['didn’t freeze','hadn’t frozen','wouldn’t freeze'],a1:1,mid:', we',o2:['wouldn’t pay','won’t pay','wouldn’t have paid'],a2:2,post:' for a plumber.',why:'“Last winter” = finished past. If + past perfect, would have + past participle.'},
 {pre:'<mark class="sig">If I were you</mark>, I',o1:['would stop','would have stopped','stopped'],a1:0,mid:' putting off that call. In your place, I',o2:['would call','would have called','called'],a2:0,post:' today.',why:'Advice now: would + base verb. No “had” anywhere.'},
 {pre:'If Mr. Silva',o1:['took','had taken','would take'],a1:1,mid:' the early offer <mark class="sig">in 2022</mark>, he',o2:['would travel','would have traveled','traveled'],a2:1,post:' to Portugal already.',why:'“in 2022” = past. Past perfect in the if-clause, would have + past participle in the result.'},
 {pre:'<mark class="sig">Someday</mark>, if the landlord',o1:['offered','had offered','would offer'],a1:0,mid:' a two-year lease, I',o2:['would sign','would have signed','will have signed'],a2:0,post:' it.',why:'“Someday” = imagined future. Past simple + would.'},
 {pre:'<mark class="sig">At the time</mark>, if we',o1:['hadn’t taken','didn’t take','wouldn’t take'],a1:0,mid:' our friends for granted, they',o2:['wouldn’t have stopped','wouldn’t stop','hadn’t stopped'],a2:0,post:' calling.',why:'“At the time” = past regret. had + past participle, then would have + past participle.'}
];
/* ---------- PAGE 2 data ---------- */
const FACT=[
 {f:'I don’t have a spare room, so I can’t host my cousin.',o:['If I had a spare room, I would host my cousin.','If I had had a spare room, I would have hosted my cousin.','If I have a spare room, I will host my cousin.'],a:0,why:'A present fact → imagine the opposite now: past simple + would.'},
 {f:'Last spring, Dana put off the car inspection, so she paid a late fine.',o:['If Dana didn’t put off the car inspection, she wouldn’t pay a late fine.','If Dana wouldn’t have put off the inspection, she hadn’t paid a fine.','If Dana hadn’t put off the car inspection, she wouldn’t have paid a late fine.'],a:2,why:'A past fact → imagine the opposite before now: had + past participle, would have + past participle.'},
 {f:'My neighbors take their quiet street for granted, so they never thank the city.',o:['If my neighbors didn’t take their quiet street for granted, they would thank the city.','If my neighbors hadn’t taken their quiet street for granted, they would have thanked the city.','If my neighbors don’t take their street for granted, they will thank the city.'],a:0,why:'They do it now (never thank), so we imagine now.'},
 {f:'We didn’t relocate to Lowell in 2018, so we kept paying high rent.',o:['If we relocated to Lowell in 2018, we wouldn’t keep paying high rent.','If we had relocated to Lowell in 2018, we wouldn’t have kept paying high rent.','If we would have relocated to Lowell, we hadn’t paid high rent.'],a:1,why:'“in 2018” + a finished result → third conditional.'},
 {f:'I’m torn between two apartments, so I haven’t signed a lease.',o:['If I hadn’t been torn between two apartments, I wouldn’t have signed a lease.','If I weren’t torn between two apartments, I would sign a lease.','If I wasn’t torn, I will sign a lease.'],a:1,why:'It is true now (I am torn), so we imagine now: weren’t + would.'},
 {f:'Gabriel’s side business paid off last year, so he quit his job in June.',o:['If Gabriel’s side business hadn’t paid off last year, he wouldn’t have quit his job in June.','If Gabriel’s side business didn’t pay off, he wouldn’t quit his job.','If Gabriel’s business hadn’t paid off, he wouldn’t quit now.'],a:0,why:'Both events are finished past → third conditional.'}
];
const TYPE=[
 {pre:'<mark class="sig">Right now</mark>, if I (have) ',ifa:['had'],mid:' a car, I (visit) ',resa:['would visit'],post:' my sister in Maine every weekend.'},
 {pre:'If the Johnsons (not / put off) ',ifa:['had not put off'],mid:' the roof repair <mark class="sig">last fall</mark>, the ceiling (not / leak) ',resa:['would not have leaked'],post:' in the storm.'},
 {pre:'If Ms. Park (be) ',ifa:['were','was'],mid:' my boss, she (give) ',resa:['would give'],post:' us Fridays off.'},
 {pre:'If Hiroshi (take) ',ifa:['had taken'],mid:' the job in Denver <mark class="sig">in 2019</mark>, he (not / meet) ',resa:['would not have met'],post:' his wife.'},
 {pre:'If I (not / take) ',ifa:['had not taken'],mid:' my weekends for granted <mark class="sig">back then</mark>, I (spend) ',resa:['would have spent'],post:' more time with my parents.'},
 {pre:'If the bakery (relocate) ',ifa:['relocated'],mid:' next to the station <mark class="sig">next year</mark>, it (be) ',resa:['would be'],post:' a game changer for commuters.'},
 {pre:'If Lucia (not / study) ',ifa:['had not studied','had never studied'],mid:' every night <mark class="sig">last semester</mark>, her hard work (not / pay off) ',resa:['would not have paid off'],post:' in the final exam.'},
 {pre:'If I (be) ',ifa:['were','was'],mid:' torn between two job offers, I (ask) ',resa:['would ask'],post:' my family for advice.'}
];
const MATCH=[
 ['If I had more space,','I would adopt a rescue dog.'],
 ['If we had left earlier,','we wouldn’t have missed the ferry to Nantucket.'],
 ['If my sister lived in Florida,','I would visit her every winter.'],
 ['If the clinic had opened on Saturdays,','I wouldn’t have taken a day off work.'],
 ['If the town offered free parking,','more people would shop on Main Street.'],
 ['If they hadn’t put off the move,','they would have saved a month of rent.']
];
const ERR=[
 {o:['If I would have more time, I would learn Portuguese.','If I had more time, I would learn Portuguese.','If I have had more time, I would learn Portuguese.'],a:1,why:'Never “would” right after if. Imagine now: if + past simple.'},
 {o:['If she had called, we would have helped her.','If she would have called, we would have helped her.','If she called, we would have helped her.'],a:0,why:'Third conditional: if + had + past participle. “If she would have” is a very common mistake.'},
 {o:['If I were you, I’d tell the landlord.','If I would be you, I’d tell the landlord.','If I am you, I’d tell the landlord.'],a:0,why:'“If I were you” is the fixed form for advice.'},
 {o:['If we hadn’t take the highway, we would arrive earlier.','If we hadn’t taken the highway, we would have arrived earlier.','If we didn’t take the highway, we would have arrived earlier.'],a:1,why:'Past regret: both halves use perfect forms. Don’t mix past simple with would have.'},
 {o:['If the interest rate went down tomorrow, I would refinance.','If the interest rate would go down tomorrow, I would refinance.','If the interest rate had gone down tomorrow, I would refinance.'],a:0,why:'“tomorrow” is a future imagined situation: past simple + would.'}
];
/* ---------- PAGE 3 data ---------- */
const SCN=[
 {id:'s1',type:2,tag:'Imagine now',ctx:'Dani has $5,000 saved. She could pay off her credit card, or she could use the money to relocate to Worcester for a cheaper life. She is torn between the two.',ask:'Write 2 sentences about what you would do in her place.',fr:['If I were Dani, I would…','If I had $5,000, I would…']},
 {id:'s2',type:3,tag:'Looking back',ctx:'Last Friday your neighbor’s dog barked all night. You put off the conversation. Now the neighbor is angry, and the situation is worse.',ask:'Write 2 sentences about what you would have done differently.',fr:['If I hadn’t put off…, I would have…','If I had talked to him on Friday, …']},
 {id:'s3',type:2,tag:'Imagine now',ctx:'Your sister moved to Texas in 2020. You miss her. You are free every Saturday this fall.',ask:'Write 2 sentences: how would things be different if she lived near you?',fr:['If she lived nearby, we would…','If she were here, I wouldn’t…']},
 {id:'s4',type:3,tag:'Looking back',ctx:'Last Saturday you left home late and missed the ferry to Martha’s Vineyard. It rained all day, and you stayed in the parking lot.',ask:'Write 2 sentences about what would have happened with a better plan.',fr:['If I had left earlier, I would have…','If we hadn’t missed the ferry, …']}
];
const CARDS=[
 {k:'now',q:'If you won a free year of rent anywhere in Massachusetts, where would you relocate? What would you miss most?',fr:['If I won…, I would…','I wouldn’t… because…'],s:['If you won']},
 {k:'then',q:'Think of something you put off last year. If you hadn’t put it off, what would have been different?',fr:['If I hadn’t put it off, I would have…','It wouldn’t have…'],s:['last year','hadn’t']},
 {k:'now',q:'Is your phone a game changer or a double-edged sword for your family? What would your day be like without it?',fr:['If I didn’t have my phone, I would…','If my kids…, they would…'],s:['without it']},
 {k:'then',q:'Which decision in your life really paid off? What would have happened if you had decided differently?',fr:['If I had decided differently, I would have…','I wouldn’t have…'],s:['had decided']},
 {k:'now',q:'If you were torn between a stable job and a risky dream, what would you do? What would your family say?',fr:['If I were torn…, I would…','My mother would say…'],s:['If you were']},
 {k:'then',q:'What do people take for granted when they move to a new country? If you had known earlier, what would you have done differently?',fr:['If I had known…, I would have…','I wouldn’t have taken… for granted'],s:['had known earlier']}
];
let card=0;

/* ---------- helpers ---------- */
function markSig(t,w){return t}
function cheat(){return `<h3>Cheat sheet</h3>
<p style="margin:0 0 6px"><span class="tagnow">2nd · imagine now</span><br><b>If + past simple, would + verb</b><br>If I <u>had</u> a car, I <u>would drive</u>.<br><small>were for all persons. Signals: ${NOWSIG.join(' · ')}</small></p>
<p style="margin:10px 0 0"><span class="tagthen">3rd · looking back</span><br><b>If + had + past participle, would have + past participle</b><br>If I <u>had had</u> a car, I <u>would have driven</u>.<br><small>Signals: ${THENSIG.join(' · ')}</small></p>
<p class="fact">Never would in the if-clause. Both types are unreal: the fact is the opposite.</p>`;}
function tl(){return `<svg class="tl" viewBox="0 0 440 96" role="img" aria-label="Timeline: the third conditional points to the past, the second conditional points to now and the future">
<line x1="20" y1="66" x2="420" y2="66" stroke-width="3" style="stroke:var(--line)"/>
<line x1="210" y1="56" x2="210" y2="76" stroke="var(--ink)" stroke-width="3"/>
<text x="210" y="92" text-anchor="middle" font-size="14" font-weight="700">NOW</text>
<text x="70" y="92" text-anchor="middle" font-size="13" style="fill:var(--ink2)">PAST</text>

function p1(){return `
<span class="step">Spot it</span><h2>Two kinds of unreal “if”</h2>
<p class="lead">Both are imaginary. The signal words tell you if you are imagining something now, or regretting something in the past.</p>
<div class="four"><div><b>0 · facts</b>If you heat ice, it melts.</div><div><b>1 · real future</b>If it rains, I’ll stay home.</div><div class="f2"><b>2 · unreal now</b>If I had a car, I would drive.</div><div class="f3"><b>3 · unreal past</b>If I had had a car, I would have driven.</div></div>
<div class="grid">
 <div class="card now"><span class="tagnow">2nd conditional · imagine now</span>
  <p class="formline"><span class="ifc">If + past simple</span>, <span class="res">would + verb</span></p>
  <p style="margin:0">If I <b>had</b> a bigger apartment, I <b>would host</b> Thanksgiving.</p>
  <div class="fact">The fact: I don’t have a bigger apartment.</div>
  <div class="chips">${NOWSIG.map(x=>`<span class="chip s">${x}</span>`).join('')}</div></div>
 <div class="card then"><span class="tagthen">3rd conditional · looking back</span>
  <p class="formline"><span class="ifc">If + had + past participle</span>, <span class="res">would have + past participle</span></p>
  <p style="margin:0">If I <b>had saved</b> more last year, I <b>would have relocated</b> sooner.</p>
  <div class="fact">The fact: I didn’t save enough, and I didn’t relocate.</div>
  <div class="chips">${THENSIG.map(x=>`<span class="chip s">${x}</span>`).join('')}</div></div>
</div>
${tl()}
<div class="card" style="margin-top:14px"><h3>Remember</h3><ul class="rules">
 <li>Step back one tense. Now → <b>past simple</b>. Past → <b>past perfect</b>.</li>
 <li><b>were</b> for every person after if: If I <b>were</b> you… If she <b>were</b> here…</li>
 <li>Never <b>would</b> in the if-clause: ✗ If I would have time  ✓ If I had time.</li>
 <li>If-clause first → comma. Contractions: <b>’d</b> = would (result) or had (if-clause).</li></ul></div>
<div class="card" style="margin-top:14px"><h3>Words from Week 4, back again</h3><p class="wordbar">${WORDS.map(w=>`<span><b>${w[0]}</b>${w[1]}</span>`).join('')}</p></div>

<section class="ex" style="margin-top:30px"><span class="step">1.1</span><h2>Now or back then?</h2>
<p class="lead">Read the sentence, look for the signal word, and choose.</p>
<div id="sortlist">${SORT.map((s,i)=>`<div class="item" data-i="${i}"><p class="q"><span class="n">${i+1}.</span><span class="stxt">${s.t.replace(/<mark class="sig">|<\/mark>/g,'')}</span></p>
 <div class="btnrow"><button class="pick nowb" data-a="now">Imagine now (2nd)</button><button class="pick thenb" data-a="then">Past regret (3rd)</button></div><div class="fb" hidden></div></div>`).join('')}</div>
<p class="score" id="sortscore">Score: <b>0</b> / ${SORT.length}</p></section>

<section class="ex"><span class="step">1.2</span><h2>Choose the forms</h2>
<p class="lead">Pick the right form in both gaps. The signal word is highlighted.</p>
<div id="sellist">${SEL.map((s,i)=>`<div class="item" data-i="${i}"><p class="q"><span class="n">${i+1}.</span>${s.pre} <select data-k="1">${['Choose…',...s.o1].map(x=>`<option>${esc(x)}</option>`).join('')}</select>${s.mid} <select data-k="2">${['Choose…',...s.o2].map(x=>`<option>${esc(x)}</option>`).join('')}</select>${s.post}</p><div class="fb" hidden></div></div>`).join('')}</div>
<div class="ctl"><button class="btn" id="selcheck">Check answers</button><button class="btn ghost" id="selreset">Start over</button><span class="score" id="selscore"></span></div></section>
<div class="nextbar"><span></span><button class="btn" data-tab="p2">Next: Build it</button></div>`;}
function p2(){return `
<span class="step">Build it</span><h2>Now you build the sentences</h2>
<p class="lead">More work for you on every step. Watch for <mark class="sig">signal words</mark> and always ask: what is the fact?</p>
<section class="ex"><span class="step">2.1</span><h2>Fact → conditional</h2><p class="lead">Choose the sentence that imagines the opposite of the fact.</p>
<div id="factlist">${FACT.map((f,i)=>`<div class="item" data-i="${i}"><p class="q"><span class="n">${i+1}.</span><b>Fact:</b> ${esc(f.f)}</p><div class="btnrow" style="flex-direction:column;align-items:stretch">${f.o.map((o,j)=>`<button class="pick" data-j="${j}">${esc(o)}</button>`).join('')}</div><div class="fb" hidden></div></div>`).join('')}</div>
<p class="score" id="factscore">Score: <b>0</b> / ${FACT.length}</p></section>

<section class="ex"><span class="step">2.2</span><h2>Type the verbs</h2><p class="lead">Use the verbs in brackets. Write the full form, for example <i>would have left</i>. Short forms (’d, wouldn’t) are fine.</p>
<div id="typelist">${TYPE.map((s,i)=>`<div class="item" data-i="${i}"><p class="q"><span class="n">${i+1}.</span>${s.pre}<input type="text" data-r="if" aria-label="if clause verb ${i+1}" autocomplete="off" autocapitalize="off" spellcheck="false">${s.mid}<input type="text" data-r="res" aria-label="result verb ${i+1}" autocomplete="off" autocapitalize="off" spellcheck="false">${s.post}</p><div class="fb" hidden></div></div>`).join('')}</div>
<div class="ctl"><button class="btn" id="typecheck">Check answers</button><button class="btn ghost" id="typehint">Show first letters</button><button class="btn ghost" id="typereset">Start over</button><span class="score" id="typescore"></span></div></section>

<section class="ex"><span class="step">2.3</span><h2>Match the halves</h2><p class="lead">Tap one if-clause, then the result that fits in form and meaning.</p>
<div class="match" id="match"></div><p class="score" id="matchscore">Matched: <b>0</b> / ${MATCH.length}</p></section>

<section class="ex"><span class="step">2.4</span><h2>Which one is correct?</h2><p class="lead">Each set has one correct sentence. The wrong ones show real student mistakes.</p>
<div id="errlist">${ERR.map((f,i)=>`<div class="item" data-i="${i}"><div class="btnrow" style="flex-direction:column;align-items:stretch">${f.o.map((o,j)=>`<button class="pick" data-j="${j}">${esc(o)}</button>`).join('')}</div><div class="fb" hidden></div></div>`).join('')}</div>
<p class="score" id="errscore">Score: <b>0</b> / ${ERR.length}</p></section>
<div class="nextbar"><button class="btn ghost" data-tab="p1">Back</button><button class="btn" data-tab="p3">Next: Say it</button></div>`;}
function p3(){return `
<span class="step">Say it</span><h2>Your own sentences</h2>
<p class="lead">No options now. Decide: <b>now (2nd)</b> or <b>back then (3rd)</b>? Write your sentences, then run the quick check. It is a helper, not a grade.</p>
<section class="ex"><span class="step">3.1</span><h2>Write it</h2>
<div class="scn">${SCN.map(s=>`<div class="card ${s.type===2?'now':'then'}"><span class="${s.type===2?'tagnow':'tagthen'}">${s.tag}</span>
<p class="ctx">${esc(s.ctx)}</p><p style="margin:0;font-weight:700">${esc(s.ask)}</p>
<div class="frames">${s.fr.map(f=>`<span class="chip">${esc(f)}</span>`).join('')}</div>
<textarea data-id="${s.id}" aria-label="${esc(s.tag)} answer" placeholder="Write here…"></textarea>
<div class="ctl" style="margin-top:0"><button class="btn" data-check="${s.id}">Quick check</button></div><div class="out" id="out-${s.id}" hidden></div></div>`).join('')}</div></section>

<section class="ex"><span class="step">3.2</span><h2>Talk about it</h2><p class="lead">In pairs. Answer in full sentences with <i>would</i> or <i>would have</i>. The blue cards imagine now, the red cards look back.</p>
<div id="cards"></div></section>
<div class="nextbar"><button class="btn ghost" data-tab="p2">Back</button><button class="btn ghost" data-tab="p1">Back to the start</button></div>`;}

/* ---------- logic ---------- */
function norm(s,role){
  s=s.toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g,' ').trim();
  s=s.replace(/n't\b/g,' not');
  s=s.replace(/'d\b/g,role==='res'?' would':' had');
  return s.replace(/\s+/g,' ').trim();
}
function ctx(el){return el.closest('.item')}
function updScore(id,n,t){const e=$('#'+id);if(e)e.innerHTML=`Score: <b>${n}</b> / ${t}`}
function bindPage(){
  if(cur==='p1'){
    let sc=0;
    document.querySelectorAll('#sortlist .item').forEach(it=>{
      it.addEventListener('click',e=>{
        const b=e.target.closest('.pick');if(!b||b.disabled)return;
        const i=+it.dataset.i,d=SORT[i],ok=b.dataset.a===d.a;
        it.querySelectorAll('.pick').forEach(x=>{x.disabled=true;if(x.dataset.a===d.a)x.classList.add('good')});
        if(!ok)b.classList.add('wrong');else sc++;
        it.querySelector('.stxt').innerHTML=d.t;
        const f=it.querySelector('.fb');f.hidden=false;f.innerHTML=`<b class="${ok?'ok':'no'}">${ok?'Correct.':'Not quite.'}</b> ${d.why}`;
        updScore('sortscore',sc,SORT.length);
      });
    });
    $('#selcheck').onclick=()=>{
      let ok=0;
      document.querySelectorAll('#sellist .item').forEach((it,i)=>{
        const d=SEL[i],ss=it.querySelectorAll('select');let g=0;
        [[ss[0],d.a1,d.o1],[ss[1],d.a2,d.o2]].forEach(([s,a,o])=>{
          const good=s.value===o[a];s.classList.toggle('ok',good);s.classList.toggle('bad',!good);if(good)g++;
        });
        const f=it.querySelector('.fb');f.hidden=false;f.innerHTML=g===2?`<b class="ok">Both correct.</b> ${d.why}`:`<b class="no">${g} of 2.</b> Look at the signal word again.`;
        if(g===2)ok++;
      });
      $('#selscore').innerHTML=`<b>${ok}</b> / ${SEL.length} sentences fully correct`;
    };
    $('#selreset').onclick=()=>{document.querySelectorAll('#sellist select').forEach(s=>{s.selectedIndex=0;s.className=''});document.querySelectorAll('#sellist .fb').forEach(f=>f.hidden=true);$('#selscore').textContent=''};
  }
  if(cur==='p2'){
    const mcq=(id,arr,sid)=>{
      let sc=0;
      document.querySelectorAll('#'+id+' .item').forEach(it=>{
        it.addEventListener('click',e=>{
          const b=e.target.closest('.pick');if(!b||b.disabled)return;
          const d=arr[+it.dataset.i],j=+b.dataset.j,ok=j===d.a;
          it.querySelectorAll('.pick').forEach((x,k)=>{x.disabled=true;if(k===d.a)x.classList.add('good')});
          if(!ok)b.classList.add('wrong');else sc++;
          const f=it.querySelector('.fb');f.hidden=false;f.innerHTML=`<b class="${ok?'ok':'no'}">${ok?'Correct.':'Not quite.'}</b> ${esc(d.why)}`;
          updScore(sid,sc,arr.length);
        });
      });
    };
    mcq('factlist',FACT,'factscore');mcq('errlist',ERR,'errscore');
    $('#typecheck').onclick=()=>{
      let ok=0;
      document.querySelectorAll('#typelist .item').forEach((it,i)=>{
        const d=TYPE[i],ins=it.querySelectorAll('input');let g=0,msgs=[];
        [[ins[0],d.ifa],[ins[1],d.resa]].forEach(([inp,acc])=>{
          const v=norm(inp.value,inp.dataset.r),good=acc.includes(v);
          inp.classList.toggle('ok',good);inp.classList.toggle('bad',!good);if(good)g++;
          else if(v){
            if(/\bwill\b/.test(v))msgs.push('“will” belongs to the first conditional.');
            else if(inp.dataset.r==='if'&&/\bwould\b/.test(v))msgs.push('No “would” in the if-clause.');
            else if(inp.dataset.r==='res'&&!/\bwould\b/.test(v))msgs.push('The result needs would.');
          }
        });
        const f=it.querySelector('.fb');f.hidden=false;
        const usedWas=/^was$/.test(norm(ins[0].value,'if'))&&d.ifa.includes('was');
        f.innerHTML=g===2?`<b class="ok">Correct.</b>${usedWas?' (“were” is the standard form, “was” is informal.)':''}`:`<b class="no">${g} of 2.</b> ${[...new Set(msgs)].join(' ')||'Check the signal word: now → past simple, back then → past perfect.'}`;
        if(g===2)ok++;
      });
      $('#typescore').innerHTML=`<b>${ok}</b> / ${TYPE.length} sentences fully correct`;
    };
    $('#typehint').onclick=()=>{
      document.querySelectorAll('#typelist .item').forEach((it,i)=>{
        const d=TYPE[i],ins=it.querySelectorAll('input');
        ins[0].placeholder=d.ifa[0][0]+'…';ins[1].placeholder=d.resa[0][0]+'…';
      });
    };
    $('#typereset').onclick=()=>{document.querySelectorAll('#typelist input').forEach(i=>{i.value='';i.className='';i.placeholder=''});document.querySelectorAll('#typelist .fb').forEach(f=>f.hidden=true);$('#typescore').textContent=''};
    // match
    const M=$('#match');let L=MATCH.map((m,i)=>({t:m[0],i})),R=MATCH.map((m,i)=>({t:m[1],i}));
    R=R.slice().sort((a,b)=>((a.i*7+3)%6)-((b.i*7+3)%6));
    let selL=null,done=0;
    M.innerHTML=L.map((l,k)=>`<button class="mb" data-s="L" data-i="${l.i}">${esc(l.t)}</button><button class="mb" data-s="R" data-i="${R[k].i}">${esc(R[k].t)}</button>`).join('');
    M.addEventListener('click',e=>{
      const b=e.target.closest('.mb');if(!b||b.classList.contains('done'))return;
      if(b.dataset.s==='L'){M.querySelectorAll('.mb[data-s="L"]').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');selL=b;return;}
      if(!selL)return;
      if(selL.dataset.i===b.dataset.i){selL.classList.remove('sel');selL.classList.add('done');b.classList.add('done');selL=null;done++;$('#matchscore').innerHTML=`Matched: <b>${done}</b> / ${MATCH.length}`;}
      else{b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),350);}
    });
  }
  if(cur==='p3'){
    document.querySelectorAll('[data-check]').forEach(b=>b.onclick=()=>{
      const s=SCN.find(x=>x.id===b.dataset.check);
      const txt=document.querySelector(`textarea[data-id="${s.id}"]`).value;
      const o=$('#out-'+s.id);o.hidden=false;o.innerHTML=check(txt,s.type);
    });
    drawCards();
  }
}
const PP=/\b(had|hadn't|'d)\s+(not\s+|never\s+)?(been|gone|taken|done|seen|known|made|given|put|left|met|come|eaten|written|bought|lost|saved|called|talked|spoken|told|\w+ed)\b/;
function splitIf(s){
  const t=s.trim();let m;
  if(/^if\b/i.test(t)){const k=t.search(/,|\bthen\b/);if(k>0)return{ifc:t.slice(0,k),res:t.slice(k+1)};return{ifc:t,res:''};}
  if((m=t.match(/^(.*?)\s+if\s+(.*)$/i)))return{ifc:'if '+m[2],res:m[1],rev:true};
  return null;
}
function check(text,type){
  const raw=text.replace(/[’‘]/g,"'").trim();
  if(!raw)return '<b>Write something first.</b>';
  const sents=raw.split(/(?<=[.!?])\s+/).filter(Boolean);
  let html='',found=0;
  sents.forEach(s=>{
    const p=splitIf(s);const low=s.toLowerCase();
    if(!p){html+=`<p style="margin:8px 0 2px">${esc(s)}</p><ul><li class="w">No “if” here. Add an if-clause.</li></ul>`;return;}
    found++;
    const g=[],w=[];
    html+=p.rev?`<p style="margin:8px 0 2px"><span class="res">${esc(p.res)}</span> <span class="ifc">${esc(p.ifc)}</span></p>`:`<p style="margin:8px 0 2px"><span class="ifc">${esc(p.ifc)}</span>,<span class="res">${esc(p.res)}</span></p>`;
    const ifl=p.ifc.toLowerCase(),rl=p.res.toLowerCase();
    if(/\bwill\b|\bwon't\b/.test(low))w.push('“will” is first conditional. For an imagined situation use “would”.');
    if(/\bwould\b/.test(ifl))w.push('Avoid “would” inside the if-clause. Use past simple (2nd) or had + past participle (3rd).');
    if(type===2){
      if(PP.test(ifl)&&!/\bhad (a|an|the|my|more|no|some|enough|to|time|\d)/.test(ifl))w.push('“had + past participle” is for the past (3rd). This card is about now: use past simple.');
      else if(!/\bwould\b/.test(ifl)&&!/\bwill\b/.test(ifl))g.push('If-clause looks fine for “now”. ✓');
      if(/\b(would|could|might|'d) (not )?have\b/.test(rl))w.push('“would have” is for the past. This card asks about now: use “would + verb”.');
      else if(/\b(would|wouldn't|'d|could|might)\b/.test(rl))g.push('Result clause: would + verb. ✓');
      else if(p.res)w.push('Add “would” (or could/might) in the result.');
    }else{
      if(PP.test(ifl))g.push('If-clause: had + past participle. ✓');else w.push('After “if”, use had + past participle for a past regret.');
      if(/\b(would|wouldn't|'d|could|might) (not )?have \w+/.test(rl))g.push('Result clause: would have + past participle. ✓');
      else w.push('The result needs “would have + past participle”.');
    }
    html+=`<ul>${g.map(x=>`<li class="g">${esc(x)}</li>`).join('')}${w.map(x=>`<li class="w">${esc(x)}</li>`).join('')}</ul>`;
  });
  if(!found)html+='<p><b>Use “if” in your sentences.</b></p>';
  return html;
}
function drawCards(){
  const c=CARDS[card];
  $('#cards').innerHTML=`<div class="card talk ${c.k==='now'?'now':'then'}"><span class="${c.k==='now'?'tagnow':'tagthen'}">${c.k==='now'?'Imagine now · 2nd':'Looking back · 3rd'}</span>
  <p style="font:800 24px/1.3 var(--f-d);margin:8px 0 10px">${esc(c.q)}</p><div class="frames">${c.fr.map(f=>`<span class="chip">${esc(f)}</span>`).join('')}</div></div>
  <div class="dots">${CARDS.map((_,i)=>`<span class="dot ${i===card?'on':''}"></span>`).join('')}</div>
  <div class="nextbar"><button class="btn ghost" id="cprev" ${card===0?'style="visibility:hidden"':''}>Back</button><button class="btn" id="cnext">${card<CARDS.length-1?'Next card':'Start over'}</button></div>`;
  $('#cnext').onclick=()=>{card=card<CARDS.length-1?card+1:0;drawCards()};
  const p=$('#cprev');if(p)p.onclick=()=>{card=Math.max(0,card-1);drawCards()};
}
function render(){
  $('#tabs').innerHTML=PAGES.map(p=>`<button role="tab" aria-selected="${p[0]===cur}" data-tab="${p[0]}">${p[1]}</button>`).join('');
  $('#main').innerHTML={p1,p2,p3}[cur]();
  bindPage();window.scrollTo({top:0});
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b&&b.dataset.tab!==cur){cur=b.dataset.tab;render();}});
const cb=$('#cheatbtn'),cp=$('#cheat');cp.innerHTML=cheat();
cb.onclick=()=>{cp.hidden=!cp.hidden;cb.setAttribute('aria-expanded',String(!cp.hidden));cb.textContent=cp.hidden?'Cheat sheet':'Close';};
render();
</script>
