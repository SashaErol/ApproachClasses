<title>Thanksgiving Reading</title>
<meta name="claude:viewport-fit-sides" content="cover">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout: five tabs (preview, reading, three activities). Approach navy / red / sky. */
:root{--bg:#f3f5f8;--card:#ffffff;--fg:#0b1827;--muted:#4f5d6f;--line:#cdd5df;--soft:#e9eef4;--red:#9d251a;--sky:#2a6a99;--btn:#0b1827;--btnfg:#ffffff;--ok:#1d6b43;--okbg:#e1f2e8;--badbg:#f9e4e1;--hl:#ffe45c;--hlfg:#0b1827;--display:"Montserrat","Helvetica Neue",Arial,sans-serif;--body:"Source Serif 4",Georgia,serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#08131f;--card:#0f2338;--fg:#edf2f7;--muted:#a8b6c6;--line:#27455f;--soft:#14304b;--red:#f0907f;--sky:#7fbbe4;--btn:#7fbbe4;--btnfg:#08131f;--ok:#7fd1a3;--okbg:#15392b;--badbg:#3b1e1b;--hl:#e8d300;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#08131f;--card:#0f2338;--fg:#edf2f7;--muted:#a8b6c6;--line:#27455f;--soft:#14304b;--red:#f0907f;--sky:#7fbbe4;--btn:#7fbbe4;--btnfg:#08131f;--ok:#7fd1a3;--okbg:#15392b;--badbg:#3b1e1b;--hl:#e8d300;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:1.1rem;line-height:1.55;padding-block:14px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:56rem;margin:0 auto;display:grid;gap:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.logo{background:#fff;padding:6px 10px;border-radius:2px;display:flex}.logo img{height:26px;width:auto;display:block}
.kick{font-family:var(--display);font-weight:700;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--red)}
h1{font-family:var(--display);font-size:clamp(1.6rem,4.6vw,2.4rem);line-height:1.12;margin:4px 0 0;text-wrap:balance}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{font-family:var(--display);font-weight:600;font-size:.82rem;background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:2px;padding:10px 14px;min-height:44px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--btn);color:var(--btnfg);border-color:var(--btn)}
.panel{display:grid;gap:14px;align-content:start}
h2{font-family:var(--display);font-size:1.2rem;margin:0}
.time{font-family:var(--display);font-size:.8rem;color:var(--muted);margin:0}
.wc{display:grid;grid-template-columns:repeat(auto-fit,minmax(16rem,1fr));gap:10px}
.wcard{background:var(--card);border:1px solid var(--line);padding:12px 14px;display:grid;gap:4px;align-content:start}
.wcard b{font-family:var(--display);font-size:1.02rem;color:var(--sky)}
.wcard .syn{font-family:var(--display);font-size:.8rem;color:var(--muted)}
.wcard .ex{font-style:italic;font-size:.95rem}
.lis{font-family:var(--display);font-weight:600;font-size:.74rem;background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:2px;padding:4px 10px;min-height:32px;cursor:pointer;justify-self:start}
.pic{margin:0;background:var(--card);border:1px solid var(--line)}
.pic img{display:block;width:100%;height:auto}
.pic figcaption{font-family:var(--display);font-size:.76rem;color:var(--muted);padding:8px 14px;border-top:1px solid var(--line)}
.top{position:static;background:var(--soft);border:1px solid var(--line);padding:8px 14px}
@media (min-width:700px){.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5}}
.gloss{display:flex;align-items:center;justify-content:space-between;gap:12px;font-family:var(--display);font-weight:600;font-size:.9rem;min-height:40px}
.gloss b{color:var(--red);margin-right:.4em}.gloss .syn{color:var(--muted);font-weight:500;margin-left:.4em}
.art{background:var(--card);border:1px solid var(--line);padding:clamp(16px,3vw,28px)}
.art p{margin:0 0 1em;max-width:64ch}.art p:last-child{margin-bottom:0}
.atitle{font-family:var(--display);font-size:1.5rem;margin:0 0 4px}.dek{color:var(--muted);font-style:italic;margin:0 0 14px}
mark.n{background:var(--hl);color:var(--hlfg);padding:0 .14em;border-radius:1px;cursor:pointer}
mark.n:focus-visible,button:focus-visible,select:focus-visible,summary:focus-visible,input:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.q{background:var(--card);border:1px solid var(--line);border-radius:2px;padding:12px 16px;display:grid;grid-template-columns:2rem minmax(0,1fr);gap:6px 10px;align-items:start}
.q.ok{border-color:var(--ok);background:var(--okbg)}.q.bad{border-color:var(--red);background:var(--badbg)}
.n{font-family:var(--display);font-weight:700;color:var(--red)}
.q>:not(.n){grid-column:2;min-width:0}.q .n{grid-column:1;grid-row:1}
.row{display:flex;flex-wrap:wrap;gap:8px}
.opt{font-family:var(--display);font-weight:600;font-size:.84rem;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:2px;padding:10px 14px;min-height:44px;cursor:pointer}
.opt.ok{background:var(--okbg);border-color:var(--ok);color:var(--fg)}.opt.bad{background:var(--badbg);border-color:var(--red)}
.why{padding:10px 12px;border-left:4px solid var(--sky);background:var(--soft);font-size:.95rem}
.plain{background:var(--hl);color:var(--hlfg);padding:0 .2em}
.btn{font-family:var(--display);font-weight:600;font-size:.82rem;border:1px solid var(--btn);background:var(--btn);color:var(--btnfg);border-radius:2px;padding:10px 16px;min-height:44px;cursor:pointer}
.btn.line{background:transparent;color:var(--fg);border-color:var(--line)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.score{font-family:var(--display);font-weight:700;color:var(--sky);font-variant-numeric:tabular-nums}
.tag{font-family:var(--display);font-size:.72rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--sky)}
.tq{background:var(--card);border:1px solid var(--line);padding:14px 18px;display:grid;gap:6px}
.tq h3{font-family:var(--display);font-size:1.05rem;margin:0}.tq p{margin:0}.tq .do{font-family:var(--display);font-size:.8rem;color:var(--muted)}
.chk{display:flex;flex-wrap:wrap;gap:8px}
.chk label{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:600;font-size:.85rem;border:1px solid var(--line);background:var(--card);padding:10px 14px;min-height:44px;cursor:pointer}
.chk input{width:18px;height:18px}
.nx{display:flex;justify-content:space-between;gap:8px}
.phr{font-family:var(--display);font-size:.85rem;color:var(--muted)}
.foot{font-family:var(--display);font-size:.76rem;color:var(--muted)}
</style>

const D={"art": ["Every year on the fourth Thursday of November, millions of Americans gather for Thanksgiving, a [[long|long-standing]] tradition that goes back to 1621, when English settlers and the Wampanoag people shared a harvest meal near Plymouth, Massachusetts. Today the holiday is mostly about family, food and a long weekend. This year it falls on November 26.", "Preparing the meal is a team effort. Relatives [[pitch|pitch in]] to cook, set the table and wash the dishes, and the table is usually covered with an impressive [[spread|spread]]: turkey, stuffing, mashed potatoes, cranberry sauce and pumpkin pie. According to the American Farm Bureau, a dinner for ten people costs about $58.63 this year, up 6 percent from last year, and a 16-pound turkey alone averages almost $24. Some families are [[scale|scaling back]] by cooking a smaller meal or asking each guest to bring one dish. After dinner, many people [[wind|wind down]] on the couch with a football game or a movie.", "Travel is part of the tradition, too. AAA expects about 81.5 million people to travel at least 50 miles from home, and nearly 90 percent of them will drive, so many families [[hit|hit the road]] early to beat the traffic. The total is almost the same as last year’s record, even though gas prices are high and the average domestic plane ticket costs around $800.", "On Thursday morning, the Macy’s Thanksgiving Day Parade [[kick|kicks off]] in New York City at 8:30 a.m. This year is its 100th edition: the parade began in 1924 and has run every year except for three years during World War II. As always, it ends with Santa Claus, which marks the unofficial start of the Christmas season. Another famous custom takes place at the White House, where the president “pardons” a turkey, which means the bird is spared and sent to live on a farm.", "The next day is Black Friday, when stores offer big discounts and shoppers wake up before sunrise to [[score|score]] a deal, although more and more people now shop online. Many families also put up their Christmas decorations that same weekend. For some, Thanksgiving is about gratitude; for others, it is simply a chance to rest, eat well and enjoy the first sale of the season."], "T": [["long", "long-standing", "existing for a long time", "well-established; old", "Eating pie after dinner is a long-standing family tradition."], ["pitch", "pitch in", "to help with a task or contribute", "chip in; lend a hand", "Everyone pitched in to clean the kitchen."], ["spread", "spread", "a large meal laid out on a table", "feast; banquet", "Grandma put out an amazing spread."], ["scale", "scale back", "to reduce the size or amount of something", "cut back; downsize", "We scaled back our gift list this year."], ["wind", "wind down", "to relax and slowly stop feeling busy or stressed", "unwind; relax", "I like to wind down with a book after work."], ["hit", "hit the road", "to start a journey, usually by car", "set off; get going", "We hit the road at six to avoid traffic."], ["kick", "kick off", "to begin or start something", "start; get underway", "The concert kicks off at eight."], ["score", "score a deal", "to get something at a good price", "snag a bargain; get a steal", "She scored a deal on winter boots."]], "tf": [["Thanksgiving is celebrated on the same calendar date every year.", "F", "It falls on the fourth Thursday of November, so the date changes. This year it is November 26."], ["The holiday has its origins in a shared meal in Massachusetts in the early 1600s.", "T", "The article mentions a harvest meal in 1621 near Plymouth, Massachusetts."], ["A Thanksgiving dinner for ten people costs about 6 percent more than it did a year ago.", "T", "The Farm Bureau says $58.63, up 6 percent from last year."], ["Most Thanksgiving travelers choose to fly because it is faster.", "F", "Nearly 90 percent of travelers will drive."], ["The number of travelers this year is very different from last year’s record.", "F", "The total is almost the same as last year’s record."], ["The Macy’s parade has taken place every single year since 1924.", "F", "It has run every year except for three years during World War II."], ["Most American families eat their Thanksgiving dinner in a restaurant.", "N", "The article does not say where families eat."], ["Shoppers on Black Friday spend more than five hundred dollars on average.", "N", "No spending figure is given. The article only says that stores offer discounts."]], "up": [["Everyone in my family [[helps]] with the cooking.", "pitches in"], ["After a busy day, I like to [[relax]] with a movie.", "winds down"], ["The parade [[begins]] the holiday season.", "kicks off"], ["We [[started our trip]] at five in the morning.", "hit the road"], ["There was a [[huge amount of food]] on the table.", "spread"], ["Because prices rose, we [[cooked less food]] this year.", "scaled back"], ["He woke up at 4 a.m. to [[find a bargain]] on a TV.", "score a deal"], ["Making tamales together is an [[old, well-established]] custom in our family.", "long-standing"]], "upo": ["pitches in", "winds down", "kicks off", "hit the road", "spread", "scaled back", "score a deal", "long-standing"], "yn": [["If a company scales back production, does it make more products?", "N"], ["Do people usually hit the road when they begin a car trip?", "Y"], ["Can a long-standing tradition be only a few weeks old?", "N"], ["If you score a deal on shoes, do you pay a very high price?", "N"], ["Does a big spread of food usually mean there is plenty to eat?", "Y"], ["When a concert kicks off, has it already ended?", "N"], ["If everyone pitches in, does one person do all the work?", "N"], ["Do many people wind down before they go to bed?", "Y"]], "talk": [["Long weekend", "What are your plans for the long weekend? Will you travel, cook, rest or work? Who will you spend it with?", "Student A asks, Student B answers. Then switch."], ["Black Friday", "Do you shop on Black Friday, shop online, or ignore it? Tell your partner about the best deal you ever scored. Are the discounts real, or is it mostly marketing?", "Give one example and one reason."], ["Christmas decorations", "Some families put up Christmas decorations right after Thanksgiving. Do you? When is it too early? Which decoration or tradition is the most important in your family?", "Describe it so your partner can picture it."], ["Traditions", "Compare Thanksgiving with a holiday in your country. Who pitches in? What is on the spread? How do people wind down afterwards?", "Find one thing that is the same and one that is different."], ["Money", "Prices are rising. During the holidays, what would you scale back: gifts, travel, food or decorations? What would you refuse to cut?", "Say why. Does your partner agree?"]], "phr": "In my opinion… · For me, it depends on… · I see what you mean, but… · Personally, I’d rather…"};
