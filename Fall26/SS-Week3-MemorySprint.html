<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Memory Sprint · Weeks 1–2 · Approach ISC</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>:root{--dark:#0b1827;--navy:#0e2a47;--red:#9d251a;--blue:#418abd;--gray:#e8e8e8;--gold:#9a7c46;--muted:#5b6776;--ok:#1f7a4d;--okbg:#e6f4ec;--badbg:#fbe9e7;--tint:rgba(65,138,189,.13);--font:'Montserrat',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
*{box-sizing:border-box}html,body{margin:0}body{font-family:var(--font);color:var(--dark);background:#fff;-webkit-font-smoothing:antialiased;min-height:100dvh}
button{font-family:inherit}
header{padding:14px 22px 12px;border-bottom:2px solid var(--gold);display:flex;align-items:center;gap:12px}header img{height:40px}
.htext b{display:block;font-size:14px;color:var(--navy)}.htext span{font-size:12px;color:var(--muted);font-weight:500}
#home{margin-left:auto;border:2px solid var(--navy);background:#fff;color:var(--navy);border-radius:999px;padding:7px 14px;font-weight:700;font-size:13px;cursor:pointer;display:none}
main{max-width:800px;margin:0 auto;padding:22px 22px 70px}
.tag{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--blue);margin:0 0 10px}
.q{font-size:clamp(25px,5.6vw,36px);line-height:1.2;color:var(--navy);margin:0 0 10px}.lead{font-size:17px;line-height:1.55;margin:0 0 16px}
.btn{border:0;border-radius:999px;padding:13px 24px;font-size:16px;font-weight:700;background:var(--navy);color:#fff;cursor:pointer}.btn.alt{background:#fff;color:var(--navy);border:2px solid var(--navy)}.btn:disabled{opacity:.35;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center}
.ab{border:1.5px solid var(--navy);background:#fff;color:var(--navy);border-radius:999px;cursor:pointer;font-size:14px;padding:3px 9px}.ab.playing{background:var(--blue);color:#fff}
.bar{height:6px;background:var(--gray);border-radius:3px;margin-bottom:16px}.bar span{display:block;height:100%;background:var(--gold);border-radius:3px;transition:width .3s}
.box{background:#f9f6f0;border:1px solid #efe6d4;border-radius:12px;padding:14px 16px;margin:0 0 14px}.box h3{margin:0 0 8px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}.box p{margin:0}
.chip{display:inline-block;background:var(--tint);border-radius:999px;padding:4px 12px;font-weight:600;font-size:14px;color:var(--navy);margin:2px}
.msg{min-height:24px;font-size:15px;color:var(--muted);margin-top:10px}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}.shake{animation:sh .35s}
.clue{background:#f9f6f0;border-left:4px solid var(--gold);border-radius:10px;padding:16px 18px;margin-bottom:16px}.kind{margin:0 0 6px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--red)}
.df{margin:0;font-size:clamp(19px,4.2vw,24px);line-height:1.45;font-weight:600;color:var(--navy)}
.slots{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px;min-height:44px}.lt{width:30px;height:40px;border-bottom:3px solid var(--navy);display:inline-grid;place-items:end center;font-size:24px;font-weight:700;color:var(--navy);text-transform:lowercase;padding-bottom:2px}
#f{display:flex;gap:10px}#ans{flex:1;min-width:0;font:inherit;font-size:20px;padding:12px 16px;border:2px solid var(--navy);border-radius:12px}#ans:focus{outline:3px solid var(--tint)}
.fb{margin-top:6px;padding:14px 16px;border-radius:12px;font-size:17px}.fb.good{background:var(--okbg)}.fb.nope{background:var(--badbg)}.exm{margin:10px 0 0;background:#fff;border-left:3px solid var(--gold);padding:8px 12px;font-style:italic;font-size:15.5px}

.two{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;align-items:start}.col{display:flex;flex-direction:column;gap:10px}
.it{font:inherit;text-align:left;border:2px solid #d3dbe5;background:#fff;border-radius:12px;padding:12px 14px;cursor:pointer;color:var(--dark);font-size:16px;line-height:1.4;font-weight:600}.it.L{color:var(--navy);font-size:17px}.it:hover{border-color:var(--blue)}.it.sel{border-color:var(--blue);background:var(--tint);box-shadow:0 0 0 3px rgba(65,138,189,.25)}.it.ok{border-color:var(--ok);background:var(--okbg);cursor:default}.it.bad{border-color:var(--red);background:var(--badbg)}
.btn.lg{font-size:18px;padding:16px 22px}@media(max-width:420px){.two{gap:10px}.it{font-size:15px;padding:10px}}
</style></head><body>

<main id="app"></main><script>const W=[
 {w:'skim',alt:[],def:'to read quickly, looking only for the main ideas.',ex:'I skimmed the article during my lunch break.'},
 {w:'fluency',alt:[],def:'the ability to speak or write smoothly and easily.',ex:'Fluency comes with practice, not perfection.'},
 {w:'misinformation',alt:['disinformation'],def:'false or misleading information, spread by mistake or on purpose.',ex:'Misinformation spreads fast on social media.'},
 {w:'reliable',alt:[],def:'something or someone you can trust to be accurate and honest.',ex:'A reliable source shows where its facts come from.'},
 {w:'self-conscious',alt:[],def:'nervous or embarrassed because you think people are judging you.',ex:'He felt self-conscious about speaking in front of the class.'},
 {w:'freeze up',alt:[],def:'to suddenly be unable to speak or move because you’re nervous.',ex:'I freeze up when someone asks me a question on the phone.'},
 {w:'stereotype',alt:['stereotypes'],def:'a fixed idea about a group of people that is too simple and often unfair.',ex:'“All Americans are loud” is a stereotype.'},
 {w:'marginalized',alt:['marginalised'],def:'pushed to the edge of society, with less power and fewer opportunities.',ex:'Marginalized communities often don’t get a seat at the table.'},
 {w:'segregation',alt:[],def:'keeping groups of people apart by law or custom, for example in schools or on buses.',ex:'Segregation in schools was legal in parts of the U.S. until the 1950s and 60s.'},
 {w:'self-reliance',alt:[],def:'depending on yourself and not asking others for help.',ex:'Self-reliance is a big American value.'},
 {w:'thrive',alt:[],def:'to grow and do very well.',ex:'Some students thrive when they study in groups.'},
 {w:'hardship',alt:[],def:'a time of difficulty, when you don’t have enough money or comfort.',ex:'Her family went through years of hardship.'},
 {w:'outsider',alt:[],def:'a person who is not part of a group, or who doesn’t feel accepted by it.',ex:'As a foreigner, he felt like an outsider at first.'},
 {w:'escape',alt:[],def:'to get away from a place or danger.',ex:'A little steam escaped from the pot.'},
 {w:'fit in',alt:[],def:'to feel that you belong in a group, and that people accept you.',ex:'It took me a few months to fit in at my new job.'}
];
const TRS={
 'skim':{en:'glance through; leaf through',es:'ojear; leer por encima',pt:'folhear; ler por alto',tr:'göz gezdirmek; hızlıca okumak'},
 'fluency':{en:'smooth, natural speech',es:'fluidez',pt:'fluência',tr:'akıcılık'},
 'misinformation':{en:'fake news; wrong facts',es:'información errónea; desinformación',pt:'informação incorreta; desinformação',tr:'yanlış bilgi; dezenformasyon'},
 'reliable':{en:'dependable; trustworthy',es:'confiable; fiable',pt:'confiável',tr:'güvenilir'},
 'self-conscious':{en:'shy and uneasy; awkward',es:'cohibido/a',pt:'constrangido/a; inibido/a',tr:'çekingen; huzursuz'},

const LANGS=[['pt','Português 🇧🇷'],['es','Español 🇪🇸'],['tr','Türkçe 🇹🇷'],['en','English 🇺🇸 (easy synonyms)']];

const shuf=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
const norm=s=>s.toLowerCase().replace(/[^a-z]/g,'');
let voice=null;function pv(){if(!('speechSynthesis' in window))return;const vs=speechSynthesis.getVoices().filter(v=>/^en[-_]US/i.test(v.lang));const pref=['Samantha','Ava','Allison','Google US English','Microsoft Aria','Microsoft Jenny','Alex','Zira'];voice=pref.map(n=>vs.find(v=>v.name.includes(n))).find(Boolean)||vs[0]||null}

function speak(t,b){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';if(voice)u.voice=voice;u.rate=.92;if(b){b.classList.add('playing');u.onend=u.onerror=()=>b.classList.remove('playing')}speechSynthesis.speak(u)}

function intro(){

  <p class="kind">Choose your language</p><div class="row">${LANGS.map(l=>`<button class="btn alt lg" data-l="${l[0]}">${l[1]}</button>`).join('')}</div>`;

}
let mrounds,mr;
function startMatch(){ const ks=shuf(W.map(x=>x.w)); mrounds=[ks.slice(0,5),ks.slice(5,10),ks.slice(10,15)]; mr=0; matchRound(); }
function matchRound(){
  const R=mrounds[mr]; let pick=null,left=R.length;
  $('#app').innerHTML=`<p class="tag">Part 1 of 2 · Round ${mr+1} of 3</p><div class="bar"><span style="width:${mr/3*100}%"></span></div><p class="lead">${lang==='en'?'Tap a word, then its easy synonym or simple paraphrase.':'Tap an English word, then its match in '+LANGS.find(l=>l[0]===lang)[1]+'.'}</p>
  <div class="two"><div class="col">${shuf(R).map(k=>`<button class="it L" data-k="${k}">${k}</button>`).join('')}</div>
  <div class="col">${shuf(R).map(k=>`<button class="it Rr" data-k="${k}">${prim(TRS[k][lang])}</button>`).join('')}</div></div><div class="msg" id="msg"></div>`;
  document.querySelectorAll('.it').forEach(b=>b.onclick=()=>{
    if(b.classList.contains('ok'))return; const isL=b.classList.contains('L');
    if(!pick||pick.classList.contains('L')===isL){ if(pick)pick.classList.remove('sel'); pick=b; b.classList.add('sel'); return; }
    const a=pick; pick=null; a.classList.remove('sel');
    if(a.dataset.k===b.dataset.k){ [a,b].forEach(x=>x.classList.add('ok')); left--; $('#msg').textContent='';
      if(!left){ $('#msg').innerHTML=`<button class="btn" id="nr">${mr<2?'Next round →':'Start the memory sprint →'}</button>`; $('#nr').onclick=()=>{ if(mr<2){mr++;matchRound()}else start(); }; } }
    else { [a,b].forEach(x=>{x.classList.add('bad','shake');setTimeout(()=>x.classList.remove('bad','shake'),400)}); $('#msg').textContent='Not that one. Try again.'; }
  });
}
/* ---- PART 2: sprint ---- */
function mask(w,n){ let r=0; return [...w].map(ch=>{ if(ch===' ') return '&nbsp;&nbsp;'; if(ch==='-') return '-'; const show=r<n; r++; return `<span class="lt">${show?ch:'&nbsp;'}</span>`; }).join(''); }
const letters=w=>[...w].filter(c=>c!==' '&&c!=='-').length;
function start(list){deck=shuf(list||W);i=0;pts=0;miss=[];t0=Date.now();ask()}
function ask(){
  tries=0; helped=false; rev=1; const x=deck[i];
  $('#app').innerHTML=`<p class="tag">Part 2 of 2 · Memory sprint · ${i+1} of ${deck.length}</p><div class="bar"><span style="width:${i/deck.length*100}%"></span></div>
  <div class="clue"><p class="kind">What’s the word?</p><p class="df">${x.def}</p></div>
  <div class="slots" id="slots">${mask(x.w,rev)}</div>
  <form id="f" autocomplete="off"><input id="ans" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Type your answer" aria-label="Your answer"><button class="btn" type="submit">Check</button></form>
  <div class="row"><button class="btn alt" id="help" type="button">💡 Help: show another letter</button><button class="btn alt" id="skip" type="button">I don’t know</button></div><div class="msg" id="msg"></div>`;
  $('#ans').focus();
  $('#f').onsubmit=e=>{e.preventDefault();check()}; $('#skip').onclick=()=>reveal(0);
  $('#help').onclick=()=>{ helped=true; rev=Math.min(rev+1,letters(x.w)); $('#slots').innerHTML=mask(x.w,rev); $('#msg').textContent='Help used: this word is worth 1 point now.'; if(rev>=letters(x.w)) $('#help').disabled=true; $('#ans').focus(); };
}
function check(){
  const x=deck[i]; const v=norm($('#ans').value); if(!v) return;
  const ok=[x.w,...x.alt].map(norm).includes(v);
  if(ok){ reveal(tries===0&&!helped?2:1,true); return; }
  tries++; const an=$('#ans'); an.classList.add('shake'); setTimeout(()=>an.classList.remove('shake'),400);
  if(tries>=2){ reveal(0); return; }
  rev=Math.min(rev+2,letters(x.w)); $('#slots').innerHTML=mask(x.w,rev); $('#msg').textContent='Not yet. Here are two more letters.'; an.value=''; an.focus();
}
function reveal(p,ok){
  const x=deck[i]; pts+=p; if(p<2) miss.push(x);
  $('#slots').innerHTML=mask(x.w,99);
  $('#f').remove(); $('#skip').remove(); $('#help').remove();
  $('#msg').innerHTML=`<div class="fb ${ok?'good':'nope'}"><b>${ok?(p===2?'Perfect! +2':'Got it! +1'):'The word is <u>'+x.w+'</u>.'}</b> <button class="ab" data-say="${qa(x.w)}" aria-label="Hear the word">🔊</button>
  <p class="exm"><button class="ab" data-say="${qa(x.ex)}" aria-label="Hear the example">🔊</button> “${x.ex}”</p></div><div class="row"><button class="btn" id="nx">${i<deck.length-1?'Next →':'Finish →'}</button></div>`;
  $('#nx').onclick=()=>{ if(i<deck.length-1){i++;ask()}else done() }; $('#nx').focus();
}
function done(){
  const max=deck.length*2, pct=Math.round(pts/max*100), sec=Math.round((Date.now()-t0)/1000);
  $('#app').innerHTML=`<p class="tag">Sprint finished · ${Math.floor(sec/60)} min ${sec%60} s</p><h1 class="q">${pts} / ${max} points</h1>
  <p class="lead">${pct>=85?'Wow, your memory is sharp!':pct>=60?'Nice. A little review and you’re there.':'Good warm-up. These words need another look.'}</p>
  ${miss.length?`<div class="box"><h3>Words to review (${miss.length})</h3><p>${miss.map(m=>`<span class="chip">${m.w} · ${prim(TRS[m.w][lang])}</span>`).join(' ')}</p></div>`:''}
  <div class="row">${miss.length?'<button class="btn" id="rm">Practice the ones I missed</button>':''}<button class="btn alt" id="again">Play again</button><button class="btn alt" id="lg">Change language</button></div>`;
  if($('#rm'))$('#rm').onclick=()=>start(miss.slice()); $('#again').onclick=()=>startMatch(); $('#lg').onclick=intro;
}
intro();
</script></body></html>
