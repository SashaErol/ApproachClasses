<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>What Is American Identity? · Reading & Critical Thinking · Approach ISC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --dark:#0b1827; --navy:#0e2a47; --red:#9d251a; --blue:#418abd; --gray:#e8e8e8; --gold:#9a7c46;
    --muted:#5b6776; --tint:rgba(65,138,189,.13);
    --font:'Montserrat',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:var(--font);color:var(--dark);background:#fff;display:flex;flex-direction:column;min-height:100dvh;-webkit-font-smoothing:antialiased}
  button{font-family:inherit}

  /* header */
  header{padding:14px 22px 12px;border-bottom:2px solid var(--gold);display:flex;align-items:center;gap:12px}
  header img{height:40px;width:auto;display:block}
  .htext{line-height:1.25}
  .htext b{display:block;font-size:14px;font-weight:700;color:var(--navy);letter-spacing:.01em}
  .htext span{font-size:12px;color:var(--muted);font-weight:500}

  /* progress */
  .progress{display:flex;gap:6px;max-width:760px;width:100%;margin:18px auto 0;padding:0 22px}
  .seg{flex:1;height:5px;border:0;padding:0;border-radius:3px;background:var(--gray);cursor:pointer;transition:background .25s}
  .seg.done{background:var(--blue)}
  .seg.now{background:var(--navy)}

  /* stage */
  main{flex:1;width:100%;max-width:760px;margin:0 auto;padding:26px 22px 8px}
  .tag{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--blue);margin:0 0 14px}
  .q{font-size:clamp(26px,5.6vw,38px);line-height:1.2;font-weight:700;color:var(--navy);margin:0 0 26px;letter-spacing:-.01em}
  .more{list-style:none;margin:0;padding:0;display:grid;gap:14px}
  .more li{font-size:clamp(17px,3.2vw,20px);line-height:1.5;font-weight:500;padding-left:18px;border-left:3px solid var(--gold)}
  .callout{margin-top:26px;background:#f4f5f7;border-radius:10px;padding:14px 16px;font-size:16px;line-height:1.5;font-weight:500}
  .callout b.lbl{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--red);margin-bottom:4px}
  .endlogo{display:block;margin:30px auto 0;width:110px;height:auto;opacity:.9}

  .card.enter-next{animation:inNext .3s ease both}
  .card.enter-back{animation:inBack .3s ease both}
  @keyframes inNext{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
  @keyframes inBack{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.card.enter-next,.card.enter-back{animation:none}}

  /* tappable words */
  .w{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;
     border-bottom:2px dotted var(--blue);line-height:inherit;-webkit-tap-highlight-color:transparent}
  .w:hover{background:var(--tint)}
  .w.pp{border-bottom:0;background:var(--tint);font-weight:700;color:var(--navy);padding:1px 6px;border-radius:5px;box-shadow:inset 0 -2px 0 var(--red)}
  .w.pp:hover{background:rgba(65,138,189,.24)}
  .w:focus-visible,.btn:focus-visible,.seg:focus-visible,.ab:focus-visible,.x:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

  /* footer / nav */
  .legend{max-width:760px;margin:0 auto;width:100%;padding:0 22px 10px;font-size:12px;color:var(--muted);font-weight:500;display:flex;gap:18px;flex-wrap:wrap}
  .legend i{font-style:normal}
  .legend .d{border-bottom:2px dotted var(--blue)}
  .legend .p{background:var(--tint);padding:0 5px;border-radius:4px;box-shadow:inset 0 -2px 0 var(--red);color:var(--navy);font-weight:700}
  nav{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--gray);padding:12px 22px calc(12px + env(safe-area-inset-bottom))}
  .navin{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px}
  .count{flex:1;text-align:center;font-size:13px;font-weight:600;color:var(--muted)}
  .btn{border:0;border-radius:999px;padding:14px 26px;font-size:16px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:transform .12s,background .2s}
  .btn:active{transform:scale(.97)}
  .btn.next{background:var(--navy);color:#fff}
  .btn.next:hover{background:var(--dark)}
  .btn.back{background:none;color:var(--navy);padding:14px 16px}
  .btn.back:hover{background:var(--tint)}
  .btn[disabled]{opacity:.3;cursor:default}
  .btn svg{width:18px;height:18px}

  /* dictionary sheet */
  #scrim{position:fixed;inset:0;background:rgba(11,24,39,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
  #scrim.on{opacity:1;pointer-events:auto}
  #sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,105%);width:min(600px,100%);background:#fff;border-radius:18px 18px 0 0;
         box-shadow:0 -10px 40px rgba(11,24,39,.25);padding:22px 22px calc(24px + env(safe-area-inset-bottom));z-index:30;transition:transform .25s ease;border-top:4px solid var(--gold)}
  #sheet.on{transform:translate(-50%,0)}
  .x{position:absolute;top:12px;right:12px;width:38px;height:38px;border:0;border-radius:50%;background:#f4f5f7;cursor:pointer;color:var(--navy);display:grid;place-items:center}
  .x svg{width:18px;height:18px}
  .kind{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--blue);margin:0 0 6px}
  .kind.pp{color:var(--red)}
  #sw{font-size:30px;font-weight:700;color:var(--navy);margin:0;line-height:1.15;padding-right:44px}
  #spos{font-size:14px;color:var(--muted);font-style:italic;margin:2px 0 12px;font-weight:500}
  #sdef{font-size:18px;line-height:1.45;margin:0 0 12px;font-weight:500}
  #sex{font-size:16px;line-height:1.5;margin:0 0 16px;padding:10px 14px;border-left:3px solid var(--gold);background:#f9f6f0;color:#2b3442;font-style:italic}
  .audio{display:flex;gap:8px;flex-wrap:wrap}
  .ab{border:1.5px solid var(--navy);background:#fff;color:var(--navy);border-radius:999px;padding:9px 15px;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
  .ab:hover{background:var(--navy);color:#fff}
  .ab svg{width:17px;height:17px}
  .ab.playing{background:var(--blue);border-color:var(--blue);color:#fff}
  #noaudio{display:none;font-size:12px;color:var(--muted);margin-top:10px}

  main{max-width:820px}
  .reading p{font-size:clamp(17px,3.1vw,19px);line-height:1.7;margin:0 0 16px;font-weight:400}
  .reading p.lead{font-size:clamp(19px,3.5vw,22px);line-height:1.55;font-weight:500;color:var(--navy);border-left:4px solid var(--gold);padding-left:16px}
  .reading h2{font-size:20px;color:var(--navy);margin:30px 0 8px;font-weight:700}
  .reading ul{padding-left:20px;margin:0 0 16px}.reading li{font-size:clamp(17px,3.1vw,19px);line-height:1.65;margin-bottom:10px}
  .bookhead{display:flex;gap:22px;align-items:flex-start;margin-bottom:20px}
  .cover{width:150px;flex:none;border-radius:6px;box-shadow:0 8px 24px rgba(11,24,39,.3);height:auto}
  .byline{font-size:15px;line-height:1.5;color:var(--muted);margin:0 0 12px}.byline b{color:var(--dark);font-size:17px}
  .facts{display:flex;flex-wrap:wrap;gap:8px}.facts span{background:#f4f5f7;border-radius:8px;padding:6px 10px;font-size:13px;font-weight:600;color:var(--navy)}
  .facts i{display:block;font-style:normal;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--red);font-weight:700}
  .box{margin:0 0 14px;padding:14px 16px;border-radius:12px;background:#f9f6f0;border:1px solid #efe6d4}
  .box h3{margin:0 0 6px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
  .box p,.box li{font-size:clamp(16px,3vw,18px);line-height:1.6;margin:0}.box ul{padding-left:18px;margin:0}.box li{margin-bottom:8px}
  .box.why{background:#eef5fb;border-color:#d8e8f4}.box.why h3{color:var(--blue)}
  .box.warn{background:#fbeeec;border-color:#f0d3cf}.box.warn h3{color:var(--red)}
  @media(max-width:560px){.bookhead{flex-direction:column;align-items:center;text-align:left}.cover{width:170px}.bookhead>div{width:100%}}
</style>
</head>

 'make ends meet':{pp:1,pos:'idiom',def:'to earn just enough money to pay for the basic things you need.',ex:'Prices are so high that many families can barely make ends meet.',say:'make ends meet'},
 'start from scratch':{pp:1,pos:'idiom',def:'to begin something again from the very beginning, with nothing.',ex:'When we moved to Boston, we had to start from scratch: new job, new friends, new everything.',say:'start from scratch'},
 'fit in':{pp:1,pos:'phrasal verb',def:'to feel that you belong in a group, and that people accept you.',ex:'It took me a few months to fit in at my new job.',say:'fit in'},
 'stand out':{pp:1,pos:'phrasal verb',def:'to be easy to notice because you are different.',ex:'With her bright red coat, she stood out in the crowd.',say:'stand out'},
 'look up to':{pp:1,pos:'phrasal verb',def:'to respect and admire someone.',ex:'I look up to my grandmother. She raised five kids alone.',say:'look up to'},
 'pick up and leave':{pp:1,pos:'idiom',def:'to suddenly leave a place and go somewhere else to live.',ex:'He picked up and left for California with just one suitcase.',say:'pick up and leave'},
 'work your way up':{pp:1,pos:'phrasal verb',def:'to move to better and better jobs slowly, through hard work.',ex:'He started washing dishes and worked his way up to manager.',say:'work your way up'},
 'make a name for yourself':{pp:1,pos:'idiom',def:'to become well known and respected for what you do.',ex:'She made a name for herself as a chef in New York.',say:'make a name for yourself'},
 'chase after':{pp:1,pos:'phrasal verb',def:'to run behind something to catch it; also, to try hard to get something you want.',ex:'Don’t chase after money; chase after work you love.',say:'chase after'},
 'let go of':{pp:1,pos:'phrasal verb',def:'to stop holding something; to stop feeling attached to it.',ex:'It’s hard to let go of the past.',say:'let go of'},
 'leave behind':{pp:1,pos:'phrasal verb',def:'to go away from a person, place, or thing and not take it with you.',ex:'They left behind their house, their friends, and their language.',say:'leave behind'},
 'start over':{pp:1,pos:'phrasal verb',def:'to begin again, usually after something has gone wrong.',ex:'After the divorce, she moved to a new city to start over.',say:'start over'},
 'make a living':{pp:1,pos:'idiom',def:'to earn enough money to live on.',ex:'He makes a living by driving for a delivery app.',say:'make a living'},

 /* dictionary words */
 'melting pot':{pos:'noun',def:'a place where many cultures mix together and become one new culture.',ex:'People call New York a melting pot because you hear fifty languages on one street.',say:'melting pot'},
 'salad bowl':{pos:'noun',def:'a picture of society where each group keeps its own culture, like pieces in a salad that don’t melt together.',ex:'Some people say the U.S. is a salad bowl, not a melting pot.',say:'salad bowl'},
 'pursuit':{pos:'noun',def:'the act of trying hard to get or achieve something.',ex:'Her pursuit of a better life took her across the ocean.',say:'pursuit'},
 'newcomer':{pos:'noun',def:'a person who has just arrived in a place.',ex:'The school has a program to help newcomers learn English.',say:'newcomer'},
 'outsider':{pos:'noun',def:'a person who is not part of a group, or doesn’t feel accepted by it.',ex:'As a foreigner, he felt like an outsider at first.',say:'outsider'},
 'enslaved':{pos:'adjective',def:'forced to work for no pay and owned by another person.',ex:'Millions of enslaved Africans were taken to the Americas.',say:'enslaved'},
 'self-reliance':{pos:'noun',def:'depending on yourself and not asking others for help.',ex:'Self-reliance is a big American value, but nobody does everything alone.',say:'self reliance'},
 'grit':{pos:'noun',def:'strong determination to keep going when things are hard.',ex:'It takes grit to learn a new language at forty.',say:'grit'},
 'hardship':{pos:'noun',def:'a time of difficulty, when you don’t have enough money or comfort.',ex:'Her family went through years of hardship after the factory closed.',say:'hardship'},
 'thrive':{pos:'verb',def:'to grow and do very well.',ex:'Some students thrive when they study in groups.',say:'thrive'},
 'wealth':{pos:'noun',def:'a large amount of money and valuable things.',ex:'Wealth can buy comfort, but it can’t buy respect.',say:'wealth'},
 'stubborn':{pos:'adjective',def:'refusing to change your mind, even when people give good reasons.',ex:'My father is so stubborn: he won’t ask for directions.',say:'stubborn'},
 'stereotype':{pos:'noun',def:'a fixed idea about a group of people that is too simple and often unfair.',ex:'“All Americans are loud” is a stereotype.',say:'stereotype'},
 'runaway':{pos:'noun',def:'a person, often young, who leaves home without telling anyone.',ex:'He was a runaway at seventeen and slept on a friend’s floor.',say:'runaway'},
 'thrifty':{pos:'adjective',def:'careful with money; not wasting it.',ex:'My thrifty aunt reuses every plastic bag.',say:'thrifty'},
 'hustle':{pos:'verb / noun',def:'to work very hard and fast, especially to make money. Also: a busy, energetic life.',ex:'He hustles all day, delivering food and fixing phones.',say:'hustle'},
 'flaw':{pos:'noun',def:'a weakness or mistake in a person or thing.',ex:'Her biggest flaw is that she never says no.',say:'flaw'},
 'shrewd':{pos:'adjective',def:'smart in a practical way, especially about money or people.',ex:'He was a shrewd businessman who always read the contract twice.',say:'shrewd'},
 'wit':{pos:'noun',def:'the ability to say clever, funny things quickly.',ex:'Her wit made everyone at the table laugh.',say:'wit'},
 'glitter':{pos:'verb',def:'to shine with many small flashes of light.',ex:'The city glittered at night.',say:'glitter'},
 'longing':{pos:'noun',def:'a strong feeling of wanting something or someone you can’t have now.',ex:'She felt a deep longing for her hometown.',say:'longing'},
 'shallow':{pos:'adjective',def:'not deep; only interested in surface things like looks and money.',ex:'He thought the party people were shallow.',say:'shallow'},
 'wealthy':{pos:'adjective',def:'having a lot of money.',ex:'The wealthy family had a house with its own tennis court.',say:'wealthy'},
 'drift':{pos:'verb',def:'to move slowly without a clear direction.',ex:'After college he drifted from job to job.',say:'drift'},
 'daydream':{pos:'noun',def:'a pleasant dream you have while you are awake.',ex:'Class was boring, so I stared out the window and daydreamed.',say:'daydream'},
 'uproot':{pos:'verb',def:'to pull a plant out of the ground; also, to force someone to leave the place they call home.',ex:'The war uprooted millions of families.',say:'uproot'},
 'flee':{pos:'verb',def:'to run away from danger.',ex:'Many families fled their country to escape the war.',say:'flee'},
 'harsh':{pos:'adjective',def:'cruel, severe, or very hard to live with.',ex:'The winters in Minnesota are harsh.',say:'harsh'},
 'sharecropper':{pos:'noun',def:'a farmer who works on someone else’s land and gives part of the crop as rent. Most were very poor.',ex:'Her grandparents were sharecroppers in Mississippi.',say:'share cropper'},
 'weave':{pos:'verb',def:'to make cloth by crossing threads; also, to join many stories or ideas together.',ex:'The author weaves three life stories into one book.',say:'weave'}
};

{ html:`<p class="tag">Page 1 · Reading · about 7 minutes</p>
<h1 class="q">So… who counts as “American”?</h1>
<div class="reading">
<p class="lead">Ask ten people to describe a typical American, and you’ll get ten different pictures. One person sees a cowboy in Texas. Another sees a software engineer in California, a farmer in Iowa, a Black grandmother in Georgia, or a Mexican-American family in Chicago. They’re all right. And that’s exactly the problem.</p>

<h2>1. A country built on a sentence</h2>
<p>Most countries began with a people, a language, and a shared past. Japan, Portugal, and Turkey are good examples. The United States began with a sentence. In 1776, the Declaration of Independence said that “all men are created equal,” with the right to life, liberty, and the {{pursuit}} of happiness. In theory, that means you don’t need American parents to be American. You need to believe in the idea.</p>
<p>But there’s a catch. When those words were written, women, {{enslaved|enslaved people}}, and Native Americans were not included in “all.” Ever since then, Americans have been arguing about who the word really covers. That argument never ended. It’s still going on today.</p>

<h2>2. A nation of newcomers</h2>
<p>About one in seven people living in the U.S. was born in another country. Brazil knows this story, too: Italians, Japanese, Germans, Lebanese, Portuguese, and millions of Africans, who were brought by force, all helped to make the country. So here’s a debate you’ll hear in the U.S.: is the country a {{melting pot}} or a {{salad bowl}}?</p>
<p>In a melting pot, everyone mixes into one new culture. In a salad bowl, each group keeps its own flavor, and together they make one dish. Which picture is truer? Ask a grandfather who arrived through Ellis Island, and a teenager who speaks Spanish at home and English at school. You’ll hear two different answers.</p>

<h2>3. “I did it myself” vs. “we did it together”</h2>
<p>Americans love {{self-reliance}}. The hero of many stories is the person who [[start from scratch|starts from scratch]] and [[work your way up|works their way up]] with {{grit}}. You’ll hear people say you should “pull yourself up by your bootstraps.” Funny fact: that phrase started as a joke about something impossible. Try lifting yourself off the ground by pulling on your own shoes!</p>
<p>The other half of the story gets less attention. In the 1830s, a French visitor wrote that Americans were always forming clubs, churches, and groups to solve problems together. Today the same people volunteer at schools, bring food to sick neighbors, and give money after a storm. So are Americans {{stubborn}} individualists or great team players? Probably both, on different days.</p>

<h2>4. The Dream</h2>
<p>The phrase “American Dream” became popular in the 1930s. It means that if you work hard, you can have a better life than your parents did. Millions of people crossed oceans and borders to chase it. Some did [[get ahead|get ahead]]. Many others spent years just trying to [[make ends meet]].</p>
<p>Today, people argue about whether the Dream is still alive. Housing is expensive. College is expensive. Doctors are expensive. Others answer that opportunity still exists, and that {{hardship}} doesn’t mean the Dream is dead; it means the road is steep. Who is right? Honestly, it depends on where you start.</p>

<h2>5. Fact or fiction? Three {{stereotype|stereotypes}}</h2>
<ul>
<li><b>“Americans are fake-friendly.”</b> They smile, chat with strangers, and ask “How are you?” without waiting for an answer. Some visitors love this. Others feel it never becomes real friendship. It isn’t lying; it’s a different style of politeness.</li>
<li><b>“Americans only eat fast food and never stop working.”</b> The food is incredibly varied, from Ethiopian to Vietnamese. But the work part has some truth: the U.S. has no national law that guarantees paid vacation days.</li>
<li><b>“Americans don’t care about the rest of the world.”</b> The country is huge, and many people never leave it. But in cities, millions of people speak another language at home and keep strong links to another country.</li>
</ul>
<p>None of these is completely true or completely false. A stereotype is a tiny piece of truth that someone turned into a rule.</p>

<h2>So… who is American?</h2>
<p>Maybe the best answer is that “American” is not a finished picture. It’s an ongoing conversation, and every new person who arrives changes it a little. The next three pages introduce three authors who joined that conversation in very different ways: a runaway printer from the 1700s, a mysterious millionaire from the 1920s, and a reporter who followed millions of families on one long journey north. Which voice sounds most like yours?</p>
</div>
<div class="callout"><b class="lbl">Pause &amp; talk</b>Which of the five angles surprised you most? Where would you [[fit in|fit in]] best in this picture: a melting pot or a salad bowl?</div>` },

 title:'The Autobiography of Benjamin Franklin', by:'Benjamin Franklin · written 1771–1790, first published 1791',
 facts:[['Type','Memoir'],['Length','about 200 pages'],['Level','●●●●○ old English'],['Free?','Yes, public domain']],
 short:'Benjamin Franklin was one of 17 children in a poor Boston family. At seventeen he was a {{runaway}} who arrived in Philadelphia with almost no money, and he [[make a name for yourself|made a name for himself]] as a printer, writer, inventor, and diplomat. He wrote this book as a long letter to his son, explaining how he [[work your way up|worked his way up]]. It’s the first great “how I did it” story in American culture.',
 why:['<b>It’s an immigrant’s toolkit.</b> Franklin shows how to {{thrive}} in a new city: build a reputation, make useful friends, learn what people value.','<b>He taught himself.</b> He read constantly, practiced writing, and learned several languages on his own. Perfect for ESL students!','<b>The 13 Virtues chart.</b> He tried to build one good habit a week. He openly admits he failed at some. That honesty makes him fun to read.','<b>He was {{thrifty}} and {{shrewd}}.</b> Many immigrants will recognize the careful saving and the “work now, enjoy later” attitude.','<b>His {{wit}}.</b> Franklin is genuinely funny about his own {{flaw|flaws}}.'],

const CARDS=PAGES;
/* ---------- RENDER ---------- */
const $ = s => document.querySelector(s);
const esc = s => s;
let i = 0;
function md(t){
  return t
    .replace(/\{\{([^}|]+)(?:\|([^}]+))?\}\}/g,(m,k,s)=>`<button class="w" data-k="${k}">${s||k}</button>`)
    .replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g,(m,k,s)=>`<button class="w pp" data-k="${k}">${s||k}</button>`);
}
function render(dir){
  const c = CARDS[i];
  const el = $('#card');
  el.className = 'card' + (dir ? ' enter-'+dir : '');
  el.innerHTML = md(c.html);
  $('#count').textContent = `Page ${i+1} / ${CARDS.length}`;
  $('#back').disabled = i===0;
  $('#nextlbl').textContent = i===CARDS.length-1 ? 'Start over' : 'Next';
  document.querySelectorAll('.seg').forEach((s,n)=>{ s.className='seg'+(n<i?' done':n===i?' now':''); s.setAttribute('aria-current', n===i?'step':'false'); });
  window.scrollTo({top:0});
}
function go(n){
  closeSheet();
  const dir = n>i ? 'next' : 'back';
  i = (n+CARDS.length)%CARDS.length;
  render(n===i||n>i ? dir : 'back');
}
(function init(){
  const p = $('#progress');
  CARDS.forEach((_,n)=>{ const b=document.createElement('button'); b.className='seg'; b.setAttribute('aria-label','Go to card '+(n+1)); b.onclick=()=>go(n); p.appendChild(b); });
  render();
  $('#next').onclick = ()=> i===CARDS.length-1 ? (closeSheet(), i=0, render('next')) : go(i+1);
  $('#back').onclick = ()=> go(i-1);
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape') closeSheet();
    if($('#sheet').classList.contains('on')) return;
    if(e.key==='ArrowRight') $('#next').click();
    if(e.key==='ArrowLeft' && i>0) go(i-1);
  });
  CARDS.forEach(c=>{ (c.html.match(/(?:\{\{|\[\[)([^}\]|]+)/g)||[]).forEach(m=>{ const k=m.slice(2); if(!D[k]) console.warn('Missing entry:',k); }); });
  })();

/* ---------- DICTIONARY SHEET ---------- */
let cur = null, opener = null;
document.addEventListener('click',e=>{
  const w = e.target.closest('.w'); if(!w) return;
  openSheet(w.dataset.k, w);
});
function openSheet(k, from){
  const d = D[k]; if(!d) return;
  cur = d; opener = from;
  $('#skind').textContent = d.pp ? 'Power phrase' : 'Dictionary';
  $('#skind').className = 'kind' + (d.pp?' pp':'');
  $('#sw').textContent = k;
  $('#spos').textContent = d.pos;
  $('#sdef').textContent = d.def;
  $('#sex').textContent = '“' + d.ex + '”';
  $('#sheet').classList.add('on'); $('#scrim').classList.add('on');
  $('#sheet').setAttribute('aria-hidden','false');
  setTimeout(()=>{ $('#a-word').focus({preventScroll:true}); speak(d.say||k, 0.92, $('#a-word')); }, 60);
}
function closeSheet(){
  if(!$('#sheet').classList.contains('on')) return;
  $('#sheet').classList.remove('on'); $('#scrim').classList.remove('on');
  $('#sheet').setAttribute('aria-hidden','true');
  if('speechSynthesis' in window) speechSynthesis.cancel();
  if(opener) opener.focus({preventScroll:true});
}
$('#close').onclick = closeSheet;
$('#scrim').onclick = closeSheet;

/* ---------- AUDIO (browser text-to-speech, US English) ---------- */
let voice = null;
function pickVoice(){
  if(!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices().filter(v=>/^en[-_]US/i.test(v.lang));
  const pref = ['Samantha','Ava','Allison','Google US English','Microsoft Aria','Microsoft Jenny','Alex','Zira'];
  voice = pref.map(n=>vs.find(v=>v.name.includes(n))).find(Boolean) || vs[0] || null;
}
if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
else { $('#noaudio').style.display='block'; document.querySelector('.audio').style.display='none'; }

function speak(text, rate, btn){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  document.querySelectorAll('.ab').forEach(b=>b.classList.remove('playing'));
  const u = new SpeechSynthesisUtterance(text);
  u.lang='en-US'; if(voice) u.voice=voice; u.rate=rate; u.pitch=1;
  if(btn){ btn.classList.add('playing'); u.onend=u.onerror=()=>btn.classList.remove('playing'); }
  speechSynthesis.speak(u);
}
$('#a-word').onclick = e=> cur && speak(cur.say, 0.92, e.currentTarget);
$('#a-slow').onclick = e=> cur && speak(cur.say, 0.5, e.currentTarget);
$('#a-ex').onclick   = e=> cur && speak(cur.ex, 0.95, e.currentTarget);
</script>
