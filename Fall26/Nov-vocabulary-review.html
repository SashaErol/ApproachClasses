<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vocabulary Review: Say It, Use It</title>
<style>
<style>
  :root{--navy-dark:#0B1B2B;--navy:#132C46;--red:#A5291C;--blue:#4488BE;--gray:#E9E9EA;--white:#FFFFFF;--green:#2E8B57;--paper:#F5F7FA;--gold:#F2B705;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);font-family:'Segoe UI',Arial,sans-serif;color:var(--navy-dark);min-height:100vh}
  .top{background:var(--navy);color:var(--white);padding:14px 20px;display:flex;align-items:center;gap:14px;border-bottom:4px solid var(--red)}
  .top img{height:40px;background:#fff;padding:4px 8px;border-radius:8px}
  .top h1{font-size:1.15rem;margin:0;font-weight:600}
  .top p{margin:2px 0 0;font-size:.8rem;color:var(--gray)}
  .steps{display:flex;gap:8px;justify-content:center;margin:18px 0 6px;flex-wrap:wrap}
  .step{display:flex;align-items:center;gap:8px;font-size:.82rem;color:#7a8794;font-weight:600}
  .step .n{width:26px;height:26px;border-radius:50%;background:var(--gray);color:var(--navy);display:flex;align-items:center;justify-content:center;font-size:.8rem}
  .step.active{color:var(--navy)} .step.active .n{background:var(--navy);color:var(--white)}
  .step.done .n{background:var(--blue);color:var(--white)}
  .step+.step::before{content:"";width:18px;height:2px;background:var(--gray);margin-right:2px}
  .wrap{max-width:960px;margin:0 auto;padding:6px 16px 100px}
  .page{display:none}.page.show{display:block;animation:fade .3s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  h2{font-size:1.4rem;margin:14px 0 4px;color:var(--navy)}
  h3{font-size:1rem;margin:26px 0 8px;color:var(--navy);text-transform:uppercase;letter-spacing:.5px}
  .lead{color:#4a5a6b;margin:0 0 14px;font-size:.98rem;line-height:1.55}
  .hl{background:linear-gradient(transparent 62%,#FFD86B 62%);font-weight:700}
  .v{color:var(--green);font-weight:700}
  .if{color:var(--red);font-weight:700}
  .red{color:var(--red);font-weight:700}
  small{font-size:.82rem;color:#5b6b7c}
  /* big chart */
  .tbwrap{background:var(--white);border-radius:14px;box-shadow:0 2px 10px rgba(11,27,43,.08);overflow:hidden}
  table.ct{width:100%;border-collapse:collapse;font-size:.95rem}
  table.ct th{background:var(--navy);color:#fff;padding:10px 8px;font-size:.85rem;text-transform:lowercase;letter-spacing:.4px;border:1px solid #2b4663}
  table.ct td{border:1px solid var(--gray);padding:10px 10px;vertical-align:middle;line-height:1.6}
  table.ct td.nm{text-align:center;width:13%}
  table.ct td.nm .num{display:block;color:var(--green);font-size:1.3rem;font-weight:700}
  table.ct td.fm{color:var(--red);font-style:italic;font-weight:600}
  table.ct td.fm b{color:var(--navy-dark)}
  table.ct tr.focus td:not(.side){background:#FFFCF0}
  table.ct td.side{width:11%;text-align:center;font-weight:800;font-size:1.05rem;letter-spacing:.5px;color:#fff}
  table.ct td.side.real{background:var(--green)} table.ct td.side.unreal{background:var(--red)}
  .tag{display:inline-block;background:var(--gold);color:var(--navy-dark);font-size:.65rem;font-weight:800;letter-spacing:.5px;padding:2px 8px;border-radius:10px;margin-top:4px}
  .ladder{display:flex;align-items:stretch;gap:0;margin:16px 0 4px;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(11,27,43,.08)}
  .ladder div{flex:1;padding:12px 10px;color:#fff;font-size:.88rem;line-height:1.45;text-align:center}
  .ladder b{display:block;font-size:.95rem}
  .l1{background:#2E8B57}.l2{background:#4a9d6b}.l3{background:#c0592e}.l4{background:#A5291C}
  .tip{background:#FFF7DD;border-left:5px solid var(--gold);border-radius:10px;padding:12px 16px;margin:14px 0;font-size:.95rem;line-height:1.6}
  /* page 2 */
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .card{background:var(--white);border-radius:14px;box-shadow:0 2px 8px rgba(11,27,43,.07);padding:14px 16px;border-top:5px solid var(--navy)}
  .card.g{border-top-color:var(--green)} .card.r{border-top-color:var(--red)} .card.b{border-top-color:var(--blue)}
  .card h4{margin:0 0 6px;font-size:1.05rem;color:var(--navy)}
  .pills{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
  .pill{background:#FBEFEE;color:var(--red);font-weight:700;font-style:italic;border-radius:20px;padding:4px 12px;font-size:.95rem}
  .pill.n{background:var(--paper);color:var(--navy);font-style:normal;border:1px solid var(--gray)}
  .ex{font-size:.97rem;line-height:1.6;color:#2a3b4d;margin:5px 0;padding-left:10px;border-left:3px solid var(--gray)}
  table.pf{width:100%;border-collapse:collapse;background:var(--white);border-radius:14px;overflow:hidden;box-shadow:0 2px 8px rgba(11,27,43,.07);font-size:.95rem}
  table.pf th{background:var(--navy);color:#fff;padding:9px 12px;text-align:left;font-size:.82rem;text-transform:uppercase;letter-spacing:.4px}
  table.pf td{border-top:1px solid var(--gray);padding:9px 12px;vertical-align:top;line-height:1.65}
  table.pf td.lab{font-weight:700;color:var(--navy);width:19%}
  .chip{display:inline-block;background:var(--paper);border:1px solid var(--gray);border-radius:14px;padding:1px 9px;font-size:.86rem;margin:1px 2px;font-weight:600}
  .tl{width:100%;height:auto;display:block;margin:6px 0}
  .cmp{width:100%;border-collapse:collapse;background:var(--white);border-radius:14px;overflow:hidden;box-shadow:0 2px 8px rgba(11,27,43,.07);font-size:.95rem;margin-top:10px}
  .cmp th{padding:9px 12px;color:#fff;font-size:.82rem;text-transform:uppercase;letter-spacing:.4px;text-align:left}
  .cmp th.a{background:var(--blue)} .cmp th.b{background:var(--green)} .cmp th.c{background:var(--navy)}
  .cmp td{border-top:1px solid var(--gray);padding:9px 12px;vertical-align:top;line-height:1.65}
  .cmp td.lab{font-weight:700;color:var(--navy);width:12%}
  .why{background:#EAF4EE;border-left:5px solid var(--green);border-radius:10px;padding:14px 18px;margin:14px 0;line-height:1.65;font-size:.97rem}
  .why ul{margin:6px 0 0;padding-left:20px}
  .why li{margin-bottom:4px}
  .mgrid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .mist{background:var(--white);border-radius:12px;padding:12px 14px;box-shadow:0 2px 6px rgba(11,27,43,.06);border-left:5px solid var(--red)}
  .mist .bad{color:var(--red);text-decoration:line-through;font-size:.98rem}
  .mist .fixd{display:none;margin-top:6px;font-size:.95rem;line-height:1.55}
  .mist.open .fixd{display:block}
  .mist button{margin-top:6px;background:var(--gray);border:none;border-radius:20px;padding:5px 14px;font-weight:700;font-size:.8rem;color:var(--navy);cursor:pointer;font-family:inherit}
  .mist.open button{display:none}
  /* exercises */
  .words{background:var(--white);border-radius:12px;padding:10px 14px;margin:0 0 14px;box-shadow:0 2px 6px rgba(11,27,43,.06);font-size:.9rem;line-height:1.9}
  .words b{color:var(--blue);text-transform:uppercase;font-size:.72rem;letter-spacing:.5px;margin-right:6px}
  .sec{margin-bottom:8px}
  .sech{display:flex;align-items:center;gap:10px;margin:26px 0 6px}
  .sech .lv{background:var(--navy);color:#fff;border-radius:20px;font-size:.7rem;font-weight:700;padding:4px 11px;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
  .sech .lv.m{background:var(--blue)} .sech .lv.f{background:var(--red)}
  .sech h3{margin:0}
  .item{background:var(--white);border-radius:14px;padding:14px 18px;margin-bottom:12px;box-shadow:0 2px 8px rgba(11,27,43,.07);border-left:6px solid var(--gray)}
  .item.ok{border-left-color:var(--green)} .item.bad{border-left-color:var(--red)}
  .item .num{font-size:.75rem;font-weight:700;color:var(--blue);margin-bottom:4px}
  .item .stmt{font-size:1.05rem;line-height:2}
  .item .cue{display:inline-block;background:var(--gray);color:var(--navy);font-size:.78rem;font-weight:700;border-radius:12px;padding:1px 10px;margin-right:6px;vertical-align:middle}
  .fn{margin-top:6px;font-size:.88rem;color:var(--red);font-weight:600;display:none;line-height:1.5}
  .fn.show{display:block}
  .fn.good{color:var(--green)}
  .nw{white-space:nowrap}
  .ti{font-family:inherit;font-size:1rem;font-weight:700;color:var(--navy);border:none;border-bottom:3px solid var(--navy);background:#EEF4FA;border-radius:6px 6px 0 0;padding:1px 6px;text-align:center}
  .ti:focus{outline:none;border-bottom-color:var(--red);background:#FBEFEE}
  .ti.right{border-bottom-color:var(--green);background:#E7F5EC;color:var(--green)}
  .ti.wrong{border-bottom-color:var(--red);background:#FBEFEE;color:var(--red)}
  .slot{display:inline-block;min-width:110px;border-bottom:3px solid var(--navy);text-align:center;padding:0 8px;font-weight:700;color:var(--navy)}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  .opts.one{grid-template-columns:1fr}
  .opt{background:var(--paper);border:2px solid var(--gray);border-radius:12px;padding:9px 14px;font-size:.96rem;cursor:pointer;font-family:inherit;color:var(--navy-dark);font-weight:600;text-align:left;transition:all .15s;line-height:1.45}
  .opt .l{display:inline-block;width:22px;font-weight:700;color:var(--blue)}
  .opt:hover{border-color:var(--blue)}
  .opt.sel2{background:var(--navy);color:#fff;border-color:var(--navy)} .opt.sel2 .l{color:#9CC4E4}
  .opt.right{background:var(--green);border-color:var(--green);color:#fff} .opt.right .l{color:#d5f0df}
  .opt.wrong{background:var(--red);border-color:var(--red);color:#fff} .opt.wrong .l{color:#f6c9c4}
  .mgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
  .mcol{display:flex;flex-direction:column;gap:10px}
  .mc{background:var(--white);border:2px solid var(--gray);border-radius:12px;padding:11px 14px;cursor:pointer;font-size:.97rem;font-family:inherit;text-align:left;color:var(--navy-dark);font-weight:600;transition:all .15s;box-shadow:0 2px 6px rgba(11,27,43,.06);line-height:1.45}
  .mc.pt{font-weight:500;color:#33465a}
  .mc:hover{border-color:var(--blue)}
  .mc.sel{border-color:var(--navy);background:#E8EEF5}
  .mc.done{background:#E7F5EC;border-color:var(--green);color:var(--green);cursor:default}
  .mc.shake{animation:shake .35s;border-color:var(--red);background:#FBEFEE}
  @keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-4px)}}
  .badge{display:inline-block;background:var(--navy);color:#fff;border-radius:30px;padding:7px 18px;font-weight:700;font-size:.9rem;margin-bottom:12px}
  .bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:14px 0 6px}
  .btn{border:none;border-radius:30px;padding:10px 24px;font-size:.93rem;font-weight:700;cursor:pointer;font-family:inherit}
  .btn.main{background:var(--red);color:#fff} .btn.main:hover{background:#8b2217}
  .btn.ghost{background:var(--gray);color:var(--navy)}
  .score{background:var(--navy);color:#fff;border-radius:30px;padding:8px 18px;font-weight:700;display:none;font-size:.9rem}
  .score.show{display:inline-block}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  textarea{width:100%;min-height:84px;border:2px solid var(--gray);border-radius:12px;padding:10px 12px;font-family:inherit;font-size:.98rem;line-height:1.5;color:var(--navy-dark);resize:vertical;background:var(--paper);margin-top:8px}
  textarea:focus{outline:none;border-color:var(--blue)}
  .model{display:none;background:#EAF4EE;border-left:5px solid var(--green);border-radius:10px;padding:10px 14px;margin-top:8px;font-size:.93rem;line-height:1.6}
  .model.show{display:block}
  .foot{position:fixed;bottom:0;left:0;right:0;background:var(--white);border-top:1px solid var(--gray);padding:12px 16px;display:flex;justify-content:center;gap:16px;z-index:5}
  .foot button{background:var(--navy);color:#fff;border:none;border-radius:30px;padding:10px 28px;font-weight:700;cursor:pointer;font-size:.95rem;font-family:inherit}
  .foot button:disabled{opacity:.3;cursor:not-allowed}
  .foot button.back{background:var(--gray);color:var(--navy)}
  .steps{gap:4px;overflow-x:auto;flex-wrap:nowrap;justify-content:flex-start;padding:0 16px 4px;max-width:1100px;margin-left:auto;margin-right:auto}
  .step{flex:0 0 auto}
  .step .n{flex:0 0 26px}
  .pg-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .pg-top .tagp{background:var(--gold);color:var(--navy-dark);font-weight:800;font-size:.7rem;letter-spacing:.5px;border-radius:12px;padding:3px 10px;text-transform:uppercase}
  .wgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:10px 0 6px}
  .wc{background:var(--white);border-radius:14px;box-shadow:0 2px 8px rgba(11,27,43,.07);padding:12px 14px;border-top:5px solid var(--blue);display:flex;flex-direction:column;gap:4px}
  .wc .w{font-size:1.15rem;font-weight:800;color:var(--navy)}
  .wc .syl{font-family:Georgia,serif;font-weight:700;color:var(--red);font-size:1rem;letter-spacing:.3px}
  .wc .syl i{font-style:normal;color:#9aa6b2;font-weight:400;font-size:.8rem;margin-left:4px;font-family:'Segoe UI',Arial,sans-serif;letter-spacing:0}
  .wc .df{font-size:.88rem;color:#4a5a6b;line-height:1.45}
  .wc .row{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
  .wc button{border:none;background:var(--gray);color:var(--navy);font-weight:700;font-size:.76rem;border-radius:14px;padding:4px 11px;cursor:pointer;font-family:inherit}
  .wc button:hover{background:#d9dadd}
  .wc .pt{display:none;font-size:.9rem;color:var(--green);font-weight:700}
  .wc.open .pt{display:block}
  .bank{background:var(--white);border-radius:12px;padding:10px 14px;margin:0 0 12px;box-shadow:0 2px 6px rgba(11,27,43,.06);font-size:.92rem;line-height:2}
  .bank b{color:var(--blue);text-transform:uppercase;font-size:.72rem;letter-spacing:.5px;margin-right:6px}
  .bank span.bk{display:inline-block;background:var(--paper);border:1px solid var(--gray);border-radius:14px;padding:1px 11px;margin:2px 3px;font-weight:700;color:var(--navy)}
  .achips,.tchips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px}
  .tk{background:var(--paper);border:2px solid var(--gray);border-radius:12px;padding:7px 13px;font-size:.98rem;font-weight:600;cursor:pointer;font-family:inherit;color:var(--navy-dark)}
  .tk:hover{border-color:var(--blue)}
  .tk.used{opacity:.25;pointer-events:none}
  .ans{min-height:50px;background:#EEF4FA;border-bottom:3px solid var(--navy);border-radius:8px 8px 0 0;padding:6px 8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
  .ans .tk{background:var(--navy);color:#fff;border-color:var(--navy)}
  .ans:empty::before{content:"Click the words in the right order";color:#8a98a6;font-size:.88rem}
  .item.ok .ans{border-bottom-color:var(--green);background:#E7F5EC} .item.bad .ans{border-bottom-color:var(--red);background:#FBEFEE}
  .sy{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .sy .tk{font-size:1.05rem;padding:8px 15px}
  .sy .tk.sel2{background:var(--navy);color:#fff;border-color:var(--navy)}
  .sy .tk.right{background:var(--green);border-color:var(--green);color:#fff}
  .sy .tk.wrong{background:var(--red);border-color:var(--red);color:#fff}
  .sy .tk.miss{border-color:var(--green);border-style:dashed;color:var(--green)}
  .sy.syl .tk{font-family:Georgia,serif;font-weight:700}
  .wl{font-size:.74rem;color:#7a8794;font-weight:700;letter-spacing:.4px;text-transform:uppercase;margin-bottom:2px}
  .cats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
  .speak{background:var(--white);border-radius:14px;box-shadow:0 2px 8px rgba(11,27,43,.07);padding:14px 18px;margin-bottom:12px;border-left:6px solid var(--gold)}
  .speak .p{font-size:1.04rem;line-height:1.6;margin:0 0 8px}
  .timer{display:inline-flex;align-items:center;gap:10px}
  .timer .t{font-size:1.5rem;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums;min-width:62px}
  .timer .t.low{color:var(--red)}
  .uchips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
  .uc{background:var(--white);border:2px solid var(--gray);border-radius:20px;padding:5px 14px;font-weight:700;color:var(--navy);cursor:pointer;font-family:inherit;font-size:.92rem}
  .uc.on{background:var(--gold);border-color:var(--gold);color:var(--navy-dark)}
  .uc small{display:block;font-weight:600;color:#5b6b7c;font-size:.72rem}
  .rw{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0}
  .rw .uc{font-size:1.15rem;padding:10px 20px;cursor:default;border-color:var(--navy)}
  .prog{height:12px;background:var(--gray);border-radius:8px;overflow:hidden;margin:6px 0 12px}
  .prog i{display:block;height:100%;width:0;background:var(--green);transition:width .3s}
  .sethd{font-size:.8rem;font-weight:800;color:var(--blue);text-transform:uppercase;letter-spacing:.5px;margin:12px 0 2px}
  .uc.know{background:var(--green);border-color:var(--green);color:#fff}
  .uc.rev{background:#FBEFEE;border-color:var(--red);color:var(--red)}
  @media(max-width:760px){
    .grid2,.mgrid2,.two{grid-template-columns:1fr}
    .opts{grid-template-columns:1fr}
    .step span.t{display:none}
    .mgrid{gap:8px}.mc{font-size:.88rem;padding:10px 9px}
    table.ct,table.ct tbody,table.ct tr,table.ct td{display:block;width:auto}
    table.ct thead{display:none}
    table.ct tr{display:flex;flex-direction:column;border-bottom:6px solid var(--paper)}
    table.ct td{border:none;border-bottom:1px solid var(--gray);padding:8px 14px}
    table.ct td::before{content:attr(data-label);display:block;font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--blue);font-style:normal}
    table.ct td.nm{text-align:left;width:auto}
    table.ct td.side{order:-1;width:auto;padding:8px;text-align:center}
    table.ct td.side::before{display:none}
    .ladder{flex-direction:column}
    table.pf td.lab,table.cmp td.lab{width:auto}
    .cmp,.cmp tbody,.cmp tr,.cmp td{display:block}
    .cmp thead{display:none}
    .cmp td{border:none;padding:6px 12px}
    .cmp tr{border-top:6px solid var(--paper);padding:6px 0}
    .cmp td[data-label]::before{content:attr(data-label);display:block;font-size:.68rem;font-weight:700;text-transform:uppercase;color:var(--blue);letter-spacing:.5px}
  }

  @media(max-width:760px){
    .wgrid{grid-template-columns:1fr 1fr}
    .cats{grid-template-columns:1fr}
  }
  @media(max-width:480px){.wgrid{grid-template-columns:1fr}}
</style>
</head>

const D={"pages": [{"title": "People & Feelings", "short": "People", "intro": "Six words for describing people and emotions. Warm up your voice first: say each word out loud, then work through the activities.", "words": [{"w": "vulnerable", "syl": "VUL·ner·a·ble", "pt": "vulnerável", "def": "easy to hurt; not protected, physically or emotionally"}, {"w": "betray", "syl": "be·TRAY", "pt": "trair", "def": "to break someone's trust, for example by telling their secret"}, {"w": "pleased", "syl": "PLEASED", "pt": "satisfeito, contente", "def": "happy about something that happened"}, {"w": "committed", "syl": "com·MIT·ted", "pt": "comprometido, dedicado", "def": "giving a lot of time and energy because you believe in something"}, {"w": "grieving", "syl": "GRIEV·ing", "pt": "de luto", "def": "feeling deep sadness because someone has died"}, {"w": "weak", "syl": "WEAK", "pt": "fraco", "def": "without much strength or power"}], "sections": [{"type": "match", "id": "a1", "lv": "Controlled", "cls": "", "title": "A. Meaning match", "lead": "Click a word, then its meaning.", "pairs": [["vulnerable", "easy to hurt; not protected"], ["betray", "to break someone's trust"], ["pleased", "happy and satisfied about a result"], ["committed", "giving your time and energy because you truly believe in something"], ["grieving", "feeling deep sadness after a death"], ["weak", "without much strength or energy"]]}, {"type": "mcq", "id": "b1", "lv": "Semi-controlled", "cls": "m", "title": "B. Which word fits the situation?", "lead": "Choose the best word for each mini-situation.", "items": [{"pre": "After her grandmother died, Marta took two weeks off work. She was still ", "post": " and didn't want to talk much.", "a": "grieving", "o": ["pleased", "committed", "betray"], "f": ""}, {"pre": "The coach was so ", "post": " to the team that he never missed a single practice in ten years.", "a": "committed", "o": ["grieving", "weak", "pleased"], "f": ""}, {"pre": "Elderly patients are more ", "post" }, {"p": "Tell me about a time you were really pleased with a result. What happened?", "secs": 60}, {"p": "Why is it hard for many people to feel vulnerable in front of others? What helps?", "secs": 60}]}]}, {"title": "Actions & Phrasal Verbs", "short": "Actions", "intro": "Six very useful verbs and phrases for daily life. In phrasal verbs the little word (<i>up, out, off</i>) is part of the meaning, so learn them as one piece.", "words": [{"w": "catch up on", "syl": "catch UP on", "pt": "colocar em dia", "def": "to do something you didn't have time to do earlier"}, {"w": "reach out to", "syl": "reach OUT to", "pt": "entrar em contato com", "def": "to contact someone, often to ask for help or reconnect"}, {"w": "cope with", "syl": "COPE with", "pt": "lidar com", "def": "to manage a difficult situation or feeling"}, {"w": "hold off", "syl": "hold OFF", "pt": "adiar, esperar", "def": "to delay doing something; also: (rain) to not start yet"}, {"w": "keep up with", "syl": "keep UP with", "pt": "acompanhar, manter o ritmo", "def": "to stay at the same speed or level as someone or something"}, {"w": "run errands", "syl": "run ER·rands", "pt": "fazer pequenas tarefas na rua", "def": "to do small jobs outside the house: bank, pharmacy, post office"}], "sections": [{"type": "gaps", "id": "a2", "lv": "Controlled", "cls": "", "cues": true, "title": "A. Right form, right tense", "lead": "Write the phrase from the grey label in the correct form.", "items": ["(catch up on) Yesterday I [[caught up on]] my emails after a week away.", "(reach out to) Last month she [[reached out to]] an old classmate on LinkedIn.", "(cope with) My neighbor can't [[cope with]] the noise from the construction site.", "(hold off) They decided to [[hold off]] buying a house until prices drop.", "(keep up with) Technology changes so fast that many grandparents struggle to [[keep up with]] it.", "(run errands) On Saturdays Daniel usually [[runs errands]] before lunch: the bank, the pharmacy, the post office.", "(cope with) She is [[coping with]] a lot of stress at work right now.", "(hold off) If the rain [[holds off]], we'll have the picnic outside."]}, {"type": "order", "id": "b2", "lv": "Semi-controlled", "cls": "m", "title": "B. Build the sentence", "lead": "Click the words in the right order. They form a natural sentence.", "items": [{"ctx": "a busy friend", "a": "She was too busy running errands to answer my call."}, {"ctx": "at the office", "a": "Could you hold off on signing the contract until Monday?"}, {"ctx": "job search", "a": "He reached out to three companies before he got an answer."}, {"ctx": "after a hard year", "a": "It took her months to cope with the loss of her job."}, {"ctx": "two old friends", "a": "We need to catch up on everything we missed last year."}]}, {"type": "mcq", "id": "c2", "lv": "Careful!", "cls": "f", "title": "C. Which sentence is correct?", "lead": "Only one sentence in each group is correct. Watch the small words.", "items": [{"q": "Choose the correct sentence.", "a": "I can't keep up with all these new apps.", "o": ["I can't keep up all these new apps.", "I can't keep up to all these new apps.", "I can't keep with up all these new apps."], "f": "The phrase is <b>keep up with</b> + noun.", "full": true}, {"q": "Choose the correct sentence.", "a": "He reached out to me after ten years of silence.", "o": ["He reached out me after ten years of silence.", "He reached me out to after ten years of silence.", "He reached to out me after ten years of silence."], "f": "<b>reach out to</b> + person.", "full": true}, {"q": "Choose the correct sentence.", "a": "How do you cope with so much pressure?", "o": ["How do you cope to so much pressure?", "How do you cope so much pressure?", "How do you cope of so much pressure?"], "f": "<b>cope with</b> + noun.", "full": true}, {"q": "Choose the correct sentence.", "a": "Let's hold off until we hear from the bank.", "o": ["Let's hold off when we hear from the bank.", "Let's hold off for we hear from the bank.", "Let's hold off at we hear from the bank."], "f": "<b>hold off until</b> + time or event.", "full": true}, {"q": "Choose the correct sentence.", "a": "She runs errands every Friday afternoon.", "o": ["She is run errands every Friday afternoon.", "She runs errand every Friday afternoon.", "She errands run every Friday afternoon."], "f": "<b>runs errands</b>: plural <i>errands</i>, and <i>-s</i> with she.", "full": true}]}, {"type": "speak", "id": "d2", "lv": "Fluency", "cls": "f", "title": "D. Speak for one minute", "lead": "Tap each phrase when you use it.", "words": ["catch up on", "reach out to", "cope with", "hold off", "keep up with", "run errands"], "items": [{"p": "Describe your ideal Saturday. Which errands do you run, and what do you finally catch up on?", "secs": 60}, {"p": "A friend you haven't spoken to for years. Would you reach out to them? What would you say?", "secs": 60}, {"p": "Which things in life are hardest to keep up with today? Explain why.", "secs": 60}]}]}, {"title": "Events & Teamwork", "short": "Events", "intro": "Words for organizing things, from a school fundraiser to a wedding. Notice the stress: <b>SET</b>up (noun) but set <b>UP</b> (verb).", "words": [{"w": "venue", "syl": "VEN·ue", "pt": "local (de um evento)", "def": "the place where an event happens"}, {"w": "crew", "syl": "CREW", "pt": "equipe (de trabalho)", "def": "a group of people who work together, e.g. on a film, ship or stage"}, {"w": "fundraising", "syl": "FUND·rais·ing", "pt": "arrecadação de fundos", "def": "collecting money for a charity or a cause"}, {"w": "setup", "syl": "SET·up", "pt": "montagem, configuração", "def": "the way something is arranged or prepared before it starts"}, {"w": "booked", "syl": "BOOKED", "pt": "reservado, lotado", "def": "reserved in advance; or with no free time left"}, {"w": "push things along", "syl": "PUSH things a·LONG", "pt": "fazer as coisas andarem", "def": "to help a slow process move forward", "say": "push things along"}], "sections": [{"type": "match", "id": "a3", "lv": "Controlled", "cls": "", "title": "A. Find the partner", "lead": "Click the beginning, then the part that completes it.", "pairs": [["The {{crew}}", "worked all night to build the stage."], ["The {{venue}}", "has room for about 500 people."], ["We {{booked}}", "our flights three months in advance."], ["The {{setup}}", "took four hours because the cables were a mess."], ["To {{push things along}},", "she sent a reminder to everyone on the committee."], ["Our {{fundraising}}", "dinner raised money for a new children's hospital."]]}, {"type": "gaps", "id": "b3", "lv": "Semi-controlled", "cls": "m", "title": "B. Complete the sentences", "lead": "Use each word from the bank once.", "bank": ["booked", "crew", "fundraising", "push things along", "setup", "venue"], "items": ["Our school is organizing a [[fundraising]] night to buy new computers for the library.", "The film [[crew]] had to wait three hours because of the fog.", "Printer [[setup]] is easy: you plug it in and follow the instructions on the screen.", "I'm sorry, we can't have lunch there. The restaurant is fully [[booked]] on Sundays.", "The wedding [[venue]] was a beautiful old farm with a view of the mountains.", "The project was moving slowly, so the manager called a meeting to [[push things along]]."]}, {"type": "mcq", "id": "c3", "lv": "Think", "cls": "f", "title": "C. Odd one out", "lead": "Which word or phrase does <b>not</b> belong with the others?", "items": [{"q": "Which one does NOT belong?", "a": "cable", "o": ["venue", "stadium", "theater"], "f": "Venue, stadium and theater are all places for events. A cable is equipment.", "full": true}, {"q": "Which one does NOT belong?", "a": "ticket", "o": ["crew", "team", "staff"], "f": "Crew, team and staff are groups of people.", "full": true}, {"q": "Which one does NOT belong?", "a": "canceled", "o": ["booked", "reserved", "scheduled"], "f": "The other three mean arranged in advance.", "full": true}, {"q": "Which one does NOT belong?", "a": "invoice", "o": ["fundraising", "donation", "charity"], "f": "The other three are connected with giving money for a good cause.", "full": true}, {"q": "Which one does NOT belong?", "a": "hold back", "o": ["push things along", "speed up", "get things moving"], "f": "The other three mean to help something move faster.", "full": true}, {"q": "Which one does NOT belong?", "a": "cleanup", "o": ["setup", "preparation", "arrangement"], "f": "The other three happen <i>before</i> an event starts.", "full": true}]}, {"type": "speak", "id": "d3", "lv": "Fluency", "cls": "f", "title": "D. Speak for one minute", "lead": "Tap each word when you use it.", "words": ["venue", "crew", "fundraising", "setup", "booked", "push things along"], "items": [{"p": "Plan a surprise party for a friend. Where is the venue? Who helps you? How do you keep it secret?", "secs": 60}, {"p": "A local charity asks you to organize a fundraising event for a hospital. What would you do first?", "secs": 60}, {"p": "Tell me about the best (or worst) event you have ever attended. What did the crew do well or badly?", "secs": 60}]}]}, {"title": "Everyday Stories", "short": "Stories", "intro": "Six lively words you hear in everyday American English. Great for telling stories and reacting to surprises.", "words": [{"w": "tricky", "syl": "TRICK·y", "pt": "complicado, delicado", "def": "difficult to do or deal with; needs care"}, {"w": "neat", "syl": "NEAT", "pt": "legal, bacana; organizado", "def": "cool and clever; or tidy and well organized"}, {"w": "huge", "syl": "HUGE", "pt": "enorme", "def": "very, very big"}, {"w": "suddenly", "syl": "SUD·den·ly", "pt": "de repente", "def": "quickly and without warning"}, {"w": "snore", "syl": "SNORE", "pt": "roncar", "def": "to make a loud noise through the nose while sleeping"}, {"w": "out of the blue", "syl": "out of the BLUE", "pt": "do nada", "def": "completely unexpectedly"}], "sections": [{"type": "mcq", "id": "a4", "lv": "Controlled", "cls": "", "title": "A. Closest meaning", "lead": "Choose the meaning of the highlighted word or phrase.", "items": [{"q": "The instructions were a bit {{tricky}}, so I read them twice.", "a": "complicated", "o": ["expensive", "funny", "very short"], "f": "", "full": true}, {"q": "What a {{neat}} idea! I'm going to try it tonight.", "a": "clever and interesting", "o": ["tidy and organized", "strange and scary", "old and boring"], "f": "<i>Neat</i> can also mean tidy, but here it describes an idea.", "full": true}, {"q": "They live in a {{huge}} house with eleven bedrooms.", "a": "very big", "o": ["very old", "very cheap", "very quiet"], "f": "", "full": true}, {"q": "{{Suddenly}}, all the lights in the building went off.", "a": "Without any warning", "o": ["After a long time", "As usual", "Little by little"], "f": "", "full": true}, {"q": "My brother {{snores}} so loudly that I can hear him through the wall.", "a": "makes a loud noise while sleeping", "o": ["talks while sleeping", "walks while sleeping", "has bad dreams"], "f": "", "full": true}, {"q": "My cousin called me {{out of the blue}} after ten years.", "a": "unexpectedly", "o": ["on purpose", "angrily", "on my birthday"], "f": "", "full": true}]}, {"type": "gaps", "id": "b4", "lv": "Semi-controlled", "cls": "m", "title": "B. Finish the story", "lead": "Use each word or phrase from the bank once. You may need to change the form.", "bank": ["huge", "neat", "out of the blue", "snore", "suddenly", "tricky"], "items": ["Last night I woke up at 3 a.m. because my husband was [[snoring]] like a motor. I went to the kitchen for some water. [[Suddenly]], my phone rang! It was my cousin, calling me [[out of the blue]] after five years.", "He told me he is getting married and wants a wedding with a [[huge]] garden, big enough for 200 guests. The plan is [[tricky]], though: the village has only one road. But the little church is so [[neat]]: every bench is in line and there isn't one speck of dust."]}, {"type": "match", "id": "c4", "lv": "Quick check", "cls": "m", "title": "C. Say it in Portuguese", "lead": "Click the English word or phrase, then its Portuguese meaning.", "pairs": [["tricky", "complicado, delicado"], ["neat", "bacana, legal"], ["huge", "enorme"], ["suddenly", "de repente"], ["snore", "roncar"], ["out of the blue", "do nada"]]}, {"type": "speak", "id": "d4", "lv": "Fluency", "cls": "f", "title": "D. Speak for one minute", "lead": "Tap each word when you use it.", "words": ["tricky", "neat", "huge", "suddenly", "snore", "out of the blue"], "items": [{"p": "Tell a story about a time something happened out of the blue. Start with: \"It was an ordinary day, and then suddenly...\"", "secs": 60}, {"p": "Describe the most tricky situation you have ever had while traveling.", "secs": 60}, {"p": "What is the neatest invention of the last ten years in your opinion? Explain why.", "secs": 60}]}]}, {"title": "Big Ideas", "short": "Big Ideas", "intro": "Words for talking about life, family and goals. Many of them belong to a word family (<i>achieve → achievement</i>), which is a great way to grow your vocabulary fast.", "words": [{"w": "achieve", "syl": "a·CHIEVE", "pt": "alcançar, conquistar", "def": "to succeed in doing or getting something after effort"}, {"w": "sacrifice", "syl": "SAC·ri·fice", "pt": "sacrifício; sacrificar", "def": "to give up something important for something or someone else"}, {"w": "influenced", "syl": "IN·flu·enced", "pt": "influenciado", "def": "changed by a person or thing; to have an effect on how someone thinks"}, {"w": "generation", "syl": "gen·er·A·tion", "pt": "geração", "def": "all the people born around the same time"}, {"w": "strength", "syl": "STRENGTH", "pt": "força", "def": "the quality of being physically or mentally strong"}, {"w": "hardship", "syl": "HARD·ship", "pt": "adversidade, dificuldade", "def": "a difficult situation, often with little money or comfort"}], "sections": [{"type": "gaps", "id": "a5", "lv": "Controlled", "cls": "", "cues": true, "title": "A. Word families", "lead": "Change the grey word into the form that fits the sentence.", "items": ["(achieve) Winning a Nobel Prize is an incredible [[achievement]].", "(strong) With age, we usually lose some physical [[strength]].", "(influence) She is a very [[influential]] writer: millions of people read her books.", "(sacrifice) Immigrants often make big [[sacrifices]] to give their children a better future.", "(generation) Three [[generations]] of the family live in this house: grandparents, parents and kids.", "(hard) Many families faced great [[hardship]] during the economic crisis."]}, {"type": "mcq", "id": "b5", "lv": "Semi-controlled", "cls": "m", "title": "B. Which word goes there?", "lead": "Choose the word that sounds natural.", "items": [{"pre": "It takes years of practice to ", "post": " your goals.", "a": "achieve", "o": ["win", "take", "do"], "f": ""}, {"pre": "She made a big ", "post": " to send her son to a good school.", "a": "sacrifice", "o": ["strength", "generation", "influence"], "f": ""}, {"pre": "As a teenager, he was deeply ", "post": " by his music teacher.", "a": "influenced", "o": ["achieved", "sacrificed", "arrived"], "f": ""}, {"pre": "The younger ", "post": " uses social media much more than the older one.", "a": "generation", "o": ["strength", "sacrifice", "hardship"], "f": ""}, {"pre": "Mountain climbers need great physical ", "post": " and a calm mind.", "a": "strength", "o": ["hardship", "generation", "sacrifice"], "f": ""}, {"pre": "After the earthquake, people showed great courage in a time of ", "post": ".", "a": "hardship", "o": ["generation", "influence", "sacrificed"], "f": ""}]}, {"type": "stress", "id": "c5", "lv": "Pronunciation", "cls": "f", "title": "C. Where is the strong beat?", "lead": "Longer words are harder. Click the stressed syllable, then say the word out loud twice.", "items": [{"lab": "achieve", "t": ["a", "chieve"], "a": [1], "syl": 1, "f": "a·<b>CHIEVE</b>"}, {"lab": "sacrifice", "t": ["sac", "ri", "fice"], "a": [0], "syl": 1, "f": "<b>SAC</b>·ri·fice"}, {"lab": "generation", "t": ["gen", "er", "a", "tion"], "a": [2], "syl": 1, "f": "gen·er·<b>A</b>·tion: the stress moves to <i>-a-</i>, unlike <i>generate</i> (<b>GEN</b>·er·ate)."}, {"lab": "influenced", "t": ["in", "flu", "enced"], "a": [0], "syl": 1, "f": "<b>IN</b>·flu·enced"}, {"lab": "opportunity", "t": ["op", "por", "tu", "ni", "ty"], "a": [2], "syl": 1, "f": "op·por·<b>TU</b>·ni·ty"}, {"lab": "community", "t": ["com", "mu", "ni", "ty"], "a": [1], "syl": 1, "f": "com·<b>MU</b>·ni·ty"}]}, {"type": "speak", "id": "d5", "lv": "Fluency", "cls": "f", "title": "D. Speak for one minute", "lead": "Tap each word when you use it.", "words": ["achieve", "sacrifice", "influenced", "generation", "strength", "hardship"], "items": [{"p": "Who has influenced you the most in your life? What did you learn from that person?", "secs": 60}, {"p": "What sacrifices do parents make for their children? Which ones would you make?", "secs": 60}, {"p": "How is your generation different from your parents' generation? Give two examples.", "secs": 60}]}]}, {"title": "History & Society", "short": "History", "intro": "Words you meet in books, documentaries and the news. Watch the sneaky pronunciation: the <b>s</b> in <i>island</i> is silent!", "words": [{"w": "enslaved", "syl": "en·SLAVED", "pt": "escravizado", "def": "forced to work without pay and without freedom"}, {"w": "trial", "syl": "TRI·al", "pt": "julgamento", "def": "a formal process in court to decide if someone is guilty"}, {"w": "island", "syl": "IS·land", "pt": "ilha", "def": "a piece of land with water all around it", "note": "s is silent: EYE-land", "say": "island"}, {"w": "gathering", "syl": "GATH·er·ing", "pt": "encontro, reunião", "def": "a meeting of many people in one place"}, {"w": "path", "syl": "PATH", "pt": "caminho, trilha", "def": "a narrow way or track you follow to get somewhere"}, {"w": "persuade", "syl": "per·SUADE", "pt": "persuadir (= convince)", "def": "to make someone agree or do something by giving good reasons", "say": "persuade"}], "sections": [{"type": "match", "id": "a6", "lv": "Controlled", "cls": "", "title": "A. Definition → word", "lead": "Click the definition, then the word it describes.", "pairs": [["forced to work without pay or freedom", "enslaved"], ["a formal court process where a judge or jury decides if someone is guilty", "trial"], ["a piece of land with water all around it", "island"], ["a meeting of many people in one place", "gathering"], ["a way or track you follow to get somewhere", "path"], ["to make someone agree by giving good reasons", "persuade"]]}, {"type": "gaps", "id": "b6", "lv": "Semi-controlled", "cls": "m", "title": "B. A short history lesson", "lead": "Complete the facts with words from the bank. (<i>persuade</i> and <i>convince</i> are both correct.)", "bank": ["enslaved", "gathering", "island", "path", "persuade", "trial"], "items": ["Before 1865, millions of people in the United States were [[enslaved]]. In 1863, President Lincoln gave a short, famous speech at a large [[gathering]] in Gettysburg, Pennsylvania. Many abolitionists worked for years to [[persuade|convince]] their fellow citizens that slavery was wrong.", "Some enslaved people escaped by following a secret [[path]] north, called the Underground Railroad. Later, millions of immigrants arrived on Ellis [[Island]], near New York City. In 1925, a famous [[trial]] in Tennessee asked whether schools could teach evolution."]}, {"type": "sort", "id": "c6", "lv": "Pronunciation", "cls": "f", "title": "C. How does the <i>-ed</i> sound?", "lead": "The ending <b>-ed</b> has three sounds. Say each word out loud, then choose its ending sound.", "cats": [{"k": "t", "label": "/t/  as in worked"}, {"k": "d", "label": "/d/  as in played"}, {"k": "id", "label": "/ɪd/  as in wanted"}], "items": [{"s": "booked", "a": "t", "f": "After the voiceless sound /k/ we say /t/: <b>bookt</b>."}, {"s": "pleased", "a": "d", "f": "After the voiced sound /z/ we say /d/: <b>pleezd</b>."}, {"s": "committed", "a": "id", "f": "After /t/ we add a whole syllable: <b>com·MIT·id</b>."}, {"s": "influenced", "a": "t", "f": "After /s/ we say /t/: <b>IN·flu·enst</b>."}, {"s": "enslaved", "a": "d", "f": "After /v/ we say /d/: <b>en·SLAYVD</b>."}, {"s": "persuaded", "a": "id", "f": "After /d/ we add a syllable: <b>per·SWAY·did</b>."}, {"s": "reached", "a": "t", "f": "After /tʃ/ we say /t/: <b>reecht</b>."}, {"s": "managed", "a": "d", "f": "After /dʒ/ we say /d/: <b>MAN·ijd</b> (the <i>-ed</i> is not a syllable)."}]}, {"type": "speak", "id": "d6", "lv": "Fluency", "cls": "f", "title": "D. Speak for one minute", "lead": "Tap each word when you use it.", "words": ["enslaved", "trial", "island", "gathering", "path", "persuade"], "items": [{"p": "If you could live on an island for a year, which one would you choose? What would you do there?", "secs": 60}, {"p": "Describe a big family gathering you remember. Who was there, and what happened?", "secs": 60}, {"p": "Think of a time you had to persuade someone. How did you do it? Did it work?", "secs": 60}]}]}, {"title": "Natural Phrases", "short": "Phrases", "intro": "Phrases that make your English sound relaxed and American. The key to sounding natural is rhythm: stress the important words, and say the little words quickly.", "words": [{"w": "keep someone posted", "syl": "keep someone POST·ed", "pt": "manter alguém informado", "def": "to give someone news as things change", "say": "keep someone posted"}, {"w": "get back to", "syl": "get BACK to", "pt": "retornar para alguém", "def": "to answer or call someone later"}, {"w": "hop on a call", "syl": "HOP on a CALL", "pt": "entrar numa chamada rápida", "def": "to join a short phone or video call"}, {"w": "look forward to", "syl": "look FOR·ward to", "pt": "aguardar com ansiedade", "def": "to feel happy about something that will happen"}, {"w": "manage to", "syl": "MAN·age to", "pt": "conseguir (apesar da dificuldade)", "def": "to succeed in doing something difficult"}, {"w": "be supposed to", "syl": "be sup·POSED to", "pt": "era para / deveria", "def": "expected or planned to happen; or a rule or duty", "say": "supposed to"}], "sections": [{"type": "mcq", "id": "a7", "lv": "Controlled", "cls": "", "title": "A. Choose the natural phrase", "lead": "Which choice sounds like real conversation?", "items": [{"pre": "\"Did the plumber fix the sink?\" \"Not yet. He said he'd ", "post": " me tomorrow.\"", "a": "get back to", "o": ["get back at", "get away from", "get over to"], "f": ""}, {"pre": "The movie ", "post": " be a comedy, but nobody laughed.", "a": "was supposed to", "o": ["supposed to", "was suppose to", "was supposing to"], "f": ""}, {"pre": "I'm so busy this week. Can you ", "post": " me posted about the schedule?", "a": "keep", "o": ["hold", "stay", "make"], "f": ""}, {"pre": "I don't have time for a long meeting. Can we just ", "post": " on a quick call?", "a": "hop", "o": ["fall", "hit", "slide"], "f": ""}, {"pre": "Despite the storm, they ", "post": " arrive on time.", "a": "managed to", "o": ["managed", "managed for", "managed at"], "f": ""}, {"pre": "I'm really ", "post": " meeting your family next weekend.", "a": "looking forward to", "o": ["looking forward for", "looking forward at", "looking forward in"], "f": ""}]}, {"type": "stress", "id": "b7", "lv": "Pronunciation", "cls": "f", "title": "B. Sentence rhythm", "lead": "In English, <b>nouns, main verbs, adjectives, adverbs</b> and the particles of phrasal verbs (<i>back, up, out</i>) are stressed. Little words (<i>to, a, the, it, was, be</i>) are quick and weak. Click the <b>stressed words</b>, then say each sentence out loud.", "items": [{"lab": "sentence 1", "t": ["Keep", "me", "posted."], "a": [0, 2], "f": "<b>KEEP</b> me <b>POST</b>ed."}, {"lab": "sentence 2", "t": ["Let's", "hop", "on", "a", "call."], "a": [1, 4], "f": "Let's <b>HOP</b> on a <b>CALL</b>."}, {"lab": "sentence 3", "t": ["I'm", "looki function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function norm(s){return s.toLowerCase().replace(/[\u2018\u2019\u02bc`]/g,"'").replace(/[.,!?;:]/g,'').replace(/\s+/g,' ').trim();}
function hl(s){return s.replace(/\{\{(.+?)\}\}/g,'<span class="hl">$1</span>');}
function header(sec,lv,cls,title,lead){
  const h=document.createElement('div');h.className='sech';
  h.innerHTML='<span class="lv '+cls+'">'+lv+'</span><h3>'+title+'</h3>';sec.appendChild(h);
  if(lead){const p=document.createElement('p');p.className='lead';p.style.margin='0 0 10px';p.innerHTML=hl(lead);sec.appendChild(p);}
}
function barFor(sec,onCheck,onReset,checkLabel){
  const b=document.createElement('div');b.className='bar';
  b.innerHTML='<button class="btn main">'+(checkLabel||'Check Answers')+'</button><button class="btn ghost">Reset</button><span class="score"></span>';
  const [c,r]=b.querySelectorAll('button');c.onclick=onCheck;r.onclick=onReset;sec.appendChild(b);
  return {score:b.querySelector('.score'),check:c};
}
function setScore(bar,t){bar.score.textContent=t;bar.score.classList.add('show');}
function bankHtml(list){return '<div class="bank"><b>Word bank</b>'+list.slice().sort((a,b)=>a.localeCompare(b)).map(x=>'<span class="bk">'+x+'</span>').join('')+'</div>';}

/* ---------- MATCH ---------- */
function secMatch(id,cfg){
  const sec=document.getElementById(id);
  function build(){
    sec.innerHTML='';header(sec,cfg.lv,cfg.cls,cfg.title,cfg.lead);
    const badge=document.createElement('div');badge.className='badge';sec.appendChild(badge);
    const g=document.createElement('div');g.className='mgrid';g.innerHTML='<div class="mcol"></div><div class="mcol"></div>';sec.appendChild(g);
    const [L,R]=g.children;let sel=null,done=0;const n=cfg.pairs.length;badge.textContent='Correct: 0 / '+n;
    const idx=cfg.pairs.map((_,i)=>i);
    function pick(b,side){
      if(b.classList.contains('done'))return;
      if(sel&&sel.side===side){sel.el.classList.remove('sel');sel=null;}
      if(!sel){b.classList.add('sel');sel={el:b,side};return;}
      const a=sel.el;a.classList.remove('sel');
      if(a.dataset.k===b.dataset.k){[a,b].forEach(x=>x.classList.add('done'));done++;badge.textContent='Correct: '+done+' / '+n;}
      else{[a,b].forEach(x=>{x.classList.add('shake');setTimeout(()=>x.classList.remove('shake'),400);});}
      sel=null;
    }
    shuffle(idx).forEach(i=>{const b=document.createElement('button');b.className='mc';b.dataset.k=i;b.innerHTML=hl(cfg.pairs[i][0]);b.onclick=()=>pick(b,'L');L.appendChild(b);});
    shuffle(idx).forEach(i=>{const b=document.createElement('button');b.className='mc pt';b.dataset.k=i;b.innerHTML=hl(cfg.pairs[i][1]);b.onclick=()=>pick(b,'R');R.appendChild(b);});
    const bar=document.createElement('div');bar.className='bar';bar.innerHTML='<button class="btn ghost">Reset</button>';bar.firstChild.onclick=build;sec.appendChild(bar);
  }
  build();
}
/* ---------- GAPS ---------- */
function secGaps(id,cfg){
  const sec=document.getElementById(id);
  function build(){
    sec.innerHTML='';header(sec,cfg.lv,cfg.cls,cfg.title,cfg.lead);
    if(cfg.bank){sec.insertAdjacentHTML('beforeend',bankHtml(cfg.bank));}
    const wrap=document.createElement('div');sec.appendChild(wrap);
    const all=[];
    cfg.items.forEach((t,i)=>{
      const it=document.createElement('div');it.className='item';
      let cue='';let txt=t;const m=txt.match(/^\((.+?)\)\s+/);
      if(m&&cfg.cues){cue='<span class="cue">'+m[1]+'</span>';txt=txt.slice(m[0].length);}
      const gaps=[];
      txt=hl(txt).replace(/\[\[(.+?)\]\]((?:\s?\([^)]*\))?[.,!?;:]*)/g,(mm,a,after)=>{
        const alts=a.split('|');gaps.push(alts);const w=Math.max(70,Math.max(...alts.map(x=>x.length))*10+26);
        return '<span class="nw"><input class="ti" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" style="width:'+w+'px" data-g="'+(gaps.length-1)+'">'+after+'</span>';
      });
      it.innerHTML='<div class="num">'+(i+1)+'</div><div class="stmt">'+cue+txt+'</div><div class="fn"></div>';
      it._gaps=gaps;wrap.appendChild(it);all.push(it);
    });
    const bar=barFor(sec,()=>{
      let ok=0,tot=0;
      all.forEach(it=>{
        const bad=[];
        it.querySelectorAll('.ti').forEach(inp=>{
          const alts=it._gaps[+inp.dataset.g];tot++;
          const r=alts.map(norm).includes(norm(inp.value));
          inp.classList.remove('right','wrong');inp.classList.add(r?'right':'wrong');
          if(r)ok++;else bad.push(alts[0]);
        });
        it.classList.remove('ok','bad');it.classList.add(bad.length?'bad':'ok');
        const f=it.querySelector('.fn');
        if(bad.length){f.textContent='Correct: '+it._gaps.map(a=>a[0]).join('  /  ');f.classList.add('show');}else f.classList.remove('show');
      });
      setScore(bar,'Score: '+ok+' / '+tot);
    },build);
  }
  build();
}
/* ---------- MCQ ---------- */
function secMcq(id,cfg){
  const sec=document.getElementById(id);
  function build(){
    sec.innerHTML='';header(sec,cfg.lv,cfg.cls,cfg.title,cfg.lead);
    const wrap=document.createElement('div');sec.appendChild(wrap);const pick={};const els=[];
    cfg.items.forEach((q,i)=>{
      const it=document.createElement('div');it.className='item';
      const full=!!q.full;
      const stmt=full?'<div class="stmt" style="line-height:1.6">'+hl(q.q)+'</div>':'<div class="stmt">'+hl(q.pre)+'<span class="slot">&nbsp;</span>'+hl(q.post)+'</div>';
      it.innerHTML='<div class="num">'+(i+1)+'</div>'+stmt+'<div class="opts'+(full?' one':'')+'"></div><div class="fn"></div>';
      const slot=it.querySelector('.slot'),opts=it.querySelector('.opts');
      shuffle([q.a].concat(q.o)).forEach((o,k)=>{
        const b=document.createElement('button');b.className='opt';b.dataset.v=o;b.innerHTML='<span class="l">'+'abcd'[k]+')</span>'+hl(o);
        b.onclick=()=>{if(it.dataset.done)return;opts.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel2'));b.classList.add('sel2');if(slot)slot.textContent=o;pick[i]=o;};
        opts.appendChild(b);
      });
      wrap.appendChild(it);els.push(it);
    });
    const bar=barFor(sec,()=>{
      let ok=0;
      els.forEach((it,i)=>{
        it.dataset.done=1;const q=cfg.items[i],pk=pick[i],r=pk===q.a;if(r)ok++;
        it.classList.remove('ok','bad');it.classList.add(r?'ok':'bad');
        it.querySelectorAll('.opt').forEach(b=>{b.classList.remove('sel2');
          if(b.dataset.v===q.a)b.classList.add('right');else if(b.dataset.v===pk)b.classList.add('wrong');});
        if(q.f){const f=it.querySelector('.fn');f.innerHTML=q.f;f.classList.add('show');f.classList.toggle('good',r);}
      });
      setScore(bar,'Score: '+ok+' / '+cfg.items.length);
    },build);
  }
  build();
}

        it.querySelectorAll('.opt').forEach(b=>{b.classList.remove('sel2');
          if(b.dataset.v===q.a)b.classList.add('right');else if(b.dataset.v===pk)b.classList.add('wrong');});
        if(q.f){const f=it.querySelector('.fn');f.innerHTML=q.f;f.classList.add('show');f.classList.toggle('good',r);}
      });
      setScore(bar,'Score: '+ok+' / '+cfg.items.length);
    },build);
  }
  build();
}
/* ---------- ORDER ---------- */
function secOrder(id,cfg){
  const sec=document.getElementById(id);
  function build(){
    sec.innerHTML='';header(sec,cfg.lv,cfg.cls,cfg.title,cfg.lead);
    const wrap=document.createElement('div');sec.appendChild(wrap);const els=[];
    cfg.items.forEach((q,i)=>{
      const it=document.createElement('div');it.className='item';
      it.innerHTML='<div class="num">'+(i+1)+(q.ctx?' &middot; '+q.ctx:'')+'</div><div class="ans"></div><div class="achips"></div><div class="fn"></div>';
      const ans=it.querySelector('.ans'),pool=it.querySelector('.achips');
      const words=q.a.split(' ');it._chosen=[];
      shuffle(words.map((w,k)=>({w,k}))).forEach(o=>{
        const b=document.createElement('button');b.className='tk';b.textContent=o.w;
        b.onclick=()=>{if(it.dataset.done)return;b.classList.add('used');const c=document.createElement('button');c.className='tk';c.textContent=o.w;
          c.onclick=()=>{if(it.dataset.done)return;c.remove();b.classList.remove('used');};ans.appendChild(c);};
        pool.appendChild(b);
      });
      wrap.appendChild(it);els.push(it);
    });
    const bar=barFor(sec,()=>{
      let ok=0;
      els.forEach((it,i)=>{
        const q=cfg.items[i];it.dataset.done=1;
        const got=norm([...it.querySelectorAll('.ans .tk')].map(x=>x.textContent).join(' '));
        const r=[q.a].concat(q.alts||[]).map(norm).includes(got);if(r)ok++;
        it.classList.remove('ok','bad');it.classList.add(r?'ok':'bad');
        const f=it.querySelector('.fn');if(!r){f.textContent='Model: '+q.a;f.classList.add('show');f.classList.remove('good');}else f.classList.remove('show');
      });
      setScore(bar,'Score: '+ok+' / '+cfg.items.length);
    },build);
  }
  build();
}
/* ---------- STRESS (click stressed syllables / words) ---------- */
function secStress(id,cfg){
  const sec=document.getElementById(id);
  function build(){
    sec.innerHTML='';header(sec,cfg.lv,cfg.cls,cfg.title,cfg.lead);
    const wrap=document.createElement('div');sec.appendChild(wrap);const els=[];
    cfg.items.forEach((q,i)=>{
      const it=document.createElement('div');it.className='item';
      it.innerHTML='<div class="num">'+(i+1)+'</div><div class="wl">'+(q.lab||'')+'</div><div class="sy'+(q.syl?' syl':'')+'"></div><div class="fn"></div>';
      const box=it.querySelector('.sy');
      q.t.forEach((tk,k)=>{const b=document.createElement('button');b.className='tk';b.dataset.k=k;b.textContent=tk;
        b.onclick=()=>{if(it.dataset.done)return;b.classList.toggle('sel2');};box.appendChild(b);});
      wrap.appendChild(it);els.push(it);
    });
    const bar=barFor(sec,()=>{
      let ok=0;
      els.forEach((it,i)=>{
        const q=cfg.items[i];it.dataset.done=1;let all=true;
        it.querySelectorAll('.tk').forEach(b=>{
          const k=+b.dataset.k,should=q.a.includes(k),on=b.classList.contains('sel2');
          b.classList.remove('sel2');
          if(should&&on)b.classList.add('right');else if(should&&!on){b.classList.add('miss');all=false;}else if(!should&&on){b.classList.add('wrong');all=false;}
        });
        if(all)ok++;
        it.classList.remove('ok','bad');it.classList.add(all?'ok':'bad');
        if(q.f){const f=it.querySelector('.fn');f.innerHTML=q.f;f.classList.add('show');f.classList.toggle('good',all);}
      });
      setScore(bar,'Score: '+ok+' / '+cfg.items.length);
    },build);
  }
  build();
}
/* ---------- WRITE ---------- */
function secWrite(id,cfg){
  const sec=document.getElementById(id);
  sec.innerHTML='';header(sec,cfg.lv,cfg.cls,cfg.title,cfg.lead);
  cfg.items.forEach((q,i)=>{
    const it=document.createElement('div');it.className='item';
    it.innerHTML='<div class="num">'+(i+1)+'</div><div class="stmt" style="line-height:1.6">'+hl(q.p)+'</div><textarea placeholder="Write or say your answer. Start with: '+q.start.replace(/"/g,'&quot;')+'"></textarea><div class="bar" style="margin:8px 0 0"><button class="btn ghost" style="padding:7px 16px;font-size:.82rem">Show a model answer</button></div><div class="model">'+hl(q.model)+'</div>';
    const btn=it.querySelector('button'),mod=it.querySelector('.model');btn.onclick=()=>{mod.classList.toggle('show');btn.textContent=mod.classList.contains('show')?'Hide the model answer':'Show a model answer';};
    sec.appendChild(it);
  });
}
/* ---------- TIMER ---------- */
function mkTimer(secs,onEnd){
  const el=document.createElement('span');el.className='timer';
  el.innerHTML='<span class="t">'+fmt(secs)+'</span><button class="btn main" style="padding:8px 18px">Start</button>';
  const t=el.querySelector('.t'),b=el.querySelector('button');let left=secs,iv=null;
  function fmt(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
  b.onclick=()=>{
    if(iv){clearInterval(iv);iv=null;left=secs;t.textContent=fmt(left);t.classList.remove('low');b.textContent='Start';return;}
    left=secs;b.textContent='Stop';t.textContent=fmt(left);t.classList.remove('low');
    iv=setInterval(()=>{left--;t.textContent=fmt(left);if(left<=10)t.classList.add('low');
      if(left<=0){clearInterval(iv);iv=null;t.textContent='Time!';b.textContent='Again';left=secs;if(onEnd)onEnd();}},1000);
  };
  return el;
}
/* ---------- SPEAK ---------- */
function secSpeak(id,cfg){
  const sec=document.getElementById(id);
  sec.innerHTML='';header(sec,cfg.lv,cfg.cls,cfg.title,cfg.lead);
  if(cfg.words){
    const c=document.createElement('div');c.className='uchips';
    cfg.words.forEach(w=>{const b=document.createElement('button');b.className='uc';b.textContent=w;b.onclick=()=>b.classList.toggle('on');c.appendChild(b);});
    sec.appendChild(c);
  }
  cfg.items.forEach((q,i)=>{
    const d=document.createElement('div');d.className='speak';
    d.innerHTML='<div class="num" style="font-size:.75rem;font-weight:700;color:var(--blue);margin-bottom:4px">'+(i+1)+' &middot; '+(q.secs||60)+' seconds</div><p class="p">'+hl(q.p)+'</p>';
    d.appendChild(mkTimer(q.secs||60));sec.appendChild(d);
  });
}
/* ---------- ROULETTE ---------- */
function secRoulette(id,cfg){
  const sec=document.getElementById(id);
  sec.innerHTML='';header(sec,cfg.lv,cfg.cls,cfg.title,cfg.lead);
  const rw=document.createElement('div');rw.className='rw';sec.appendChild(rw);
  const bar=document.createElement('div');bar.className='bar';
  bar.innerHTML='<button class="btn main">Spin 3 words</button>';sec.appendChild(bar);
  const sp=document.createElement('div');sp.className='speak';sp.innerHTML='<p class="p">Tell a short story or give a real example that uses <b>all three words</b>. Then spin again and make it harder: connect the new words to your last story.</p>';
  sp.appendChild(mkTimer(cfg.secs||45));sec.appendChild(sp);
  bar.firstChild.onclick=()=>{rw.innerHTML='';shuffle(D.all).slice(0,3).forEach(o=>{const b=document.createElement('span');b.className='uc';b.innerHTML=o.w+'<small>'+o.pt+'</small>';rw.appendChild(b);});};
  bar.firstChild.onclick();
}
/* ---------- CHECKLIST ---------- */
function secCheck(id,cfg){
  const sec=document.getElementById(id);
  sec.innerHTML='';header(sec,cfg.lv,cfg.cls,cfg.title,cfg.lead);
  const total=D.all.length;
  const info=document.createElement('div');info.className='badge';info.textContent='I can use 0 / '+total+' with confidence';sec.appendChild(info);
  const pg=document.createElement('div');pg.className='prog';pg.innerHTML='<i></i>';sec.appendChild(pg);
  const chips=[];let known=0;
  D.pages.forEach(p=>{
    const h=document.createElement('div');h.className='sethd';h.textContent=p.title;sec.appendChild(h);
    const c=document.createElement('div');c.className='uchips';
    p.words.forEach(w=>{const b=document.createElement('button');b.className='uc';b.textContent=w.w;
      b.onclick=()=>{b.classList.toggle('know');known=document.querySelectorAll('#'+id+' .uc.know').length;info.textContent='I can use '+known+' / '+total+' with confidence';pg.firstChild.style.width=(known/total*100)+'%';};
      chips.push(b);c.appendChild(b);});
    sec.appendChild(c);
  });
  const bar=document.createElement('div');bar.className='bar';bar.innerHTML='<button class="btn main">Highlight words to review</button><button class="btn ghost">Reset</button>';sec.appendChild(bar);
  const [a,r]=bar.querySelectorAll('button');
  a.onclick=()=>chips.forEach(b=>{b.classList.toggle('rev',!b.classList.contains('know'));});
  r.onclick=()=>{chips.forEach(b=>b.classList.remove('know','rev'));info.textContent='I can use 0 / '+total+' with confidence';pg.firstChild.style.width='0';};
}
const RUN={match:secMatch,gaps:secGaps,mcq:secMcq,sort:secSort,order:secOrder,stress:secStress,write:secWrite,speak:secSpeak,roulette:secRoulette,check:secCheck};

/* ---------- BUILD PAGES ---------- */
const stepsEl=document.getElementById('steps'),wrapEl=document.getElementById('wrap');
function say(t){try{const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}}
const canSpeak=('speechSynthesis' in window);
D.pages.forEach((p,pi)=>{
  stepsEl.insertAdjacentHTML('beforeend','<div class="step"><div class="n">'+(pi+1)+'</div><span class="t">'+p.short+'</span></div>');
  const s=document.createElement('section');s.className='page';s.id='p'+(pi+1);
  let h='<div class="pg-top"><h2>'+p.title+'</h2><span class="tagp">'+p.words.length+' words</span></div><p class="lead">'+p.intro+'</p><div class="wgrid">';
  p.words.forEach((w,wi)=>{
    h+='<div class="wc" id="wc'+pi+'_'+wi+'"><div class="w">'+w.w+'</div><div class="syl">'+w.syl+(w.note?'<i>'+w.note+'</i>':'')+'</div><div class="df">'+w.def+'</div><div class="pt">'+w.pt+'</div><div class="row">'+(canSpeak?'<button data-say="'+(w.say||w.w).replace(/"/g,'')+'">&#128266; Hear it</button>':'')+'<button data-pt="1">PT</button></div></div>';
  });
  h+='</div><p class="lead" style="margin:6px 0 0"><small>Say each word out loud <b>three times</b>: slowly, normally, then fast. CAPITAL letters = the strong beat.</small></p>';
  p.sections.forEach(sc=>{h+='<div class="sec" id="'+sc.id+'"></div>';});
  s.innerHTML=h;wrapEl.appendChild(s);
  s.querySelectorAll('.wc').forEach(c=>{
    c.querySelectorAll('button').forEach(b=>{b.onclick=()=>{if(b.dataset.say)say(b.dataset.say);else c.classList.toggle('open');};});
  });
});
D.pages.forEach(p=>p.sections.forEach(sc=>RUN[sc.type](sc.id,sc)));

let cur=0;const stepEls=document.querySelectorAll('.step'),pages=D.pages.map((_,i)=>'p'+(i+1));
const back=document.getElementById('back'),next=document.getElementById('next');
function show(){
  pages.forEach((id,i)=>document.getElementById(id).classList.toggle('show',i===cur));
  stepEls.forEach((s,i)=>{s.classList.toggle('active',i===cur);s.classList.toggle('done',i<cur);});
  stepEls[cur].scrollIntoView({block:'nearest',inline:'center'});
  back.disabled=cur===0;next.disabled=cur===pages.length-1;
  window.scrollTo({top:0,behavior:'smooth'});
}
next.onclick=()=>{if(cur<pages.length-1){cur++;show();}};
back.onclick=()=>{if(cur>0){cur--;show();}};
show();
</script>
