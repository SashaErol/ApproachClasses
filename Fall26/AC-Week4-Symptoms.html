<title>Week 4 · Picture Match: Symptoms</title>
<style>
:root{--navy:#1f3a5f;--gold:#e0a526;--green:#2e8b57;--red:#c0392b;--bg:#f6f3ec;--ink:#1d2433}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.logo{font-weight:800;letter-spacing:.08em;color:var(--navy);font-size:13px}
.tag{margin-left:auto;font-size:12px;background:var(--navy);color:#fff;padding:3px 10px;border-radius:99px}
h1{margin:6px 0 4px;font-size:26px;color:var(--navy)}
.sub{margin:0 0 14px;color:#445;font-size:15px}
.words{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{display:flex;align-items:center;gap:6px;background:#fff;border:2px solid var(--navy);color:var(--navy);border-radius:12px;padding:8px 12px;font-size:17px;font-weight:700;cursor:pointer}
.chip.sel{background:var(--gold);border-color:var(--gold);color:#222}
.chip.done{background:var(--green);border-color:var(--green);color:#fff;cursor:default}
.chip .sp{font-size:15px;background:none;border:0;cursor:pointer;padding:0 2px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}}
.card{position:relative;background:#fff;border:3px solid transparent;border-radius:14px;overflow:hidden;cursor:pointer;box-shadow:0 2px 6px #0002}
.card img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.card .n{position:absolute;top:6px;left:6px;background:var(--navy);color:#fff;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px}
.card .cap{padding:8px;text-align:center;min-height:44px;font-weight:700;font-size:16px;color:var(--green)}
.card.sel{border-color:var(--gold)}
.card.done{border-color:var(--green);cursor:default}
.card.shake{animation:sh .35s;border-color:var(--red)}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.cap small{display:block;color:#555;font-weight:500;font-size:13px;margin-top:2px}
.bar{display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap}
button.b{background:var(--navy);color:#fff;border:0;border-radius:10px;padding:10px 18px;font-size:16px;font-weight:700;cursor:pointer}
#msg{font-weight:700;color:var(--navy)}
#fin{display:none;margin-top:14px;background:#fff;border-left:6px solid var(--green);padding:12px 16px;border-radius:10px}
.say{margin-top:14px;background:#fff7e0;border:2px dashed var(--gold);border-radius:12px;padding:10px 14px;font-size:15px}
</style></head><body><div class="wrap">

let voice=null;
function pick(){const v=speechSynthesis.getVoices().filter(x=>/en[-_]US/i.test(x.lang));
 voice=v.find(x=>/natural|premium|enhanced|neural|samantha|google us/i.test(x.name))||v[0]||null}
try{pick();speechSynthesis.onvoiceschanged=pick}catch(e){}
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.85;if(voice)u.voice=voice;speechSynthesis.speak(u)}catch(e){}}
function sh(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
let selP=null,selW=null,done,tries;
function render(){
 const g=document.getElementById('grid'),w=document.getElementById('words');
 g.innerHTML='';w.innerHTML='';
 D.forEach((d,i)=>{const c=document.createElement('div');c.className='card'+(done[d.id]?' done':'')+(selP===d.id?' sel':'');c.dataset.id=d.id;
  c.innerHTML=`<span class="n">${i+1}</span><img src="${d.img}" alt=""><div class="cap">${done[d.id]?d.word+'<small>'+d.sent+'</small>':'&nbsp;'}</div>`;
  c.onclick=()=>{if(done[d.id])return;selP=selP===d.id?null:d.id;try{}catch(e){}check()};g.appendChild(c)});
 order.forEach(d=>{const c=document.createElement('div');c.className='chip'+(done[d.id]?' done':'')+(selW===d.id?' sel':'');c.dataset.id=d.id;
  c.innerHTML=`<span>${d.word}</span><button class="sp" aria-label="listen">🔊</button>`;
  c.querySelector('.sp').onclick=e=>{e.stopPropagation();say(d.word)};
  c.onclick=()=>{if(done[d.id])return;selW=selW===d.id?null:d.id;say(d.word);check()};w.appendChild(c)});
 const n=Object.keys(done).length;document.getElementById('msg').textContent='Matched: '+n+' / 6';
 const f=document.getElementById('fin');
 if(n==6){f.style.display='block';f.innerHTML='🎉 <b>Great job!</b> '+(tries==0?'Perfect — no mistakes!':'Mistakes: '+tries+'. Try again for a perfect score.')+'<br>Now say all 6 sentences with a partner.'}else f.style.display='none';
}
function check(){
 if(selP&&selW){
  if(selP===selW){done[selP]=1;say(D.find(d=>d.id===selP).sent);selP=selW=null;render()}
  else{tries++;const el=document.querySelector('.card[data-id="'+selP+'"]');selP=selW=null;render();const e2=document.querySelector('.card[data-id="'+el.dataset.id+'"]');e2.classList.add('shake');setTimeout(()=>e2.classList.remove('shake'),400)}
 }else render();
}
let order;
function init(){done={};tries=0;selP=selW=null;order=sh(D);render()}
document.getElementById('reset').onclick=init;init();
</script></body></html>
