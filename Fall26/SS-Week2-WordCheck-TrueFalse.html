<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Week 1 Word Check · True or False · Approach ISC</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--dark:#0b1827;--navy:#0e2a47;--red:#9d251a;--blue:#418abd;--gray:#e8e8e8;--gold:#9a7c46;--muted:#5b6776;--ok:#1f7a4d;--okbg:#e6f4ec;--badbg:#fbe9e7;--tint:rgba(65,138,189,.13);--font:'Montserrat',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
*{box-sizing:border-box}body{margin:0;font-family:var(--font);color:var(--dark);background:#fff;-webkit-font-smoothing:antialiased}
header{padding:14px 22px 12px;border-bottom:2px solid var(--gold);display:flex;align-items:center;gap:12px}header img{height:40px}
.htext b{display:block;font-size:14px;color:var(--navy)}.htext span{font-size:12px;color:var(--muted);font-weight:500}
.steps{display:flex;gap:6px;max-width:760px;margin:18px auto 0;padding:0 22px}.steps i{flex:1;height:5px;border-radius:3px;background:var(--gray)}.steps i.done{background:var(--blue)}.steps i.on{background:var(--navy)}
main{max-width:760px;margin:0 auto;padding:22px 22px 60px}
.tag{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--blue);margin:0 0 12px}
.q{font-size:clamp(26px,6vw,38px);line-height:1.2;color:var(--navy);margin:0 0 12px}.lead{font-size:17px;line-height:1.55;margin:0 0 16px}
.bar{height:6px;background:var(--gray);border-radius:3px;margin-bottom:18px}.bar span{display:block;height:100%;background:var(--gold);border-radius:3px;transition:width .3s}
.qcard{background:#f9f6f0;border-left:4px solid var(--gold);border-radius:10px;padding:18px 20px;margin-bottom:18px}
.kind{margin:0 0 8px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--red)}
.st{margin:0;font-size:clamp(20px,4.4vw,26px);line-height:1.4;font-weight:600;color:var(--navy)}.st b{background:var(--tint);padding:0 6px;border-radius:5px;box-shadow:inset 0 -2px 0 var(--red)}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{font:inherit;font-weight:700;font-size:20px;padding:18px;border:2px solid var(--navy);border-radius:14px;background:#fff;color:var(--navy);cursor:pointer}
.opt:hover:not(:disabled){background:var(--tint)}.opt:disabled{cursor:default}.opt.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}.opt.bad{background:var(--badbg);border-color:var(--red);color:var(--red)}
.fb{margin-top:16px;padding:14px 16px;border-radius:12px;font-size:16px;line-height:1.5}.fb.good{background:var(--okbg)}.fb.nope{background:var(--badbg)}
.def{margin:10px 0 8px;font-size:17px;font-weight:500}.def .w{font-weight:700;color:var(--navy);font-size:19px}.def i{color:var(--muted);font-size:13px}
.exm{margin:0;background:#fff;border-left:3px solid var(--gold);padding:8px 12px;font-style:italic;font-size:15.5px}
.ab{border:1.5px solid var(--navy);background:#fff;color:var(--navy);border-radius:999px;cursor:pointer;font:inherit}.ab.sm{padding:3px 9px;font-size:14px;margin-right:6px;font-style:normal}.ab.playing{background:var(--blue);color:#fff}
.nav,.nav2{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap}
.btn{border:0;border-radius:999px;padding:14px 26px;font:inherit;font-size:16px;font-weight:700;background:var(--navy);color:#fff;cursor:pointer}.btn.alt{background:#fff;color:var(--navy);border:2px solid var(--navy)}
.box{background:#f9f6f0;border:1px solid #efe6d4;border-radius:12px;padding:14px 16px;margin:0 0 14px}.box h3{margin:0 0 8px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}.box p{margin:0}
.chip{display:inline-block;background:var(--tint);border-radius:999px;padding:4px 12px;font-weight:600;font-size:14px;color:var(--navy);margin:2px}
#flt{width:100%;font:inherit;font-size:16px;padding:12px 16px;border:2px solid var(--gray);border-radius:999px;margin-bottom:12px}#flt:focus{outline:none;border-color:var(--blue)}
.ents{display:grid;gap:12px}.ent{border:1px solid var(--gray);border-radius:12px;padding:12px 16px}
.en{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.en h3{margin:0;font-size:21px;color:var(--navy)}.pos{font-size:13px;font-style:italic;color:var(--muted)}
.df{margin:6px 0 8px;font-size:16px;line-height:1.45;font-weight:500}
.trs p{margin:4px 0;font-size:16px;font-weight:600;color:var(--navy)}.lg{display:inline-block;min-width:32px;margin-right:8px;font-size:11px;font-weight:700;color:#fff;background:var(--red);border-radius:5px;padding:2px 6px;text-align:center}
</style></head><body>

 ['self-conscious','A <b>self-conscious</b> person feels proud because everyone is looking at them.',false],
 ['fluency','<b>Fluency</b> means you never make a mistake when you speak.',false],
 ['critical thinking','<b>Critical thinking</b> means asking questions about information before you believe it.',true],
 ['misinformation','<b>Misinformation</b> is false or misleading information, but only when someone spreads it on purpose.',false],
 ['deepfake','A <b>deepfake</b> is a fake video or audio made with AI that looks or sounds real.',true],
 ['reliable','A <b>reliable</b> source is one you can trust to be accurate and honest.',true]
];
const $=s=>document.querySelector(s);
const shuf=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
let deck=[], i=0, score=0, missed=[], answered=false, stage=0;
let voice=null;
function pickVoice(){ if(!('speechSynthesis' in window))return; const vs=speechSynthesis.getVoices().filter(v=>/^en[-_]US/i.test(v.lang)); const pref=['Samantha','Ava','Allison','Google US English','Microsoft Aria','Microsoft Jenny','Alex','Zira']; voice=pref.map(n=>vs.find(v=>v.name.includes(n))).find(Boolean)||vs[0]||null; }
if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
function speak(t,btn){ if(!('speechSynthesis' in window))return; speechSynthesis.cancel(); document.querySelectorAll('.ab.playing').forEach(b=>b.classList.remove('playing')); const u=new SpeechSynthesisUtterance(t); u.lang='en-US'; if(voice)u.voice=voice; u.rate=.92; if(btn){btn.classList.add('playing'); u.onend=u.onerror=()=>btn.classList.remove('playing');} speechSynthesis.speak(u); }
document.addEventListener('click',e=>{const b=e.target.closest('[data-say]'); if(b) speak(b.dataset.say,b);});
const att=s=>s.replace(/"/g,'&quot;');
function steps(){ $('#steps').innerHTML=[0,1,2].map(n=>`<i class="${n<stage?'done':n===stage?'on':''}"></i>`).join(''); }
function start(list){ deck=shuf(list||Q); i=0; score=0; missed=[]; stage=0; showQ(); }
function showQ(){
  steps(); answered=false; const [k,st]=deck[i]; const d=D[k];
  $('#app').innerHTML=`<p class="tag">Week 1 · Word check · ${i+1} of ${deck.length}</p>
  <div class="bar"><span style="width:${i/deck.length*100}%"></span></div>
  <div class="qcard"><p class="kind">${d.pp?'Power phrase':'Word'}</p><p class="st">${st}</p></div>
  <div class="tf"><button class="opt" data-a="1">✔ True</button><button class="opt" data-a="0">✘ False</button></div>
  <div id="fb" aria-live="polite"></div>`;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(b));
}
function answer(b){
  if(answered) return; answered=true; const [k,st,ans]=deck[i]; const d=D[k]; const pick=b.dataset.a==='1'; const ok=pick===ans;
  if(ok) score++; else missed.push(deck[i]);
  document.querySelectorAll('.opt').forEach(x=>{ const v=x.dataset.a==='1'; if(v===ans) x.classList.add('ok'); else if(x===b) x.classList.add('bad'); x.disabled=true; });
  const say=(d.say||k);
  $('#fb').innerHTML=`<div class="fb ${ok?'good':'nope'}"><b>${ok?'Yes!':'Not quite.'}</b> This statement is <b>${ans?'true':'false'}</b>.
   <p class="def"><span class="w">${k}</span> <i>${d.pos}</i> <button class="ab sm" data-say="${att(say)}" aria-label="Hear ${k}">🔊</button><br>${d.def}</p>
   <p class="exm"><button class="ab sm" data-say="${att(d.ex)}" aria-label="Hear the example">🔊</button> “${d.ex}”</p></div>
   <div class="nav"><button class="btn" id="nx">${i<deck.length-1?'Next →':'See my score →'}</button></div>`;
  $('#nx').onclick=()=>{ if(i<deck.length-1){ i++; showQ(); } else results(); };
  $('#nx').focus({preventScroll:true});
}
function results(){
  stage=1; steps(); const n=deck.length; const pct=Math.round(score/n*100);
  const msg=pct===100?'Perfect! Your vocabulary is on fire.':pct>=75?'Great work!':pct>=50?'Good start. Review the words you missed.':'These words are new, and that’s OK. Try again!';
  $('#app').innerHTML=`<p class="tag">Your result</p><h1 class="q">${score} / ${n}</h1><p class="lead">${msg}</p>
  ${missed.length?`<div class="box"><h3>Words to review</h3><p>${missed.map(m=>`<span class="chip">${m[0]}</span>`).join(' ')}</p></div>`:''}
  <div class="nav2">${missed.length?`<button class="btn alt" id="again">Try the ones I missed</button>`:''}<button class="btn alt" id="all">Play all again</button><button class="btn" id="tr">Translations →</button></div>`;
  if($('#again')) $('#again').onclick=()=>start(missed.map(m=>m));
  $('#all').onclick=()=>start(); $('#tr').onclick=translations;
}
function translations(){
  stage=2; steps();
  const keys=Q.map(q=>q[0]);
  $('#app').innerHTML=`<p class="tag">Word bank · all 23</p><h1 class="q">Spanish · Portuguese · Turkish</h1>
  <p class="lead">Translations help you remember, but a word can have more than one meaning. Use them with the explanations in English.</p>
  <input id="flt" type="search" placeholder="Search a word…" aria-label="Search">
  <div class="ents" id="list">${keys.map(k=>{const d=D[k],t=TR[k]; return `<article class="ent"><div class="en"><h3>${k}</h3><span class="pos">${d.pos}</span><button class="ab sm" data-say="${att(d.say||k)}" aria-label="Hear ${k}">🔊</button></div>
   <p class="df">${d.def}</p>
   <div class="trs"><p><span class="lg">ES</span>${t[0]}</p><p><span class="lg">PT</span>${t[1]}</p><p><span class="lg">TR</span>${t[2]}</p></div></article>`;}).join('')}</div>
  <div class="nav2"><button class="btn alt" id="back">← Back to results</button></div>`;
  $('#back').onclick=results;
  $('#flt').oninput=e=>{const q=e.target.value.toLowerCase().trim(); document.querySelectorAll('#list .ent').forEach(x=>x.style.display=(!q||x.textContent.toLowerCase().includes(q))?'':'none');};
  window.scrollTo({top:0});
}
start();

</script></body></html>
