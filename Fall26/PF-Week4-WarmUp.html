<style>/* Approach International Student Center brand: Dark Blue, Blue, Red, Light Blue, Gray, White. */
/* Layout: brand band, then one centered stage that swaps between instructions, the timed question and the results with a concept review. Big type for a classroom projector. */
:root {
  --bg: #E7E7E7; --surface: #FFFFFF; --ink: #0C1927; --ink-soft: #44546A; --line: #C9CDD2;
  --navy: #10294A; --navy-ink: #FFFFFF; --red: #9C2519; --red-ink: #FFFFFF; --accent: #9C2519;
  --bar: #4189BF; --track: #E3EAF1; --hl-bg: #CFE3F3; --hl-ink: #0C1927; --focus: #1D6FB8;
  --good: #1F7A4D; --warn: #A65F00; --crit: #B3261E; --field: #F6F8FA;
  --font-display: "Montserrat", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1927; --surface: #10294A; --ink: #F1F4F7; --ink-soft: #AFBCCB; --line: #2A486B;
    --navy: #4189BF; --navy-ink: #0C1927; --red: #B3382B; --red-ink: #FFFFFF; --accent: #F08A7E;
    --bar: #6FA8D8; --track: #183A63; --hl-bg: #1F4F7C; --hl-ink: #EAF3FB; --focus: #8CC0EE;
    --good: #5CC48D; --warn: #F2B24C; --crit: #FF8A80; --field: #0C1F38;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1927; --surface: #10294A; --ink: #F1F4F7; --ink-soft: #AFBCCB; --line: #2A486B;
  --navy: #4189BF; --navy-ink: #0C1927; --red: #B3382B; --red-ink: #FFFFFF; --accent: #F08A7E;
  --bar: #6FA8D8; --track: #183A63; --hl-bg: #1F4F7C; --hl-ink: #EAF3FB; --focus: #8CC0EE;
  --good: #5CC48D; --warn: #F2B24C; --crit: #FF8A80; --field: #0C1F38;
  color-scheme: dark;
}
* { box-sizing: border-box; }

button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
.wrap { max-width: 60rem; margin-inline: auto; display: flex; flex-direction: column; gap: 1.5rem; }

.wm { display: flex; flex-direction: column; line-height: 1.05; }
.wm-a { font-family: var(--font-display); font-weight: 800; font-size: 1.6rem; letter-spacing: .03em; }
.wm-b { font-size: .85rem; font-weight: 600; opacity: .9; }
.band-tag { margin-left: auto; font-size: .8rem; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; opacity: .85; }
@media (max-width: 30rem) { .band-tag { margin-left: 0; width: 100%; } }

.lbl { font-size: .8rem; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; color: var(--ink-soft); }
h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(2rem, 6.5vw, 3.4rem); line-height: 1.02; letter-spacing: -.01em; margin: 0; text-wrap: balance; }
h1 span { color: var(--accent); }
h2 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: clamp(1.3rem, 3.6vw, 1.8rem); }
h3 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 1.1rem; }
.card { background: var(--surface); border: 2px solid var(--line); border-radius: 1.5rem; padding: clamp(1.1rem, 4vw, 2rem); display: flex; flex-direction: column; gap: 1.25rem; min-width: 0; }
.btn { border: 2px solid var(--ink); background: transparent; border-radius: .9rem; padding: .7rem 1.3rem; font-weight: 700; }
.btn.primary { background: var(--navy); color: var(--navy-ink); border-color: var(--navy); }
.btn.big { font-size: 1.15rem; padding: .85rem 1.8rem; }
.row { display: flex; flex-wrap: wrap; gap: .75rem; align-items: center; }
.row.between { justify-content: space-between; }
.vw { background: var(--hl-bg); color: var(--hl-ink); border-radius: .3rem; padding: 0 .3rem; font-weight: 700; }

/* intro */
ol.how { margin: 0; padding-left: 1.4rem; display: flex; flex-direction: column; gap: .6rem; font-size: 1.1rem; }
.keys { display: flex; flex-wrap: wrap; gap: .5rem; }
kbd { font-family: var(--font-display); font-weight: 700; font-size: .9rem; border: 2px solid var(--line); border-bottom-width: 4px; border-radius: .5rem; padding: .05rem .55rem; background: var(--field); }

/* question */
.qtop { display: flex; flex-wrap: wrap; gap: .75rem; align-items: center; justify-content: space-between; }
.dots { display: flex; flex-wrap: wrap; gap: .4rem; }
.dot { width: 2.1rem; height: 2.1rem; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-weight: 800; font-size: .8rem; font-variant-numeric: tabular-nums; background: var(--field); }
.dot.cur { border-color: var(--ink); background: var(--ink); color: var(--bg); }
.dot.right { border-color: var(--good); color: var(--good); }
.dot.wrong, .dot.time { border-color: var(--crit); color: var(--crit); }
.timer { display: flex; align-items: center; gap: 1rem; }
.secs { font-family: var(--font-display); font-weight: 800; font-size: clamp(2.2rem, 7vw, 3.2rem); line-height: 1; min-width: 2.2ch; text-align: right; font-variant-numeric: tabular-nums; }
.tbar { flex: 1; height: 1rem; border-radius: 999px; background: var(--track); overflow: hidden; }
.tbar i { display: block; height: 100%; width: 100%; background: var(--bar); border-radius: 999px; }
.tbar i.warn { background: var(--warn); } .tbar i.crit { background: var(--crit); }
.stmt { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: clamp(1.25rem, 3.4vw, 1.95rem); line-height: 1.3; text-wrap: pretty; }
.tf { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
.tf button { border: 0; border-radius: 1.1rem; min-height: 5.5rem; font-family: var(--font-display); font-weight: 800; font-size: clamp(1.6rem, 5vw, 2.4rem); }
.tf .t { background: var(--navy); color: var(--navy-ink); }
.tf .f { background: var(--red); color: var(--red-ink); }
.tf button[disabled] { opacity: .45; cursor: default; }
.tf button.answer { opacity: 1; outline: 4px solid var(--ink); outline-offset: 3px; }
.verdict { border-top: 2px solid var(--line); padding-top: 1.1rem; display: flex; flex-direction: column; gap: .8rem; }
.vpill { align-self: flex-start; font-family: var(--font-display); font-weight: 800; font-size: 1.05rem; padding: .3rem 1rem; border-radius: 999px; border: 2px solid currentColor; }
.vpill.good { color: var(--good); } .vpill.crit { color: var(--crit); } .vpill.warn { color: var(--warn); }
.verdict p { margin: 0; font-size: 1.1rem; max-width: 46rem; text-wrap: pretty; }
.verdict .ans { font-weight: 800; }

/* end */
.score { font-family: var(--font-display); font-weight: 800; font-size: clamp(3rem, 12vw, 5.5rem); line-height: 1; }
.score small { font-size: .35em; color: var(--ink-soft); }
.res { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: .3rem; }
.res li { display: grid; grid-template-columns: 2.2rem 1fr; gap: .6rem; align-items: start; padding: .45rem .2rem; border-top: 1px solid var(--line); font-size: .98rem; }
.res .ic { font-weight: 800; font-family: var(--font-display); }
.res .ok { color: var(--good); } .res .no { color: var(--crit); }
.review { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 22rem), 1fr)); gap: 1rem; }
.rv { background: var(--field); border-radius: 1.1rem; padding: 1.1rem 1.2rem; display: flex; flex-direction: column; gap: .4rem; min-width: 0; }
.rv p { margin: 0; font-size: 1rem; color: var(--ink-soft); text-wrap: pretty; }
.rv p b { color: var(--ink); }
.rv h3 { color: var(--ink); }
.note { font-size: .9rem; color: var(--ink-soft); margin: 0; }
@media (max-width: 32rem) { .tf { gap: .6rem; } .tf button { min-height: 4.5rem; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
.chip{display:inline-block;background:var(--hl-bg);color:var(--hl-ink);border-radius:.5rem;padding:.2rem .65rem;font-weight:700;font-size:.95rem}
.chips{display:flex;flex-wrap:wrap;gap:.5rem}
.big{font-family:var(--font-display);font-weight:800;font-size:clamp(1.5rem,4.6vw,2.4rem);line-height:1.15;margin:0;text-wrap:balance}
.num{font-family:var(--font-display);font-weight:800;color:var(--accent);font-size:1rem;letter-spacing:.1em}
ul.pr{margin:0;padding-left:1.3rem;display:flex;flex-direction:column;gap:.5rem;font-size:1.15rem}
.book{background:var(--field);border-left:.35rem solid var(--bar);border-radius:.8rem;padding:1rem 1.2rem;display:flex;flex-direction:column;gap:.4rem}
.book p{margin:0}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,13rem),1fr));gap:.7rem}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:1rem;padding:.8rem 1rem;font-weight:700;text-align:left;font-size:1.05rem}
.opt[aria-pressed=true]{border-color:var(--navy);background:var(--hl-bg);color:var(--hl-ink)}
.sort{display:flex;flex-direction:column;gap:.5rem}
.srow{display:grid;grid-template-columns:1fr auto;gap:.7rem;align-items:center;border:2px solid var(--line);border-radius:1rem;padding:.6rem .9rem}
.srow.ok{border-color:var(--good)} .srow.no{border-color:var(--crit)}
.sb{display:flex;gap:.4rem}.sb button{border:2px solid var(--ink);background:transparent;border-radius:.7rem;padding:.35rem .8rem;font-weight:700}
.sb button.on{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
.fb{grid-column:1/-1;font-size:.95rem;color:var(--ink-soft)}
.nav{display:flex;justify-content:space-between;gap:.75rem;flex-wrap:wrap}
.btn[disabled]{opacity:.4;cursor:default}
.hidden{display:none}
.emo{font-size:3rem;line-height:1}
.nav2{display:flex;justify-content:space-between;gap:.75rem;flex-wrap:wrap}
</style>
<div class="wrap">
  <header class="band">
    <div class="mark" role="img" aria-label="Approach logo"></div>
    <div class="wm"><span class="wm-a">APPROACH</span><span class="wm-b">International Student Center®</span></div>
    <span class="band-tag">Personal Finances · Warm-Up Conversations</span>
  </header>
  <main id="stage" aria-live="polite"></main>
</div>
<script>var S=[
{n:"Your first money",q:"What’s the first money you ever got, and what did you do with it?",
 p:["Was it a gift, an allowance, or from your first job?","Did you spend it right away, hide it, or save it? Any funny memory?","Did anyone teach you about money when you were a kid?"],
 x:["The first money I ever got was…","I spent it all on…","My mom used to say…","Looking back, I wish I had…"],
 t:"Partner challenge: tell the story in 60 seconds. Your partner asks one follow-up question."},
{n:"Family money story",q:"What did your family do with money? What did they trust, and what did they never trust?",
 p:["Did your parents or grandparents keep gold, land, dollars, or cash at home?","Did they trust banks? What did they say about the stock market?","Is there a money saying in your family or country that everybody knows?"],
 x:["In my family, banks were…","My grandparents always kept…","People where I’m from think that…","One thing I do differently is…"],
 t:"Compare: is your family story similar to your partner’s, or totally different?"},
{n:"Money on screen",q:"Movies and TV love stories about money. Which ones have you seen, and what do they get right or wrong?",
 p:["Tap the ones you’ve seen. Which one would you recommend?","Pick one character you would trust with your savings, and one you would never trust.","Do these shows make investing look exciting, scary, or fake?"],
 x:["I’d never trust… because…","In real life, investing is probably more…","The scene I remember is…","This show made me think that…"],
 shows:["The Big Short","The Wolf of Wall Street","Wall Street","Billions","Succession","Squid Game","Money Heist","Shark Tank"],
 t:"Quick question: do you think Wall Street is as wild in real life as it looks in the movies?"},
{n:"The $1,000 gift",q:"Imagine someone gives you $1,000 and you don’t need it for 10 years. What do you do with it?",
 p:["Vote for your first instinct below. No wrong answers!","Explain your choice to a partner. Are you the careful type or the risk-taker?","Imagine it’s 10 years later. What do you hope happened?"],
 x:["My first instinct is to…","I’d feel safer if…","I’m worried that…","In 10 years, I hope…"],
 vote:["Put it in a bank","Buy gold or dollars","Lend it to family or a friend","Start a small business","Spend it on something I love","Invest it somehow","Give it away","Hide it at home"],
 t:"Twist: your partner has to convince you to choose a different option. Do they succeed?"}
];
var i=0,st=document.getElementById("stage"),seen={},votes={};
function chips(a){return a.map(function(t){return '<span class="chip">'+t+'</span>'}).join("")}
function render(){var s=S[i],h='<section class="card"><div class="qtop"><span class="num">TOPIC '+(i+1)+' OF '+S.length+'</span><div class="dots">';
 S.forEach(function(_,k){h+='<span class="dot'+(k==i?' cur':'')+'">'+(k+1)+'</span>'});
 h+='</div></div><p class="big">'+s.q+'</p><ul class="pr">'+s.p.map(function(t){return '<li>'+t+'</li>'}).join("")+'</ul>';
 if(s.shows)h+='<div class="opts">'+s.shows.map(function(v,k){return '<button class="opt" data-s="'+k+'" aria-pressed="'+!!seen[k]+'">'+v+'</button>'}).join("")+'</div>';
 if(s.vote)h+='<div class="opts">'+s.vote.map(function(v,k){return '<button class="opt" data-v="'+k+'" aria-pressed="'+(votes[i]===k)+'">'+v+'</button>'}).join("")+'</div>';
 h+='<div><div class="lbl" style="margin-bottom:.5rem">Story starters</div><div class="chips">'+chips(s.x)+'</div></div><div class="book"><p>'+s.t+'</p></div>';
 h+='<div class="nav2"><button class="btn" id="pv"'+(i?'':' disabled')+'>← Back</button><button class="btn primary" id="nx"'+(i==S.length-1?' disabled':'')+'>Next →</button></div></section>';
 st.innerHTML=h;
 document.getElementById("pv").onclick=function(){i--;render();window.scrollTo(0,0)};
 document.getElementById("nx").onclick=function(){i++;render();window.scrollTo(0,0)};
 st.querySelectorAll("[data-s]").forEach(function(b){b.onclick=function(){var k=+b.dataset.s;seen[k]=!seen[k];render()}});
 st.querySelectorAll("[data-v]").forEach(function(b){b.onclick=function(){votes[i]=+b.dataset.v;render()}})}
document.addEventListener("keydown",function(e){if(e.key==="ArrowRight"&&i<S.length-1){i++;render()}if(e.key==="ArrowLeft"&&i>0){i--;render()}});
render();
</script>

</body></html>
