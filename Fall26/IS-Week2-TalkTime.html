<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Warm-Up: People, Places & Shopping</title>
<style>
:root{
  --navy:#0B1827; --red:#9D251A; --blue:#418ABD;
  --bg:#EEF2F6; --card:#FFFFFF; --ink:#0B1827; --soft:#5A6878; --line:#D3DBE4; --tint:#F4F7FA; --defbg:#FBEDEB;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#08111C; --card:#122236; --ink:#EAF0F6; --soft:#9FB0C2; --line:#24384F; --tint:#0E1B2B; --defbg:#2A1A1C; --blue:#6FAEDD; --red:#E07A6E; } }
:root[data-theme="dark"]{
  --bg:#08111C; --card:#122236; --ink:#EAF0F6; --soft:#9FB0C2; --line:#24384F; --tint:#0E1B2B; --defbg:#2A1A1C; --blue:#6FAEDD; --red:#E07A6E; }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;font-size:19px;line-height:1.5}
.wrap{max-width:960px;margin:0 auto;padding:20px 16px 36px}
.shell{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.bar{height:8px;background:linear-gradient(90deg,#0B1827,#418ABD 60%,#9D251A)}
header.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 22px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.logo svg{width:38px;height:38px;flex:none}
.logo .name{font-size:21px;letter-spacing:.02em;line-height:1}
.logo .sub{display:block;font-size:12px;color:var(--soft);letter-spacing:.08em;text-transform:uppercase;margin-top:3px;font-family:Arial,sans-serif}
.count{font-size:15px;color:var(--soft);font-family:Arial,sans-serif}
main{padding:24px 26px}
.dots{display:flex;gap:8px;margin:0 0 18px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dot.on{background:var(--red)} .dot.done{background:var(--blue)}
.topic{font-family:Arial,sans-serif;font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--red);margin:0 0 6px}
.q{font-size:clamp(26px,4.2vw,38px);line-height:1.3;margin:0 0 14px}
.f{font-size:clamp(20px,2.8vw,24px);color:var(--ink);margin:0 0 18px;padding-left:14px;border-left:4px solid var(--blue)}
.rp{color:var(--blue);font-weight:bold}
.w{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;border-bottom:3px dotted var(--red);line-height:1.15}
.w:hover,.w.on{background:var(--defbg)}
.def{display:none;background:var(--defbg);border-radius:10px;padding:14px 16px;margin:0 0 18px;font-size:19px}
.def.show{display:block}
.def b{color:var(--red);font-size:22px}
.def i{display:block;color:var(--soft);margin-top:4px}
.def .x{float:right;background:none;border:0;font-size:22px;color:var(--soft);cursor:pointer;line-height:1}
.say{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:3px 10px;font-size:14px;margin-left:8px;vertical-align:middle;cursor:pointer;font-family:Arial,sans-serif}
.starters{background:var(--tint);border-radius:10px;padding:12px 16px;margin:0 0 6px}
.starters span{display:block;font-family:Arial,sans-serif;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);margin-bottom:4px}
.starters p{margin:2px 0;font-size:20px;font-style:italic}
.legend{font-size:15px;color:var(--soft);margin:14px 0 0;font-family:Arial,sans-serif}
.legend .k1{border-bottom:3px dotted var(--red)} .legend .k2{color:var(--blue);font-weight:bold}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:20px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:12px 24px;font-size:18px;background:#0B1827;color:#fff;cursor:pointer;font-family:inherit}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.red{background:#9D251A}
.btn:disabled{opacity:.35;cursor:default}
.timer{display:flex;align-items:center;gap:8px;font-family:Arial,sans-serif}
.timer .t{font-size:24px;min-width:64px;text-align:center;font-variant-numeric:tabular-nums}
.timer .t.end{color:var(--red)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
@media (max-width:600px){ main{padding:18px 16px} .foot{justify-content:center} }
</style>
</head>
<body>
<div class="wrap">
  <div class="shell">
    <div class="bar"></div>
    <header class="top">
      <div class="logo" aria-label="Approach">
        <svg viewBox="0 0 40 40" aria-hidden="true">
          <circle cx="20" cy="20" r="19" fill="#0B1827"/>
          <path d="M11 30 L20 9 L29 30" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/>
          <path d="M14.5 23 H25.5" stroke="#9D251A" stroke-width="3.2" stroke-linecap="round"/>
          <circle cx="20" cy="9" r="2.4" fill="#418ABD"/>
        </svg>
        <div><span class="name">Approach</span><span class="sub">Integrated Skills · Warm-Up</span></div>
      </div>
      <div class="count" id="count"></div>
    </header>
    <main id="app"></main>
  </div>
</div>
<script>
/* [[word|key]] = clickable word · {who} = relative pronoun */
const CARDS = [
  { topic:"Neighbors back home",
    q:"Think of a neighbor {who} lived near you in your country. What was he or she like?",
    f:"Was there a [[nosy|nosy]] neighbor {who} loved to [[gossip|gossip]]? Or someone {who} always [[borrowed|borrow]] things and never gave them back?",
    s:["I had a neighbor who…","The street where I grew up was…"] },
  { topic:"Not-so-nice coworkers",
    q:"Have you ever worked with someone {who} was not very nice? What did this person do?",
    f:"Was it a person {who} was [[rude|rude]], {who} tried to [[take credit|take credit]] for your work, or {who} [[complained|complain]] all day? (No real names!)",
    s:["I worked with a man / woman who…","The company where we worked was…"] },
  { topic:"That one relative",
    q:"Every family has a [[relative|relative]] {who} is a little [[annoying|annoying]]. Who is it in your family?",
    f:"What does this person do at family parties? Do they [[show off|show off]], or ask questions {which} are too personal?",
    s:["I have a cousin / an aunt / an uncle who…","The question which I hate is…"] },
  { topic:"Not worth the trip",
    q:"Tell your group about a famous place {which} was [[overrated|overrated]]. What did you expect?",
    f:"Was it too [[crowded|crowded]]? Was it a [[tourist trap|tourist trap]] {where} a bottle of water cost ten dollars?",
    s:["I visited a place which…","It was a city where…"] },
  { topic:"Store or screen?",
    q:"Do you prefer stores {where} you can touch and try things, or websites {which} [[deliver|deliver]] to your door?",
    f:"Do you like to [[browse|browse]] for hours, or buy fast and go home? Is it easy to get a [[refund|refund]] in your country?",
    s:["I prefer stores where…","I like apps which…"] },
  { topic:"What kind of shopper are you?",
    q:"Are you a person {who} hunts for a [[bargain|bargain]], or do you buy things [[on impulse|on impulse]]?",
    f:"Tell the group about something {which} you bought and later [[regretted|regret]]. Is there someone in your family {whose} shopping [[drives you crazy|drive someone crazy]]?",
    s:["I'm the kind of person who…","One thing which I regret buying is…"] }
];
const DEFS = {
  "nosy":{d:"wants to know about other people's private life", e:"My nosy neighbor always watched us from her window."},
  "gossip":{d:"to talk about other people's private lives, often things that are not nice or not true", e:"They gossip about everyone on the street."},
  "borrow":{d:"to take something from someone and give it back later", e:"Can I borrow your ladder this weekend?"},
  "rude":{d:"not polite", e:"He was rude to the customers and never said thank you."},
  "take credit":{d:"to say that good work is yours when another person did it", e:"She took credit for my idea in the meeting."},
  "complain":{d:"to say that you are unhappy about something", e:"He complains about the weather every single day."},
  "relative":{d:"a person in your family, for example a cousin, an aunt, or an uncle", e:"All my relatives come to our house for the holidays."},
  "annoying":{d:"makes you a little angry or impatient", e:"The noise from the TV upstairs is so annoying."},
  "show off":{d:"to try to make people see how rich, smart, or good you are", e:"My cousin always shows off his new car."},
  "overrated":{d:"people say it is great, but really it is not so great", e:"That restaurant is overrated. The food is just OK."},
  "crowded":{d:"full of too many people", e:"The mall is very crowded the week before the holidays."},
  "tourist trap":{d:"a place for tourists that is expensive and not very good", e:"The souvenir shops near the castle are a tourist trap."},
  "deliver":{d:"to bring something to a person's home or office", e:"The store delivers groceries in two hours."},
  "browse":{d:"to look at things in a store or online with no plan to buy", e:"I like to browse in bookstores on Sunday afternoons."},
  "refund":{d:"money that a store gives back when you return something", e:"The shoes were too small, so I asked for a refund."},
  "bargain":{d:"something you buy for a good, low price", e:"This coat was a bargain: only twenty dollars!"},
  "on impulse":{d:"suddenly, without thinking or planning", e:"I bought a guitar on impulse, and I never play it."},
  "regret":{d:"to feel sorry or unhappy about something you did", e:"I regret buying those expensive boots."},
  "drive someone crazy":{d:"to make someone very annoyed", e:"My brother's loud music drives me crazy."}
};
let i=0, timer=null, left=120;
const app=document.getElementById("app"), count=document.getElementById("count");
const esc=t=>t.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function fmt(t){
  return esc(t)
    .replace(/\[\[([^|\]]+)\|([^\]]+)\]\]/g,(m,w,k)=>`<button class="w" data-k="${k}" aria-expanded="false">${w}</button>`)
    .replace(/\{(\w+)\}/g,'<span class="rp">$1</span>');
}
let voice=null;
function pickVoice(){ const vs=speechSynthesis.getVoices().filter(v=>/^en[-_]US/i.test(v.lang));
  const r=v=>(/natural|neural|premium|enhanced/i.test(v.name)?3:0)+(/google|samantha|aria|jenny|ava/i.test(v.name)?1:0);
  voice=vs.sort((a,b)=>r(b)-r(a))[0]||null; }
if("speechSynthesis" in window){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
function speak(t){ if(!("speechSynthesis" in window))return; speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); if(voice)u.voice=voice; u.lang="en-US"; u.rate=.9; speechSynthesis.speak(u); }

function stopTimer(){ clearInterval(timer); timer=null; }
function render(){
  stopTimer(); left=120;
  const c=CARDS[i];
  count.textContent=`Question ${i+1} of ${CARDS.length}`;
  app.innerHTML=`
    <div class="dots">${CARDS.map((_,k)=>`<span class="dot ${k<i?'done':k===i?'on':''}"></span>`).join("")}</div>
    <p class="topic">${c.topic}</p>
    <p class="q">${fmt(c.q)}</p>
    <p class="f">${fmt(c.f)}</p>
    <div class="def" id="def" role="region" aria-live="polite"></div>
    <div class="starters"><span>Start like this</span>${c.s.map(x=>`<p>${esc(x)}</p>`).join("")}</div>
    <p class="legend"><span class="k1">dotted words</span>: tap for the meaning &nbsp;·&nbsp; <span class="k2">blue words</span>: relative pronouns</p>
    <div class="foot">
      <button class="btn alt" id="back" ${i===0?'disabled':''}>Back</button>
      <div class="timer"><span class="t" id="t">2:00</span><button class="btn alt" id="tgo">Start timer</button></div>
      <button class="btn ${i===CARDS.length-1?'red':''}" id="next">${i===CARDS.length-1?'Start again':'Next'}</button>
    </div>`;
  app.querySelectorAll(".w").forEach(b=>b.onclick=()=>showDef(b));
  document.getElementById("back").onclick=()=>{ if(i>0){i--;render();} };
  document.getElementById("next").onclick=()=>{ i=(i+1)%CARDS.length; render(); };
  document.getElementById("tgo").onclick=toggleTimer;
}
function showDef(b){
  const box=document.getElementById("def"), k=b.dataset.k, d=DEFS[k];
  const already=b.classList.contains("on");
  app.querySelectorAll(".w").forEach(x=>{x.classList.remove("on");x.setAttribute("aria-expanded","false");});
  if(already){ box.classList.remove("show"); return; }
  b.classList.add("on"); b.setAttribute("aria-expanded","true");
  box.innerHTML=`<button class="x" aria-label="Close">×</button><b>${esc(k)}</b><button class="say" id="say">Listen</button><br>${esc(d.d)}<i>"${esc(d.e)}"</i>`;
  box.classList.add("show");
  box.querySelector(".x").onclick=()=>{ box.classList.remove("show"); b.classList.remove("on"); b.setAttribute("aria-expanded","false"); };
  document.getElementById("say").onclick=()=>speak(`${k}. ${d.e}`);
}
function toggleTimer(){
  const t=document.getElementById("t"), btn=document.getElementById("tgo");
  if(timer){ stopTimer(); btn.textContent="Start timer"; return; }
  if(left<=0){ left=120; t.classList.remove("end"); }
  btn.textContent="Pause";
  timer=setInterval(()=>{
    left--; t.textContent=`${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}`;
    if(left<=0){ stopTimer(); t.textContent="Time!"; t.classList.add("end"); btn.textContent="Restart"; }
  },1000);
}
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="BUTTON" && (e.key==="Enter"||e.key===" ")) return;
  if(e.key==="ArrowRight"){ i=(i+1)%CARDS.length; render(); }
  if(e.key==="ArrowLeft" && i>0){ i--; render(); }
});
render();
</script>
</body>
</html>
