<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Warm-Up: My First Days in the U.S.</title>
<style>
  :root {
    --navy: #1b2a4a;
    --navy-dark: #10192e;
    --rust: #a8431c;
    --amber: #c9871f;
    --olive: #6b6b2f;
    --paper: #fbf1dd;
    --ink: #2a1d12;
    --line: #e3cfa3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(circle at 15% 15%, rgba(201,135,31,0.18), transparent 45%),
      radial-gradient(circle at 85% 85%, rgba(168,67,28,0.22), transparent 45%),
      linear-gradient(160deg, var(--navy) 0%, var(--navy-dark) 100%);
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    position: relative;
    overflow: hidden;
  }
  .leaf-bg {
    position: absolute;
    opacity: 0.14;
    width: 120px;
    height: 120px;
  }
  .leaf-bg.l1 { top: -20px; left: -20px; transform: rotate(-15deg); }
  .leaf-bg.l2 { bottom: -30px; right: -10px; transform: rotate(25deg) scale(1.3); }
  .leaf-bg.l3 { top: 40%; right: 6%; transform: rotate(60deg) scale(0.7); opacity: 0.08; }

  .wrap {
    width: 100%;
    max-width: 640px;
    position: relative;
    z-index: 1;
  }
  .kicker {
    color: var(--amber);
    letter-spacing: 2px;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    text-align: center;
    margin-bottom: 6px;
  }
  .title {
    color: var(--paper);
    text-align: center;
    font-size: 24px;
    font-weight: 700;
    margin: 0 0 4px;
  }
  .subtitle {
    color: #c9c2b2;
    text-align: center;
    font-size: 13px;
    margin-bottom: 22px;
  }
  .card {
    background: var(--paper);
    border-radius: 18px;
    padding: 34px 32px 26px;
    box-shadow: 0 20px 45px rgba(0,0,0,0.35);
    border: 1px solid var(--line);
    position: relative;
    min-height: 260px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    overflow: hidden;
  }
  .card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 5px;
    background: linear-gradient(90deg, var(--rust), var(--amber), var(--olive));
  }
  .card-number {
    position: absolute;
    top: 22px;
    left: 28px;
    font-size: 12px;
    font-weight: 700;
    color: var(--olive);
    letter-spacing: 1px;
  }
  .leaf-mark {
    display: block;
    margin: 0 auto 14px;
    width: 30px;
    height: 30px;
  }
  .question {
    font-size: 21px;
    line-height: 1.5;
    color: var(--ink);
    text-align: center;
    font-weight: 600;
  }
  .hint {
    text-align: center;
    color: #8a7a5e;
    font-size: 13px;
    font-style: italic;
    margin-top: 14px;
  }
  .word {
    border-bottom: 2px dotted var(--rust);
    cursor: pointer;
    color: var(--navy);
    font-weight: 700;
    position: relative;
  }
  .word:hover { color: var(--rust); }
  .tooltip {
    display: none;
    position: absolute;
    bottom: 130%;
    left: 50%;
    transform: translateX(-50%);
    background: var(--navy);
    color: #fff;
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    box-shadow: 0 6px 16px rgba(0,0,0,0.3);
    z-index: 5;
  }
  .tooltip::after {
    content: "";
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    border: 6px solid transparent;
    border-top-color: var(--navy);
  }
  .word.open .tooltip { display: block; }
  .controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 22px;
  }
  button.nav {
    background: var(--rust);
    color: var(--paper);
    border: none;
    padding: 11px 22px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }
  button.nav:hover { background: var(--amber); }
  button.nav:active { transform: scale(0.97); }
  button.nav:disabled {
    opacity: 0.35;
    cursor: default;
  }
  button.nav:disabled:hover { background: var(--rust); }
  .dots {
    display: flex;
    gap: 8px;
  }
  .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--line);
    transition: background 0.2s, transform 0.2s;
  }
  .dot.active {
    background: var(--amber);
    transform: scale(1.25);
  }
  .footer-note {
    text-align: center;
    color: #a99c82;
    font-size: 12px;
    margin-top: 18px;
  }
</style>
</head>
<body>

<svg class="leaf-bg l1" viewBox="0 0 100 100"><path fill="#c9871f" d="M50 92 C 18 78, 8 42, 50 8 C 92 42, 82 78, 50 92 Z"/><path fill="none" stroke="#1b2a4a" stroke-width="2" opacity="0.4" d="M50 20 L50 85 M50 35 L30 25 M50 35 L70 25 M50 55 L26 50 M50 55 L74 50"/></svg>
<svg class="leaf-bg l2" viewBox="0 0 100 100"><path fill="#a8431c" d="M50 92 C 18 78, 8 42, 50 8 C 92 42, 82 78, 50 92 Z"/><path fill="none" stroke="#1b2a4a" stroke-width="2" opacity="0.4" d="M50 20 L50 85 M50 35 L30 25 M50 35 L70 25 M50 55 L26 50 M50 55 L74 50"/></svg>
<svg class="leaf-bg l3" viewBox="0 0 100 100"><path fill="#6b6b2f" d="M50 92 C 18 78, 8 42, 50 8 C 92 42, 82 78, 50 92 Z"/><path fill="none" stroke="#1b2a4a" stroke-width="2" opacity="0.4" d="M50 20 L50 85 M50 35 L30 25 M50 35 L70 25 M50 55 L26 50 M50 55 L74 50"/></svg>

<div class="wrap">
  <div class="kicker">Approach ISC &middot; American Culture &amp; Civic Life</div>
  <div class="title">My First Days in the U.S.</div>
  <div class="subtitle">Talk with a partner. Click the underlined words for help.</div>

  <div class="card">
    <div class="card-number" id="cardNum">1 / 5</div>
    <svg class="leaf-mark" viewBox="0 0 100 100"><path fill="#a8431c" d="M50 92 C 18 78, 8 42, 50 8 C 92 42, 82 78, 50 92 Z"/><path fill="none" stroke="#fbf1dd" stroke-width="3" d="M50 20 L50 85 M50 35 L32 26 M50 35 L68 26 M50 55 L28 49 M50 55 L72 49"/></svg>
    <div class="question" id="cardQuestion"></div>
    <div class="hint" id="cardHint"></div>
  </div>

  <div class="controls">
    <button class="nav" id="backBtn">&larr; Back</button>
    <div class="dots" id="dots"></div>
    <button class="nav" id="nextBtn">Next &rarr;</button>
  </div>

  <div class="footer-note">Tap a dotted word to see the Portuguese meaning.</div>
</div>

<script>
const glossary = {
  "met you": "te encontrou / foi te buscar",
  "airport": "aeroporto",
  "bags": "malas",
  "traveled": "viajou",
  "first apartment": "primeiro apartamento",
  "first car": "primeiro carro",
  "documents": "documentos",
  "change of status": "mudança de status",
  "waited": "esperou",
  "process": "processo",
  "expensive": "caro"
};

function markWords(text) {
  let out = text;
  Object.keys(glossary).sort((a,b)=>b.length-a.length).forEach(word => {
    const re = new RegExp("\\b" + word.replace(/[.*+?^${}()|[\\]\\\\]/g, '\\\\$&') + "\\b", "i");
    out = out.replace(re, function(match) {
      return `<span class="word" data-pt="${glossary[word]}">${match}<span class="tooltip">${glossary[word]}</span></span>`;
    });
  });
  return out;
}

const cards = [
  {
    q: "Who met you at the airport when you first arrived?",
    hint: "family, a friend, a driver, or no one"
  },
  {
    q: "How many bags did you have? How many people traveled with you?",
    hint: "one bag, two bags... one person, a family"
  },
  {
    q: "Where did you find your first apartment? Who helped you find your first car?",
    hint: "a friend, a website, family, a realtor"
  },
  {
    q: "Who gave you information about your documents, like your change of status?",
    hint: "a lawyer, a school, a friend, the internet"
  },
  {
    q: "How long did you wait for your documents? Was the process expensive?",
    hint: "one week, one month, one year... yes/no"
  }
];

let current = 0;
const cardNum = document.getElementById('cardNum');
const cardQuestion = document.getElementById('cardQuestion');
const cardHint = document.getElementById('cardHint');
const dotsWrap = document.getElementById('dots');
const backBtn = document.getElementById('backBtn');
const nextBtn = document.getElementById('nextBtn');

cards.forEach((_, i) => {
  const dot = document.createElement('div');
  dot.className = 'dot' + (i === 0 ? ' active' : '');
  dotsWrap.appendChild(dot);
});

function render() {
  const c = cards[current];
  cardNum.textContent = (current + 1) + ' / ' + cards.length;
  cardQuestion.innerHTML = markWords(c.q);
  cardHint.textContent = c.hint;

  [...dotsWrap.children].forEach((d, i) => {
    d.classList.toggle('active', i === current);
  });

  backBtn.disabled = current === 0;
  nextBtn.textContent = current === cards.length - 1 ? 'Restart ↻' : 'Next →';

  attachWordHandlers();
}

function attachWordHandlers() {
  document.querySelectorAll('.word').forEach(w => {
    w.addEventListener('click', (e) => {
      e.stopPropagation();
      const wasOpen = w.classList.contains('open');
      document.querySelectorAll('.word').forEach(x => x.classList.remove('open'));
      if (!wasOpen) w.classList.add('open');
    });
  });
}

document.addEventListener('click', () => {
  document.querySelectorAll('.word').forEach(x => x.classList.remove('open'));
});

backBtn.addEventListener('click', () => {
  if (current > 0) { current--; render(); }
});

nextBtn.addEventListener('click', () => {
  if (current === cards.length - 1) {
    current = 0;
  } else {
    current++;
  }
  render();
});

render();
</script>

</body>
</html>
