<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Weeks 1–3 Word Reunion · Approach ISC</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--dark:#0b1827;--navy:#0e2a47;--red:#9d251a;--blue:#418abd;--gray:#e8e8e8;--gold:#9a7c46;--muted:#5b6776;--tint:rgba(65,138,189,.13);--ok:#2e7d4f;--font:'Montserrat',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
*{box-sizing:border-box}html,body{margin:0}body{font-family:var(--font);color:var(--dark);background:#fff;min-height:100dvh;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit}
header{padding:14px 22px 12px;border-bottom:2px solid var(--gold);display:flex;align-items:center;gap:12px}header img{height:40px}
.htext b{display:block;font-size:14px;color:var(--navy)}.htext span{font-size:12px;color:var(--muted);font-weight:500}
main{max-width:820px;margin:0 auto;padding:24px 22px 60px}
.tag{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--blue);margin:0 0 12px}
h1{font-size:clamp(26px,5.6vw,38px);line-height:1.2;color:var(--navy);margin:0 0 14px;letter-spacing:-.01em}
.lead{font-size:clamp(17px,3.2vw,20px);line-height:1.55;font-weight:500;color:#2b3442;margin:0 0 20px}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:560px){.menu{grid-template-columns:1fr}}
.mc{text-align:left;border:1.5px solid var(--gray);border-radius:14px;background:#fff;padding:14px 16px;cursor:pointer;position:relative;display:block;width:100%}
.mc:hover{border-color:var(--blue);background:#f5f9fd}.mc .n{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--red)}.mc h3{margin:2px 0 4px;font-size:19px;color:var(--navy)}.mc p{margin:0;font-size:14.5px;line-height:1.45;color:#2b3442}
.mc .t{position:absolute;right:12px;top:12px;font-size:12px;color:var(--muted);font-weight:600}.mc.done::after{content:'✓';position:absolute;right:12px;bottom:10px;width:24px;height:24px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:14px;font-weight:700}
.box{margin:18px 0 0;padding:14px 16px;border-radius:12px;background:#f9f6f0;border:1px solid #efe6d4;font-size:15.5px;line-height:1.55}.box h3{margin:0 0 6px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}.box ul{margin:0;padding-left:18px}
.back{border:0;background:none;color:var(--navy);font-weight:700;font-size:15px;cursor:pointer;padding:8px 0;margin-bottom:8px}
.btn{border:0;border-radius:999px;padding:13px 24px;font-size:16px;font-weight:700;cursor:pointer;background:var(--navy);color:#fff}.btn:hover{background:var(--dark)}.btn.alt{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}.btn[disabled]{opacity:.35;cursor:default}
.ab{border:1.5px solid var(--navy);background:#fff;color:var(--navy);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:600;cursor:pointer}.ab:hover{background:var(--navy);color:#fff}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}.chip{border:1.5px solid var(--navy);background:#fff;color:var(--navy);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;cursor:pointer}.chip.on{background:var(--navy);color:#fff}
/* flip cards */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.fc{perspective:900px;min-height:310px;border:0;background:none;padding:0;text-align:left;cursor:pointer}
.fi{position:relative;min-height:310px;height:100%;transition:transform .45s;transform-style:preserve-3d}.fc.flip .fi{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;padding:14px;border:1.5px solid var(--gray);background:#fff;overflow:auto}
.face.fr{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:8px}
.face.fr h3{font-size:26px;color:var(--navy);margin:0}.face.bk{transform:rotateY(180deg);background:#f9f6f0;border-color:#efe6d4;font-size:14px;line-height:1.45}
.st{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--red)}.pos{font-size:13px;font-style:italic;color:var(--muted)}
.bk b{color:var(--navy)}.bk .pt{color:var(--blue);font-weight:700}.bk .cx{border-left:3px solid var(--gold);padding-left:8px;margin:6px 0}
.mk{display:flex;gap:6px;margin-top:8px}.mk button{flex:1;border:1.5px solid var(--navy);border-radius:999px;background:#fff;font-size:12.5px;font-weight:700;padding:5px;cursor:pointer;color:var(--navy)}.mk button.on{background:var(--ok);border-color:var(--ok);color:#fff}.mk button.rv.on{background:var(--red);border-color:var(--red)}
.piles{font-size:14px;font-weight:600;color:var(--muted);margin:0 0 10px}
/* quiz */
.q{font-size:clamp(20px,4vw,26px);font-weight:700;color:var(--navy);margin:0 0 14px;line-height:1.3}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:480px){.opts{grid-template-columns:1fr}}
.opt{border:2px solid var(--gray);background:#fff;border-radius:12px;padding:16px;font-size:20px;font-weight:700;color:var(--navy);cursor:pointer}.opt:hover{border-color:var(--blue)}.opt.ok{background:var(--ok);border-color:var(--ok);color:#fff}.opt.no{background:#fbeeec;border-color:var(--red);color:var(--red)}
.fb{margin:14px 0 0;padding:12px 14px;border-radius:10px;background:#eef5fb;font-size:16px;line-height:1.5;display:none}.fb.on{display:block}
.bar{display:flex;gap:6px;margin:0 0 16px}.bar i{flex:1;height:5px;border-radius:3px;background:var(--gray)}.bar i.on{background:var(--navy)}.bar i.ok{background:var(--ok)}.bar i.no{background:var(--red)}
.score{font-size:48px;font-weight:700;color:var(--navy);margin:6px 0}
/* cloze */
.scene{font-size:clamp(17px,3.1vw,19.5px);line-height:2.1;margin:0 0 14px}.scene select{font-size:16px;padding:4px 6px;border:2px solid var(--blue);border-radius:8px;background:#f5f9fd;color:var(--navy);font-weight:600;max-width:100%}
.scene select.ok{border-color:var(--ok);background:#e9f6ee}.scene select.no{border-color:var(--red);background:#fbeeec}
.bank{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}.bank span{background:var(--tint);color:var(--navy);font-weight:600;font-size:14px;padding:4px 10px;border-radius:999px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* dictation */
.inp,.ta{width:100%;font:inherit;font-size:20px;padding:12px 14px;border:2px solid var(--gray);border-radius:10px;background:#fff;color:var(--dark)}.inp:focus,.ta:focus{outline:none;border-color:var(--blue)}.ta{font-size:17px;line-height:1.5;min-height:140px;resize:vertical}
.inp.ok{border-color:var(--ok);background:#e9f6ee}.inp.no{border-color:var(--red);background:#fbeeec}
/* dice */
.dice{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 16px}@media(max-width:560px){.dice{grid-template-columns:1fr}}
.die{border:2px solid var(--navy);border-radius:14px;padding:14px;text-align:center;min-height:120px;display:flex;flex-direction:column;justify-content:center;background:#f5f9fd}.die small{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--red);margin-bottom:6px}.die b{font-size:22px;color:var(--navy)}.die span{font-size:15.5px;line-height:1.4;font-weight:600;color:var(--navy)}
.die.roll{animation:sh .35s}@keyframes sh{0%{transform:rotate(-4deg) scale(.96)}50%{transform:rotate(4deg) scale(1.04)}100%{transform:none}}
@media(prefers-reduced-motion:reduce){.die.roll{animation:none}.fi{transition:none}}
.wc{font-size:13px;color:var(--muted);margin:4px 0 12px}.pick{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}.pick .chip.used{border-color:var(--ok);box-shadow:inset 0 -3px 0 var(--ok)}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mcol{display:grid;gap:8px;align-content:start}.mi{border:2px solid var(--gray);background:#fff;border-radius:12px;padding:12px;font-size:16px;font-weight:700;color:var(--navy);cursor:pointer;text-align:left;display:flex;justify-content:space-between;gap:6px;align-items:center;min-height:52px}.mi.tr{font-weight:600;font-size:15px}.mi.sel{border-color:var(--blue);background:var(--tint)}.mi.ok{background:var(--ok);border-color:var(--ok);color:#fff}.mi.no{background:#fbeeec;border-color:var(--red);color:var(--red)}.msg{font-size:14px;color:var(--muted);font-weight:600}
</style></head><body>

<script>
const ST={poe:['The Tell-Tale Heart','Poe'],walker:['Everyday Use','Walker'],w1:['Who Is American?','Week 1 reading']};
const WORDS=[
{w:'bedcover',pos:'noun',st:'poe',pt:'colcha; cobertor',def:'a cloth or blanket that covers a bed.',ctx:'The old man lies in bed, under his bedcovers, while the narrator watches him in the dark.',ex:'On cold nights I pull the bedcover up to my chin.'},
{w:'vulture',pos:'noun',st:'poe',pt:'abutre; urubu',def:'a large bird that eats dead animals.',ctx:'The narrator says the old man’s pale blue eye looks like the eye of a vulture.',ex:'A vulture was circling above the empty road.'},
{w:'certain',pos:'adjective',st:'poe',pt:'certo; seguro',def:'completely sure; with no doubt.',ctx:'The narrator is certain that he is not mad, and he wants you to be certain too.',ex:'I am certain I locked the door.'},
{w:'evil',pos:'adjective / noun',st:'poe',pt:'mau; maligno; o mal',def:'very bad; wanting to hurt people.',ctx:'The narrator does not hate the old man. He hates the “Evil Eye.”',ex:'In the film, the evil king wants the magic ring.'},
{w:'bear (to bear sth)',pos:'verb',st:'walker',pt:'suportar; aguentar',def:'to accept something unpleasant without breaking down. Often: can’t bear it.',ctx:'Dee says she couldn’t bear her old name any longer. (In Poe, the narrator also can’t bear the smiles of the police.)',ex:'I can’t bear loud chewing.',say:'bear'},
{w:'awe',pos:'noun',st:'walker',pt:'admiração; assombro',def:'a feeling of deep respect and wonder, sometimes mixed with fear.',ctx:'Mama says Maggie looks at her sister with a mixture of envy and awe.',ex:'The children stared in awe at the huge waterfall.'},
{w:'envy',pos:'noun',st:'walker',pt:'inveja',def:'the unhappy feeling of wanting what someone else has.',ctx:'Maggie feels envy because Dee has always had things easy.',ex:'She looked at her friend’s new house with envy.'},
{w:'hand down',pos:'phrasal verb',st:'walker',pt:'passar de geração em geração',def:'to give something to the next generation.',ctx:'The quilts were made by Grandma and handed down in the family. Who should get them?',ex:'The recipe was handed down from mother to daughter.',say:'hand down'},
{w:'temper',pos:'noun',st:'walker',pt:'pavio curto; mau humor',def:'a tendency to get angry very quickly.',ctx:'In the quilt argument, Mama notes that Dee has a temper.',ex:'He has a terrible temper when he’s stuck in traffic.'},
{w:'stitch',pos:'verb / noun',st:'walker',pt:'costurar; ponto (de costura)',def:'to sew; to join cloth with a needle and thread.',ctx:'Dee points out that Grandma did all the stitching by hand, not by machine.',ex:'She stitched the torn pocket back on.'},
{w:'ignorant',pos:'adjective',st:'walker',pt:'ignorante; sem instrução',def:'not knowing facts that others know. It can sound rude.',ctx:'Mama describes herself and Maggie as “ignorant” from Dee’s point of view. Is that fair?',ex:'I was ignorant about American holidays when I arrived.',tip:'False friend: “ignorar” in Portuguese means “to not know,” but “ignore” in English means to pay no attention on purpose.'},

/* 5 spell */
V.spell=function(){let i=0,sc=0;const Q=shuf(DICT);
 const draw=()=>{if(i>=Q.length){finish('spell');shell('spell',`<h1>Spelling champion!</h1><p class="score">${sc} / ${Q.length}</p><p class="lead">First try only counts. Choose the 3 hardest words and write them on a sticky note for your wall.</p><button class="btn" id="re">Play again</button>`);$('#re').onclick=()=>V.spell();return}
  const [w,s]=Q[i];let tries=0,hc=0;
  shell('spell',`<p class="piles">Word ${i+1} / ${Q.length}</p><h1 class="q">Listen and type the word</h1><div class="row"><button class="btn" id="l1">🔊 Word</button><button class="btn alt" id="l2">🐢 Slowly</button><button class="btn alt" id="l3">🔊 In a sentence</button></div><p class="lead" style="margin-top:18px" id="hint"></p><input class="inp" id="in" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Type here…" aria-label="Your answer"><div class="row" style="margin-top:12px"><button class="btn" id="ck">Check</button><button class="btn alt" id="hn">Hint</button><button class="btn alt" id="nx" style="display:none">Next →</button></div><div class="fb" id="fb"></div>`);
  $('#l1').onclick=()=>speak(w,.85);$('#l2').onclick=()=>speak(w,.45);$('#l3').onclick=()=>speak(s,.9);
  $('#hn').onclick=()=>{hc=Math.min(hc+1,w.length-1);$('#hint').textContent=w.split('').map((c,n)=>n<hc?c:'_').join(' ')+`  (${w.length} letters)`;$('#hn').textContent=hc>=w.length-1?'Hint (all shown)':'Hint +1 letter'};
  const chk=()=>{const v=$('#in').value.trim().toLowerCase();if(!v)return;if(v===w){if(!tries)sc++;$('#in').className='inp ok';$('#fb').textContent='✅ '+s;$('#fb').classList.add('on');$('#nx').style.display='inline-block';$('#ck').disabled=true}else{tries++;$('#in').className='inp no';$('#fb').textContent=tries>1?'Not yet. The word is: '+w:'Not quite. Listen again or tap Hint to see a letter.';$('#fb').classList.add('on');if(tries>1)$('#nx').style.display='inline-block'}};
  $('#ck').onclick=chk;$('#in').onkeydown=e=>{if(e.key==='Enter')chk()};$('#nx').onclick=()=>{i++;draw()};setTimeout(()=>{const l=$('#l1');l&&l.click()},200)};
 draw()};
/* 7 match */
V.match=function(){let L=0,R=0;const W=WORDS;const lang=['PT','ES','TR','EN'],lname=['Português','Español','Türkçe','Easy English'];
 const draw=()=>{const set=W.slice(R*6,R*6+6);let sel=null,ok=0,err=0;
  const R2=shuf(set);
  shell('match',`<h1>Translation Match</h1><p class="lead">Tap a word on the left, then tap its partner on the right. Choose your language, then play all 4 rounds.</p>
  <div class="chips">${lname.map((n,i)=>`<button class="chip ${i===L?'on':''}" data-l="${i}">${n}</button>`).join('')}</div>
  <div class="chips">${[0,1,2,3].map(i=>`<button class="chip ${i===R?'on':''}" data-r="${i}">Round ${i+1}</button>`).join('')}</div>
  <div class="mgrid"><div class="mcol">${set.map(w=>`<button class="mi" data-k="${w.w}"><span>${w.w}</span><span class="ab" data-s="${w.w}" role="button" tabindex="0" aria-label="Hear ${norm(w.w)}">🔊</span></button>`).join('')}</div>
  <div class="mcol">${R2.map(w=>`<button class="mi tr" data-t="${w.w}">${TR[w.w][L]}</button>`).join('')}</div></div><p class="msg" id="ms"></p><div class="fb" id="fb"></div>`);
  $('#app').onclick=e=>{
   const lc=e.target.closest('[data-l]');if(lc){L=+lc.dataset.l;draw();return}
   const rc=e.target.closest('[data-r]');if(rc){R=+rc.dataset.r;draw();return}
   const sp=e.target.closest('[data-s]');if(sp){e.stopPropagation();speak(norm(sp.dataset.s),.85)}
   const l=e.target.closest('.mi[data-k]');if(l&&!l.classList.contains('ok')){$$('.mi[data-k]').forEach(x=>x.classList.remove('sel'));l.classList.add('sel');sel=l.dataset.k;return}
   const t=e.target.closest('.mi[data-t]');if(t&&sel&&!t.classList.contains('ok')){
     if(t.dataset.t===sel){t.classList.add('ok');const li=$$('.mi[data-k]').find(x=>x.dataset.k===sel);li.classList.remove('sel');li.classList.add('ok');sel=null;ok++;if(ok===6){$('#fb').textContent=`✅ Round complete! Mistakes: ${err}.`;$('#fb').classList.add('on');LS.mt=LS.mt||{};LS.mt[L+'-'+R]=1;if(Object.keys(LS.mt).length>=4)LS.done.match=1;sv()}}
     else{err++;t.classList.add('no');setTimeout(()=>t.classList.remove('no'),500);$('#ms').textContent='Mistakes: '+err}}};
 };
 draw()};
home();
</script></body></html>
