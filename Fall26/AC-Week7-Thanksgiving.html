<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Week 7 · Thanksgiving: Host and Guest</title>
<style>
:root{--navy:#1f3a5f;--gold:#e0a526;--green:#2e8b57;--red:#c0392b;--bg:#f6f3ec;--ink:#1d2433}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.45}
.wrap{max-width:860px;margin:0 auto;padding:14px}
header{display:flex;align-items:center;gap:10px}.logo{font-weight:800;letter-spacing:.08em;color:var(--navy);font-size:13px}
.tag{margin-left:auto;font-size:12px;background:var(--navy);color:#fff;padding:3px 10px;border-radius:99px}
.tabs{display:flex;gap:6px;margin:10px 0}
.tab{flex:1;border:2px solid var(--navy);background:#fff;color:var(--navy);border-radius:10px;padding:6px 0;font-weight:800;font-size:15px;cursor:pointer}
.tab.on{background:var(--navy);color:#fff}.tab.done{border-color:var(--green)}
.card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 2px 8px #0002}
h1{margin:0 0 2px;font-size:22px;color:var(--navy)}.ins{margin:0 0 12px;color:#445}
.sc{margin-top:12px;font-weight:700;color:var(--navy)}
.nav{display:flex;justify-content:space-between;margin:12px 0}
.nav button{background:var(--navy);color:#fff;border:0;border-radius:10px;padding:10px 20px;font-size:16px;font-weight:700;cursor:pointer}
.nav button:disabled{opacity:.35}.nav button.go{background:var(--green)}
.words{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{display:flex;align-items:center;gap:6px;background:#fff;border:2px solid var(--navy);color:var(--navy);border-radius:12px;padding:8px 12px;font-size:17px;font-weight:700;cursor:pointer}
.chip.sel{background:var(--gold);border-color:var(--gold);color:#222}.chip.done{background:var(--green);border-color:var(--green);color:#fff;cursor:default}
.chip .sp{font-size:15px;background:none;border:0;cursor:pointer;padding:0 2px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}}
.pic{background:#fff;border:3px solid transparent;border-radius:14px;overflow:hidden;cursor:pointer;box-shadow:0 2px 6px #0002;position:relative}
.pic img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.pic .n{position:absolute;top:6px;left:6px;background:var(--navy);color:#fff;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px}
.pic .cap{padding:6px;text-align:center;min-height:50px;font-weight:700;color:var(--green)}.pic .cap small{display:block;color:#555;font-weight:500;font-size:12.5px}
.pic.sel{border-color:var(--gold)}.pic.done{border-color:var(--green);cursor:default}.pic.bad{animation:sh .35s;border-color:var(--red)}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.it{border:2px solid var(--navy);border-radius:10px;padding:9px;margin-bottom:8px;background:#fff;font-size:16px;cursor:pointer;display:flex;gap:6px;align-items:center}
.it.sel{background:var(--gold);border-color:var(--gold)}.it.ok{background:var(--green);border-color:var(--green);color:#fff;cursor:default}.it.bad{animation:sh .35s;border-color:var(--red)}
.sp{background:none;border:0;cursor:pointer;font-size:16px;padding:0 2px}
.q{border:1px solid #ddd;border-radius:12px;padding:10px 12px;margin-bottom:10px}
.q .qt{font-size:17px;margin-bottom:8px}.opts{display:flex;gap:8px;flex-wrap:wrap}
.o{border:2px solid var(--navy);background:#fff;color:var(--navy);border-radius:10px;padding:7px 14px;font-size:16px;font-weight:700;cursor:pointer;text-align:left}
.o.ok{background:var(--green);border-color:var(--green);color:#fff}.o.bad{background:#fbe3e0;border-color:var(--red);color:var(--red)}
.mc .opts{flex-direction:column}.mc .o{width:100%}
.aft{margin-top:6px;font-size:14px;color:#2a7;font-weight:600}
.read{font-size:17px;line-height:1.7}.read p{margin:0 0 10px}
.g{border-bottom:2px dotted var(--green);cursor:pointer;color:var(--navy);font-weight:600;position:relative}
.t{background:#fff3c4;border-bottom:2px solid var(--gold);cursor:pointer;color:var(--navy);font-weight:700;position:relative;padding:0 2px;border-radius:3px}
.tip{display:none;position:absolute;bottom:130%;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:4px 10px;border-radius:8px;font-size:13px;font-weight:500;white-space:nowrap;z-index:5}
.open>.tip{display:block}
.legend{font-size:13px;color:#555;margin-bottom:8px}
h2{font-size:18px;color:var(--navy);margin:16px 0 6px}
.warn{display:none;background:#fbe3e0;border:2px solid var(--red);border-radius:10px;padding:8px;margin-bottom:10px;color:var(--red);font-weight:600;font-size:14px}
</style></head><body><div class="wrap">

const GT={"big family dinner":"grande jantar em família","set the table":"pôr a mesa","tablecloth":"toalha de mesa","napkins":"guardanapos","cutlery":"talheres","mashed potatoes with gravy":"purê de batatas com molho","cranberry sauce":"molho de cranberry","warm welcome":"recepção calorosa","offer a drink":"oferecer uma bebida","help yourself":"sirva-se","make yourself at home":"fique à vontade","bring a dish":"levar um prato","homemade dessert":"sobremesa caseira","take off their shoes":"tirar os sapatos","take off your shoes":"tirar os sapatos","slippers":"chinelos / pantufas","do the dishes":"lavar a louça","host":"anfitrião(ã)","guests":"convidados","guest":"convidado(a)","leftovers":"sobras de comida","pass the gravy":"passar o molho"};
const GW={"harvest":"colheita","parade":"desfile","relatives":"parentes","thankful":"grato(a)","turkey":"peru","pumpkin pie":"torta de abóbora","sales":"promoções","side dish":"acompanhamento","bottle":"garrafa","fourth":"quarto","plan":"planejar","menu":"cardápio"};
const ALL=Object.assign({},GW,GT);const keys=Object.keys(ALL).sort((a,b)=>b.length-a.length);
const RE=new RegExp("(?<![\\w-])("+keys.map(k=>k.replace(/[-]/g,'\\-')).join("|")+")(?![\\w-])","gi");
function mark(t){return t.replace(RE,m=>{const k=Object.keys(ALL).find(x=>x.toLowerCase()===m.toLowerCase());return `<span class="${GT[k]!==undefined?'t':'g'}" data-say="${k}">${m}<span class="tip">${ALL[k]}</span></span>`})}
const READ=["Thanksgiving is on the fourth Thursday in November. Many Americans have a big family dinner with relatives and friends. The tradition comes from a harvest meal in 1621 in Plymouth, Massachusetts. The Pilgrims and the Wampanoag people shared food together. Today, people watch a parade and American football on TV. At the table, many people say what they are thankful for. On Friday, many people go shopping because stores have big sales.",
"The host plans the menu and cooks the turkey. Before the party, the host will set the table: a tablecloth, plates, napkins and cutlery for every guest. The table has turkey, mashed potatoes with gravy, cranberry sauce and pumpkin pie. When guests arrive, the host gives them a warm welcome and will offer a drink. The host often says, “Make yourself at home!” At dinner, a guest says, “Could you pass the gravy, please?” and the host says, “Help yourself!”",
"A good guest asks, “What can I bring?” Many guests bring a dish, like a homemade dessert or a side dish. Flowers or a bottle of juice or wine are also nice, but they are not required. Shoes depend on the home. In some homes, guests take off their shoes at the door, and the host may offer slippers. In many homes, people keep their shoes on. Watch the host, or ask: “Should I take off my shoes?” After dinner, guests often offer to do the dishes. Some hosts say, “Please relax,” and some say, “Yes, thank you!” At the end, many guests take leftovers home."];
function setDone(k,ok,tot){SC[k]={ok,tot,done:1};renderTabs()}
function sl(k){const s=SC[k];return s?`First-try score: ${s.ok} / ${s.tot}`:''}
function renderTabs(){$('#tabs').innerHTML=PG.map((p,i)=>`<button class="tab${i==cur?' on':''}${SC['p'+i]&&SC['p'+i].done?' done':''}" onclick="go(${i})">${i+1}</button>`).join('')}
function frame(t,i,ex){return `<h1>${t}</h1><p class="ins">${i}</p><div class="warn" id="warn">Sound could not start. Open this file in Chrome or Safari and turn up the volume.</div>${ex||''}`}
/* P1 pictures */
function p1(){const key='p0';let selP=null,selW=null,done={},bad={};const order=sh(PICS);
 $('#card').innerHTML=frame('What is it?','Tap a picture, then tap the English word. Tap 🔊 to listen.','<div class="words" id="w"></div><div class="grid" id="g"></div><div class="sc" id="s"></div>');
 const draw=()=>{$('#g').innerHTML=PICS.map((d,i)=>`<div class="pic${done[d[0]]?' done':''}${selP===d[0]?' sel':''}" data-id="${d[0]}"><span class="n">${i+1}</span><img src="${IM[d[0]]}" alt=""><div class="cap">${done[d[0]]?d[1]+'<small>'+d[2]+'</small>':'&nbsp;'}</div></div>`).join('');
  $('#w').innerHTML=order.map(d=>`<div class="chip${done[d[0]]?' done':''}${selW===d[0]?' sel':''}" data-id="${d[0]}"><span>${d[1]}</span><button class="sp">🔊</button></div>`).join('');
  document.querySelectorAll('.pic').forEach(e=>e.onclick=()=>{if(done[e.dataset.id])return;selP=selP===e.dataset.id?null:e.dataset.id;chk()});
  document.querySelectorAll('.chip').forEach(e=>{e.querySelector('.sp').onclick=ev=>{ev.stopPropagation();say(PICS.find(x=>x[0]===e.dataset.id)[1])};e.onclick=()=>{if(done[e.dataset.id])return;selW=selW===e.dataset.id?null:e.dataset.id;say(PICS.find(x=>x[0]===e.dataset.id)[1]);chk()}})};
 const fin=()=>{const n=Object.keys(done).length;if(n==PICS.length){setDone(key,PICS.length-Object.keys(bad).length,PICS.length)}$('#s').textContent=n==PICS.length?'🎉 '+sl(key):`Matched: ${n} / ${PICS.length}`};
 const chk=()=>{if(selP&&selW){if(selP===selW){done[selP]=1;selP=selW=null;draw();fin()}else{bad[selP]=1;const id=selP;selP=selW=null;draw();const el=document.querySelector(`.pic[data-id="${id}"]`);el.classList.add('bad');setTimeout(()=>el.classList.remove('bad'),400)}}else draw()};
 draw();fin()}
/* P2 match */
function p2(){const key='p1';let L=sh(COL),R=sh(COL);for(let n=0;n<20&&R.some((x,i)=>x===L[i]);n++)R=sh(COL);let sel=null,done={},bad={};
 $('#card').innerHTML=frame('Match to Portuguese','Verbs and adjectives that go together. Tap the English phrase, then its Portuguese meaning.','<div class="cols" id="m"></div><div class="sc" id="s"></div>');
 const draw=()=>{$('#m').innerHTML=`<div>${L.map(x=>`<div class="it${done[x[0]]?' ok':''}${sel===x[0]?' sel':''}" data-l="${x[0]}"><button class="sp">🔊</button>${x[0]}</div>`).join('')}</div><div>${R.map(x=>`<div class="it${done[x[0]]?' ok':''}" data-r="${x[0]}">${x[1]}</div>`).join('')}</div>`;
  document.querySelectorAll('[data-l]').forEach(e=>e.onclick=ev=>{const k=e.dataset.l;if(ev.target.classList.contains('sp')){say(k);return}if(done[k])return;sel=sel===k?null:k;if(sel)say(k);draw()});
  document.querySelectorAll('[data-r]').forEach(e=>e.onclick=()=>{const k=e.dataset.r;if(done[k]||!sel)return;if(k===sel){done[k]=1;sel=null;draw();fin()}else{bad[sel]=1;sel=null;draw();const el=document.querySelector(`[data-r="${k}"]`);el.classList.add('bad');setTimeout(()=>el.classList.remove('bad'),400)}})};
 const fin=()=>{const n=Object.keys(done).length;if(n==COL.length)setDone(key,COL.length-Object.keys(bad).length,COL.length);$('#s').textContent=n==COL.length?'🎉 '+sl(key):`Matched: ${n} / ${COL.length}`};draw();fin()}
/* P3 reading + TF */
function p3(){const key='p2';let st={},bad={};
 $('#card').innerHTML=frame('Reading: Hosting a Thanksgiving Party','Read. Tap the gold and dotted words for Portuguese.',`<div class="legend"><span class="t">gold</span> = target expressions · <span class="g">dotted</span> = helpful words</div><div class="read">${READ.map(p=>`<p>${mark(p)}</p>`).join('')}</div><h2>True or False?</h2><div id="w"></div><div class="sc" id="s"></div>`);
 const draw=()=>{$('#w').innerHTML=TF.map((x,i)=>`<div class="q"><div class="qt">${i+1}. ${x[0]}</div><div class="opts"><button class="o${st[i]&&x[1]?' ok':''}" data-i="${i}" data-a="1" ${st[i]?'disabled':''}>True</button><button class="o${st[i]&&!x[1]?' ok':''}" data-i="${i}" data-a="0" ${st[i]?'disabled':''}>False</button></div>${st[i]?`<div class="aft">✔ ${x[2]}</div>`:''}</div>`).join('');
  document.querySelectorAll('#w .o').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if((b.dataset.a==='1')===TF[i][1]){st[i]=1;draw();fin()}else{bad[i]=1;b.classList.add('bad')}})};
 const fin=()=>{const n=Object.keys(st).length;if(n==TF.length)setDone(key,TF.length-Object.keys(bad).length,TF.length);$('#s').textContent=n==TF.length?'🎉 '+sl(key):`Done: ${n} / ${TF.length}`};draw();fin()}
/* P4 MCQ */
function p4(){const key='p3';let st={},bad={};
 $('#card').innerHTML=frame('Thanksgiving in the U.S.','Choose the best answer. You can go back to the reading.','<div id="w" class="mc"></div><div class="sc" id="s"></div>');
 const draw=()=>{$('#w').innerHTML=MC.map((x,i)=>`<div class="q"><div class="qt">${i+1}. ${x[0]}</div><div class="opts">${x[1].map((o,j)=>`<button class="o${st[i]&&j==x[2]?' ok':''}" data-i="${i}" data-j="${j}" ${st[i]?'disabled':''}>${'abcd'[j]}) ${o}</button>`).join('')}</div></div>`).join('');
  document.querySelectorAll('#w .o').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(+b.dataset.j===MC[i][2]){st[i]=1;draw();fin()}else{bad[i]=1;b.classList.add('bad')}})};
 const fin=()=>{const n=Object.keys(st).length;if(n==MC.length){setDone(key,MC.length-Object.keys(bad).length,MC.length)}let t=0,tt=0;Object.keys(SC).forEach(k=>{t+=SC[k].ok;tt+=SC[k].tot});$('#s').textContent=n==MC.length?'🎉 '+sl(key)+` · Total, all pages: ${t} / ${tt}`:`Done: ${n} / ${MC.length}`};draw();fin()}
const PG=[p1,p2,p3,p4];
function go(i){cur=i;renderTabs();PG[i]();$('#bk').disabled=i==0;$('#nx').disabled=i==PG.length-1;scrollTo(0,0)}
$('#bk').onclick=()=>go(cur-1);$('#nx').onclick=()=>go(cur+1);
setInterval(()=>{$('#nx').className=(SC['p'+cur]&&SC['p'+cur].done)?'go':''},400);
document.addEventListener('click',e=>{const w=e.target.closest('.g,.t');document.querySelectorAll('.open').forEach(x=>{if(x!==w)x.classList.remove('open')});if(!w)return;w.classList.toggle('open');say(w.dataset.say)});
go(0);
