<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Everyday Use · Before You Read · Approach ISC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --dark:#0b1827; --navy:#0e2a47; --red:#9d251a; --blue:#418abd; --gray:#e8e8e8; --gold:#9a7c46;
    --muted:#5b6776; --tint:rgba(65,138,189,.13);
    --font:'Montserrat',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:var(--font);color:var(--dark);background:#fff;display:flex;flex-direction:column;min-height:100dvh;-webkit-font-smoothing:antialiased}
  button{font-family:inherit}

  /* header */
  header{padding:14px 22px 12px;border-bottom:2px solid var(--gold);display:flex;align-items:center;gap:12px}
  header img{height:40px;width:auto;display:block}
  .htext{line-height:1.25}
  .htext b{display:block;font-size:14px;font-weight:700;color:var(--navy);letter-spacing:.01em}
  .htext span{font-size:12px;color:var(--muted);font-weight:500}

  /* progress */
  .progress{display:flex;gap:6px;max-width:760px;width:100%;margin:18px auto 0;padding:0 22px}
  .seg{flex:1;height:5px;border:0;padding:0;border-radius:3px;background:var(--gray);cursor:pointer;transition:background .25s}
  .seg.done{background:var(--blue)}
  .seg.now{background:var(--navy)}

  /* stage */
  main{flex:1;width:100%;max-width:760px;margin:0 auto;padding:26px 22px 8px}
  .tag{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--blue);margin:0 0 14px}
  .q{font-size:clamp(26px,5.6vw,38px);line-height:1.2;font-weight:700;color:var(--navy);margin:0 0 26px;letter-spacing:-.01em}
  .more{list-style:none;margin:0;padding:0;display:grid;gap:14px}
  .more li{font-size:clamp(17px,3.2vw,20px);line-height:1.5;font-weight:500;padding-left:18px;border-left:3px solid var(--gold)}
  .callout{margin-top:26px;background:#f4f5f7;border-radius:10px;padding:14px 16px;font-size:16px;line-height:1.5;font-weight:500}
  .callout b.lbl{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--red);margin-bottom:4px}
  .endlogo{display:block;margin:30px auto 0;width:110px;height:auto;opacity:.9}

  .card.enter-next{animation:inNext .3s ease both}
  .card.enter-back{animation:inBack .3s ease both}
  @keyframes inNext{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
  @keyframes inBack{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.card.enter-next,.card.enter-back{animation:none}}

  /* tappable words */
  .w{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;
     border-bottom:2px dotted var(--blue);line-height:inherit;-webkit-tap-highlight-color:transparent}
  .w:hover{background:var(--tint)}
  .w.pp{border-bottom:0;background:var(--tint);font-weight:700;color:var(--navy);padding:1px 6px;border-radius:5px;box-shadow:inset 0 -2px 0 var(--red)}
  .w.pp:hover{background:rgba(65,138,189,.24)}
  .w:focus-visible,.btn:focus-visible,.seg:focus-visible,.ab:focus-visible,.x:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

  /* footer / nav */
  .legend{max-width:760px;margin:0 auto;width:100%;padding:0 22px 10px;font-size:12px;color:var(--muted);font-weight:500;display:flex;gap:18px;flex-wrap:wrap}
  .legend i{font-style:normal}
  .legend .d{border-bottom:2px dotted var(--blue)}
  .legend .p{background:var(--tint);padding:0 5px;border-radius:4px;box-shadow:inset 0 -2px 0 var(--red);color:var(--navy);font-weight:700}
  nav{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--gray);padding:12px 22px calc(12px + env(safe-area-inset-bottom))}
  .navin{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px}
  .count{flex:1;text-align:center;font-size:13px;font-weight:600;color:var(--muted)}
  .btn{border:0;border-radius:999px;padding:14px 26px;font-size:16px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:transform .12s,background .2s}
  .btn:active{transform:scale(.97)}
  .btn.next{background:var(--navy);color:#fff}
  .btn.next:hover{background:var(--dark)}
  .btn.back{background:none;color:var(--navy);padding:14px 16px}
  .btn.back:hover{background:var(--tint)}
  .btn[disabled]{opacity:.3;cursor:default}
  .btn svg{width:18px;height:18px}

  /* dictionary sheet */
  #scrim{position:fixed;inset:0;background:rgba(11,24,39,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
  #scrim.on{opacity:1;pointer-events:auto}
  #sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,105%);width:min(600px,100%);background:#fff;border-radius:18px 18px 0 0;
         box-shadow:0 -10px 40px rgba(11,24,39,.25);padding:22px 22px calc(24px + env(safe-area-inset-bottom));z-index:30;transition:transform .25s ease;border-top:4px solid var(--gold)}
  #sheet.on{transform:translate(-50%,0)}
  .x{position:absolute;top:12px;right:12px;width:38px;height:38px;border:0;border-radius:50%;background:#f4f5f7;cursor:pointer;color:var(--navy);display:grid;place-items:center}
  .x svg{width:18px;height:18px}
  .kind{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--blue);margin:0 0 6px}
  .kind.pp{color:var(--red)}
  #sw{font-size:30px;font-weight:700;color:var(--navy);margin:0;line-height:1.15;padding-right:44px}
  #spos{font-size:14px;color:var(--muted);font-style:italic;margin:2px 0 12px;font-weight:500}
  #sdef{font-size:18px;line-height:1.45;margin:0 0 12px;font-weight:500}
  #sex{font-size:16px;line-height:1.5;margin:0 0 16px;padding:10px 14px;border-left:3px solid var(--gold);background:#f9f6f0;color:#2b3442;font-style:italic}
  .audio{display:flex;gap:8px;flex-wrap:wrap}
  .ab{border:1.5px solid var(--navy);background:#fff;color:var(--navy);border-radius:999px;padding:9px 15px;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
  .ab:hover{background:var(--navy);color:#fff}
  .ab svg{width:17px;height:17px}
  .ab.playing{background:var(--blue);border-color:var(--blue);color:#fff}
  #noaudio{display:none;font-size:12px;color:var(--muted);margin-top:10px}

  main{max-width:820px}
  .reading p{font-size:clamp(17px,3.1vw,19px);line-height:1.7;margin:0 0 16px;font-weight:400}
  .reading p.lead{font-size:clamp(19px,3.5vw,22px);line-height:1.55;font-weight:500;color:var(--navy);border-left:4px solid var(--gold);padding-left:16px}
  .reading h2{font-size:20px;color:var(--navy);margin:30px 0 8px;font-weight:700}
  .reading ul{padding-left:20px;margin:0 0 16px}.reading li{font-size:clamp(17px,3.1vw,19px);line-height:1.65;margin-bottom:10px}
  .bookhead{display:flex;gap:22px;align-items:flex-start;margin-bottom:20px}
  .cover{width:150px;flex:none;border-radius:6px;box-shadow:0 8px 24px rgba(11,24,39,.3);height:auto}
  .byline{font-size:15px;line-height:1.5;color:var(--muted);margin:0 0 12px}.byline b{color:var(--dark);font-size:17px}
  .facts{display:flex;flex-wrap:wrap;gap:8px}.facts span{background:#f4f5f7;border-radius:8px;padding:6px 10px;font-size:13px;font-weight:600;color:var(--navy)}
  .facts i{display:block;font-style:normal;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--red);font-weight:700}
  .box{margin:0 0 14px;padding:14px 16px;border-radius:12px;background:#f9f6f0;border:1px solid #efe6d4}
  .box h3{margin:0 0 6px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
  .box p,.box li{font-size:clamp(16px,3vw,18px);line-height:1.6;margin:0}.box ul{padding-left:18px;margin:0}.box li{margin-bottom:8px}
  .box.why{background:#eef5fb;border-color:#d8e8f4}.box.why h3{color:var(--blue)}
  .box.warn{background:#fbeeec;border-color:#f0d3cf}.box.warn h3{color:var(--red)}
  @media(max-width:560px){.bookhead{flex-direction:column;align-items:center;text-align:left}.cover{width:170px}.bookhead>div{width:100%}}

  .intro{font-size:17px;line-height:1.6;margin:0 0 16px;color:#2b3442}
  .ents{display:grid;gap:12px}
  .ent{border:1px solid var(--gray);border-radius:12px;padding:12px 16px;background:#fff}
  .en{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.en h3{margin:0;font-size:21px;color:var(--navy)}
  .num{width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700}
  .pos{font-size:13px;font-style:italic;color:var(--muted)}
  .where{margin:6px 0 0;font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--red)}
  .seen{margin:4px 0;font-size:13px;color:var(--muted)}.seen b{color:var(--navy)}
  .df{margin:4px 0 8px;font-size:17px;line-height:1.5;font-weight:500}
  .exm{margin:0;font-size:15.5px;line-height:1.5;background:#f9f6f0;border-left:3px solid var(--gold);padding:8px 12px;font-style:italic;color:#2b3442}
  .ab.sm{padding:4px 9px;font-size:14px;margin-right:6px;font-style:normal}
  #flt{width:100%;font:inherit;font-size:16px;padding:12px 16px;border:2px solid var(--gray);border-radius:999px;margin-bottom:6px}
  #flt:focus{outline:none;border-color:var(--blue)}.cnt{font-size:12px;color:var(--muted);margin:0 0 12px}
</style>
</head>

 {w:'shove',pos:'verb',form:'shove',def:'to push someone or something roughly.',ex:'He shoved his hands in his pockets.'},
 {w:'shutters',pos:'noun',form:'shutters',def:'wooden or metal covers that close over a window.',ex:'We closed the shutters against the sun.'},
 {w:'shuffle',pos:'verb',form:'shuffle',def:'to walk slowly without lifting your feet.',ex:'The tired old man shuffled to the door.'},
 {w:'sidle',pos:'verb',form:'sidle',def:'to walk toward someone slowly and shyly.',ex:'The cat sidled up to the table.'},
 {w:'sledgehammer',pos:'noun',form:'sledgehammer',def:'a very big, heavy hammer with a long handle.',ex:'They broke the wall with a sledgehammer.'},
 {w:'snatch',pos:'verb',form:'snatched',def:'to take something quickly and roughly.',ex:'A boy snatched the ball from my hands.'},
 {w:'snuff',pos:'noun',form:'snuff',def:'finely ground tobacco, put in the mouth or nose.',ex:'Her grandmother used a little snuff every evening.'},
 {w:'soothing',pos:'adjective',form:'soothing',def:'making you feel calm and relaxed.',ex:'Soft music is soothing after a long day.'},
 {w:'stare down',pos:'phrasal verb',form:'stare down',def:'to look at someone for so long and so firmly that they look away first.',ex:'She stared down the angry customer without blinking.'},
 {w:'stitch',pos:'verb',form:'stitched, stitching',def:'to sew; to join pieces of cloth with a needle and thread.',ex:'She stitched the quilt by hand.'},
 {w:'stocky',pos:'adjective',form:'stocky',def:'short, with a strong, wide body.',ex:'The stocky man carried two heavy bags easily.'},
 {w:'stoop',pos:'verb',form:'stoops',def:'to bend forward and down.',ex:'He stooped to pick up the coin.'},
 {w:'stout',pos:'adjective',form:'stout',def:'rather fat and strong-looking. It sounds polite and old-fashioned.',ex:'The stout cook tasted the soup and smiled.'},
 {w:'stroke',pos:'verb',form:'stroking',def:'to move your hand gently over something.',ex:'She stroked the cat’s head.'},
 {w:'stumble',pos:'verb',form:'stumbles',def:'to nearly fall while walking; also, to read or speak with mistakes.',ex:'He stumbled over the hard words in the text.'},
 {w:'stumped',pos:'adjective',form:'stumped',def:'unable to answer a question or solve a problem.',ex:'The riddle left everyone stumped.'},
 {w:'tacky',pos:'adjective',form:'tacky',def:'cheap-looking and in bad taste.',ex:'The gold plastic fountain looked tacky.'},
 {w:'totter',pos:'verb',form:'tottering',def:'to walk in a weak, unsteady way, as if you might fall.',ex:'The toddler tottered across the room.'},
 {w:'weep',pos:'verb',form:'weep',def:'to cry, especially quietly, because you are very sad or moved. It’s literary.',ex:'They wept when they heard the news.'},
 {w:'whittle',pos:'verb',form:'whittle',def:'to cut wood into a shape by taking off small pieces with a knife.',ex:'He whittled a spoon from a branch.'},
 {w:'witty',pos:'adjective',form:'witty',def:'clever and funny with words.',ex:'Her witty answers made the audience laugh.'},
 {w:'wriggle',pos:'verb',form:'wriggling',def:'to twist and turn with small, quick movements.',ex:'The worm wriggled in the dirt.'}
];
function qa(s){return s.replace(/'/g,"&#39;").replace(/"/g,'&quot;')}
function row(x,n){return `<article class="ent"${n?'':''}>
  <div class="en">${n?`<span class="num">${n}</span>`:''}<h3>${x.w}</h3><span class="pos">${x.pos}</span>
   <button class="ab sm" data-say="${qa(x.say||x.w.replace(/\s*\(.*\)/,''))}" aria-label="Hear ${x.w}">🔊</button></div>
  ${x.where?`<p class="where">${x.where}</p>`:''}
  <p class="seen">In the story: <b>${x.form}</b></p>
  <p class="df">${x.def}</p>
  <p class="exm"><button class="ab sm" data-say="${qa(x.ex)}" aria-label="Hear the example">🔊</button> “${x.ex}”</p></article>`;}
const PAGES = [
{ html:`<p class="tag">Page 1 · Before You Read</p>
<h1 class="q">“Everyday Use”: who should keep the family’s history?</h1>
<div class="reading">
<p class="lead">Imagine your grandmother left you a quilt that she sewed by hand. Would you hang it on the wall to protect it, or put it on your bed and use it until it wears out? Alice Walker’s short story is about two sisters who answer that question in opposite ways.</p>
<div class="box"><h3>The author</h3><p>Alice Walker was born in 1944 in rural Georgia, the youngest of eight children in a family of {{sharecropper|sharecroppers}}. She became one of America’s best-known writers. Her novel <i>The Color Purple</i> won the Pulitzer Prize in 1983. “Everyday Use” came out in 1973.</p></div>
<div class="box"><h3>The story (no spoilers!)</h3><p>The narrator is “Mama,” a strong, practical woman who lives in the rural South with her shy daughter Maggie. One day her other daughter, Dee, comes home for a visit. Dee has changed a lot since she left. The story takes place around 1970, when many Black Americans were looking at their African roots with new pride.</p></div>
<div class="box why"><h3>Reading tips</h3><ul><li>It’s short, about 3,500 words. You can read it in one sitting.</li><li>Mama speaks in a Southern {{dialect}}, so some grammar will look “wrong” (“I been saving ’em”). That’s the author’s choice. Enjoy the voice, but don’t copy it in your essays.</li><li>Watch the three women: Mama, Maggie, and Dee. What does each one want?</li></ul></div>
</div>
<h2 style="color:var(--navy);margin:26px 0 10px;font-size:22px">Warm-up: talk in groups of 3 or 4</h2>
<ul class="more">
<li><b>1.</b> Think of something old and special in your family: a ring, a recipe, a photo, a piece of furniture. Who had it first? Who should get this {{heirloom}} next, and why?</li>
<li><b>2.</b> Do you save nice things for “special days” (the good plates, a perfume, a beautiful dress), or do you use them every day? Which is better: something beautiful in a box, or something beautiful that gets used and worn out?</li>
<li><b>3.</b> Have you, or has someone you know, ever changed a name, a style, or a way of life to feel closer to your {{roots}}, or to start a new life? How did the family react?</li>
<li><b>4.</b> Do you have {{sibling|siblings}}? Are you very different from each other? Who [[get out|got out]] of the small town, and who stayed close to home? Does education change how family members talk to each other?</li></ul>
<div class="callout"><b class="lbl">Group task</b>Pick one question and talk for three minutes. Then tell the class the most surprising answer in your group.</div>` },

{ html:`<p class="tag">Page 2 · Key Words, In Order of Appearance</p>
<h1 class="q">18 words you’ll meet as you read</h1>
<p class="intro">These words carry the story’s big ideas. They appear in this order, so keep the page open while you read. Tap 🔊 to hear the word or the example.</p>
<div class="ents">__K__</div>` },

{ html:`<p class="tag">Page 3 · Word Bank, A to Z</p>
<h1 class="q">Challenging words from the story</h1>
<p class="intro">These are the hardest words and phrases that don’t come from Latin. Many are old English or Southern farm words that are fun to know, but you don’t need to learn all of them. Look at them before reading, and come back when you’re stuck. Latin-based words (like <i>oppress</i> and <i>heritage</i>) are on page 2.</p>
<input id="flt" type="search" placeholder="Search a word…" aria-label="Search words">
<p class="cnt" id="cnt"></p>
<div class="ents" id="glist">__G__</div>`,
 after(el){ const f=el.querySelector('#flt'); if(!f) return; const items=[...el.querySelectorAll('#glist .ent')];
   const c=el.querySelector('#cnt'); const upd=()=>{ const q=f.value.trim().toLowerCase(); let n=0; items.forEach(x=>{ const m=!q||x.textContent.toLowerCase().includes(q); x.style.display=m?'':'none'; if(m)n++; }); c.textContent=n+' of '+items.length+' words'; }; f.oninput=upd; upd(); } }
];
PAGES[1].html=PAGES[1].html.replace('__K__',K.map((x,i)=>row(x,i+1)).join(''));
PAGES[2].html=PAGES[2].html.replace('__G__',G.map(x=>row(x,0)).join(''));

const CARDS=PAGES;
/* ---------- RENDER ---------- */
const $ = s => document.querySelector(s);
const esc = s => s;
let i = 0;
function md(t){
  return t
    .replace(/\{\{([^}|]+)(?:\|([^}]+))?\}\}/g,(m,k,s)=>`<button class="w" data-k="${k}">${s||k}</button>`)
    .replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g,(m,k,s)=>`<button class="w pp" data-k="${k}">${s||k}</button>`);
}
function render(dir){
  const c = CARDS[i];
  const el = $('#card');
  el.className = 'card' + (dir ? ' enter-'+dir : '');
  el.innerHTML = md(c.html); if(c.after) c.after(el);
  $('#count').textContent = `Page ${i+1} / ${CARDS.length}`;
  $('#back').disabled = i===0;
  $('#nextlbl').textContent = i===CARDS.length-1 ? 'Start over' : 'Next';
  document.querySelectorAll('.seg').forEach((s,n)=>{ s.className='seg'+(n<i?' done':n===i?' now':''); s.setAttribute('aria-current', n===i?'step':'false'); });
  window.scrollTo({top:0});
}
function go(n){
  closeSheet();
  const dir = n>i ? 'next' : 'back';
  i = (n+CARDS.length)%CARDS.length;
  render(n===i||n>i ? dir : 'back');
}
(function init(){
  const p = $('#progress');
  CARDS.forEach((_,n)=>{ const b=document.createElement('button'); b.className='seg'; b.setAttribute('aria-label','Go to card '+(n+1)); b.onclick=()=>go(n); p.appendChild(b); });
  render();
  $('#next').onclick = ()=> i===CARDS.length-1 ? (closeSheet(), i=0, render('next')) : go(i+1);
  $('#back').onclick = ()=> go(i-1);
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape') closeSheet();
    if($('#sheet').classList.contains('on')) return;
    if(e.key==='ArrowRight') $('#next').click();
    if(e.key==='ArrowLeft' && i>0) go(i-1);
  });
  CARDS.forEach(c=>{ (c.html.match(/(?:\{\{|\[\[)([^}\]|]+)/g)||[]).forEach(m=>{ const k=m.slice(2); if(!D[k]) console.warn('Missing entry:',k); }); });
  })();

/* ---------- DICTIONARY SHEET ---------- */
let cur = null, opener = null;
document.addEventListener('click',e=>{
  const w = e.target.closest('.w'); if(!w) return;
  openSheet(w.dataset.k, w);
});
function openSheet(k, from){
  const d = D[k]; if(!d) return;
  cur = d; opener = from;
  $('#skind').textContent = d.pp ? 'Power phrase' : 'Dictionary';
  $('#skind').className = 'kind' + (d.pp?' pp':'');
  $('#sw').textContent = k;
  $('#spos').textContent = d.pos;
  $('#sdef').textContent = d.def;
  $('#sex').textContent = '“' + d.ex + '”';
  $('#sheet').classList.add('on'); $('#scrim').classList.add('on');
  $('#sheet').setAttribute('aria-hidden','false');
  setTimeout(()=>{ $('#a-word').focus({preventScroll:true}); speak(d.say||k, 0.92, $('#a-word')); }, 60);
}
function closeSheet(){
  if(!$('#sheet').classList.contains('on')) return;
  $('#sheet').classList.remove('on'); $('#scrim').classList.remove('on');
  $('#sheet').setAttribute('aria-hidden','true');
  if('speechSynthesis' in window) speechSynthesis.cancel();
  if(opener) opener.focus({preventScroll:true});
}
$('#close').onclick = closeSheet;
$('#scrim').onclick = closeSheet;

/* ---------- AUDIO (browser text-to-speech, US English) ---------- */
let voice = null;
function pickVoice(){
  if(!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices().filter(v=>/^en[-_]US/i.test(v.lang));
  const pref = ['Samantha','Ava','Allison','Google US English','Microsoft Aria','Microsoft Jenny','Alex','Zira'];
  voice = pref.map(n=>vs.find(v=>v.name.includes(n))).find(Boolean) || vs[0] || null;
}
if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
else { $('#noaudio').style.display='block'; document.querySelector('.audio').style.display='none'; }

function speak(text, rate, btn){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  document.querySelectorAll('.ab').forEach(b=>b.classList.remove('playing'));
  const u = new SpeechSynthesisUtterance(text);
  u.lang='en-US'; if(voice) u.voice=voice; u.rate=rate; u.pitch=1;
  if(btn){ btn.classList.add('playing'); u.onend=u.onerror=()=>btn.classList.remove('playing'); }
  speechSynthesis.speak(u);
}
$('#a-word').onclick = e=> cur && speak(cur.say, 0.92, e.currentTarget);
$('#a-slow').onclick = e=> cur && speak(cur.say, 0.5, e.currentTarget);
$('#a-ex').onclick   = e=> cur && speak(cur.ex, 0.95, e.currentTarget);
</script>
