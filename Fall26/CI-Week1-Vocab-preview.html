<style>
/* Layout: one centered card at a time. Small logo and counter on top, thin progress bar, Next pinned under the card. */
:root {
  --navy: #14223f;
  --gold: #86683a;
  --bg: #f3f4f8;
  --card: #ffffff;
  --fg: #14223f;
  --muted: #5a6479;
  --line: #d9dce6;
  --band: #a8924f;
  --btn-bg: #14223f;
  --btn-fg: #ffffff;
  --soft: #eceef5;
  --ok: #1f6b45;
  --ok-bg: #e3f3ea;
  --bad: #9c3a2a;
  --bad-bg: #f8e7e3;
  --logo-filter: none;
  --font-display: "Montserrat", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Source Serif 4", Georgia, "Times New Roman", serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --gold: #c9ad6e;
    --bg: #0c1429;
    --card: #14223f;
    --fg: #eef0f6;
    --muted: #a6aec2;
    --line: #2a3a5e;
    --btn-bg: #c9ad6e;
    --btn-fg: #14223f;
    --soft: #1b2c52;
    --ok: #7fd1a1;
    --ok-bg: #163a2b;
    --bad: #f0a090;
    --bad-bg: #3f2320;
    --logo-filter: brightness(0) invert(0.93);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --gold: #c9ad6e;
  --bg: #0c1429;
  --card: #14223f;
  --fg: #eef0f6;
  --muted: #a6aec2;
  --line: #2a3a5e;
  --btn-bg: #c9ad6e;
  --btn-fg: #14223f;
  --soft: #1b2c52;
  --ok: #7fd1a1;
  --ok-bg: #163a2b;
  --bad: #f0a090;
  --bad-bg: #3f2320;
  --logo-filter: brightness(0) invert(0.93);
  color-scheme: dark;
}

body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  padding-inline: 16px;
  padding-block: 20px 32px;
}
.wrap { max-width: 640px; margin-inline: auto; display: flex; flex-direction: column; gap: 18px; }

header { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.logo { height: 30px; width: auto; max-width: 60%; display: block; filter: var(--logo-filter); }
.count { font-family: var(--font-display); font-weight: 600; font-size: 0.75rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold); font-variant-numeric: tabular-nums; white-space: nowrap; }

.bar { display: grid; grid-template-columns: repeat(12, 1fr); gap: 4px; }
.bar i { height: 3px; background: var(--line); display: block; }
.bar i.on { background: var(--gold); }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 2px; display: flex; flex-direction: column; min-width: 0; }
.card-body { padding: 28px 24px 26px; display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.band { height: 8px; background: var(--band); }
.meta { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-family: var(--font-display); font-size: 0.72rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; }
.meta .topic { color: var(--gold); }
.meta .tag { color: var(--muted); }

h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(1.5rem, 6vw, 2rem); line-height: 1.2; margin: 0; text-wrap: balance; overflow-wrap: anywhere; }
h2 { font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; letter-spacing: 0.02em; margin: 0; }
p { margin: 0; }

.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; counter-reset: s; }
.steps li { counter-increment: s; position: relative; padding-left: 40px; font-size: 1.08rem; line-height: 1.5; max-width: 65ch; }
.steps li::before { content: counter(s); position: absolute; left: 0; top: 1px; width: 26px; height: 26px; border: 1.5px solid var(--gold); border-radius: 50%; display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 0.78rem; color: var(--gold); }
.note { font-size: 0.95rem; line-height: 1.5; color: var(--muted); background: var(--soft); padding: 12px 14px; border-radius: 2px; }

.audio { display: flex; gap: 10px; flex-wrap: wrap; }
.sound { display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-display); font-weight: 600; font-size: 0.82rem; letter-spacing: 0.03em; color: var(--fg); background: transparent; border: 1px solid var(--gold); border-radius: 2px; padding: 10px 14px; min-height: 44px; cursor: pointer; }
.sound svg { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.sound:hover { background: var(--soft); }
.sound[aria-pressed="true"] { background: var(--soft); }
.audio-off { font-size: 0.9rem; color: var(--muted); }

.sentence { font-size: clamp(1.15rem, 4.4vw, 1.4rem); line-height: 1.5; max-width: 65ch; padding-block: 4px; }
.sentence strong { font-weight: 700; text-decoration: underline; text-decoration-color: var(--gold); text-decoration-thickness: 2px; text-underline-offset: 4px; }
.q { font-family: var(--font-display); font-weight: 600; font-size: 0.82rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }

.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { text-align: left; font-family: var(--font-body); font-size: 1.1rem; line-height: 1.35; color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: 2px; padding: 13px 16px; min-height: 52px; cursor: pointer; width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.opt:hover:not([disabled]) { background: var(--soft); border-color: var(--gold); }
.opt[disabled] { cursor: default; }
.opt.right { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); font-weight: 600; }
.opt.wrong { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
.opt.dim { opacity: 0.55; }
.opt .mark { font-family: var(--font-display); font-weight: 700; font-size: 0.78rem; letter-spacing: 0.04em; flex: none; }

.fb { min-height: 0; }
.fb .box { padding: 14px 16px; border-radius: 2px; font-size: 1.02rem; line-height: 1.5; max-width: 65ch; }
.fb .box.ok { background: var(--ok-bg); color: var(--fg); border-left: 4px solid var(--ok); }
.fb .box.no { background: var(--bad-bg); color: var(--fg); border-left: 4px solid var(--bad); }
.fb b { font-weight: 700; }
.fb .lab { font-weight: 700; }

.btn { font-family: var(--font-display); font-weight: 600; font-size: 0.9rem; letter-spacing: 0.03em; border-radius: 2px; cursor: pointer; padding: 13px 20px; min-height: 48px; border: 1px solid transparent; }
.btn.solid { background: var(--btn-bg); color: var(--btn-fg); }
.btn.solid:hover:not([disabled]) { opacity: 0.9; }
.btn.line { background: transparent; color: var(--fg); border-color: var(--line); }
.btn.line:hover { background: var(--soft); }
.btn[disabled] { opacity: 0.35; cursor: default; }
.start { align-self: flex-start; }
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

nav { display: flex; }
nav .btn { flex: 1; }

.score { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.score b { font-family: var(--font-display); font-size: 2.4rem; font-weight: 700; color: var(--gold); font-variant-numeric: tabular-nums; line-height: 1; }
.score span { font-size: 1.08rem; }
.review { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.review li { display: grid; grid-template-columns: minmax(0, 11rem) minmax(0, 1fr); gap: 4px 16px; padding-block: 10px; border-bottom: 1px solid var(--line); font-size: 0.98rem; line-height: 1.4; }
.review li b { font-family: var(--font-display); font-weight: 600; font-size: 0.88rem; }
.review li span { color: var(--muted); }
@media (max-width: 480px) { .review li { grid-template-columns: 1fr; } }

.fade { animation: fade 0.25s ease-out; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .fade { animation: none; } }
@media (max-width: 420px) { .card-body { padding: 22px 18px 20px; } }
</style>

var canSpeak = false;

function pickVoice() {
  if (!canSpeak) return;
  try {
    var list = window.speechSynthesis.getVoices() || [];
    var us = list.filter(function (v) { return v.lang && v.lang.replace("_", "-").toLowerCase() === "en-us"; });

}
if (canSpeak) {
  pickVoice();

function speak(text, rate, btn) {
  if (!canSpeak) return;
  try {
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);

  } catch (e) {}
}

function setProgress(done) {
  var h = "";
  for (var k = 0; k < N; k++) h += '<i class="' + (k < done ? "on" : "") + '"></i>';
  bar.innerHTML = h;
}

function show(html) {
  body.innerHTML = html;
  body.classList.remove("fade");
  void body.offsetWidth;
  body.classList.add("fade");
}

function renderIntro() {
  st.i = -1;
  nav.hidden = true;
  count.textContent = "Instructions";
  setProgress(0);
  show(
    '<div class="meta"><span class="topic">Vocabulary preview</span><span class="tag">12 words · about 10 min</span></div>' +
    '<h1>Before we begin</h1>' +
    '<ol class="steps">' +
      '<li>Read the sentence. The new word is in <strong>bold</strong>.</li>' +
      '<li>Click the speaker button to listen to how the word sounds.</li>' +
      '<li>Choose the answer that means almost the same as the bold word.</li>' +
      '<li>If your answer is not right, try again. When you are right, click Next.</li>' +
    '</ol>' +
    '<p class="note">Do not worry about mistakes. This is a preview. Use the other words in the sentence to help you guess.</p>' +
    '<button class="btn solid start" id="start" type="button">Start</button>'
  );
  document.getElementById("start").addEventListener("click", function () { go(0); });
}

function renderCard(n) {
  var c = words[n];
  st.i = n; st.solved = false; st.wrongOnce = false;
  nav.hidden = false;
  next.disabled = true;
  next.textContent = n === N - 1 ? "See results" : "Next";
  count.textContent = "Word " + (n + 1) + " of " + N;
  setProgress(n);

  var opts = shuffle([{ t: c.ok, ok: true }].concat(c.bad.map(function (t) { return { t: t, ok: false }; })));
  var optHtml = opts.map(function (o, k) {
    return '<button class="opt" type="button" data-ok="' + (o.ok ? "1" : "0") + '" id="opt' + k + '"><span>' + esc(o.t) + '</span><span class="mark"></span></button>';
  }).join("");

  var audio = canSpeak
    ? '<div class="audio">' +
        '<button class="sound" id="say-word" type="button" aria-pressed="false" aria-label="Listen to the word">' + ICON + 'Listen</button>' +
      '</div>'
    : '<p class="audio-off">Audio is not available on this device.</p>';

  show(
    '<div class="meta"><span class="topic">Word ' + (n + 1) + '</span><span class="tag">' + esc(c.pos) + '</span></div>' +
    '<h1>' + esc(c.w) + '</h1>' +
    audio +
    '<p class="sentence">' + fmt(c.s) + '</p>' +
    '<p class="q">Which choice means almost the same as the bold words?</p>' +
    '<div class="opts" role="group" aria-label="Answer choices">' + optHtml + '</div>' +
    '<div class="fb" id="fb"></div>'
  );

  if (canSpeak) {
    document.getElementById("say-word").addEventListener("click", function (e) { speak(c.say, 0.8, e.currentTarget); });
  }
  var btns = body.querySelectorAll(".opt");
  for (var i = 0; i < btns.length; i++) btns[i].addEventListener("click", onPick);
}

function onPick(e) {
  if (st.solved) return;
  var b = e.currentTarget;
  var c = words[st.i];
  var fb = document.getElementById("fb");
  if (b.getAttribute("data-ok") === "1") {
    st.solved = true;
    if (!st.wrongOnce) st.first[st.i] = true;
    var all = body.querySelectorAll(".opt");
    for (var i = 0; i < all.length; i++) {
      all[i].disabled = true;
      if (all[i] === b) {
        all[i].classList.add("right");
        all[i].querySelector(".mark").textContent = "Correct";
      } else if (!all[i].classList.contains("wrong")) {
        all[i].classList.add("dim");
      }
    }
    fb.innerHTML = '<div class="box ok"><span class="lab">' + esc(c.label) + '</span> means: ' + esc(c.def) + '.</div>';
    setProgress(st.i + 1);
    next.disabled = false;
    next.focus();
  } else {
    st.wrongOnce = true;
    st.first[st.i] = false;
    b.disabled = true;
    b.classList.add("wrong");
    b.querySelector(".mark").textContent = "Try again";
    fb.innerHTML = '<div class="box no">Not yet. Read the sentence again and choose another answer.</div>';
  }
}

function renderEnd() {
  st.i = N;
  nav.hidden = true;
  count.textContent = "Finished";
  setProgress(N);
  var score = st.first.filter(Boolean).length;
  var list = words.map(function (c) {
    return '<li><b>' + esc(c.label) + '</b><span>' + esc(c.def) + '</span></li>';
  }).join("");
  show(
    '<div class="meta"><span class="topic">Vocabulary preview</span><span class="tag">Complete</span></div>' +
    '<h1>Good work!</h1>' +
    '<div class="score"><b>' + score + '/' + N + '</b><span>right on the first try</span></div>' +
    '<p class="note">Compare your answers with a partner. Which words were new for you? You will use all 12 words again later in class.</p>' +
    '<h2>Your 12 words</h2>' +
    '<ul class="review">' + list + '</ul>' +
    '<button class="btn line start" id="again" type="button">Start again</button>'
  );
  document.getElementById("again").addEventListener("click", function () { st.first = []; renderIntro(); window.scrollTo(0, 0); });
}

function go(n) {
  try { if (canSpeak) window.speechSynthesis.cancel(); } catch (e) {}
  if (n >= N) renderEnd(); else renderCard(n);
  window.scrollTo(0, 0);
}

next.addEventListener("click", function () { if (st.solved) go(st.i + 1); });

renderIntro();
</script>

</body></html>
