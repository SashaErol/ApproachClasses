<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Désirée’s Baby · 10 Hard Words · Approach ISC</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--dark:#0b1827;--navy:#0e2a47;--red:#9d251a;--blue:#418abd;--gray:#e8e8e8;--gold:#9a7c46;--muted:#5b6776;--tint:rgba(65,138,189,.13);--ok:#2e7d4f;--font:'Montserrat',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
*{box-sizing:border-box}html,body{margin:0}body{font-family:var(--font);color:var(--dark);background:#fff;min-height:100dvh;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
header{padding:14px 22px 12px;border-bottom:2px solid var(--gold);display:flex;align-items:center;gap:12px}header img{height:40px}
.htext b{display:block;font-size:14px;color:var(--navy)}.htext span{font-size:12px;color:var(--muted);font-weight:500}
.tabs{display:flex;gap:6px;max-width:780px;margin:16px auto 0;padding:0 22px}
.tab{flex:1;border:0;border-bottom:4px solid var(--gray);background:none;padding:10px 6px;font-size:14px;font-weight:700;color:var(--muted);cursor:pointer}.tab.on{border-color:var(--navy);color:var(--navy)}
main{max-width:780px;margin:0 auto;padding:22px 22px 60px}
.tag{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--blue);margin:0 0 12px}
h1{font-size:clamp(24px,5vw,34px);line-height:1.2;color:var(--navy);margin:0 0 12px}
.lead{font-size:clamp(16px,3vw,18px);line-height:1.55;font-weight:500;color:#2b3442;margin:0 0 16px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}.chip{border:1.5px solid var(--navy);background:#fff;color:var(--navy);border-radius:999px;padding:8px 16px;font-size:14px;font-weight:700;cursor:pointer}.chip.on{background:var(--navy);color:#fff}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mcol{display:grid;gap:8px;align-content:start}
.mi{border:2px solid var(--gray);background:#fff;border-radius:12px;padding:12px;font-size:16px;font-weight:700;color:var(--navy);cursor:pointer;text-align:left;display:flex;justify-content:space-between;gap:6px;align-items:center;min-height:54px;width:100%}
.mi.tr{font-weight:600;font-size:14.5px}.mi.sel{border-color:var(--blue);background:var(--tint)}.mi.ok{background:var(--ok);border-color:var(--ok);color:#fff}.mi.no{background:#fbeeec;border-color:var(--red);color:var(--red)}
.ab{border:1.5px solid var(--navy);background:#fff;color:var(--navy);border-radius:999px;padding:5px 10px;font-size:13px;font-weight:600;cursor:pointer;flex:none}.mi.ok .ab{background:#fff}
.mi small{display:block;font-weight:500;font-size:12px;color:var(--muted)}.mi.ok small{color:#e5f3ea}
.btn{border:0;border-radius:999px;padding:13px 24px;font-size:16px;font-weight:700;cursor:pointer;background:var(--navy);color:#fff}.btn.alt{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}.btn[disabled]{opacity:.35}
.msg{font-size:14px;color:var(--muted);font-weight:600;margin:12px 0}
.fb{margin:14px 0 0;padding:12px 14px;border-radius:10px;background:#eef5fb;font-size:16px;line-height:1.5;display:none}.fb.on{display:block}
.bar{display:flex;gap:5px;margin:0 0 16px}.bar i{flex:1;height:5px;border-radius:3px;background:var(--gray)}.bar i.on{background:var(--navy)}.bar i.ok{background:var(--ok)}.bar i.no{background:var(--red)}
.pass{font-size:clamp(18px,3.4vw,21px);line-height:1.7;font-weight:500;margin:0 0 18px;padding:14px 16px;border-left:4px solid var(--gold);background:#f9f6f0;border-radius:0 12px 12px 0}
.blank{display:inline-block;min-width:90px;border-bottom:3px solid var(--gold);text-align:center;font-weight:700;color:var(--navy)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:480px){.opts{grid-template-columns:1fr}}
.opt{border:2px solid var(--gray);background:#fff;border-radius:12px;padding:15px;font-size:19px;font-weight:700;color:var(--navy);cursor:pointer}.opt:hover{border-color:var(--blue)}.opt.ok{background:var(--ok);border-color:var(--ok);color:#fff}.opt.no{background:#fbeeec;border-color:var(--red);color:var(--red)}
.score{font-size:52px;font-weight:700;color:var(--navy);margin:6px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
</style></head><body>

{w:'headlong',p:'Armand saw Désirée standing at the gate of the plantation. His love for her grew so fast that nothing could stop it, like a river that rushes ____ over every obstacle in its way.',o:['headlong','soothing','ignorant','cautiously'],why:'Headlong means very fast and without stopping to think. Chopin uses it to describe how suddenly Armand fell in love.'},

    if(ok===10){$('#fb').innerHTML=`✅ All 10 matched! Mistakes: ${err}. Now read the definitions below, then continue.<br><br>${W.map(w=>`<b>${w.w}</b>: ${w.def}`).join('<br>')}`;$('#fb').classList.add('on');$('#go').style.display='inline-block'}}
   else{err++;t.classList.add('no');setTimeout(()=>t.classList.remove('no'),500);$('#ms').textContent='Mistakes: '+err}}};
}
function quiz(){let i=0,sc=0,res=[];const Z=shuf(Q);
 const draw=()=>{
  if(i>=Z.length){$('#app').innerHTML=`<p class="tag">Page 2 · Results</p><h1>Finished!</h1><p class="score">${sc} / ${Z.length}</p><p class="lead">${sc>=9?'Excellent! You really know these words.':sc>=7?'Good work! Review the ones you missed.':'Keep going: go back to Page 1 and listen to the words again.'}</p><div class="row"><button class="btn" id="re">Play again</button><button class="btn alt" id="pg1">Back to Match</button></div>`;
   $('#app').onclick=e=>{if(e.target.id==='re')quiz();if(e.target.id==='pg1')tab('m')};return}
  const q=Z[i],ord=shuf(q.o);
  const text=q.p.replace('____','<span class="blank">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>');
  $('#app').innerHTML=`<p class="tag">Page 2 · Question ${i+1} of ${Z.length}</p><div class="bar">${Z.map((_,n)=>`<i class="${res[n]||(n===i?'on':'')}"></i>`).join('')}</div><p class="lead" style="margin-bottom:10px">Read the passage. Choose the word that fits the gap.</p><p class="pass" id="ps">${text}</p><div class="row" style="margin:-6px 0 14px"><span class="ab" role="button" tabindex="0" data-s="${q.p.replace('____','blank').replace(/"/g,'&quot;')}" data-r=".9">🔊 Listen to the passage</span></div>
  <div class="opts">${ord.map(o=>`<button class="opt" data-o="${o}">${o}</button>`).join('')}</div><div class="fb" id="fb"></div><div class="row"><button class="btn" id="nx" style="display:none">${i===Z.length-1?'See score':'Next →'}</button></div>`;
  $('#app').onclick=e=>{if(e.target.closest('[data-s]'))return;const b=e.target.closest('.opt');
   if(b&&!b.disabled){const ok=b.dataset.o===q.o[0];$$('.opt').forEach(x=>{x.disabled=true;if(x.dataset.o===q.o[0])x.classList.add('ok')});if(!ok)b.classList.add('no');res[i]=ok?'ok':'no';if(ok)sc++;
    $('.blank').textContent=q.o[0];$('#fb').textContent=(ok?'✅ ':'❌ ')+q.why;$('#fb').classList.add('on');$('#nx').style.display='inline-block'}
   if(e.target.id==='nx'){i++;draw();window.scrollTo(0,0)}}};
 draw()}
function tab(t){speechSynthesis&&speechSynthesis.cancel&&speechSynthesis.cancel();$$('.tab').forEach(x=>x.classList.toggle('on',x.dataset.t===t));window.scrollTo(0,0);t==='m'?match():quiz()}
$$('.tab').forEach(b=>b.onclick=()=>tab(b.dataset.t));
match();
</script></body></html>
