<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Midterm Review Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout idea: one sticky tab bar, one activity at a time, a review panel that opens after the answers. */
:root{
  --bg:#F4F5F7; --card:#FFFFFF; --ink:#10294A; --muted:#51647A; --line:#D5DAE0; --soft:#EAEFF5;
  --accent:#9C2519; --sky:#2F6FA3; --ok:#1C7A4B; --okbg:#E3F3EA; --bad:#B3261E; --badbg:#FBE8E6; --btn-ink:#FFFFFF;
  --paper:#FFFDF7; --paperline:#E4DCC8;
  --f-d:'Montserrat', Arial, sans-serif; --f-b:'Source Sans 3', Arial, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1B31; --card:#12263F; --ink:#F4F5F7; --muted:#A9B9CB; --line:#2A486B; --soft:#1A3354;
  --accent:#F08A7E; --sky:#6FA8D8; --ok:#5BC48A; --okbg:#12392A; --bad:#F08A7E; --badbg:#3E1B1B; --btn-ink:#0B1B31;
  --paper:#F6F1E3; --paperline:#CFC6AE; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1B31; --card:#12263F; --ink:#F4F5F7; --muted:#A9B9CB; --line:#2A486B; --soft:#1A3354;
  --accent:#F08A7E; --sky:#6FA8D8; --ok:#5BC48A; --okbg:#12392A; --bad:#F08A7E; --badbg:#3E1B1B; --btn-ink:#0B1B31;
  --paper:#F6F1E3; --paperline:#CFC6AE; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-b);font-size:18px;line-height:1.45;padding:0 16px 56px}
.wrap{max-width:980px;margin:0 auto}
header{display:flex;align-items:center;gap:14px;padding:18px 0 8px}
header img{width:54px;height:auto;background:#fff;border-radius:10px;padding:4px}
.eyebrow{font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
h1{font-family:var(--f-d);font-weight:800;font-size:clamp(24px,5vw,34px);line-height:1.1;margin:2px 0 0;text-wrap:balance}
h2{font-family:var(--f-d);font-weight:800;font-size:clamp(21px,3.6vw,26px);margin:0 0 6px;text-wrap:balance}
h3{font-family:var(--f-d);font-weight:600;font-size:17px;margin:0 0 6px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:10;border-bottom:1px solid var(--line)}
.tab{font:inherit;font-weight:700;font-size:15px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 14px;cursor:pointer;display:flex;gap:8px;align-items:center}
.tab .num{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--soft);font-size:13px}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab[aria-selected="true"] .num{background:var(--bg);color:var(--ink)}
.tab.done .num{background:var(--ok);color:#fff}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.lead{color:var(--muted);margin:2px 0 14px;max-width:70ch}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-top:14px}
.btn{font-family:var(--f-d);font-weight:800;font-size:15px;border-radius:12px;border:2px solid var(--accent);background:var(--accent);color:var(--btn-ink);padding:10px 20px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn[disabled]{opacity:.4;cursor:default}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}
img.pic{max-width:100%;height:auto;border-radius:12px;display:block}
.msg{border-radius:12px;padding:10px 14px;margin-top:12px;font-weight:600}
.msg.ok{background:var(--okbg);color:var(--ok)} .msg.bad{background:var(--badbg);color:var(--bad)} .msg.info{background:var(--soft);color:var(--ink)}
.review{border-top:4px solid var(--accent);margin-top:18px}
.review h2{color:var(--accent)}
ul.clean{margin:6px 0;padding-left:20px} ul.clean li{margin:4px 0}
.src{font-size:15px;color:var(--muted);margin-top:10px}
.src a{color:var(--sky);font-weight:600}
.book{background:var(--soft);border-radius:12px;padding:10px 14px;margin:10px 0;font-size:16px}
.book b{color:var(--accent)}
/* match */
.mcols{display:grid;grid-template-columns:1fr 1.5fr;gap:14px;margin-top:12px}
@media (max-width:640px){.mcols{grid-template-columns:1fr}}
.mcard{display:flex;align-items:center;gap:10px;width:100%;text-align:left;font:inherit;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 12px;margin-bottom:10px;cursor:pointer;min-height:54px}
.mcard.term{font-family:var(--f-d);font-weight:600;font-size:16px}
.mcard[aria-pressed="true"]{border-color:var(--sky);box-shadow:0 0 0 3px color-mix(in srgb,var(--sky) 30%,transparent)}
.mcard.right{border-color:var(--ok);background:var(--okbg)} .mcard.wrong{border-color:var(--bad);background:var(--badbg)}
.chip{flex:none;display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--soft);font-weight:700;font-size:14px;color:#fff;visibility:hidden}
.chip.on{visibility:visible}
.c1{background:#2F6FA3}.c2{background:#9C2519}.c3{background:#1C7A4B}.c4{background:#7A4EA8}.c5{background:#A66A00}
.pct{display:flex;align-items:center;gap:10px;margin:6px 0}
.pct b{width:150px;flex:none;font-size:15px}
.pct .bar{flex:1;height:14px;background:var(--soft);border-radius:7px;overflow:hidden}
.pct .bar i{display:block;height:100%;background:var(--sky)}
.pct span{width:44px;text-align:right;font-weight:700}
/* documents */
.doc{background:var(--paper);color:#1d2a3a;border:1px solid var(--paperline);border-radius:6px;box-shadow:0 2px 0 rgba(0,0,0,.08),0 10px 24px rgba(16,41,74,.14);font-size:16px;overflow:hidden;max-width:520px}
.doc .dh{background:#1d3d66;color:#fff;padding:9px 14px;display:flex;justify-content:space-between;align-items:center;font-family:var(--f-d);font-weight:600;font-size:14px}
.doc .dh small{font-family:var(--f-b);opacity:.85}
.doc .db{padding:12px 14px}
.doc table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.doc td{padding:5px 0;border-bottom:1px dashed var(--paperline);vertical-align:top}
.doc td:last-child{text-align:right;font-weight:700}
.doc .hl td{background:#FFF1B8}
.doc .foot{font-size:13px;color:#5b6a7c;padding:8px 14px;border-top:1px solid var(--paperline)}
.doc .stamp{display:inline-block;border:2px solid #9C2519;color:#9C2519;font-family:var(--f-d);font-weight:800;font-size:12px;padding:1px 8px;border-radius:4px;transform:rotate(-4deg)}
.card3d{background:linear-gradient(135deg,#1d3d66,#2F6FA3);color:#fff;border-radius:14px;padding:14px 16px;max-width:300px;font-family:var(--f-d);box-shadow:0 8px 20px rgba(16,41,74,.3)}
.card3d .n{letter-spacing:.14em;margin-top:18px;font-size:16px}.card3d small{opacity:.85;font-family:var(--f-b)}
.phone{border:6px solid #1b2430;border-radius:26px;background:#fff;color:#1d2a3a;max-width:300px;overflow:hidden;box-shadow:0 10px 24px rgba(16,41,74,.25)}
.phone .top{background:#0f6b5c;color:#fff;padding:10px 14px;font-family:var(--f-d);font-weight:600;font-size:14px}
.phone .it{padding:10px 14px;border-bottom:1px solid #e6eaef;display:flex;justify-content:space-between;gap:10px;font-size:15px}
.phone .it b{font-variant-numeric:tabular-nums}
.phone .low{color:#B3261E}.phone .hi{color:#0f6b5c}
/* utilization */
.inp{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-top:10px}
.inp label{display:flex;flex-direction:column;font-weight:600;font-size:15px;gap:4px}
input[type=number],input[type=text]{font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:8px 10px;width:150px;font-variant-numeric:tabular-nums}
.meter{display:grid;grid-template-columns:.6fr 1.2fr 1.6fr 1.6fr 1.6fr 1.6fr 1.4fr;gap:3px;margin-top:16px;position:relative;font-size:12px;text-align:center}
.meter div{padding:8px 2px;color:#fff;font-weight:700;border-radius:4px;min-height:44px;display:flex;align-items:center;justify-content:center;line-height:1.1}
.m0{background:#8a1c1c}.m1{background:#18a03a}.m2{background:#c7b200;color:#222!important}.m3{background:#e9a000;color:#222!important}.m4{background:#e86a00}.m5{background:#d13b00}.m6{background:#8a1c1c}
.meter div.here{outline:4px solid var(--ink);outline-offset:1px}
.steps{background:var(--soft);border-radius:12px;padding:10px 14px;margin-top:12px;font-size:16px}
.steps ol{margin:4px 0 0;padding-left:20px}
.big{font-family:var(--f-d);font-weight:800;font-size:30px}
.scn{border-top:1px solid var(--line);padding-top:16px;margin-top:18px}
.scn:first-of-type{border-top:0;padding-top:0;margin-top:6px}
/* quiz */
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;font:inherit;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 12px;margin:8px 0;cursor:pointer}
.opt .l{flex:none;font-family:var(--f-d);font-weight:800;color:var(--accent);width:22px}
.opt[aria-pressed="true"]{border-color:var(--sky)}
.opt.right{border-color:var(--ok);background:var(--okbg)} .opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt[disabled]{cursor:default}
.qn{font-weight:700;color:var(--accent);font-size:14px;letter-spacing:.1em;text-transform:uppercase}
.dots{display:flex;gap:6px;margin:6px 0 10px}.dots i{width:30px;height:6px;border-radius:3px;background:var(--line)}.dots i.on{background:var(--sky)}.dots i.ok{background:var(--ok)}.dots i.no{background:var(--bad)}
.calc{background:var(--soft);border-radius:12px;padding:12px 14px;margin-top:12px}
.calc h3{margin-bottom:2px}
.out{font-weight:700;font-variant-numeric:tabular-nums}
.res{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:10px}
.res div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:15px}
.res b{display:block;font-family:var(--f-d);font-size:20px}
/* ladder */
.ladder{display:flex;flex-direction:column;gap:5px;margin:10px 0}
.rung{display:flex;gap:10px;align-items:center;border-radius:8px;padding:6px 10px;background:var(--soft);font-size:15px;border:2px solid transparent}
.rung b{font-family:var(--f-d);width:22px;color:var(--accent)}
.rung.act{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--card));font-weight:700}
/* t/f */
.tf{display:flex;gap:12px;margin-top:12px}.tf .btn{flex:1;max-width:200px}
.tf .btn.picked{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tfbar{font-family:var(--f-d);font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.statement{border-left:5px solid var(--accent);padding:6px 12px;margin:12px 0 0;font-weight:700;background:var(--soft);border-radius:0 10px 10px 0}
footer{margin-top:28px;color:var(--muted);font-size:15px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

function A4(){
  var h='<div class="panel"><h2>4. Which choice fits this person?</h2><p class="lead">Read each document like a real file. Choose the wisest next step. Use the Ladder of Personal Finance to decide.</p>';
  SC.forEach(function(s,i){var a=S.a4.ans[i];
    h+='<div class="scn"><h3>Case '+(i+1)+': '+s.title+'</h3><p style="margin-top:0">'+esc(s.story)+'</p>'+s.doc()+'<p style="font-weight:700;margin-bottom:0">What is the wisest choice?</p>';
    h+=s.o.map(function(t,k){var st='';if(a!=null){if(k===s.c)st=' right';else if(k===a)st=' wrong';}return '<button class="opt'+st+'" data-act="a4pick" data-i="'+i+'" data-k="'+k+'"'+(a!=null?' disabled':'')+'><span class="l">'+'ABCD'[k]+'</span><span>'+esc(t)+'</span></button>';}).join('');
    if(a!=null)h+='<div class="msg '+(a===s.c?'ok':'bad')+'">'+(a===s.c?'Correct. ':'Not quite. The answer is '+'ABCD'[s.c]+'. ')+esc(s.why)+'</div>'+ladder(s.rung,s.note||'');
    h+='</div>';});
  var n=S.a4.ans.filter(function(x){return x!=null;}).length;
  if(n===SC.length){var sc=0;SC.forEach(function(s,i){if(S.a4.ans[i]===s.c)sc++;});finish('scenarios');
    h+='<div class="panel review"><h2>Review: you got '+sc+' of 4</h2><ul class="clean"><li><b>Rung 1: employer match.</b> Always first. It is an instant return.</li><li><b>Rung 2: high-interest debt.</b> Paying off a 20%+ card beats investing.</li><li><b>Rung 3: Roth IRA.</b> Tax-free growth. You can always take out the money you contributed.</li><li><b>Savings account.</b> For goals you need soon, and for your emergency fund. Use an online high-interest account with no fees.</li></ul><div class="grid2"><div><img class="pic" src="'+IMG.roth+'" alt="Traditional versus Roth IRA tax breaks"></div><div><img class="pic" src="'+IMG.k401+'" alt="401(k) piggy bank"></div></div>'+book('Chapter 3','The Ladder of Personal Finance: 1) 401(k) match, 2) pay off debt, 3) Roth IRA, 4) more 401(k), 5) HSA, 6) regular investing account. Ramit says to finish one step before the next.')+srcs(['irs','cfpb','inv'])+nextBtn('scenarios')+'</div>';}
