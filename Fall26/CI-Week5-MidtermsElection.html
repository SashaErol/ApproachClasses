<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Midterms Word Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout: one scrolling workbook with four tabs. Answer choices look like ballot ovals. Brand: Approach navy, red, sky. */
:root{--bg:#f3f5f8;--card:#ffffff;--fg:#0b1827;--muted:#4f5d6f;--line:#cdd5df;--soft:#e9eef4;--red:#9d251a;--sky:#2a6a99;--navy:#0b1827;--btn:#0b1827;--btnfg:#ffffff;
--ok:#1d6b43;--okbg:#e1f2e8;--bad:#9d251a;--badbg:#f7e3df;--hl:#ffe45c;--hlfg:#0b1827;--display:"Montserrat","Helvetica Neue",Arial,sans-serif;--body:"Source Serif 4",Georgia,serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#08131f;--card:#0f2338;--fg:#edf2f7;--muted:#a8b6c6;--line:#27455f;--soft:#14304b;--red:#f0907f;--sky:#7fbbe4;--btn:#7fbbe4;--btnfg:#08131f;--ok:#7fd1a3;--okbg:#15392b;--bad:#f0907f;--badbg:#472629;--hl:#e8d300;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#08131f;--card:#0f2338;--fg:#edf2f7;--muted:#a8b6c6;--line:#27455f;--soft:#14304b;--red:#f0907f;--sky:#7fbbe4;--btn:#7fbbe4;--btnfg:#08131f;--ok:#7fd1a3;--okbg:#15392b;--bad:#f0907f;--badbg:#472629;--hl:#e8d300;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:1.08rem;line-height:1.55;padding-block:14px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:62rem;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding-bottom:12px}
.logo{background:#fff;padding:6px 10px;border-radius:2px;display:flex}.logo img{height:26px;width:auto;display:block}
.kick{font-family:var(--display);font-weight:700;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--red)}
h1{font-family:var(--display);font-size:clamp(1.5rem,4.2vw,2.2rem);line-height:1.12;margin:4px 0 0;text-wrap:balance}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding-block:8px;border-bottom:1px solid var(--line)}
.tab{font-family:var(--display);font-weight:600;font-size:.78rem;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:2px;padding:8px 4px;min-height:52px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center}
.tab small{font-weight:500;color:var(--muted);font-size:.68rem}
.tab[aria-selected="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}.tab[aria-selected="true"] small{color:var(--bg);opacity:.8}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.panel{display:grid;gap:22px;padding-top:18px}
.task{background:var(--card);border:1px solid var(--line);border-radius:2px;padding:clamp(16px,3vw,26px);display:grid;gap:12px}
.task h2{font-family:var(--display);font-size:1.15rem;margin:0;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.task h2 i{font-style:normal;color:var(--red);font-size:.78rem;letter-spacing:.12em}
.instr{margin:0;color:var(--muted)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{font-family:var(--display);font-weight:600;font-size:.82rem;border:1px solid var(--btn);background:var(--btn);color:var(--btnfg);border-radius:2px;padding:10px 16px;min-height:44px;cursor:pointer}
.btn.line{background:transparent;color:var(--fg);border-color:var(--line)}
.score{font-family:var(--display);font-weight:700;color:var(--sky);font-variant-numeric:tabular-nums}
/* word list */
.az{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:760px){.az{grid-template-columns:minmax(0,1fr)}}
.entry{border:1px solid var(--line);border-radius:2px;padding:16px;display:grid;gap:8px;align-content:start;background:var(--card);min-width:0}
.entry .top{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.letter{font-family:var(--display);font-weight:700;color:var(--red);font-size:.9rem;border:1px solid var(--red);padding:0 7px;border-radius:2px}
.w{font-family:var(--display);font-weight:700;font-size:1.45rem;line-height:1.1}
.ph{font-family:var(--display);font-size:.78rem;color:var(--muted);letter-spacing:.04em}
.say{margin-left:auto;font-family:var(--display);font-weight:600;font-size:.74rem;background:var(--soft);color:var(--fg);border:1px solid var(--line);border-radius:2px;padding:6px 10px;min-height:36px;cursor:pointer}
.lab{font-family:var(--display);font-weight:700;font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--sky);margin-top:4px}
.entry p{margin:0}.entry .ex{font-style:italic;color:var(--muted)}
.entry .ex+.ex{margin-top:-4px}
.old{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--display);font-weight:600;font-size:.82rem;background:var(--soft);border:1px solid var(--line);border-radius:2px;padding:8px 12px;min-height:40px;cursor:pointer;color:var(--fg)}
.chip[aria-pressed="true"]{background:var(--btn);color:var(--btnfg);border-color:var(--btn)}
.oldgloss{min-height:1.6em;color:var(--sky);font-family:var(--display);font-weight:600;font-size:.88rem;margin:0}
/* ballot ovals */
ol.items{list-style:none;margin:0;padding:0;display:grid;gap:12px;counter-reset:n}
ol.items>li{counter-increment:n;padding:10px 12px 10px 40px;position:relative;border-left:4px solid transparent;display:grid;gap:8px;min-width:0}
ol.items>li::before{content:counter(n);position:absolute;left:12px;top:10px;font-family:var(--display);font-weight:700;font-size:.8rem;color:var(--sky)}
ol.items>li.ok{background:var(--okbg);border-left-color:var(--ok)}ol.items>li.bad{background:var(--badbg);border-left-color:var(--bad)}
.q{min-width:0}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{font-family:var(--display);font-weight:600;font-size:.84rem;display:inline-flex;align-items:center;gap:8px;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:2px;padding:8px 12px;min-height:44px;cursor:pointer;text-align:left}
.opt .bub{flex:none;width:18px;height:18px;border-radius:50%;border:2px solid var(--fg);background:transparent}
.opt[aria-checked="true"] .bub{background:var(--fg)}
.opt.key{outline:2px dashed var(--ok);outline-offset:1px}
.opt.right{border-color:var(--ok)}.opt.right .bub{background:var(--ok);border-color:var(--ok)}
.opt.wrong{border-color:var(--bad)}.opt.wrong .bub{background:var(--bad);border-color:var(--bad)}
.opts.num .opt{min-width:44px;justify-content:center;padding-inline:0}.opts.num .bub{display:none}
.big{font-family:var(--display);font-weight:700;font-size:1.5rem}
.why{font-family:var(--display);font-size:.78rem;font-weight:600;color:var(--ok)}
/* reading */
.gloss{position:sticky;top:calc(env(safe-area-inset-top,0px) + 66px);z-index:4;background:var(--soft);border:1px solid var(--line);padding:10px 14px;font-family:var(--display);font-weight:600;font-size:.88rem;color:var(--fg);min-height:48px}
.gloss b{color:var(--red)}
.article h3{font-family:var(--display);font-size:1.12rem;margin:22px 0 4px}
.article h3:first-child{margin-top:0}
.article p,.article li{max-width:68ch}
.article ul{padding-left:1.2em;display:grid;gap:4px;margin:6px 0}
mark.t{background:var(--hl);color:var(--hlfg);padding:0 .14em;border-radius:1px;cursor:pointer}
u.r{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px;text-decoration-color:var(--sky);cursor:pointer}
.legend{font-family:var(--display);font-size:.78rem;color:var(--muted)}
/* match */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 28px}
.mcol{display:grid;gap:8px;align-content:start}
.mb{font-family:var(--display);font-weight:600;font-size:.9rem;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:2px;padding:8px 10px;min-height:44px;cursor:pointer;text-align:center}
.mb.sel{background:var(--btn);color:var(--btnfg);border-color:var(--btn)}.mb.done{background:var(--okbg);border-color:var(--ok);cursor:default}.mb.miss{background:var(--badbg);border-color:var(--bad)}
/* riddles */
.rid{display:grid;gap:8px}
.rid .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input.ans{font-family:var(--display);font-weight:600;font-size:1rem;padding:8px 12px;min-height:44px;width:min(100%,15rem);border:1px solid var(--fg);background:var(--card);color:var(--fg);border-radius:2px}
.hint{font-family:var(--display);font-weight:600;font-size:.78rem;background:transparent;color:var(--sky);border:0;cursor:pointer;min-height:44px;padding:0 6px;text-decoration:underline}
/* tap mistake */
.tw{display:flex;flex-wrap:wrap;gap:4px 3px}
.tok{font:inherit;background:transparent;color:inherit;border:1px solid transparent;border-radius:2px;padding:2px 5px;cursor:pointer;min-height:36px}
.tok:hover{background:var(--soft)}.tok.pick{background:var(--hl);color:var(--hlfg)}.tok.found{background:var(--okbg);border-color:var(--ok)}.tok.wrongpick{background:var(--badbg);border-color:var(--bad)}
/* cloze */
.bank{display:flex;flex-wrap:wrap;gap:8px}
.cl{max-width:68ch;line-height:2.3}
.gap{font-family:var(--display);font-weight:600;font-size:.88rem;display:inline-block;min-width:8.2em;text-align:center;border:0;border-bottom:2px solid var(--fg);background:var(--soft);color:var(--fg);padding:2px 8px;min-height:34px;cursor:pointer;border-radius:2px 2px 0 0}
.gap.okg{background:var(--okbg);border-color:var(--ok)}.gap.badg{background:var(--badbg);border-color:var(--bad)}
table.res{border-collapse:collapse;width:100%;font-family:var(--display);font-size:.88rem}
table.res td,table.res th{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
.tw2{overflow-x:auto}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

'<h3>What does “midterm” mean?</h3><p>Americans choose a president every four years. Midterm elections happen '+'halfway through that term, this year on Tuesday, November 3. All 435 House seats, 35 Senate seats and many governors’ offices are on the '+T("ballot","ballot")+'. The president’s party usually loses seats.</p>'+
'<h3>Why does one vote matter?</h3><p>Congress writes laws and controls federal spending, so a lot is '+R("at stake","stake")+'. '+T("Turnout","turnout")+' usually '+R("declines","decline")+' in midterm years, which gives each '+T("ballot","ballot")+' more '+T("weight","weight")+'. Republicans hold the Senate 53-47, and Democrats need a net gain of four seats.</p>'+
'<h3>Who draws the districts?</h3><p>After each census, states divide into House districts. Most legislatures draw the maps; some states use commissions. Gerrymandering means drawing lines to help one party, and both parties have been accused of it. This year several states '+R("revamped","revamp")+' their maps in the middle of the decade, including Texas and California, which '+R("sparked","spark")+' court cases.</p>'+
'<h3>Which states could decide it?</h3><p>A '+T("swing","swing")+' state, or battleground, is a state where either party can win. Ratings differ by outlet, but CBS News lists Maine, Michigan, Ohio, Texas and Alaska Senate races as '+T("toss-ups","toss")+'.</p>'+
'<h3>What do the '+T("forecasts","forecast")+' say?</h3><p>'+T("Non-partisan","nonp")+' analysts, such as the Cook Political Report and Sabato’s Crystal Ball, rate more House races as '+T("leaning","lean")+' Democratic; the Senate looks closer. On October 28, the prediction market Kalshi gave Democrats a 91% chance in the House and 65% in the Senate, but a price is not a fact, and '+T("polls","polls")+' and markets can be wrong. After 31 past midterms, U.S. stocks rose an average of 12.4% in the following year, but analysts '+T("warn","warn")+' that this is not a reliable rule.</p>'+
'<h3>What is different in Massachusetts?</h3><p>Massachusetts voters face nine '+T("ballot","ballot")+' questions, the most since 1994.</p><ul>'+
['Question 1 would open most Legislature and governor’s office records to the public.','Question 2 would let state public defenders form a union.','Question 3 would replace party primaries for state offices with one primary; the top two candidates would advance.','Question 4 would allow Election Day registration.','Question 5 would limit state revenue and refund extra money.','Question 6 would fund conservation with some sales taxes.','Question 7 would allow single-family homes on lots of at least 5,000 square feet.','Question 8 would end legal retail sales of marijuana.','Question 9 is a referendum: a yes vote keeps a 2024 gun law, and a no vote repeals it.'].map(function(x){return'<li>'+x+'</li>'}).join('')+'</ul>'+

/* riddles */
(function(){var sec=$("#t-rid");$("#rids").innerHTML=RID.map(function(r,i){return'<div class="rid" data-i="'+i+'"><div>'+r.c+'</div><div class="row"><input class="ans" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" id="ans'+i+'" aria-label="Answer '+(i+1)+'"><button class="hint" type="button" data-h="'+i+'">first letter</button><span class="why"></span></div></div>'}).join("");
 $("#rids").style.cssText="display:grid;gap:12px";
 sec.addEventListener("click",function(e){var h=e.target.closest("[data-h]");if(h){var i=+h.dataset.h,w=RID[i].a[0];h.parentNode.querySelector(".why").textContent=w[0]+" "+"_ ".repeat(Math.max(0,w.length-1)).trim()+" ("+w.length+" letters)";return}
  var a=e.target.closest("[data-a]");if(!a)return;var act=a.dataset.a;
  if(act==="reset"){$$("input.ans",sec).forEach(function(x){x.value="";x.style.borderColor=""});$$(".why",sec).forEach(function(x){x.textContent=""});$(".score",sec).textContent="";var g=REG.filter(function(x){return x.id==="rid"})[0];g.right=0;g.done=false;updateRes();return}
  var right=0;RID.forEach(function(r,i){var inp=$("#ans"+i),ok=r.a.indexOf(norm(inp.value))>-1;if(ok)right++;inp.style.borderColor=ok?"var(--ok)":"var(--bad)";var w=inp.parentNode.querySelector(".why");if(act==="show"&&!ok){inp.value=r.a[0];w.textContent="Answer: "+r.a[0]}else if(ok)w.textContent=""});
  setScore(sec,right,RID.length)})})();

/* spot the mistake */
(function(){var sec=$("#t-mis");
 sec.addEventListener("click",function(e){var t=e.target.closest(".tok");if(t){var li=t.closest("li");if(li.classList.contains("ok")||li.dataset.locked)return;$$(".tok",li).forEach(function(x){x.classList.remove("pick")});t.classList.add("pick");return}
  var a=e.target.closest("[data-a]");if(!a)return;var act=a.dataset.a;
  if(act==="reset"){$$("li",sec).forEach(function(l){l.className="";$$(".tok",l).forEach(function(x){x.className="tok"});var w=$(".why",l);if(w)w.remove()});$(".score",sec).textContent="";var g=REG.filter(function(x){return x.id==="mis"})[0];g.right=0;g.done=false;updateRes();return}
  var right=0;$$("li",sec).forEach(function(l){var m=MIS[+l.dataset.i],pick=$(".tok.pick,.tok.wrongpick",l),toks=$$(".tok",l),ok=pick&&norm(pick.textContent)===norm(m.w);if(ok)right++;l.className=ok?"ok":"bad";toks.forEach(function(x){x.classList.remove("pick","wrongpick","found")});if(pick)pick.classList.add(ok?"found":"wrongpick");var w=$(".why",l);if(w)w.remove();if(ok||act==="show"){toks.forEach(function(x){if(norm(x.textContent)===norm(m.w))x.classList.add("found")});var s=document.createElement("div");s.className="why";s.textContent="Correct word: "+m.fix;l.appendChild(s)}});
  setScore(sec,right,MIS.length)})})();

/* cloze */
CZ.forEach(function(c,ci){var sec=$("#t-"+c.id),CL=c.words,placed={},cur=null,order=shuffle(CL.map(function(w,i){return i}),5+ci*3);
 $("#clt-"+c.id).innerHTML=c.txt.replace(/<g n="(\d+)"><\/g>/g,function(m,n){return'<button class="gap" data-g="'+n+'" type="button" aria-label="Gap '+(+n+1)+'">&nbsp;</button>'});
 function draw(){$("#bank-"+c.id).innerHTML=order.filter(function(i){return Object.keys(placed).every(function(k){return placed[k]!==i})}).map(function(i){return'<button class="chip" data-c="'+i+'" aria-pressed="'+(cur===i)+'" type="button">'+esc(CL[i])+'</button>'}).join("");$$(".gap",sec).forEach(function(g){var p=placed[g.dataset.g];g.textContent=p===undefined?" ":CL[p]})}
 draw();
 sec.addEventListener("click",function(e){var cc=e.target.closest("[data-c]"),g=e.target.closest("[data-g]"),a=e.target.closest("[data-a]");
  if(cc){cur=+cc.dataset.c;draw();return}
  if(g){var n=g.dataset.g;if(placed[n]!==undefined){delete placed[n];g.className="gap";draw();return}if(cur!==null){placed[n]=cur;cur=null;draw()}return}
  if(a){var act=a.dataset.a;
   if(act==="reset"){placed={};cur=null;$$(".gap",sec).forEach(function(x){x.className="gap"});draw();$(".score",sec).textContent="";var r0=REG.filter(function(x){return x.id===c.id})[0];r0.right=0;r0.done=false;updateRes();return}
   if(act==="show"){CL.forEach(function(w,i){placed[i]=i});cur=null;draw()}
   var right=0;$$(".gap",sec).forEach(function(x){var n=+x.dataset.g,ok=placed[n]===n;if(ok)right++;x.className="gap "+(placed[n]===undefined?"":ok?"okg":"badg")});setScore(sec,right,CL.length)}})});

/* results */
function updateRes(){var t=REG.reduce(function(s,x){return s+x.total},0),r=REG.reduce(function(s,x){return s+(x.right||0)},0);$("#res").innerHTML='<tr><th>Task</th><th>Score</th></tr>'+REG.map(function(x){return'<tr><td>'+esc(x.title)+'</td><td>'+(x.done?x.right+" / "+x.total:"— / "+x.total)+'</td></tr>'}).join("")+'<tr><th>Total</th><th>'+r+' / '+t+'</th></tr>'}
$("#copy").addEventListener("click",function(){var txt=$$("#res tr").map(function(tr){return $$("th,td",tr).map(function(c){return c.textContent}).join(": ")}).join("\n");function ok(){$("#copied").textContent="Copied"}try{navigator.clipboard.writeText(txt).then(ok,function(){$("#copied").textContent="Copy did not work. Take a screenshot instead."})}catch(e){$("#copied").textContent="Copy did not work. Take a screenshot instead."}});
updateRes();
})();
</script>
