<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modal Verb Match — Ability, Obligation, Advice, Permission, Necessity</title>
<style>
  :root {
    --navy-dark: #0B1827;
    --navy-mid: #0E2A47;
    --red: #9D251A;
    --blue: #418ABD;
    --gray: #E8E8E8;
    --white: #FFFFFF;
    --green: #2E7D46;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(160deg, var(--navy-dark) 0%, var(--navy-mid) 55%, var(--blue) 130%);
    font-family: 'Georgia', 'Times New Roman', serif;
    color: var(--navy-dark);
  }

  body {
    padding: 24px 16px 50px;
    display: flex;
    align-items: flex-start;
    justify-content: center;
  }

  .app { width: 100%; max-width: 720px; }

  .brand-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 16px;
  }

  .brand-row img { height: 32px; width: auto; display: block; }

  .brand-row span {
    color: var(--gray);
    letter-spacing: 0.12em;
    font-size: 12px;
    text-transform: uppercase;
    opacity: 0.85;
  }

  .panel {
    background: var(--white);
    border-radius: 18px;
    box-shadow: 0 25px 60px rgba(0,0,0,0.35);
    overflow: hidden;
  }

  .panel-top-bar { height: 8px; background: linear-gradient(90deg, var(--red) 0%, var(--blue) 100%); }

  .panel-inner { padding: 26px 28px 30px; }

  h1 { font-size: 21px; margin: 0 0 4px 0; color: var(--navy-dark); }

  .subtitle {
    font-size: 14.5px;
    color: var(--navy-mid);
    margin: 0 0 20px 0;
    line-height: 1.5;
  }

  .columns {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
  }

  .col-label {
    font-size: 11px;
    font-weight: bold;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--red);
    margin-bottom: 10px;
  }

  .item-btn {
    display: block;
    width: 100%;
    font-family: Georgia, serif;
    font-size: 15px;
    text-align: left;
    padding: 12px 14px;
    margin-bottom: 10px;
    border-radius: 10px;
    border: 1.5px solid #d5d5d5;
    background: var(--gray);
    color: var(--navy-dark);
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
  }

  .item-btn:active { transform: scale(0.98); }

  .item-btn.selected {
    border-color: var(--blue);
    background: #eaf4fa;
  }

  .item-btn.matched {
    background: #e8f6ec;
    border-color: var(--green);
    color: var(--green);
    font-weight: bold;
    cursor: default;
  }

  .item-btn.wrong-flash {
    background: #fbeceb;
    border-color: var(--red);
    animation: shakeAnim 0.3s;
  }

  .item-btn.func-label {
    text-align: center;
    font-weight: bold;
  }

  @keyframes shakeAnim {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    75% { transform: translateX(5px); }
  }

  .feedback-line {
    min-height: 22px;
    font-size: 14px;
    font-weight: bold;
    color: var(--green);
    margin-top: 16px;
    text-align: center;
  }

  .results-wrap { text-align: center; padding: 20px 6px; }
  .results-emoji { font-size: 44px; margin-bottom: 6px; }
  .results-title { font-size: 22px; font-weight: bold; color: var(--navy-dark); margin-bottom: 8px; }
  .results-sub { font-size: 14.5px; color: var(--navy-mid); margin-bottom: 20px; line-height: 1.5; }

  .replay-btn {
    font-family: Georgia, serif;
    font-size: 15px;
    font-weight: bold;
    padding: 11px 26px;
    border-radius: 10px;
    border: none;
    background: var(--red);
    color: var(--white);
    cursor: pointer;
    box-shadow: 0 6px 14px rgba(157,37,26,0.3);
  }

  @media (max-width: 560px) {
    .columns { grid-template-columns: 1fr; gap: 4px; }
    .item-btn { font-size: 14px; }
  }
</style>
</head>

      <p class="subtitle">Tap a sentence, then tap the function that matches it. Correct pairs turn green!</p>
      <div class="columns">
        <div>
          <div class="col-label">Sentence</div>
          <div id="sentenceCol"></div>
        </div>
        <div>
          <div class="col-label">Function</div>
          <div id="functionCol"></div>
        </div>
      </div>
      <div class="feedback-line" id="feedbackLine"></div>
    </div>
  </div>
</div>

<script>
const pairs = [
  { sentence: "A newborn baby can cry, but it can't walk.", func: "Ability" },
  { sentence: "You must wear a seatbelt in the car.", func: "Obligation" },
  { sentence: "You should practice English more often.", func: "Advice" },
  { sentence: "May I open the window, please?", func: "Permission" },
  { sentence: "I have to go to work every day.", func: "Necessity" },
];

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

let sentenceCol = document.getElementById('sentenceCol');
let functionCol = document.getElementById('functionCol');
let feedbackLine = document.getElementById('feedbackLine');
const panelInner = document.getElementById('panelInner');

let selectedSentence = null;
let selectedFunction = null;
let matchedCount = 0;

function buildGame() {
  sentenceCol = document.getElementById('sentenceCol');
  functionCol = document.getElementById('functionCol');
  feedbackLine = document.getElementById('feedbackLine');
  matchedCount = 0;
  selectedSentence = null;
  selectedFunction = null;
  feedbackLine.textContent = '';

  const shuffledSentences = shuffle(pairs);
  const shuffledFunctions = shuffle(pairs);

  sentenceCol.innerHTML = '';
  shuffledSentences.forEach((p) => {
    const btn = document.createElement('button');
    btn.className = 'item-btn sentence-item';
    btn.dataset.func = p.func;
    btn.textContent = p.sentence;
    btn.addEventListener('click', () => onSentenceClick(btn));
    sentenceCol.appendChild(btn);
  });

  functionCol.innerHTML = '';
  shuffledFunctions.forEach((p) => {
    const btn = document.createElement('button');
    btn.className = 'item-btn func-label';
    btn.dataset.func = p.func;
    btn.textContent = p.func;
    btn.addEventListener('click', () => onFunctionClick(btn));
    functionCol.appendChild(btn);
  });
}

function clearSelections() {
  document.querySelectorAll('.item-btn.selected').forEach(b => b.classList.remove('selected'));
}

function onSentenceClick(btn) {
  if (btn.classList.contains('matched')) return;
  clearSentenceSelection();
  btn.classList.add('selected');
  selectedSentence = btn;
  tryMatch();
}

function onFunctionClick(btn) {
  if (btn.classList.contains('matched')) return;
  clearFunctionSelection();
  btn.classList.add('selected');
  selectedFunction = btn;
  tryMatch();
}

function clearSentenceSelection() {
  Array.from(sentenceCol.children).forEach(b => b.classList.remove('selected'));
}
function clearFunctionSelection() {
  Array.from(functionCol.children).forEach(b => b.classList.remove('selected'));
}

function tryMatch() {
  if (!selectedSentence || !selectedFunction) return;

  if (selectedSentence.dataset.func === selectedFunction.dataset.func) {
    selectedSentence.classList.remove('selected');
    selectedFunction.classList.remove('selected');
    selectedSentence.classList.add('matched');
    selectedFunction.classList.add('matched');
    matchedCount++;
    feedbackLine.style.color = 'var(--green)';
    feedbackLine.textContent = '\u2713 Correct match!';
    selectedSentence = null;
    selectedFunction = null;

    if (matchedCount === pairs.length) {
      setTimeout(showResults, 700);
    }
  } else {
    const s = selectedSentence, f = selectedFunction;
    s.classList.add('wrong-flash');
    f.classList.add('wrong-flash');
    feedbackLine.style.color = 'var(--red)';
    feedbackLine.textContent = 'Not quite \u2014 try again!';
    setTimeout(() => {
      s.classList.remove('selected', 'wrong-flash');
      f.classList.remove('selected', 'wrong-flash');
    }, 500);
    selectedSentence = null;
    selectedFunction = null;
  }
}

function showResults() {
  panelInner.innerHTML = `
    <div class="results-wrap">
      <div class="results-emoji">\ud83c\udf89</div>
      <div class="results-title">Great Work!</div>
      <div class="results-sub">You matched all 5 sentences to the correct modal verb function.</div>
      <button class="replay-btn" id="replayBtn">Play Again</button>
    </div>
  `;
  document.getElementById('replayBtn').addEventListener('click', () => {
    panelInner.innerHTML = `
      <h1>Modal Verb Match</h1>
      <p class="subtitle">Tap a sentence, then tap the function that matches it. Correct pairs turn green!</p>
      <div class="columns">
        <div>
          <div class="col-label">Sentence</div>
          <div id="sentenceCol"></div>
        </div>
        <div>
          <div class="col-label">Function</div>
          <div id="functionCol"></div>
        </div>
      </div>
      <div class="feedback-line" id="feedbackLine"></div>
    `;
    buildGame();
  });
}

buildGame();
</script>

</body>
</html>
