<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Memory Match — Approach International Student Center</title>
<style>
  :root{
    --ink:#0B1827;
    --navy:#0E2A47;
    --sky:#418ABD;
    --mist:#E8E8E8;
    --paper:#FFFFFF;
    --sky-tint:#EAF3F9;
    --gold-tint:#FBF3E1;
    --success:#1E8E3E;
    --success-tint:#E6F4EA;
    --error:#E4002B;
    --error-tint:#FDE7EA;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  /* ---------- Header ---------- */
  .header{
    width:100%;
    background:var(--paper);
    border-bottom:3px solid var(--sky);
    position:relative;
    overflow:hidden;
    padding:22px 20px 20px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }
  .header::before{
    content:"";
    position:absolute;
    width:640px; height:640px;
    border:2px solid var(--sky);
    border-radius:50%;
    opacity:0.08;
    top:-420px; left:50%;
    transform:translateX(-50%) rotate(-8deg);
  }
  .header::after{
    content:"";
    position:absolute;
    width:520px; height:520px;
    border:2px solid var(--navy);
    border-radius:50%;
    opacity:0.06;
    top:-370px; left:50%;
    transform:translateX(-50%) rotate(6deg);
  }
  .header-content{position:relative; z-index:1; display:flex; flex-direction:column; align-items:center;}
  .header-logo{height:60px; width:auto; margin-bottom:10px;}
  .header-title{
    font-size:25px;
    font-weight:800;
    letter-spacing:0.02em;
    margin:2px 0 4px;
    color:var(--ink);
  }
  .header-subtitle{
    font-family:Georgia,"Times New Roman",serif;
    font-style:italic;
    font-size:15px;
    color:var(--navy);
    margin:0;
    max-width:560px;
  }

  /* ---------- Main ---------- */
  .wrap{
    width:100%;
    max-width:780px;
    padding:22px 18px 60px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .example-note{
    background:var(--mist);
    border-radius:10px;
    padding:10px 18px;
    font-size:13.5px;
    color:var(--navy);
    margin-bottom:18px;
    text-align:center;
    max-width:640px;
    width:100%;
  }
  .example-note b{color:var(--ink);}

  .stats-row{
    display:flex;
    gap:14px;
    flex-wrap:wrap;
    justify-content:center;
    margin-bottom:22px;
  }
  .stat-pill{
    background:var(--sky-tint);
    border-radius:20px;
    padding:8px 18px;
    font-size:13.5px;
    font-weight:700;
    color:var(--navy);
  }
  .stat-pill b{color:var(--ink); font-size:15px;}

  .grid{
    width:100%;
    display:grid;
    grid-template-columns:repeat(6, 1fr);
    gap:10px;
    margin-bottom:26px;
  }

  .card-outer{
    aspect-ratio:3/4;
    perspective:1000px;
    cursor:pointer;
    outline:none;
  }
  .card-outer:focus-visible .card-inner{
    box-shadow:0 0 0 3px var(--sky);
    border-radius:12px;
  }

  .card-inner{
    position:relative;
    width:100%; height:100%;
    transition:transform .5s cubic-bezier(.4,.2,.2,1);
    transform-style:preserve-3d;
  }
  .card-outer.flipped .card-inner,
  .card-outer.matched .card-inner{
    transform:rotateY(180deg);
  }

  .card-face{
    position:absolute; inset:0;
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:6px 4px;
    text-align:center;
    overflow:hidden;
  }

  .card-back{
    background:var(--navy);
    box-shadow:0 3px 8px rgba(11,24,39,0.2);
  }
  .card-back img{width:40%; height:auto; opacity:0.85;}

  .card-front{
    background:var(--paper);
    border:2px solid var(--sky);
    transform:rotateY(180deg);
    flex-direction:column;
    gap:3px;
  }
  .card-outer.matched .card-front{
    background:var(--success-tint);
    border-color:var(--success);
  }
  .card-outer.mismatch .card-front{
    background:var(--error-tint);
    border-color:var(--error);
    animation:shake .4s ease;
  }
  @keyframes shake{
    10%,90%{transform:translateX(-3px);}
    20%,80%{transform:translateX(5px);}
    30%,50%,70%{transform:translateX(-7px);}
    40%,60%{transform:translateX(7px);}
  }
  .lang-tag{
    font-size:7px;
    font-weight:800;
    letter-spacing:0.01em;
    color:var(--sky);
    text-transform:uppercase;
  }
  .card-front.pt .lang-tag{color:#9C6B00;}
  .card-text{
    font-size:12px;
    font-weight:700;
    line-height:1.25;
    color:var(--ink);
  }
  .card-front.pt .card-text{
    font-style:italic;
    color:#7A5A00;
  }
  .check-mark{
    font-size:13px;
    color:var(--success);
    font-weight:900;
  }

  .controls{
    display:flex;
    justify-content:center;
  }
  .btn{
    font-family:inherit;
    font-size:14px;
    font-weight:700;
    letter-spacing:0.03em;
    padding:13px 26px;
    border-radius:10px;
    border:none;
    cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .btn:hover{transform:translateY(-1px);}
  .btn-primary{
    background:var(--ink);
    color:var(--paper);
    box-shadow:0 2px 0 rgba(0,0,0,0.2);
  }

  .sr-only{
    position:absolute; width:1px; height:1px;
    padding:0; margin:-1px; overflow:hidden;
    clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }

  /* ---------- Completion overlay ---------- */
  .overlay{
    position:fixed; inset:0;
    background:rgba(11,24,39,0.55);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:1000;
    padding:20px;
  }
  .overlay.show{display:flex;}
  .modal{
    background:var(--paper);
    border-radius:20px;
    padding:36px 34px 30px;
    max-width:400px;
    width:100%;
    text-align:center;
    position:relative;
    overflow:hidden;
    box-shadow:0 24px 60px rgba(0,0,0,0.3);
  }
  .modal::before{
    content:"";
    position:absolute;
    width:340px; height:340px;
    border:2px solid var(--sky);
    opacity:0.12;
    border-radius:50%;
    top:-180px; left:50%;
    transform:translateX(-50%) rotate(-10deg);
  }
  .modal-icon{height:56px; width:auto; margin-bottom:14px; position:relative;}
  .modal h2{
    margin:0 0 8px;
    font-size:22px;
    color:var(--ink);
    position:relative;
  }
  .modal .modal-stats{
    font-size:16px;
    font-weight:700;
    color:var(--navy);
    margin:6px 0 18px;
    position:relative;
  }
  .modal p{
    margin:0 0 22px;
    font-family:Georgia,"Times New Roman",serif;
    font-style:italic;
    color:var(--navy);
    font-size:15px;
    position:relative;
  }
</style>
</head>

<script>
(function(){
  const PAIRS = [
    { en:"get up", pt:"levantar-se" },
    { en:"take a shower", pt:"tomar banho" },
    { en:"have breakfast", pt:"tomar caf\u00e9 da manh\u00e3" },
    { en:"go to bed", pt:"ir dormir" },
    { en:"go for a walk", pt:"dar um passeio" },
    { en:"meet friends", pt:"encontrar amigos" },
    { en:"go to the movies", pt:"ir ao cinema" },
    { en:"buy groceries", pt:"comprar mantimentos" },
    { en:"have a headache", pt:"estar com dor de cabe\u00e7a" },
    { en:"make an appointment", pt:"marcar uma consulta" },
    { en:"take medicine", pt:"tomar rem\u00e9dio" },
    { en:"see a doctor", pt:"ir ao m\u00e9dico" },
  ];

  const grid = document.getElementById('grid');
  const matchCountEl = document.getElementById('matchCount');
  const moveCountEl = document.getElementById('moveCount');
  const timeCountEl = document.getElementById('timeCount');
  const liveRegion = document.getElementById('liveRegion');
  const overlay = document.getElementById('overlay');
  const finalStats = document.getElementById('finalStats');
  const resetBtn = document.getElementById('resetBtn');
  const playAgainBtn = document.getElementById('playAgainBtn');

  let flippedCards = [];
  let matchedCount = 0;
  let moves = 0;
  let boardLocked = false;
  let timerInterval = null;
  let elapsedSeconds = 0;
  let timerStarted = false;

  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]] = [a[j],a[i]];
    }
    return a;
  }

  function announce(msg){ liveRegion.textContent = msg; }

  function formatTime(sec){
    const m = Math.floor(sec/60).toString().padStart(2,'0');
    const s = (sec%60).toString().padStart(2,'0');
    return m + ':' + s;
  }

  function startTimerIfNeeded(){
    if(timerStarted) return;
    timerStarted = true;
    timerInterval = setInterval(()=>{
      elapsedSeconds++;
      timeCountEl.textContent = formatTime(elapsedSeconds);
    }, 1000);
  }

  function stopTimer(){
    clearInterval(timerInterval);
  }

  function buildDeck(){
    const cards = [];
    PAIRS.forEach((p, i)=>{
      cards.push({ pairId: 'p'+i, lang:'en', text:p.en });
      cards.push({ pairId: 'p'+i, lang:'pt', text:p.pt });
    });
    return shuffle(cards);
  }

  function renderCard(cardData){
    const outer = document.createElement('div');
    outer.className = 'card-outer';
    outer.tabIndex = 0;
    outer.setAttribute('role','button');
    outer.dataset.pairId = cardData.pairId;
    outer.setAttribute('aria-label', 'Memory card, face down');

    function activate(){
      handleCardClick(outer);
    }
    outer.addEventListener('click', activate);
    outer.addEventListener('keydown', (e)=>{
      if(e.key === 'Enter' || e.key === ' '){
        e.preventDefault();
        activate();
      }
    });

    grid.appendChild(outer);
  }

  function handleCardClick(card){
    if(boardLocked) return;
    if(card.classList.contains('flipped') || card.classList.contains('matched')) return;
    if(flippedCards.length === 2) return;

    startTimerIfNeeded();
    card.classList.add('flipped');
    flippedCards.push(card);

    if(flippedCards.length === 2){
      moves++;
      moveCountEl.textContent = String(moves);
      boardLocked = true;
      const [c1, c2] = flippedCards;

      if(c1.dataset.pairId === c2.dataset.pairId){
        setTimeout(()=>{
          [c1, c2].forEach(c=>{
            c.classList.remove('flipped');
            c.classList.add('matched');
            c.querySelector('.check-mark').style.display = 'inline';
            c.setAttribute('aria-label','Matched card: ' + c.querySelector('.card-text').textContent);
          });
          matchedCount++;
          matchCountEl.textContent = String(matchedCount);
          announce('Match! ' + matchedCount + ' of 12 found.');
          flippedCards = [];
          boardLocked = false;

          if(matchedCount === PAIRS.length){
            stopTimer();
            finalStats.textContent = moves + ' moves \u2022 ' + formatTime(elapsedSeconds);
            setTimeout(()=>{ overlay.classList.add('show'); }, 500);
          }
        }, 550);
      } else {
        c1.classList.add('mismatch');
        c2.classList.add('mismatch');
        announce('Not a match. Try again.');
        setTimeout(()=>{
          [c1, c2].forEach(c=>{
            c.classList.remove('flipped','mismatch');
          });
          flippedCards = [];
          boardLocked = false;
        }, 900);
      }
    }
  }

  function newGame(){
    stopTimer();
    grid.innerHTML = '';
    flippedCards = [];
    matchedCount = 0;
    moves = 0;
    boardLocked = false;
    elapsedSeconds = 0;
    timerStarted = false;
    matchCountEl.textContent = '0';
    moveCountEl.textContent = '0';
    timeCountEl.textContent = '00:00';
    overlay.classList.remove('show');

    const deck = buildDeck();
    deck.forEach(renderCard);
  }

  resetBtn.addEventListener('click', newGame);
  playAgainBtn.addEventListener('click', newGame);

  newGame();
})();
