<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Oral Exam Warm-Up — Approach International Student Center</title>
<style>
  :root{
    --ink:#0B1827;
    --navy:#0E2A47;
    --sky:#418ABD;
    --brick:#9D251A;
    --mist:#E8E8E8;
    --paper:#FFFFFF;
    --sky-tint:#EAF3F9;
    --gold-tint:#FBF3E1;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  /* ---------- Header ---------- */
  .header{
    width:100%;
    background:var(--paper);
    border-bottom:3px solid var(--sky);
    position:relative;
    overflow:hidden;
    padding:22px 20px 20px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }
  .header::before{
    content:"";
    position:absolute;
    width:640px; height:640px;
    border:2px solid var(--sky);
    border-radius:50%;
    opacity:0.08;
    top:-420px; left:50%;
    transform:translateX(-50%) rotate(-8deg);
  }
  .header::after{
    content:"";
    position:absolute;
    width:520px; height:520px;
    border:2px solid var(--navy);
    border-radius:50%;
    opacity:0.06;
    top:-370px; left:50%;
    transform:translateX(-50%) rotate(6deg);
  }
  .header-content{position:relative; z-index:1; display:flex; flex-direction:column; align-items:center;}
  .header-logo{height:60px; width:auto; margin-bottom:10px;}
  .header-title{
    font-size:25px;
    font-weight:800;
    letter-spacing:0.02em;
    margin:2px 0 4px;
    color:var(--ink);
  }
  .header-subtitle{
    font-family:Georgia,"Times New Roman",serif;
    font-style:italic;
    font-size:15px;
    color:var(--navy);
    margin:0;
    max-width:560px;
  }

  /* ---------- Main ---------- */
  .wrap{
    width:100%;
    max-width:760px;
    padding:24px 18px 60px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .controls{
    display:flex;
    justify-content:center;
    margin-bottom:26px;
  }
  .btn{
    font-family:inherit;
    font-size:14px;
    font-weight:700;
    letter-spacing:0.02em;
    padding:13px 24px;
    border-radius:10px;
    border:none;
    cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .btn:hover{transform:translateY(-1px);}
  .btn-primary{
    background:var(--ink);
    color:var(--paper);
    box-shadow:0 2px 0 rgba(0,0,0,0.2);
  }
  .btn-outline{
    background:var(--paper);
    color:var(--navy);
    border:1.5px solid #c7cdd4;
  }
  .btn:disabled{
    opacity:0.35;
    cursor:not-allowed;
    box-shadow:none;
    transform:none;
  }

  .page-indicator{
    font-size:13px;
    font-weight:800;
    letter-spacing:0.08em;
    color:var(--navy);
    margin-bottom:8px;
  }
  .page-dots{display:flex; gap:6px; margin-bottom:24px;}
  .page-dot{
    width:9px; height:9px; border-radius:50%;
    background:var(--mist);
    border:1.5px solid #d5d5d5;
    transition:background .2s ease, border-color .2s ease, transform .2s ease;
  }
  .page-dot.active{background:var(--sky); border-color:var(--sky); transform:scale(1.3);}

  .nav-buttons{
    display:flex;
    gap:14px;
    margin-top:28px;
  }

  .card-list{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:22px;
  }

  .topic-card{
    background:var(--paper);
    border:1.5px solid var(--mist);
    border-top:6px solid var(--navy);
    border-radius:16px;
    padding:22px 22px 20px;
    box-shadow:0 6px 18px rgba(11,24,39,0.06);
    transition:box-shadow .4s ease, transform .3s ease;
  }
  .topic-card.spotlight{
    animation:pulseGlow 1.1s ease-in-out 3;
  }
  @keyframes pulseGlow{
    0%,100%{ box-shadow:0 6px 18px rgba(11,24,39,0.06); }
    50%{ box-shadow:0 0 0 8px rgba(65,138,189,0.25); }
  }

  .topic-head{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:16px;
  }
  .topic-icon{color:var(--navy); flex:none;}
  .topic-titles{display:flex; flex-direction:column;}
  .topic-kicker{
    font-size:11px;
    font-weight:800;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--sky);
  }
  .topic-title{
    font-size:20px;
    font-weight:800;
    color:var(--ink);
  }

  .q-block{
    display:flex;
    gap:12px;
    align-items:flex-start;
    border-radius:12px;
    padding:12px 14px;
    margin-bottom:10px;
  }
  .q-block.a1{background:var(--sky-tint);}
  .q-block.a2{background:var(--gold-tint);}
  .q-badge{
    flex:none;
    font-size:11.5px;
    font-weight:800;
    letter-spacing:0.04em;
    padding:4px 10px;
    border-radius:20px;
    color:var(--paper);
    margin-top:1px;
  }
  .q-badge.a1{background:var(--navy);}
  .q-badge.a2{background:#9C6B00;}
  .q-text{font-size:15.5px; line-height:1.5; color:var(--ink);}

  .tip-box{
    background:var(--mist);
    border-left:4px solid var(--brick);
    border-radius:8px;
    padding:12px 14px;
    margin:14px 0 14px;
  }
  .tip-label{
    font-size:11.5px;
    font-weight:800;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--brick);
    margin-bottom:6px;
  }
  .tip-box ul{margin:0; padding-left:18px;}
  .tip-box li{font-size:14px; line-height:1.55; color:var(--ink); margin-bottom:4px;}
  .tip-box li:last-child{margin-bottom:0;}
  .tip-box b{color:var(--navy);}

  .adj-label{
    font-size:11.5px;
    font-weight:800;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--navy);
    margin-bottom:8px;
  }
  .adj-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .adj-chip{
    background:var(--navy);
    color:var(--paper);
    font-size:13px;
    font-weight:700;
    padding:5px 12px;
    border-radius:20px;
  }
</style>
</head>

      <h1 class="header-title">Oral Exam Warm-Up</h1>
      <p class="header-subtitle">Practice speaking before your exam &mdash; Level A1, with &#9733; A2 bonus questions</p>
    </div>
  </header>

  <main class="wrap">
    <div class="page-indicator" id="pageIndicator">TOPIC 1 OF 5</div>
    <div class="page-dots" id="pageDots"></div>

    <div class="card-list" id="cardList"></div>

    <div class="nav-buttons">
      <button class="btn btn-outline" id="prevBtn">&larr; Previous</button>
      <button class="btn btn-primary" id="nextBtn">Next &rarr;</button>
    </div>
  </main>

<script>
(function(){
  const ICONS = {
    idcard: '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2.2"/><circle cx="8.2" cy="12" r="2"/><line x1="13" y1="10.4" x2="18" y2="10.4"/><line x1="13" y1="13.6" x2="18" y2="13.6"/><line x1="6.2" y1="16.6" x2="10.2" y2="16.6"/></svg>',
    sunrise: '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="17" x2="20" y2="17"/><path d="M7 17a5 5 0 0 1 10 0"/><line x1="12" y1="8" x2="12" y2="5"/><line x1="7.5" y1="9.5" x2="5.6" y2="7.6"/><line x1="16.5" y1="9.5" x2="18.4" y2="7.6"/></svg>',
    family: '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="8.5" cy="8" r="2.4"/><path d="M4 19c0-3 2-5 4.5-5s4.5 2 4.5 5"/><circle cx="17" cy="9.3" r="1.9"/><path d="M13.6 19c0-2.5 1.5-4.1 3.4-4.1s3.4 1.6 3.4 4.1"/></svg>',
    heart: '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.2s-7.2-4.4-7.2-9.6a4.6 4.6 0 0 1 7.2-3.8 4.6 4.6 0 0 1 7.2 3.8c0 5.2-7.2 9.6-7.2 9.6z"/></svg>',
    star: '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><polygon points="12,4 14.2,9.5 20,10 15.5,13.8 17,19.5 12,16.3 7,19.5 8.5,13.8 4,10 9.8,9.5"/></svg>',
  };

  const TOPICS = [
    {
      icon: "idcard",
      title: "Personal Information",
      a1: "What is your name and where are you from?",
      a2: "Can you spell your full name and tell me your email address?",
      tips: [
        "Say <b>\u201CI am 25 years old,\u201D</b> not \u201CI have 25 years.\u201D (Portuguese: <i>Eu tenho 25 anos.</i>)",
        "Don't forget the subject: <b>\u201CI am from Brazil,\u201D</b> not \u201CAm from Brazil.\u201D",
      ],
      adjectives: ["married", "single", "new", "official", "correct", "foreign"],
    },
    {
      icon: "sunrise",
      title: "Daily Routine",
      a1: "What do you do every morning?",
      a2: "Describe your typical day, from morning to night.",
      tips: [
        "Remember the extra \u201C-s\u201D for he/she/it: <b>\u201CShe works,\u201D</b> not \u201CShe work.\u201D",
        "Use <b>make</b> your bed but <b>do</b> the laundry \u2014 not \u201CI do my bed.\u201D",
      ],
      adjectives: ["busy", "tired", "early", "late", "relaxing", "exhausting"],
    },
    {
      icon: "family",
      title: "Family",
      a1: "Tell me about your family.",
      a2: "Describe your relationship with one family member in detail.",
      tips: [
        "Use <b>'s</b> for possession: <b>\u201Cmy mother's sister,\u201D</b> not \u201Cthe sister of my mother.\u201D",
        "Don't use \u201Cthe\u201D before a name: <b>\u201CMaria is my sister,\u201D</b> not \u201CThe Maria is my sister.\u201D",
      ],
      adjectives: ["close", "supportive", "loving", "strict", "big", "small"],
    },
    {
      icon: "heart",
      title: "Health",
      a1: "How are you feeling today?",
      a2: "Tell me about a time you were sick and what you did.",
      tips: [
        "Say <b>\u201CI have a fever,\u201D</b> not \u201CI am with fever.\u201D (Portuguese: <i>Estou com febre.</i>)",
        "Use <b>have</b> for symptoms: <b>\u201CI have a headache,\u201D</b> not \u201CI have pain of head.\u201D",
      ],
      adjectives: ["sick", "dizzy", "sore", "better", "worse", "healthy"],
    },
    {
      icon: "star",
      title: "Free Time & Fun Activities",
      a1: "What do you like to do in your free time?",
      a2: "Talk about your favorite weekend activity and why you enjoy it.",
      tips: [
        "Use <b>play</b> for sports, <b>go</b> for -ing activities: <b>\u201CI play soccer\u201D</b> / <b>\u201CI go swimming,\u201D</b> not \u201CI do soccer.\u201D",
        "After \u201Clike,\u201D use to + verb or verb + -ing: <b>\u201CI like to swim\u201D</b> or <b>\u201CI like swimming,\u201D</b> not \u201CI like swim.\u201D",
      ],
      adjectives: ["fun", "exciting", "relaxing", "boring", "favorite", "active"],
    },
  ];

  const cardList = document.getElementById('cardList');
  const pageIndicator = document.getElementById('pageIndicator');
  const pageDotsEl = document.getElementById('pageDots');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');

  let currentIndex = 0;

  function buildPageDots(){
    pageDotsEl.innerHTML = '';
    TOPICS.forEach(() => {
      const d = document.createElement('span');
      d.className = 'page-dot';
      pageDotsEl.appendChild(d);
    });
  }

  function renderTopic(){
    const t = TOPICS[currentIndex];
    pageIndicator.textContent = 'TOPIC ' + (currentIndex + 1) + ' OF ' + TOPICS.length;

    const dots = pageDotsEl.querySelectorAll('.page-dot');
    dots.forEach((d, i) => d.classList.toggle('active', i === currentIndex));

    const adjChips = t.adjectives.map(a => '<span class="adj-chip">' + a + '</span>').join('');
    const tipItems = t.tips.map(tip => '<li>' + tip + '</li>').join('');

    cardList.innerHTML =
      '<div class="topic-card">' +
        '<div class="topic-head">' +
          '<span class="topic-icon">' + ICONS[t.icon] + '</span>' +
          '<div class="topic-titles">' +
            '<span class="topic-kicker">Topic ' + (currentIndex + 1) + '</span>' +
            '<span class="topic-title">' + t.title + '</span>' +
          '</div>' +
        '</div>' +
        '<div class="q-block a1"><span class="q-badge a1">A1</span><span class="q-text">' + t.a1 + '</span></div>' +
        '<div class="q-block a2"><span class="q-badge a2">&#9733; A2</span><span class="q-text">' + t.a2 + '</span></div>' +
        '<div class="tip-box">' +
          '<div class="tip-label">Common Mistake &mdash; Portuguese Speakers</div>' +
          '<ul>' + tipItems + '</ul>' +
        '</div>' +
        '<div class="adj-label">Useful Adjectives</div>' +
        '<div class="adj-row">' + adjChips + '</div>' +
      '</div>';

    prevBtn.disabled = (currentIndex === 0);
    nextBtn.disabled = (currentIndex === TOPICS.length - 1);
  }

  prevBtn.addEventListener('click', () => {
    if(currentIndex > 0){ currentIndex--; renderTopic(); }
  });
  nextBtn.addEventListener('click', () => {
    if(currentIndex < TOPICS.length - 1){ currentIndex++; renderTopic(); }
  });

  buildPageDots();
  renderTopic();
})();
</script>
</body>
</html>
