<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Speaking Cards — Talking About Feelings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0B1B2E;
    --red:#A82C1F;
    --blue:#4A89B8;
    --gray:#E8E8E8;
    --ink:#1B2530;
    --muted:#6b7480;
    --white:#FFFFFF;
    --line:#DDE2E7;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',sans-serif;
    color:var(--ink);
    background:#F7F8FA;
    min-height:100vh;
    padding:0 0 60px;
  }
  .wrap{ max-width:480px; margin:0 auto; padding:0 20px; }

  header.top{
    display:flex; align-items:center; gap:12px;
    padding:22px 20px 16px;
    max-width:480px; margin:0 auto;
  }
  header.top img{ width:34px; height:auto; display:block; }
  .brand-name{ font-weight:800; font-size:15px; color:var(--navy); letter-spacing:0.5px; }
  .brand-sub{ font-weight:500; font-size:11px; color:var(--muted); }
  .top-rule{ height:2px; background:var(--navy); max-width:480px; margin:0 auto; }

  .title-block{ text-align:center; padding:26px 20px 6px; }
  h1{
    font-weight:800; font-size:clamp(20px,4.5vw,26px);
    color:var(--navy); margin:0 0 8px; letter-spacing:-0.3px;
  }
  .subtitle{ color:var(--muted); font-weight:500; font-size:13.5px; max-width:420px; margin:0 auto; }
  .note{
    text-align:center; font-size:12px; color:var(--muted); font-weight:600; margin:14px auto 0;
    max-width:420px; background:var(--white); border:1px solid var(--line); border-radius:8px; padding:8px 14px;
  }

  .status-row{
    display:flex; justify-content:center; align-items:center; gap:10px;
    margin:20px 0 16px;
  }
  .status-chip{
    background:var(--white); border:1px solid var(--line); border-radius:10px; padding:7px 14px;
    font-weight:800; font-size:12.5px; color:var(--navy);
  }
  .dots{ display:flex; gap:6px; }
  .dot{ width:8px; height:8px; border-radius:50%; background:var(--gray); transition:background 0.2s ease; }
  .dot.active{ background:var(--navy); }
  .dot.done{ background:var(--blue); }

  .card-slot{ width:100%; margin-bottom:22px; }
  .card-face{
    background:var(--white);
    border-radius:10px;
    border:1px solid var(--line);
    box-shadow:0 4px 12px rgba(11,27,46,0.08);
    padding:26px 24px;
  }

  .num-badge{
    width:38px; height:38px; border-radius:8px;
    display:flex; align-items:center; justify-content:center;
    color:var(--white); font-weight:800; font-size:14px;
    margin-bottom:16px; background:var(--navy);
  }
  .accent-bar{ height:3px; width:40px; border-radius:2px; margin-bottom:16px; background:var(--navy); }

  .card-title{
    font-weight:700; font-size:21px; color:var(--navy); margin:0 0 12px; line-height:1.3;
  }
  .prompt{ color:var(--ink); font-size:14.5px; margin-bottom:14px; line-height:1.5; font-weight:600; }
  .talk-label{
    font-weight:700; font-size:11px; text-transform:uppercase; letter-spacing:0.6px;
    color:var(--blue); margin-bottom:8px;
  }
  ul.qlist{ margin:0; padding-left:18px; font-size:14px; line-height:1.7; color:var(--ink); }
  ul.qlist li{ margin-bottom:7px; }

  .term{
    color:var(--navy); font-weight:700; cursor:pointer;
    border-bottom:2px dotted var(--blue); padding-bottom:1px;
  }
  .term:hover{ color:var(--blue); }
  .term.shown{ color:var(--red); border-color:var(--red); }
  .term.shown::after{
    content:" (" attr(data-pt) ")";
    font-weight:600; font-style:italic; color:var(--red); font-size:0.92em;
  }

  .nav-row{ display:flex; justify-content:space-between; gap:12px; }
  .btn{
    font-weight:700; font-size:14px; letter-spacing:0.3px;
    color:var(--white); background:var(--navy);
    border:none; padding:12px 24px; border-radius:6px; cursor:pointer;
    transition:background 0.15s ease, transform 0.1s ease;
    flex:1;
  }
  .btn:hover:not(:disabled){ background:#142842; }
  .btn:active:not(:disabled){ transform:scale(0.98); }
  .btn:disabled{ background:#c9cfd5; cursor:not-allowed; }
  .btn-outline{
    color:var(--navy); background:var(--white); border:1.5px solid var(--navy);
  }
  .btn-outline:hover:not(:disabled){ background:var(--gray); }
  .btn-outline:disabled{ color:#a9b2bb; border-color:#c9cfd5; background:var(--white); }

  .done-card{
    display:none; text-align:center; background:var(--white); border:1px solid var(--line);
    border-radius:10px; padding:30px; box-shadow:0 4px 12px rgba(11,27,46,0.08);
  }
  .done-card.show{ display:block; }
  .done-card h2{ font-weight:800; font-size:20px; color:var(--navy); margin:0 0 8px; }
  .done-card p{ color:var(--muted); font-weight:600; font-size:13.5px; margin:0 0 18px; }
</style>
</head>

    <div class="brand-name">APPROACH</div>

</header>
<div class="top-rule"></div>

<div class="wrap">
  <div class="title-block">
    <h1>Talking About Feelings</h1>
    <p class="subtitle">Discuss each question with your group, then click Next.</p>
  </div>
  <p class="note">Click any underlined word to see its Portuguese translation.</p>

  <div class="status-row">
    <div class="status-chip">Card <span id="cardNum">1</span> / 5</div>
    <div class="dots" id="dots"></div>
  </div>

  <div class="card-slot">
    <div class="card-face">
      <div class="num-badge" id="badge">01</div>
      <div class="accent-bar"></div>
      <div class="card-title" id="cardTitle"></div>
      <p class="prompt" id="cardPrompt"></p>
      <div class="talk-label">Talk about</div>
      <ul class="qlist" id="cardQuestions"></ul>
    </div>
  </div>

  <div class="nav-row" id="navRow">
    <button class="btn btn-outline" id="prevBtn">Previous</button>
    <button class="btn" id="nextBtn">Next</button>
  </div>

  <div class="done-card" id="doneCard">
    <h2>All done!</h2>
    <p>You discussed all 5 situations. Great work!</p>
    <button class="btn" id="restartBtn">Start Over</button>
  </div>
</div>

<script>
(function(){
  const CARDS = [{"title": "At the RMV", "prompt": "How did you feel while you were waiting at the RMV for a long time?", "questions": ["Were you <span class=\"term\" data-pt=\"frustrado(a)\">frustrated</span>, <span class=\"term\" data-pt=\"entediado(a)\">bored</span>, or <span class=\"term\" data-pt=\"paciente\">patient</span>?", "What did you do to pass the time?", "Did anything make you feel better while you waited?"]}, {"title": "The Last Exam", "prompt": "How did you feel before and after your last exam?", "questions": ["Were you <span class=\"term\" data-pt=\"nervoso(a)\">nervous</span> before the test? Why or why not?", "How did you feel when you saw your score?", "Did you <span class=\"term\" data-pt=\"comemorar\">celebrate</span> or <span class=\"term\" data-pt=\"relaxar\">relax</span> afterward? How?"]}, {"title": "Good News", "prompt": "Think about a time you got really good news. How did you feel?", "questions": ["What was the news about \u2014 a job, a family event, something else?", "Were you <span class=\"term\" data-pt=\"surpreso(a)\">surprised</span>, or did you <span class=\"term\" data-pt=\"esperar\">expect</span> it?", "Who was the first person you told?"]}, {"title": "Something Went Wrong", "prompt": "Describe a time something went wrong at home or at work. How did you feel?", "questions": ["Were you <span class=\"term\" data-pt=\"com raiva\">angry</span>, <span class=\"term\" data-pt=\"estressado(a)\">stressed</span>, or <span class=\"term\" data-pt=\"calmo(a)\">calm</span> about it?", "What did you do to fix the problem?", "How did you feel afterward?"]}, {"title": "Meeting Someone New", "prompt": "Think about the last time you met someone new \u2014 a coworker, a neighbor, a classmate. How did you feel?", "questions": ["Were you <span class=\"term\" data-pt=\"nervoso(a)\">nervous</span>, <span class=\"term\" data-pt=\"t\u00edmido(a)\">shy</span>, or <span class=\"term\" data-pt=\"confort\u00e1vel\">comfortable</span>?", "What did you talk about?", "Do you still know this person now?"]}];

  let current = 0;

  const cardNum = document.getElementById('cardNum');
  const dotsEl = document.getElementById('dots');
  const badge = document.getElementById('badge');
  const cardTitle = document.getElementById('cardTitle');
  const cardPrompt = document.getElementById('cardPrompt');
  const cardQuestions = document.getElementById('cardQuestions');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const navRow = document.getElementById('navRow');
  const cardSlot = document.querySelector('.card-slot');
  const doneCard = document.getElementById('doneCard');
  const restartBtn = document.getElementById('restartBtn');

  function renderDots(){
    dotsEl.innerHTML = '';
    CARDS.forEach((_, i) => {
      const d = document.createElement('div');
      d.className = 'dot';
      if(i === current) d.classList.add('active');
      else if(i < current) d.classList.add('done');
      dotsEl.appendChild(d);
    });
  }

  function attachTermHandlers(){
    document.querySelectorAll('.term').forEach(el => {
      el.addEventListener('click', () => {
        el.classList.toggle('shown');
      });
    });
  }

  function renderCard(){
    const c = CARDS[current];
    cardNum.textContent = current + 1;
    badge.textContent = String(current + 1).padStart(2, '0');
    cardTitle.textContent = c.title;
    cardPrompt.textContent = c.prompt;

    cardQuestions.innerHTML = '';
    c.questions.forEach(q => {
      const li = document.createElement('li');
      li.innerHTML = q;
      cardQuestions.appendChild(li);
    });

    attachTermHandlers();

    prevBtn.disabled = (current === 0);
    nextBtn.textContent = (current === CARDS.length - 1) ? 'Finish' : 'Next';

    renderDots();
  }

  prevBtn.addEventListener('click', () => {
    if(current > 0){
      current--;
      renderCard();
    }
  });

  nextBtn.addEventListener('click', () => {
    if(current < CARDS.length - 1){
      current++;
      renderCard();
    } else {
      cardSlot.style.display = 'none';
      navRow.style.display = 'none';
      doneCard.classList.add('show');
    }
  });

  restartBtn.addEventListener('click', () => {
    current = 0;
    cardSlot.style.display = '';
    navRow.style.display = '';
    doneCard.classList.remove('show');
    renderCard();
  });

  renderCard();
})();
</script>
